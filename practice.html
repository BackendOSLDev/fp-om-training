<title>Practice tasks · BCB Partners Academy</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;700&amp;family=Permanent+Marker&amp;family=Source+Sans+3:wght@400;500;600;700;900&amp;display=swap">
<style>
/* BCB Partners look, taken from bluecollarballerpartners.com: near-black ground, off-white type, one red, square corners.
   Anton for headings, Archivo for reading, JetBrains Mono for labels and buttons. */
body{margin:0;background:#0B0B0B}
.bcb{--ink:#0B0B0B;--ink2:#131313;--ink3:#1B1B1B;--paper:#F2F1EE;--mut:rgba(242,241,238,.72);--faint:rgba(242,241,238,.48);--line:rgba(242,241,238,.12);--line2:rgba(242,241,238,.24);--ok:#62C482;--warn:#E8A93C;--red:#C6301A;--red2:#DD3B22;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;--body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  min-height:100vh;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
/* Working pages use a white page; the header bar stays BCB black. Front-door pages (sign in, choose FSM) stay dark. */
.bcb.light{--ink:#FFFFFF;--ink2:#F6F5F2;--ink3:#EEECE7;--paper:#0B0B0B;--mut:rgba(11,11,11,.7);--faint:rgba(11,11,11,.52);--line:rgba(11,11,11,.12);--line2:rgba(11,11,11,.26);--ok:#1E7A3C;--warn:#9A6200;}
.bcb.light .hdr{--ink:#0B0B0B;--ink2:#131313;--ink3:#1B1B1B;--paper:#F2F1EE;--mut:rgba(242,241,238,.72);--faint:rgba(242,241,238,.48);--line:rgba(242,241,238,.12);--line2:rgba(242,241,238,.24);--ok:#62C482;--warn:#E8A93C;background:#0B0B0B;color:#F2F1EE}
.bcb a{color:var(--paper);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.bcb a:hover{text-decoration-color:var(--red)}
.bcb :focus-visible{outline:2px solid var(--red);outline-offset:2px}
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--ink)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none!important;color:var(--paper)!important}
.brand .logo{height:24px;width:auto;display:block}
.brand small{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);padding-left:12px;border-left:1px solid var(--line2)}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto;flex-wrap:wrap}
.toplink{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)!important;text-decoration:none!important;padding:8px 10px;border-bottom:2px solid transparent}
.toplink:hover{color:var(--paper)!important}
.toplink.on{color:var(--paper)!important;border-bottom-color:var(--red)}
.who{width:32px;height:32px;margin-left:10px;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--paper)}
.search{flex:1 1 260px;max-width:380px;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);padding:0 12px;min-height:38px;background:var(--ink2)}
.search input{border:0;background:transparent;font:inherit;font-size:14px;flex:1;min-width:0;outline:none;color:var(--paper)}
.search input::placeholder{color:var(--faint)}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:0}
.h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:46px;line-height:.98;letter-spacing:-.005em;margin:0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
.h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:19px;line-height:1.1;margin:0}
.mut{color:var(--mut)}.faint{color:var(--faint)}
.marker{font-family:'Permanent Marker',cursive;text-transform:none;letter-spacing:.01em;border-bottom:2px solid var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 20px;border:1px solid var(--red);background:var(--red);color:#F2F1EE!important;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none!important;cursor:pointer;border-radius:0}
.btn:hover{background:var(--red2);border-color:var(--red2)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--paper)!important}
.btn.ghost:hover{border-color:var(--paper)}
.btn.done{background:transparent;border-color:var(--ok);color:var(--ok)!important;cursor:default}
.panel{border:1px solid var(--line);background:var(--ink2)}
.paper{--ink:#FFFFFF;--ink2:#F6F5F2;--ink3:#EEECE7;--paper:#0B0B0B;--mut:rgba(11,11,11,.7);--faint:rgba(11,11,11,.52);--line:rgba(11,11,11,.12);--line2:rgba(11,11,11,.26);--ok:#1E7A3C;--warn:#9A6200;--ink2:#FFFFFF;background:#F2F1EE;color:#0B0B0B}
.bcb.light .paper{--ink:#0B0B0B;--ink2:#131313;--ink3:#1B1B1B;--paper:#F2F1EE;--mut:rgba(242,241,238,.72);--faint:rgba(242,241,238,.48);--line:rgba(242,241,238,.12);--line2:rgba(242,241,238,.24);--ok:#62C482;--warn:#E8A93C;background:#0B0B0B;color:#F2F1EE}
.tabs{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line2);width:max-content;max-width:100%}
.tabb{border:0;border-right:1px solid var(--line2);background:transparent;color:var(--paper);font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;padding:10px 14px;cursor:pointer;min-height:38px}
.tabb:last-child{border-right:0}
.tabb:hover{background:var(--ink3)}
.tabb.on{background:var(--red);color:#F2F1EE}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{font:inherit;font-size:15px;color:var(--paper);background:var(--ink2);border:1px solid var(--line2);border-radius:0;min-height:44px;padding:0 12px}
.field input:focus,.field select:focus{outline:none;border-color:var(--paper)}
.num{font-variant-numeric:tabular-nums}
.fsmchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);padding:6px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper)!important;text-decoration:none!important}
.fsmchip:hover{border-color:var(--paper)}
.fsmchip .dot{width:7px;height:7px;background:var(--ok)}
.fsmchip .chg{color:var(--faint);padding-left:8px;border-left:1px solid var(--line2)}
.bar{display:block;height:4px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--ok)}
.sw{position:relative;flex:1 1 260px;max-width:440px}.sw .search{max-width:none}.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;background:#131313;border:1px solid rgba(242,241,238,.24);box-shadow:0 18px 40px rgba(0,0,0,.45);max-height:560px;overflow:auto;padding:6px 0 10px}.sres-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 14px}.sres-top .lbl{color:rgba(242,241,238,.72)!important;text-transform:none;letter-spacing:.02em}.sres-x{border:0;background:transparent;color:rgba(242,241,238,.72);font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:4px}.sres-x:hover{color:#F2F1EE}.sres-g{border-top:1px solid rgba(242,241,238,.12);padding-top:6px;margin-top:4px}.sres-h{padding:4px 14px;color:rgba(242,241,238,.48)!important}.sres-h .num{margin-left:6px;color:#E0583F}.sres-i{display:flex;flex-direction:column;gap:2px;padding:8px 14px;text-decoration:none!important;border-left:2px solid transparent}.sres-i:hover{background:#1B1B1B;border-left-color:#C6301A}.sres-t{color:#F2F1EE;font-size:14px;font-weight:600;line-height:1.3}.sres-s{color:rgba(242,241,238,.55);font-size:12px}.sres-none{margin:6px 14px;color:rgba(242,241,238,.72);font-size:13.5px}
.out{border:1px solid var(--line2);background:transparent;color:var(--mut);font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:7px 10px;cursor:pointer;margin-left:6px}
.out:hover{color:var(--paper);border-color:var(--paper)}
.demo{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:#E8A93C;color:#0B0B0B;padding:4px 8px;margin-left:8px}
.fpt-toast{position:fixed;left:16px;bottom:16px;z-index:300;background:#0B0B0B;color:#F2F1EE;font:13px/1.4 'Archivo',system-ui,sans-serif;padding:10px 14px;border-left:3px solid #E8A93C}
.fpt-toast:empty{display:none}
.loading{padding:80px 24px;text-align:center;font:14px 'Archivo',system-ui,sans-serif;color:#9A9A9A}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed}
.marker{overflow-wrap:anywhere}
.px-arm{display:block;margin-top:4px;line-height:1.45}
@media (max-width:720px){.hdr{padding:12px 16px}.h1{font-size:36px}}


/* Practice copy of FieldPulse. Light only on purpose: it copies the FieldPulse web app, which is light. */
#px{--nv:#0b0a4d;--bl:#1976d2;--bl-d:#135ea8;--bl-l:#e3f0fc;--gr:#5cb531;--gr-d:#4a9827;--pg:#eef1f5;--sf:#fff;--ln:#d9dee5;--ln2:#eceff3;--ink:#1f2633;--ink2:#5b6474;--ink3:#8a93a3;--ok:#2e7d32;--ok-l:#e5f4e6;--bad:#c62828;--bad-l:#fdecea;--warn:#8a5a00;--warn-l:#fff4dc;--hl:#f5a623;
  color-scheme:light;color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.4}
#px *{box-sizing:border-box}
:where(#px button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:where(#px input,#px select,#px textarea){font:inherit;color:var(--ink);background:#fff;border:1px solid #c5ccd6;border-radius:4px;padding:6px 8px;min-width:0;max-width:100%}
:where(#px textarea){width:100%}
#px :focus-visible{outline:2px solid var(--bl);outline-offset:1px}
#px .muted{color:var(--ink2)} #px .fp-small{font-size:12px} #px .ok{color:var(--ok)} #px .bad{color:var(--bad)} #px .warn{color:var(--warn)} #px .req{color:var(--bad);font-size:11px;font-weight:600}
#px .lnk{color:var(--bl);text-align:left} #px .lnk:hover{text-decoration:underline}
.px-days{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.px-days button{display:grid;text-align:left;border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:120px;background:var(--bg);color:var(--fg)}
.px-days button.on{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.px-days span{font-size:12px;color:var(--muted)} .px-days small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.px-read{font-size:13px;color:var(--muted);margin:0 0 10px}
.px-read .lnk{color:var(--accent)}
.fp-frame{display:grid;grid-template-columns:186px minmax(0,1fr) 300px;min-height:720px;background:var(--pg);border:1px solid var(--ln);border-radius:6px;overflow:hidden}
.fp-side{background:#fff;border-right:1px solid var(--ln);padding:10px 8px;min-width:0}
.fp-me{display:flex;align-items:center;gap:8px;padding:2px 6px 10px;border-bottom:1px solid var(--ln2);margin-bottom:6px}
.fp-av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.fp-av.sm{width:24px;height:24px;font-size:10px;vertical-align:middle}
.fp-nav{display:flex;flex-direction:column;gap:1px}
.fp-ni{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 6px;border-radius:4px;font-size:13.5px;color:var(--ink)}
.fp-ni:hover{background:#f2f5f9} .fp-ni.on{background:var(--bl-l);color:var(--bl-d);font-weight:600}
.fp-ni.grp{cursor:default;font-weight:600;margin-top:6px} .fp-ni.grp:hover{background:none}
.fp-ni.sub{padding-left:36px;font-size:13px}
.fp-ico{width:22px;height:22px;border-radius:5px;display:inline-grid;place-items:center;color:#fff;flex:none}
.fp-mainwrap{display:flex;flex-direction:column;min-width:0}
.fp-top{height:46px;background:var(--nv);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px}
.fp-top .fp-title{font-size:15px} .fp-back{color:#fff!important;display:grid;place-items:center}
.fp-prac{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.06em;background:#ffe9b3;color:#6b4500;border-radius:3px;padding:2px 6px}
.fp-now{font-size:12px;opacity:.85;white-space:nowrap}
.fp-main{padding:14px 16px 28px;min-width:0;overflow:auto;max-height:860px}
.fp-ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.fp-ph h1{font-size:20px;margin:0;font-weight:600} .fp-ph .r{display:flex;gap:6px}
.fp-bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;margin-bottom:10px}
.fp-btn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:4px;font-size:13.5px;font-weight:600;white-space:nowrap}
.fp-btn.blue{background:var(--bl);color:#fff!important} .fp-btn.blue:hover{background:var(--bl-d)}
.fp-btn.green{background:var(--gr);color:#fff!important} .fp-btn.green:hover{background:var(--gr-d)}
.fp-btn.ghost{border:1px solid #c5ccd6;background:#fff} .fp-btn.ghost.on{border-color:var(--bl);color:var(--bl)}
.fp-btn.danger{border:1px solid var(--bad);color:var(--bad)!important;background:#fff}
.fp-btn.link{height:auto;padding:0;color:var(--bl)!important;font-weight:600}
.fp-btn.sm{height:26px;padding:0 9px;font-size:12.5px}
.fp-card{background:#fff;border:1px solid var(--ln);border-radius:6px;margin-bottom:10px;min-width:0}
.fp-card.pad,.fp-card .pad{padding:12px 14px}
.fp-card h3{font-size:14.5px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.fp-card h4{margin:10px 0 4px;font-size:13px}
.fp-card p{margin:0 0 6px}
.fp-tw{overflow-x:auto}
.fp-t{border-collapse:collapse;width:100%;font-size:13px}
.fp-t th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:8px;border-bottom:1px solid var(--ln);white-space:nowrap}
.fp-t td{padding:8px;border-bottom:1px solid var(--ln2);vertical-align:top}
.fp-t.sm td,.fp-t.sm th{padding:5px 8px}
.fp-t tr.cl{cursor:pointer} .fp-t tr.cl:hover td{background:#f6f9fd}
.fp-t tr.refund td{color:var(--bad);font-size:12px}
.fp-foot{padding:8px 10px;color:var(--ink2);font-size:12px;display:flex;justify-content:space-between;align-items:center}
.fp-pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11.5px;font-weight:600;background:#eef2f6;color:var(--ink2);white-space:nowrap}
.fp-pill.ok{background:var(--ok-l);color:var(--ok)} .fp-pill.bad{background:var(--bad-l);color:var(--bad)}
.fp-search{position:relative;display:flex;align-items:center} .fp-search svg{position:absolute;left:8px;color:var(--ink3)} .fp-search input{padding-left:28px;width:240px}
.fp-ltabs{display:flex;gap:16px;border-bottom:1px solid var(--ln);margin:0 0 10px;flex-wrap:wrap}
.fp-ltabs button{padding:7px 2px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.5px}
.fp-ltabs button.on{color:var(--bl);border-bottom-color:var(--bl);font-weight:600}
.fp-ltabs.sub{gap:12px} .fp-ltabs.sub button{font-size:12.5px}
.fp-ttabs{display:flex;gap:16px;margin:10px 0;border-bottom:1px solid var(--ln)}
.fp-ttabs button{padding:6px 2px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--ink2)} .fp-ttabs button.on{color:var(--bl);border-bottom-color:var(--bl);font-weight:600}
.fp-rec{display:grid;gap:4px;min-width:0}
.fp-rh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;background:#fff;border:1px solid var(--ln);border-radius:6px;padding:12px 14px}
.fp-rh h1{margin:0;font-size:20px;font-weight:600} .fp-rh .r{display:flex;gap:6px;flex-wrap:wrap}
.fp-qb{font-size:12px;color:var(--ink2);margin-top:4px;display:flex;gap:8px;align-items:center} .fp-qb.bad{color:var(--bad)}
.fp-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fp-two>.fp-card{margin-bottom:0} .fp-rec>.fp-two{margin-bottom:10px}
.fp-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px} .fp-kv dt{color:var(--ink2)} .fp-kv dd{margin:0}
.fp-tag{display:inline-flex;align-items:center;gap:4px;background:#e8edf3;border-radius:10px;padding:1px 8px;font-size:12px}
.fp-tag button{color:var(--ink2);font-size:14px;line-height:1}
.fp-pm{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.fp-star{color:#b0b8c4;vertical-align:middle} .fp-star.on{color:#f5a623}
.fp-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fp-chip{border:1px solid #c5ccd6;border-radius:14px;padding:3px 11px;font-size:12.5px;background:#fff}
.fp-chip.on{background:#d9f0fb;border-color:#4fb3e0;font-weight:700;color:#075985}
.fp-mwrap{position:relative;display:inline-block}
.fp-menu{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--ln);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.16);z-index:30;padding:6px 0;min-width:180px;display:grid}
.fp-menu.wide{display:flex;gap:4px;padding:8px;min-width:0;flex-wrap:wrap;width:max-content;max-width:min(560px,80vw)}
.fp-menu.right{right:0}
.fp-menu button{text-align:left;padding:6px 14px;font-size:13px;white-space:nowrap} .fp-menu button:hover{background:#f2f5f9}
.fp-mg{display:grid;min-width:130px} .fp-mg b{font-size:12px;color:var(--ink2);padding:4px 14px}
.fp-dd{position:absolute;left:0;top:100%;background:#fff;border:1px solid var(--ln);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:20;display:grid;min-width:220px;padding:4px 0}
.fp-dd button{text-align:left;padding:6px 12px} .fp-dd button:hover{background:#f2f5f9} .fp-dd button.new{color:var(--bad);border-top:1px solid var(--ln2)}
.fp-dd .muted{padding:6px 12px}
.fp-tags{position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid #c5ccd6;border-radius:4px;padding:4px 6px;background:#fff}
.fp-tags .fp-tagin{border:0;padding:3px;flex:1;min-width:120px}
.fp-filt .fp-fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fp-chk{display:flex;gap:6px;align-items:flex-start;font-size:13px;padding:2px 0;cursor:pointer}
.fp-chk input{margin-top:2px}
.fp-fld{display:grid;gap:2px;min-width:0} .fp-fld>label{font-size:12px;color:var(--ink2);font-weight:600}
.fp-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:8px}
.fp-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px} .fp-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fp-grid2 select,.fp-grid2 input,.fp-grid3 select,.fp-fld select,.fp-fld input{width:100%}
.fp-bar .fp-fld select,.fp-bar .fp-fld input{width:auto}
.fp-seg{display:inline-flex;border:1px solid var(--bl);border-radius:4px;overflow:hidden;margin:4px 0}
.fp-seg button{padding:4px 12px;color:var(--bl);font-size:13px} .fp-seg button.on{background:var(--bl);color:#fff}
.fp-days{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px} .fp-days button{border:1px solid #c5ccd6;border-radius:4px;padding:4px 10px;background:#fff;font-size:12.5px} .fp-days button.on{background:var(--bl);color:#fff;border-color:var(--bl)}
