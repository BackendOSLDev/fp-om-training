    "invoices/Customer view": () => '<section class="s-block"><h3>Customer view</h3><p class="x-muted">Configure the default contents shown on all future invoices. One-off adjustments can be made on each invoice.</p></section><div class="s-cv"><div>' + '<div class="x-card x-pad"><h6>Default terms</h6>' + B.radio("icv-terms", "upon", "upon", "Upon receipt") + B.radio("icv-terms", "net", "upon", "Net 30") + '</div><div class="x-card x-pad"><h6>Job and invoice</h6>' + [["Job number", 0], ["Invoice number", 1], ["Service date", 1], ["Invoice date", 0], ["Summary of work", 1]].map((r) => B.cb("icv-" + r[0], !!r[1], r[0])).join("") + '<p class="x-muted">View format</p>' + B.radio("icv-fmt", "email", "email", "Email optimized") + B.radio("icv-fmt", "env", "email", "Envelope optimized", "For use with #9 single and double-window envelopes") + "</div>" + acc("icv-b", "Business and customer", B.cb("icv-bl", true, "Business logo")) + acc("icv-s", "Services", B.cb("icv-sq", true, "Quantity")) + acc("icv-m", "Materials", B.cb("icv-mq", true, "Quantity")) + '<p class="x-muted">To change the logo and default invoice message, visit <button class="link" data-go="app-settings/company">Company profile</button>.</p><button class="x-fb" data-x-ext="the feedback form"><i>' + svg("feedback") + '</i>Give us feedback</button></div><div class="x-card x-pad s-preview"><b>' + esc(D.company) + '</b><p class="x-muted">100 Main St Riverton, NY 10990</p><p>Bill to: 123 Main St Anytown, CA 90210</p>' + B.table(["Services", "qty", "unit price", "amount"], [["Service call", "1.0", "$129.00", "$129.00"]]) + B.table(["Materials", "qty", "unit price", "amount"], []) + '<p class="x-muted">Thank you for your business!</p><button class="link" data-go="app-settings/company">Terms & Conditions</button></div></div>',
    "jobs/Costs & Materials": () => '<section class="s-block"><h3>Job costing</h3>' + toggleRow("jc-1", "Show job costing breakdown", "", true) + toggleRow("jc-2", "Show expected job costs", "", false) + toggleRow("jc-3", "Material job inputs", "", true) + '<div class="s-indent">' + B.cb("jc-3a", true, "Track materials from all Price book services") + "</div>" + toggleRow("jc-4", "Miscellaneous job inputs", "", false) + toggleRow("jc-5", "Travel and time on jobs", "", true) + '<div class="s-trow"><p class="s-t">Pay and commissions</p><button class="pill outline" data-go="payroll">Manage pay</button></div></section><section class="s-block"><h3>Material detail tracking</h3>' + toggleRow("md-1", "Source", "", false) + toggleRow("md-2", "Purchase status", "", false) + toggleRow("md-3", "Vendor", "", false) + "</section>",
    "jobs/Templates": () => '<section class="s-block"><h3>Templates</h3><p class="x-muted">Create and manage templates for common types of jobs your company performs. <button class="link" data-x-ext="the help article">Learn more</button></p><div><button class="pill outline" data-x-ext="the job template builder">+ Job template</button></div>' + B.table(["Template name", "Contents"], D.jobTemplates.map((t) => [esc(t), "1 service, 1 checklist"])) + "</section>",
    "jobs/Time tracking": () => '<section class="s-block"><h3>Employee time tracking</h3>' + toggleRow("tt-on", "Total clocked-in time and timesheets", "Allow employees to clock-in and out of their workday to track how many hours they worked.", true) + "<h6>Time format</h6>" + B.radio("tt-fmt", "decimal", "decimal", "Decimal hours", "Example: 48.50") + B.radio("tt-fmt", "hhmm", "decimal", "Hours & minutes (HH:MM)", "Example: 48:30") + toggleRow("tt-jobs", "Travel and time on jobs", "Allow any employee assigned to a job to track their travel and time on the job.", true) + "</section>",

    marketing() {

        B.table(["Type", "Trigger", "Actions", "Conditions", "", ""], shown.map((a, i) => [esc(a[0]), esc(a[1]), esc(a[2]), esc(a[3]), B.sw("auto-" + sub + i, true, "Automation on"), '<button class="icon-btn small" aria-label="More" data-x-ext="the automation editor">' + svg("dots") + "</button>"])) + "</section>";

        '<section class="s-block"><h3>Service Price Adjuster</h3><p class="x-muted">Raise or lower prices across categories by a percent.</p><div class="x-row">' + B.radio("adj-dir", "increase", "increase", "Increase") + B.radio("adj-dir", "decrease", "increase", "Decrease") + '</div><div class="x-row"><input class="x-input s-pct" data-s-pct placeholder="%" aria-label="Percent"><span>%</span>' + B.cb("adj-round", false, "Round to nearest dollar") + "</div>" + B.cb("adj-all", false, "All Services") + '<div class="s-indent">' + B.cb("adj-plumb", false, "Plumbing") + '</div><div class="x-row"><button class="pill" data-s-adjust>Save</button><button class="pill outline" data-x-tab="s-pb" data-val="Services">Cancel</button></div></section>';

  };

  HCP.onClick((e) => {
    const t = (s) => e.target.closest(s);

    if (t("[data-s-cancel]")) { ui.sel.sEdit = ""; HCP.render(); return true; }
    if ((b = t("[data-s-save]"))) { vals()[b.dataset.sSave] = document.querySelector("[data-s-val]").value; ui.sel.sEdit = ""; HCP.save(); HCP.render(); toast("Saved"); return true; }
    if ((b = t("[data-s-step]"))) { ui.sel.leadStep = ui.sel.leadStep === b.dataset.sStep ? "" : b.dataset.sStep; HCP.render(); return true; }
    if (t("[data-s-copy]")) { toast("Copied"); return true; }
    if (t("[data-s-saved]")) { toast("Saved"); return true; }
    if (t("[data-s-adjust]")) { const v = Number((document.querySelector("[data-s-pct]") || {}).value); if (!v) { toast("Enter a percent first"); return true; } toast("Prices " + (S().toggles["adj-dir"] === "decrease" ? "lowered" : "raised") + " by " + v + "% in the practice copy"); return true; }
    if ((b = t("[data-s-adding]"))) { ui.sel.adding = b.dataset.sAdding; HCP.render(); const n = document.getElementById("sAdd"); if (n) n.focus(); return true; }

    return false;
  });
  function commitAdd(key) {
    const el = document.getElementById("sAdd");
    const n = el ? el.value.trim() : "";
    if (!n) { toast("Type a name first"); return; }
    if (key === "source") { const list = S().sources || (S().sources = D.leadSources.map((x) => ({ name: x, archived: false }))); list.push({ name: n, archived: false }); D.leadSources.push(n); toast("Lead source created"); }
    else if (key === "tag") { const list = S().tags || (S().tags = ["Repeat", "Contractor", "VIP", "Warranty", "Rental", "Commercial"]); list.unshift(n); toast("Tag added"); }
    else { D[key].push(n); toast("Added"); }
    ui.sel.adding = ""; HCP.save(); HCP.render();
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("[data-s-add-input]")) { e.preventDefault(); commitAdd(e.target.dataset.sAddInput); } });
  document.addEventListener("change", (e) => {
    if (e.target.matches("[data-s-ind]") && e.target.value) { S().industries.push(e.target.value); HCP.save(); HCP.render(); }
  });
});

<script>
// Create forms module: New lead, New estimate, New recurring job, New event, plus the type switcher
// (caret next to the title). Layout copied from a live Housecall Pro account (Nov 12 2026). Data is fictional.
window.HCP_MODULES = window.HCP_MODULES || [];
window.HCP_MODULES.push(function (HCP) {
  const { svg, esc, toast } = HCP;
  const D = HCP.data;
  const B = HCP.b;
  const S = HCP.extra;
  const pad = (n) => String(n).padStart(2, "0");
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const KIND = { "new-lead": "lead", "new-estimate": "estimate", "new-recurring": "recurring job", "new-event": "event" };
  let f = null;
  const blank = (view) => ({ view, customerId: "", q: "", showResults: false, assignee: "", notes: "", noteFor: "this", services: [], materials: [], adding: "", rows: {}, tags: [], lead: "", fromDate: today(), fromTime: "09:00", toDate: today(), toTime: "10:00", team: view === "new-event" ? ["e0"] : [], freq: "Does not repeat", anytime: false, arrival: "2 hours", notify: false, mode: "Schedule", name: "", note: "", location: "", template: "", confirm: false, typeMenu: false });
  const form = (view) => { if (!f || f.view !== view) f = blank(view); return f; };
  const total = () => f.services.concat(f.materials).reduce((n, r) => n + r.qty * r.price, 0);

  function custCard() {
    const c = B.cust(f.customerId);
    if (c) return '<section class="jp-card nj-card"><div class="nj-title"><i>' + svg("person") + '</i><h3>Customer</h3><button class="icon-btn small" data-f-clear aria-label="Change customer">' + svg("close") + '</button></div><div class="nj-card-body"><b>' + esc(c.display) + "</b><p>" + esc((c.addresses[0] || {}).street || "") + "<br>" + esc((c.phones[0] || {}).number || "") + "</p></div></section>";
    const q = f.q.trim().toLowerCase();
    const hits = q ? HCP.state.customers.filter((x) => (x.display + " " + x.emails.join(" ") + " " + x.phones.map((p) => p.number).join(" ") + " " + x.addresses.map((a) => a.street).join(" ")).toLowerCase().includes(q)).slice(0, 6) : [];
    return '<section class="jp-card nj-card"><div class="nj-title"><i>' + svg("person") + '</i><h3>Customer</h3></div><div class="nj-card-body nj-cust"><div class="search-wrap"><input id="fCust" data-f-q placeholder="Name, email, phone, or address" value="' + esc(f.q) + '" autocomplete="off" aria-label="Customer search">' +
      (q ? '<div class="x-results">' + (hits.length ? hits.map((x) => '<button data-f-cust="' + x.id + '"><b>' + esc(x.display) + "</b><small>" + esc((x.addresses[0] || {}).street || "") + "</small></button>").join("") : '<p class="x-muted">No customers found</p>') + "</div>" : "") +
      '</div><button class="link" data-new="customer">+ New customer</button></div></section>';
  }
  const row = (key, label, icon, body) => '<div class="nj-row' + (f.rows[key] ? " on" : "") + '"><div class="nj-row-head"><i>' + svg(icon) + "</i><span>" + label + '</span><button class="icon-btn small plus" data-f-row="' + key + '" aria-label="Add ' + label + '">' + svg("plus") + "</button></div>" + (f.rows[key] ? '<div class="nj-row-body">' + body + "</div>" : "") + "</div>";
  const opts = (list, val, ph) => '<option value="">' + ph + "</option>" + list.map((o) => "<option" + (o === val ? " selected" : "") + ">" + esc(o) + "</option>").join("");
  const teamSel = () => '<div class="nj-team"><i>' + svg("clipboard") + '</i><div><select data-f-team aria-label="Edit team"><option value="">Edit team</option>' + D.team.filter((m) => !f.team.includes(m.id)).map((m) => '<option value="' + m.id + '">' + esc(m.name) + "</option>").join("") + '</select><div class="people">' + (f.team.length ? f.team.map((id) => { const m = D.team.find((x) => x.id === id); return '<span class="person">' + B.av(m) + esc(m.name) + '<button data-f-untm="' + id + '" aria-label="Remove ' + esc(m.name) + '">' + svg("close") + "</button></span>"; }).join("") : '<span class="person grey"><i class="ic s">' + svg("noUser") + "</i>Unassigned</span>") + "</div></div></div>";
  const dateRow = (lbl, dk, tk) => '<div class="x-row f-dt"><span>' + lbl + '</span><input type="date" data-f="' + dk + '" value="' + f[dk] + '" aria-label="' + lbl + ' date"><input type="time" data-f="' + tk + '" value="' + f[tk] + '" aria-label="' + lbl + ' time"></div>';
  function schedCard(withTz) {
    return '<section class="jp-card nj-card"><div class="nj-title"><i>' + svg("calendar") + '</i><h3>Schedule</h3><button class="icon-btn" data-x-ext="" aria-label="Edit schedule">' + svg("pencil") + '</button></div><div class="nj-card-body nj-sched">' + dateRow("From", "fromDate", "fromTime") + dateRow("To", "toDate", "toTime") + (withTz ? '<p class="tz-line">Timezone: EST</p>' : "") + teamSel() + "</div></section>";
  }
  function lines(templates) {
    const sec = (kind, title, key) => '<div class="lis-head"><h4>' + title + '</h4><button class="link" data-go="price-book">' + (kind === "service" ? "Service" : "Material") + ' Price Book<i class="bk">' + svg("bookmark") + "</i></button></div>" +

      (f.adding === key ? '<div class="f-add"><select data-f-pick="' + key + '" aria-label="Pick ' + kind + '"><option value="">Choose from the price book</option>' + D.priceBook.filter((p) => p.kind === kind).map((p) => "<option>" + esc(p.name) + "</option>").join("") + "</select></div>" : '<button class="lis-add" data-f-adding="' + key + '"><span>Add ' + kind + "</span><i>" + svg("plus") + "</i></button>");
    return '<section class="jp-card nj-lines"><div class="jp-title-row"><h2>Line items</h2><div class="view-seg"><button class="on" aria-label="List view">' + svg("menu") + '</button><button data-x-ext="the detailed view" aria-label="Detailed view">' + svg("fields") + "</button></div></div>" + (templates ? '<div class="eg-templates"><button class="link" data-x-ext="estimate templates">Templates<i class="bk">' + svg("bookmark") + "</i></button></div>" : "") +
      sec("service", "Services", "services") + sec("material", "Materials", "materials") + '<div class="lis-sum"><span>Subtotal</span><span>' + B.money(total()) + '</span></div><div class="lis-sum"><span>Tax rate' + (f.view === "new-lead" ? "" : '<small class="eg-sub">none</small>') + '</span><span>$0.00</span><button class="icon-btn small plus" data-x-ext="the tax rate picker" aria-label="Edit tax rate">' + svg("pencil") + '</button></div><div class="lis-sum big"><span>Total</span><span>' + B.money(total()) + "</span></div>" +
      (f.view === "new-estimate" ? '<table class="eg-cost"><thead><tr><th>Cost breakdown</th><th>Total cost</th><th>Profit/Loss</th></tr></thead><tbody><tr><td></td><td>$0.00</td><td>' + (total() ? "100.00" : "0.00") + " %</td></tr></tbody></table>" : "") + "</section>";
  }
  const notes = (word) => '<section class="jp-card nj-card nj-note"><div class="nj-title"><i>' + svg("note") + '</i><h3>Private notes</h3><div class="note-seg"><button class="' + (f.noteFor === "this" ? "on" : "") + '" data-f-notefor="this">This ' + word + '</button><button class="' + (f.noteFor === "cust" ? "on" : "") + '" data-f-notefor="cust">Customer</button></div></div><div class="nj-card-body"><textarea data-f="notes" aria-label="Private notes" placeholder="Add a private note here">' + esc(f.notes) + "</textarea></div></section>";
  const sideRows = (list) => list.map((k) => ({
    checklists: row("checklists", "Checklists", "checklist", '<select data-f="checklist" aria-label="Checklist">' + opts(D.checklists, f.checklist, "Add a checklist") + "</select>"),
    attachments: row("attachments", "Attachments", "attach", '<button class="pill outline" data-x-ext="a file picker">Upload file</button>'),
    fields: row("fields", "Fields", "fields", '<label class="block">Job type<select data-f="jobType">' + opts(D.jobTypes, f.jobType, "Select") + '</select></label><label class="block">Business unit<select data-f="unit">' + opts(D.businessUnits, f.unit, "Select") + "</select></label>"),
    tags: row("tags", "Tags", "tag", '<input data-f-tag placeholder="Type a tag and press Enter" aria-label="Tags"><div class="tags">' + f.tags.map((t, i) => '<span class="tag">' + esc(t) + '<button data-f-untag="' + i + '" aria-label="Remove ' + esc(t) + '">' + svg("close") + "</button></span>").join("") + "</div>"),
    lead: row("lead", "Lead source", "target", '<select data-f="lead" aria-label="Lead source">' + opts(D.leadSources, f.lead, "Select") + "</select>"),
  }[k])).join("");
  function head(title, ready, saveLabel, extra) {
    return '<header class="nj-head"><button class="icon-btn" data-f-close aria-label="Close">' + svg("close") + '</button><h1 id="njTitle">' + title + '</h1><button class="icon-btn nj-caret" data-x-type aria-label="Change type">' + svg("chevDown") + "</button>" + (f.typeMenu ? typeMenu() : "") + (extra || "") + '<button class="pill' + (ready ? "" : " off") + '" data-f-save>' + saveLabel + "</button></header>";
  }
  function typeMenu() {
    return '<div class="menu f-type">' + [["new-job", "New job"], ["new-recurring", "New recurring job"], ["new-estimate", "New estimate"], ["new-lead", "New lead"]].map(([v, l]) => '<button class="' + (v === (f ? f.view : "new-job") ? "sel" : "") + '" data-f-switch="' + v + '">' + l + "</button>").join("") + "</div>";
  }
  const confirmBox = () => (f.confirm ? '<div class="modal"><div class="dialog small-dialog" role="alertdialog" aria-modal="true" aria-labelledby="fDel"><h2 id="fDel">Delete ' + KIND[f.view] + '?</h2><p>Are you sure you want to delete this ' + KIND[f.view] + '? This action cannot be undone.</p><div><button class="pill outline" data-f-keep>Keep</button><button class="pill danger" data-f-delete>Delete</button></div></div></div>' : "");
  const wrap = (inner) => '<div class="nj f-form" role="dialog" aria-modal="true" aria-labelledby="njTitle">' + inner + "</div>" + confirmBox();

  HCP.views["new-lead"] = () => { form("new-lead"); return wrap(head("New lead", !!f.customerId, "Save lead") + '<div class="nj-body"><div class="nj-left">' + custCard() + '<section class="jp-card nj-card"><div class="nj-title"><i>' + svg("calendar") + '</i><h3>Lead assignee</h3></div><div class="nj-card-body"><select data-f="assignee" aria-label="Assign to"><option value="">Assign to</option>' + D.team.map((m) => '<option value="' + m.id + '"' + (f.assignee === m.id ? " selected" : "") + ">" + esc(m.name) + "</option>").join("") + "</select></div></section>" + sideRows(["attachments", "fields", "tags", "lead"]) + '</div><div class="nj-right">' + notes("lead") + lines(false) + "</div></div>"); };
  HCP.views["new-estimate"] = () => { form("new-estimate"); return wrap(head("New estimate", !!f.customerId, "Save estimate") + '<div class="nj-body"><div class="nj-left">' + custCard() + schedCard(false) + sideRows(["checklists", "attachments", "fields", "tags", "lead"]) + '</div><div class="nj-right">' + notes("estimate") + lines(true) + "</div></div>"); };
  function freqList() {
    const d = new Date(f.fromDate + "T12:00:00");
    const nth = ["first", "second", "third", "fourth", "fifth"][Math.floor((d.getDate() - 1) / 7)];
    return ["Does not repeat", "Daily", "Every weekday (Monday to Friday)", "Weekly on " + DAYS[d.getDay()], "Monthly on the " + nth + " " + DAYS[d.getDay()], "Yearly on " + MON[d.getMonth()] + " " + d.getDate(), "Custom"];
  }
  const fmtT = (t) => { const [h, m] = t.split(":").map(Number); return (h % 12 || 12) + ":" + pad(m) + (h >= 12 ? "pm" : "am"); };
  HCP.views["new-recurring"] = () => {
    form("new-recurring");
    const arr = { "None": 0, "30 minutes": 30, "1 hour": 60, "2 hours": 120, "3 hours": 180, "4 hours": 240 };
    const [h, m] = f.fromTime.split(":").map(Number); const endMin = h * 60 + m + arr[f.arrival];
    const endT = pad(Math.floor(endMin / 60) % 24) + ":" + pad(endMin % 60);
    const sched = '<section class="jp-card nj-card f-rec"><div class="jp-title-row"><h2>Schedule</h2><button class="pill outline" data-go="schedule">Edit on calendar</button></div><h6>Frequency</h6><div class="f-freq">' + freqList().map((o) => '<label class="' + (f.freq === o ? "on" : "") + '"><input type="radio" name="freq" data-f="freq" value="' + esc(o) + '"' + (f.freq === o ? " checked" : "") + "> " + esc(o) + "</label>").join("") + "</div>" +
      '<div class="x-row x-between"><h6>Recurrence starts</h6>' + B.seg("rec-mode", ["Schedule", "Find a time"], "Schedule") + '</div><div class="f-grid"><label class="x-field"><small>Start date</small><input type="date" data-f="fromDate" value="' + f.fromDate + '"></label><label class="x-field"><small>Start time</small><input type="time" data-f="fromTime" value="' + f.fromTime + '"></label><label class="x-field"><small>End date</small><input type="date" data-f="toDate" value="' + f.toDate + '"></label><label class="x-field"><small>End time</small><input type="time" data-f="toTime" value="' + f.toTime + '"></label></div>' +
      '<label class="check"><input type="checkbox" data-f-chk="anytime"' + (f.anytime ? " checked" : "") + "> Anytime</label>" + teamSel() + '<label class="x-field"><small>Arrival window</small><select data-f="arrival">' + Object.keys(arr).map((k) => "<option" + (k === f.arrival ? " selected" : "") + ">" + k + "</option>").join("") + "</select></label>" + (arr[f.arrival] ? '<p class="x-muted f-help">' + esc(D.company) + " is scheduled to arrive between " + fmtT(f.fromTime) + " - " + fmtT(endT) + "</p>" : "") + '<label class="check"><input type="checkbox" data-f-chk="notify"' + (f.notify ? " checked" : "") + "> Notify customer</label></section>";
    return wrap(head("New recurring job", true, "Save recurring job", '<select class="nj-template" data-f="template" aria-label="Job Template">' + opts(D.jobTemplates, f.template, "Job Template") + "</select>") + '<div class="nj-body"><div class="nj-left">' + custCard() + sideRows(["checklists", "fields", "tags", "lead"]) + '<button class="x-fb" data-x-ext="the feedback form"><i>' + svg("feedback") + '</i>Give us feedback<i>' + svg("chevDown") + '</i></button></div><div class="nj-right">' + notes("recurring job") + lines(false) + sched + "</div></div>");
  };
  HCP.views["new-event"] = () => { form("new-event"); return wrap('<header class="nj-head"><button class="icon-btn" data-f-close aria-label="Close">' + svg("close") + '</button><h1 id="njTitle">New event</h1><span class="nj-sp"></span><button class="pill' + (f.name.trim() ? "" : " off") + '" data-f-save>Save event</button></header><div class="nj-body"><div class="nj-left">' + schedCard(true) + '</div><div class="nj-right"><section class="jp-card nj-card"><div class="nj-title"><i>' + svg("fields") + '</i><h3>Event details (optional)</h3></div><div class="nj-card-body stack"><label class="x-field"><small>Name</small><input data-f="name" value="' + esc(f.name) + '" aria-label="Name"></label><label class="x-field"><small>Note</small><input data-f="note" value="' + esc(f.note) + '" aria-label="Note"></label><label class="x-field"><small>Location</small><input data-f="location" value="' + esc(f.location) + '" aria-label="Location"></label></div></section></div></div>'); };
  Object.assign(HCP.titles, { "new-lead": "New lead", "new-estimate": "Add estimate", "new-recurring": "Add recurring job", "new-event": "Add Events" });
  Object.assign(HCP.navFor, { "new-lead": "leads", "new-estimate": "estimates", "new-recurring": "jobs", "new-event": "schedule" });

  function save() {
    const c = B.cust(f.customerId);
    if (f.view === "new-event") {
      if (!f.name.trim()) { toast("Add a name for the event"); return; }
      (S().events || (S().events = [])).push({ name: f.name, date: f.fromDate, start: f.fromTime, end: f.toTime, team: f.team.slice() });
      HCP.save(); f = null; toast("Event saved"); HCP.go("schedule"); return;
    }
    if (!c) { toast("Pick a customer first"); return; }
    if (f.view === "new-lead") {
      const id = 1000 + S().leads.length + 1;
      S().leads.unshift({ id, customerId: c.id, note: f.notes, source: f.lead, tags: f.tags.slice(), created: today(), assignee: f.assignee, value: total() });
      HCP.save(); f = null; toast("Lead saved"); HCP.go("leads"); return;
    }
    if (f.view === "new-estimate") {
      const id = Math.max.apply(null, HCP.state.estimates.map((e) => e.id)) + 1;
      const d = new Date(); d.setDate(d.getDate() + 30);
      HCP.state.estimates.unshift({ id, customerId: c.id, status: "Scheduled", assignee: f.team[0] || "", created: today(), updated: today(), expires: MON[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(), lead: f.lead, notes: f.notes, discount: 0, services: f.services, materials: f.materials });
      HCP.save(); f = null; toast("Estimate saved"); HCP.go("estimate/" + id); return;
    }
    const id = Math.max.apply(null, HCP.state.jobs.map((j) => j.id)) + 1;
    const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
    HCP.state.jobs.unshift({ id, customerId: c.id, addressId: (c.addresses[0] || {}).id, status: "Scheduled", appt: { date: f.fromDate, start: toMin(f.fromTime), end: toMin(f.toTime), anytime: f.anytime, team: f.team.slice(), arrival: 120 }, jobType: f.jobType || "", unit: f.unit || "", lead: f.lead, tags: f.tags.slice(), notes: f.notes, services: f.services, materials: f.materials, recurring: f.freq });
    HCP.save(); f = null; toast("Recurring job saved"); HCP.go("job/" + id);
  }

  HCP.onClick((e) => {
    const t = (s) => e.target.closest(s);
    let b;
    // The caret beside every create-form title switches the form type (New job included).
    if (t("[data-x-type]")) {
      if (HCP.view === "new-job") { let m = document.querySelector(".f-type"); if (m) m.remove(); else { t("[data-x-type]").insertAdjacentHTML("afterend", typeMenu().replace('class="sel"', "")); document.querySelector('.f-type [data-f-switch="new-job"]').classList.add("sel"); } }
      else { f.typeMenu = !f.typeMenu; HCP.render(); }
      return true;
    }
    if ((b = t("[data-f-switch]"))) { const v = b.dataset.fSwitch; if (f) f.typeMenu = false; const keep = f && { customerId: f.customerId, notes: f.notes, services: f.services, materials: f.materials }; if (v === "new-job") { f = null; HCP.startJob(null, "jobs"); } else { f = Object.assign(blank(v), keep || {}); HCP.go(v); } return true; }
    if (!f || !KIND[HCP.view]) return false;
    if (f.typeMenu && !t(".f-type")) { f.typeMenu = false; HCP.render(); }
    if ((b = t("[data-f-cust]"))) { f.customerId = b.dataset.fCust; f.q = ""; HCP.render(); return true; }
    if (t("[data-f-clear]")) { f.customerId = ""; HCP.render(); return true; }
    if ((b = t("[data-f-row]"))) { f.rows[b.dataset.fRow] = !f.rows[b.dataset.fRow]; HCP.render(); return true; }
    if ((b = t("[data-f-adding]"))) { f.adding = b.dataset.fAdding; HCP.render(); return true; }
    if ((b = t("[data-f-del]"))) { const [k, i] = b.dataset.fDel.split("."); f[k].splice(Number(i), 1); HCP.render(); return true; }
    if ((b = t("[data-f-untm]"))) { f.team = f.team.filter((x) => x !== b.dataset.fUntm); HCP.render(); return true; }
    if ((b = t("[data-f-untag]"))) { f.tags.splice(Number(b.dataset.fUntag), 1); HCP.render(); return true; }
    if ((b = t("[data-f-notefor]"))) { f.noteFor = b.dataset.fNotefor; HCP.render(); return true; }
    if (t("[data-f-save]")) { save(); return true; }
    if (t("[data-f-close]")) { const dirty = f.customerId || f.notes || f.services.length || f.name; if (dirty) { f.confirm = true; HCP.render(); } else { const back = HCP.navFor[HCP.view]; f = null; HCP.go(back); } return true; }
    if (t("[data-f-keep]")) { f.confirm = false; HCP.render(); return true; }
    if (t("[data-f-delete]")) { const back = HCP.navFor[HCP.view]; f = null; HCP.go(back); return true; }
    return false;
  });
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (!f) return;
    if (el.matches("[data-f-q]")) { f.q = el.value; const p = el.selectionStart; HCP.render(); const n = document.getElementById("fCust"); n.focus(); n.setSelectionRange(p, p); }
    else if (el.matches("input[data-f]:not([type=radio]):not([type=date]):not([type=time]), textarea[data-f]")) { f[el.dataset.f] = el.value; if (el.dataset.f === "name") { const s = document.querySelector("[data-f-save]"); if (s) s.classList.toggle("off", !el.value.trim()); } }
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (!f) return;
    if (el.matches("[data-f-pick]") && el.value) { const p = D.priceBook.find((x) => x.name === el.value); f[el.dataset.fPick].push({ name: p.name, description: p.description, qty: 1, price: p.price }); f.adding = ""; HCP.render(); }
    else if (el.matches("[data-f-team]") && el.value) { f.team.push(el.value); HCP.render(); }
    else if (el.matches("[data-f-chk]")) { f[el.dataset.fChk] = el.checked; }
    else if (el.matches("select[data-f], input[type=radio][data-f], input[type=date][data-f], input[type=time][data-f]")) { f[el.dataset.f] = el.value; HCP.render(); }
  });
  document.addEventListener("keydown", (e) => {
    if (f && e.key === "Enter" && e.target.matches("[data-f-tag]") && e.target.value.trim()) { e.preventDefault(); f.tags.push(e.target.value.trim()); HCP.render(); const n = document.querySelector("[data-f-tag]"); if (n) n.focus(); }
  });
  HCP.afterRender.push(() => document.getElementById("shell").classList.toggle("x-full", !!KIND[HCP.view]));
  HCP.onReset.push(() => { f = null; });
});

</script>
<script>
// Calls with Voice and HCP Assist turned on, laid out from a live account that has both
// (Full map, section 14, Nov 12 2026). Practice data is made up.
// The live account with these features runs the old top-nav layout; here they sit under the
// new layout's Calls tabs (Voice, HCP Assist). Where a sub-screen sits in the new layout is our reading.
window.HCP_MODULES = window.HCP_MODULES || [];
window.HCP_MODULES.push(function (HCP) {
  const { svg, esc, toast } = HCP;
  const B = HCP.b;
  const ui = { sub: "Call log", vtab: "All", q: "", aq: "", open: null, aopen: null };
  const pad = (n) => String(n).padStart(2, "0");
  const dayStr = (off) => { const d = new Date(); d.setDate(d.getDate() + off); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  const when = (c) => { const [y, m, d] = c.date.split("-"); const h = Math.floor(c.m / 60), mm = c.m % 60; return m + "/" + d + "/" + y.slice(2) + " " + ((h % 12) || 12) + ":" + pad(mm) + (h < 12 ? " am" : " pm"); };
  const dur = (s) => (s ? Math.floor(s / 60) + ":" + pad(s % 60) : "0:00");
  const page = (inner) => '<div class="x-page">' + inner + "</div>";

  function seed() {
    return {
      reasons: [{ name: "New job request", opp: true, archived: false }, { name: "Question about a booked job", opp: false, archived: false }, { name: "Estimate follow-up", opp: true, archived: false }, { name: "Billing question", opp: false, archived: false }, { name: "Spam or wrong number", opp: false, archived: false }],
      voice: [
        { id: "v1", dir: "Inbound", missed: false, vm: false, from: "(555) 010-0127", customerId: "c2", date: dayStr(0), m: 545, secs: 212, lead: "Facebook", reason: "Question about a booked job", object: "", emp: "Demo User", read: true },
        { id: "v2", dir: "Inbound", missed: true, vm: true, from: "(555) 010-0190", customerId: "", date: dayStr(0), m: 602, secs: 38, lead: "Google Search", reason: "", object: "", emp: "", read: false, vmText: "Hi, my water heater is leaking from the bottom. Please call me back at 555-010-0190. This is Carla." },
        { id: "v3", dir: "Inbound", missed: true, vm: false, from: "(555) 010-0133", customerId: "c3", date: dayStr(0), m: 655, secs: 0, lead: "Referral", reason: "", object: "", emp: "", read: false },
        { id: "v4", dir: "Outbound", missed: false, vm: false, from: "(555) 010-0166", customerId: "c6", date: dayStr(-1), m: 870, secs: 95, lead: "Google Local Services", reason: "Estimate follow-up", object: "", emp: "Demo User", read: true },
        { id: "v5", dir: "Inbound", missed: false, vm: false, from: "(555) 010-0201", customerId: "", date: dayStr(-1), m: 600, secs: 241, lead: "Google Local Services", reason: "", object: "", emp: "Demo User", read: true },
        { id: "v6", dir: "Inbound", missed: false, vm: false, from: "(555) 010-0119", customerId: "c1", date: dayStr(-2), m: 720, secs: 133, lead: "Existing customer", reason: "New job request", object: "Job #2260", emp: "Demo User", read: true },
      ],
      assist: [
        { id: "a1", status: "Action required", from: "(555) 010-0213", customerId: "", ctype: "New Customer", date: dayStr(0), m: 1230, secs: 186, lead: "Google Search", reason: "Message for Pro", job: "", notes: "After-hours caller, Maria. Toilet overflowing, shut the water off herself. Wants a call first thing in the morning. Address 41 Willow Ct, Riverton." },
        { id: "a2", status: "Action required", from: "(555) 010-0148", customerId: "c4", ctype: "Existing Customer", date: dayStr(0), m: 1305, secs: 92, lead: "Google Search", reason: "General Inquiry", job: "", notes: "Caller asked to book a drain cleaning. Customer is marked Do not service, so nothing was booked. Asked the office to call back." },
        { id: "a3", status: "Reviewed", from: "(555) 010-0133", customerId: "c3", ctype: "Existing Customer", date: dayStr(-1), m: 1200, secs: 151, lead: "Referral", reason: "Cancellation Request", job: "2263", notes: "Wants to cancel Friday's faucet appointment. Will call back to rebook next week." },
        { id: "a4", status: "Reviewed", from: "(555) 010-0222", customerId: "", ctype: "Silent call", date: dayStr(-2), m: 1350, secs: 12, lead: "", reason: "General Inquiry", job: "", notes: "No one spoke on the line." },
      ],
    };
  }
  const C = () => {
    const c = HCP.state.calls || (HCP.state.calls = seed());
    // Practice data saved before Nov 18 had a "Completed" HCP Assist status. The help center lists Action required, To do, In progress and Reviewed.
    (c.assist || []).forEach((a) => { if (a.status === "Completed") a.status = "Reviewed"; });
    return c;
  };
  const cust = (id) => HCP.state.customers.find((c) => c.id === id);
  const caller = (c) => { const x = cust(c.customerId); return x ? x.display : c.from; };

  // ---------- Voice ----------
  function voiceLog() {
    const tabs = ["All", "Missed", "Inbound", "Outbound", "Voicemails"];
    const q = ui.q.trim().toLowerCase();
    const ord = (a, b) => (b.date + String(b.m).padStart(4, "0")).localeCompare(a.date + String(a.m).padStart(4, "0"));
    const list = C().voice.slice().sort(ord).filter((c) => ui.vtab === "All" || (ui.vtab === "Missed" && c.missed) || (ui.vtab === "Inbound" && c.dir === "Inbound") || (ui.vtab === "Outbound" && c.dir === "Outbound") || (ui.vtab === "Voicemails" && c.vm)).filter((c) => !q || (caller(c) + " " + c.from).toLowerCase().includes(q));
    const type = (c) => '<span class="vc-type' + (c.missed ? " miss" : "") + '">' + svg("phone") + (c.missed ? (c.vm ? "Voicemail" : "Missed") : c.dir) + "</span>";
    const rows = list.map((c) => '<tr class="row' + (c.read ? "" : " vc-unread") + '" data-vc-open="' + c.id + '"><td>' + type(c) + "</td><td>" + esc(caller(c)) + (cust(c.customerId) ? "" : '<br><small class="x-muted">Unknown caller</small>') + "</td><td>" + when(c) + "</td><td>" + esc(c.lead || "-") + "</td><td>" + esc(c.reason || "-") + "</td><td>" + esc(c.object || "-") + "</td><td>" + esc(c.emp || "-") + "</td><td>" + dur(c.secs) + '</td><td><button class="icon-btn small" data-vc-open="' + c.id + '" aria-label="Open call">' + svg("dots") + "</button></td></tr>").join("");
    return '<div class="x-row x-between"><h2 class="vc-h">Call log</h2><div class="x-row"><button class="pill outline" data-vc-sub="Overview">Launch Voice overview</button><button class="pill outline" data-x-ext="the Voice usage page">View usage</button><button class="pill outline" data-x-ext="your browser notification prompt">Turn on notifications</button></div></div>' +
      '<div class="el-tabs" role="tablist">' + tabs.map((t) => '<button role="tab" class="' + (ui.vtab === t ? "on" : "") + '" aria-selected="' + (ui.vtab === t) + '" data-vc-tab="' + t + '">' + t + (t === "Missed" ? ' <span class="x-count">' + C().voice.filter((c) => c.missed && !c.read).length + "</span>" : "") + "</button>").join("") + "</div>" +
      '<div class="el-bar"><label class="ep-search"><i>' + svg("search") + '</i><input data-vc-q placeholder="Search by name or number" aria-label="Search by name or number" value="' + esc(ui.q) + '"></label><button class="icon-btn" data-x-ext="the call log filter" aria-label="Filter">' + svg("fields") + '</button><button class="icon-btn" data-x-ext="the Edit columns list" aria-label="Edit columns">' + svg("pipeline") + '</button><span></span><button class="pill outline" data-x-ext="a CSV download of the call log">Export</button><button class="pill outline" data-vc-readall>Mark all as read</button></div>' +
      '<div class="el-table vc-table"><table><thead><tr><th>Type</th><th>Caller</th><th>Start time</th><th>Lead source</th><th>Reason for call</th><th>Object created</th><th>Employee</th><th>Duration</th><th>Actions</th></tr></thead><tbody>' + (rows || '<tr><td colspan="9" class="muted">No calls here</td></tr>') + '</tbody></table><div class="el-pager">' + (list.length ? "1-" + list.length : "0-0") + " of " + list.length + " &nbsp; Rows per page 10</div></div>";
  }
  function overview() {
    const v = C().voice;
    return '<div class="vc-counters"><div><small>Calls today</small><b>' + v.filter((c) => c.date === dayStr(0)).length + '</b></div><div><small>Missed today</small><b>' + v.filter((c) => c.date === dayStr(0) && c.missed).length + '</b></div><div><small>Voicemails</small><b>' + v.filter((c) => c.vm).length + "</b></div></div>" +
      B.tabs("vc-ov", ["Queued calls", "Active calls", "Agent management"], "Queued calls") + '<section class="x-card x-pad vc-empty"><p>Please open your dialer to connect to the call queue</p><button class="pill" data-x-ext="the Voice dialer">Open dialer</button></section>';
  }
  function coaching() {
    return '<section class="x-card x-pad vc-empty"><h3>Voice call coaching</h3><p class="x-muted">AI reviews recorded calls and gives tips on how each call was handled.</p><button class="pill" data-x-ext="the AI coach">Take me to AI coach</button></section>';
  }
  // ---------- HCP Assist ----------
  function assistLog() {
    const q = ui.aq.trim().toLowerCase();
    const list = C().assist.slice().sort((a, b) => (b.date + String(b.m).padStart(4, "0")).localeCompare(a.date + String(a.m).padStart(4, "0"))).filter((c) => !q || (caller(c) + " " + c.from).toLowerCase().includes(q));
    const st = (s) => '<span class="vc-st' + (s === "Action required" ? " red" : "") + '"><i></i>' + esc(s) + "</span>";
    return '<nav class="jp-crumb"><span>Inbox</span><span>›</span><span>HCP Assist</span></nav>' +
      '<div class="vc-counters"><div><small>Calls this month</small><b>' + C().assist.length + '</b></div><div><small>Minutes used</small><b>' + Math.round(C().assist.reduce((n, c) => n + c.secs, 0) / 60) + '</b></div><div><small>Action required</small><b>' + C().assist.filter((c) => c.status === "Action required").length + '</b></div><button class="pill outline" data-x-ext="the HCP Assist usage page">View usage</button></div>' +
      '<div class="el-bar"><label class="ep-search"><i>' + svg("search") + '</i><input data-as-q placeholder="Search by name or number" aria-label="Search HCP Assist calls" value="' + esc(ui.aq) + '"></label><button class="icon-btn" data-x-ext="the call log filter" aria-label="Filter">' + svg("fields") + '</button><span class="inv-chip"><span>Call reason is not SPAM</span></span><span class="inv-chip"><span>Caller type is not SPAM</span></span><span></span><button class="pill outline" data-x-ext="a CSV download of the call log">Export</button></div>' +
      '<div class="el-table vc-table"><table><thead><tr><th>Status</th><th>Caller</th><th>Caller type</th><th>Start time</th><th>Lead source</th><th>Call reason</th><th>Job</th><th>Duration</th></tr></thead><tbody>' +
      list.map((c) => '<tr class="row" data-as-open="' + c.id + '"><td>' + st(c.status) + "</td><td>" + esc(caller(c)) + "</td><td>" + esc(c.ctype) + "</td><td>" + when(c) + "</td><td>" + esc(c.lead || "-") + "</td><td>" + esc(c.reason) + "</td><td>" + (c.job ? '<button class="link" data-go="job/' + c.job + '">Job ↗</button>' : "-") + "</td><td>" + dur(c.secs) + "</td></tr>").join("") + "</tbody></table></div>";
  }
  HCP.views.calls = function () {
    const tab = B.tab("calls", "Voice");
    const voiceSub = '<div class="x-seg vc-sub">' + ["Overview", "Coaching", "Call log"].map((s) => '<button class="' + (ui.sub === s ? "on" : "") + '" data-vc-sub="' + s + '">' + s + "</button>").join("") + "</div>";
    const body = tab === "HCP Assist" ? assistLog() : voiceSub + (ui.sub === "Overview" ? overview() : ui.sub === "Coaching" ? coaching() : voiceLog());
    return page(B.head("Calls", { feedback: true, gear: "app-settings/inbox" }) + B.tabs("calls", ["Voice", "HCP Assist"], "Voice") + body);
  };

  // ---------- call windows ----------
  function openCall(id) {
    const c = C().voice.find((x) => x.id === id); if (!c) return;
    c.read = true; HCP.save(); ui.open = id;
    const reasons = C().reasons.filter((r) => !r.archived).map((r) => r.name);
    const el = document.getElementById("modal"); el.hidden = false;
    el.innerHTML = '<div class="dialog pay ja" role="dialog" aria-modal="true" aria-labelledby="vcT"><h2 id="vcT">' + esc(caller(c)) + '</h2><div class="pay-body">' +
      '<p class="x-muted">' + esc(c.from) + " · " + (c.missed ? (c.vm ? "Voicemail" : "Missed call") : c.dir + " call") + " · " + when(c) + " · " + dur(c.secs) + "</p>" +
      (c.vmText ? '<p class="cp-note"><b>Voicemail:</b> ' + esc(c.vmText) + "</p>" : "") +
      (c.secs && !c.missed ? '<button class="pill outline" data-vc-play>' + svg("play") + " Play recording</button>" : "") +
      '<label class="pay-f send-f filled"><span>Caller (Edit caller)</span><select data-vc-cust aria-label="Caller"><option value="">Unknown caller</option>' + HCP.state.customers.map((x) => '<option value="' + x.id + '"' + (x.id === c.customerId ? " selected" : "") + ">" + esc(x.display) + "</option>").join("") + "</select></label>" +
      '<label class="pay-f send-f filled"><span>Reason for call</span><select data-vc-reason aria-label="Reason for call"><option value="">Add call reason</option>' + reasons.map((r) => "<option" + (r === c.reason ? " selected" : "") + ">" + esc(r) + "</option>").join("") + "</select></label>" +
      '<div class="x-row"><button class="pill outline" data-vc-job>Create job</button><button class="pill outline" data-vc-cb>Call back</button></div></div>' +
      '<div class="send-foot"><button class="pill outline" data-vc-close>Close</button><button class="pill" data-vc-save>Save</button></div></div>';
  }
  function openAssist(id) {
    const c = C().assist.find((x) => x.id === id); if (!c) return;
    ui.aopen = id;
    const el = document.getElementById("modal"); el.hidden = false;
    el.innerHTML = '<div class="dialog pay ja" role="dialog" aria-modal="true" aria-labelledby="asT"><h2 id="asT">' + esc(caller(c)) + " · " + esc(c.ctype) + '</h2><div class="pay-body">' +
      '<p class="x-muted">' + esc(c.from) + " · " + when(c) + " · " + esc(c.reason) + "</p>" +
      '<p class="cp-note"><b>Call notes:</b> ' + esc(c.notes) + "</p>" +
      '<label class="pay-f send-f filled"><span>Status</span><select data-as-status aria-label="Status">' + ["Action required", "To do", "In progress", "Reviewed"].map((s) => "<option" + (s === c.status ? " selected" : "") + ">" + s + "</option>").join("") + "</select></label>" +
      '<div class="x-row">' + (c.job ? '<button class="pill outline" data-go="job/' + c.job + '">Open job</button>' : '<button class="pill outline" data-as-job>Create job</button>') + '<button class="pill outline" data-as-cb>Call back</button></div></div>' +
      '<div class="send-foot"><button class="pill outline" data-vc-close>Close</button><button class="pill" data-as-save>Save</button></div></div>';
  }
  const closeModal = () => { ui.open = null; ui.aopen = null; const el = document.getElementById("modal"); el.hidden = true; el.innerHTML = ""; };
  function logCallback(num) {
    const c = HCP.state.customers.find((x) => x.phones.some((p) => p.number === num));
    C().voice.unshift({ id: "v" + Date.now().toString(36), dir: "Outbound", missed: false, vm: false, from: num, customerId: c ? c.id : "", date: dayStr(0), m: new Date().getHours() * 60 + new Date().getMinutes(), secs: 60, lead: c ? c.lead : "", reason: "", object: "", emp: "Demo User", read: true });
    HCP.save(); toast("Call back logged in the call log (no real call is made)");
  }

  HCP.onClick((e) => {
    const t = (s) => e.target.closest(s);
    let b;
    if ((b = t("[data-vc-sub]"))) { ui.sub = b.dataset.vcSub; HCP.render(); return true; }
    if ((b = t("[data-vc-tab]"))) { ui.vtab = b.dataset.vcTab; HCP.render(); return true; }
    if (t("[data-vc-readall]")) { C().voice.forEach((c) => (c.read = true)); HCP.save(); HCP.render(); toast("All calls marked as read"); return true; }
    if ((b = t("[data-vc-open]"))) { openCall(b.dataset.vcOpen); return true; }
    if ((b = t("[data-as-open]")) && !t("[data-go]")) { openAssist(b.dataset.asOpen); return true; }
    if (t("[data-vc-close]")) { closeModal(); HCP.render(); return true; }
    if (t("[data-vc-play]")) { toast("Recordings are not in the practice copy. In Housecall Pro this plays the call."); return true; }
    if (t("[data-vc-save]")) {
      const c = C().voice.find((x) => x.id === ui.open);
      const cid = document.querySelector("[data-vc-cust]").value; const r = document.querySelector("[data-vc-reason]").value;
      c.customerId = cid; c.reason = r; if (cid) { const x = cust(cid); if (x && !c.lead) c.lead = x.lead; }
      HCP.save(); closeModal(); HCP.render(); toast("Call saved"); return true;
    }
    if (t("[data-vc-cb]")) { const c = C().voice.find((x) => x.id === ui.open); closeModal(); logCallback(c.from); HCP.render(); return true; }
    if (t("[data-as-cb]")) { const c = C().assist.find((x) => x.id === ui.aopen); closeModal(); logCallback(c.from); HCP.render(); return true; }
    if (t("[data-vc-job]") || t("[data-as-job]")) {
      const c = ui.open ? C().voice.find((x) => x.id === ui.open) : C().assist.find((x) => x.id === ui.aopen);
      closeModal();
      if (c.customerId) { if (ui.open !== null || true) { if ("object" in c) c.object = "Job (in progress)"; HCP.save(); } const btn = document.createElement("button"); btn.dataset.newJobFor = c.customerId; btn.hidden = true; document.body.appendChild(btn); btn.click(); btn.remove(); }
      else { toast("Link the caller to a customer first, or create the customer from Create > Customer"); HCP.render(); }
      return true;
    }
    if (t("[data-as-save]")) { const c = C().assist.find((x) => x.id === ui.aopen); c.status = document.querySelector("[data-as-status]").value; HCP.save(); closeModal(); HCP.render(); toast("Status saved"); return true; }
    return false;
  });
  document.addEventListener("input", (e) => {
    if (e.target.matches("[data-vc-q]")) { ui.q = e.target.value; const p = e.target.selectionStart; HCP.render(); const n = document.querySelector("[data-vc-q]"); n.focus(); n.setSelectionRange(p, p); }
    if (e.target.matches("[data-as-q]")) { ui.aq = e.target.value; const p = e.target.selectionStart; HCP.render(); const n = document.querySelector("[data-as-q]"); n.focus(); n.setSelectionRange(p, p); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (ui.open || ui.aopen)) { closeModal(); HCP.render(); } });

  // ---------- Settings > Inbox, with Voice (Full map 14, item 23; Settings - Housecall Pro INT-C09) ----------
  HCP.voiceSettings = function (tab) {
    if (tab === "Phone Numbers") return '<section class="s-block"><div class="x-row x-between"><h3>Phone Numbers</h3><div class="x-row"><button class="pill outline" data-x-ext="number porting">Port numbers</button><button class="pill" data-x-ext="the add number window">Add number</button></div></div>' + B.table(["Number", "Lead source", "Destination"], [["(555) 010-0100 (primary)", "-", "Main call flow"], ["(555) 010-0300", "Google Local Services", "Main call flow"], ["(555) 010-0301", "Yard sign", "Main call flow"]], "", "s-table") + "</section>";
    const R = C().reasons;
    const rt = B.tab("s-cr", "Active");
    const rows = R.filter((r) => (rt === "Active") !== r.archived).map((r, i) => [esc(r.name), r.opp ? "Yes" : "No", '<button class="link" data-cr-arch="' + R.indexOf(r) + '">' + (r.archived ? "Restore" : "Archive") + "</button>"]);
    return '<section class="s-block"><h3>Call Flows</h3><div class="x-row x-between">' + B.search("cf", "Search", 220) + '<button class="pill" data-x-ext="the call flow editor">Create call flow</button></div>' + B.table(["Name", "Numbers assigned to flow"], [['<button class="link" data-x-ext="the call flow editor">Main call flow</button>', "3"]], "", "s-table") + "</section>" +
      '<section class="s-block"><div class="x-row x-between"><h3>Ring Groups</h3><button class="pill outline" data-x-ext="the new ring group form">New ring group</button></div><p class="x-muted">You don\'t have any ring groups set up yet</p></section>' +
      '<section class="s-block"><div class="x-row x-between"><h3>Audio Library</h3><button class="pill outline" data-x-ext="your computer\'s file picker">Upload new audio file</button></div></section>' +
      '<section class="s-block"><h3>Call Reasons</h3>' + B.tabs("s-cr", ["Active", "Archived"], "Active") + '<div class="x-row x-between"><span></span><button class="pill" data-cr-add>+ Create call reason</button></div>' + (ui.crAdd ? '<div class="x-row"><input id="crName" placeholder="Call reason" aria-label="Call reason name"><label class="x-row"><input type="checkbox" id="crOpp"> Report as opportunity call</label><button class="pill" data-cr-ok>Add</button><button class="pill outline" data-cr-cancel>Cancel</button></div>' : "") + B.table(["Call reason", "Report as opportunity call", ""], rows, "No call reasons", "s-table") + "</section>" +
      '<section class="s-block"><h3>Missed call automations</h3>' + B.table(["Automation", "Actions"], [["When you miss an incoming call, if it's any time of the day then send a text message", B.sw("mca-1", false, "Missed call text")]], "", "s-table") + "</section>" +
      '<section class="s-block"><div class="x-row x-between"><h3>Call Masking</h3>' + B.sw("vc-mask", false, "Mask mobile calls with my primary number") + '</div><p class="x-muted">Mask mobile calls with my primary number</p></section>' +
      '<section class="s-block"><h3>Call Recording</h3><div class="x-row x-between"><span>Inbound</span>' + B.sw("vc-rec-in", true, "Record inbound calls") + '</div><div class="x-row x-between"><span>Outbound</span>' + B.sw("vc-rec-out", true, "Record outbound calls") + "</div></section>";
  };
  HCP.onClick((e) => {
    const t = (s) => e.target.closest(s); let b;
    if (t("[data-cr-add]")) { ui.crAdd = true; HCP.render(); const n = document.getElementById("crName"); if (n) n.focus(); return true; }
    if (t("[data-cr-cancel]")) { ui.crAdd = false; HCP.render(); return true; }
    if (t("[data-cr-ok]")) { const n = document.getElementById("crName").value.trim(); if (!n) { toast("Type a call reason first"); return true; } C().reasons.push({ name: n, opp: document.getElementById("crOpp").checked, archived: false }); ui.crAdd = false; HCP.save(); HCP.render(); toast("Call reason created"); return true; }
    if ((b = t("[data-cr-arch]"))) { const r = C().reasons[Number(b.dataset.crArch)]; r.archived = !r.archived; HCP.save(); HCP.render(); return true; }
    return false;
  });
  // Leaving Calls (Back button, a link) closes an open call window.
  HCP.afterRender.push(() => { if (HCP.view !== "calls" && (ui.open || ui.aopen)) closeModal(); });
  HCP.onReset.push(() => Object.assign(ui, { sub: "Call log", vtab: "All", q: "", aq: "", open: null, aopen: null, crAdd: false }));
});

</script>
<script>
// Settings > Pipeline > Customize boards, laid out from the live Leads board settings
// (Full map 14, item 20, Nov 12 2026). Estimates and Jobs columns are our reading
// of the live Pipeline boards; the live settings for those two boards were not mapped.
window.HCP_MODULES = window.HCP_MODULES || [];
window.HCP_MODULES.push(function (HCP) {
  const { svg, esc, toast } = HCP;
  const B = HCP.b;
  const D = HCP.data;
  const seed = () => ({
    Leads: [
      { name: "New Lead", required: true, statuses: [["New Lead", true], ["Unassigned", true], ["Assigned", true]] },
      { name: "Return Call Needed", statuses: [["Return Call Needed", false]] },
      { name: "First Contact", statuses: [["First Contact", true]] },
      { name: "Second Contact", statuses: [["Second Contact", true]] },
      { name: "Third Contact", statuses: [["Third Contact", true]] },
      { name: "Fourth Contact", statuses: [["Fourth Contact", false]] },
      { name: "Fifth Contact", statuses: [["Fifth Contact", false]] },
      { name: "On Hold", statuses: [["On Hold", true]] },
    ],
    Estimates: D.estimateColumns.map((c) => ({ name: c.name, statuses: c.statuses.map((s) => [s, true]) })),
    Jobs: ["Unscheduled", "Scheduled", "In Progress", "Completed", "Invoice Sent", "Invoice Paid"].map((n) => ({ name: n, statuses: [[n, true]] })),
  });
  const S = () => HCP.state.boards || (HCP.state.boards = seed());
  let adding = null;
  HCP.boardsSettings = function () {
    const sub = B.tab("s-board", "Leads");
    const cols = S()[sub];
    return B.tabs("s-board", ["Leads", "Estimates", "Jobs"], "Leads", "small") +
      '<div class="x-row x-between bd-bar"><span class="x-muted">Turn statuses on or off, and add your own.</span><div class="x-row"><button class="pill outline" data-bd-addcol>Add column</button><button class="pill" data-go="pipeline">Go to board</button></div></div>' +
      '<div class="bd-cols">' + cols.map((c, ci) => '<section class="bd-col"><h4>' + esc(c.name) + "</h4>" +
        (c.required ? '<p class="x-muted bd-req">Required by Pipeline to work properly.</p>' : "") +
        c.statuses.map(([n, on], si) => '<div class="bd-st"><span>' + esc(n) + "</span>" + (c.required ? '<span class="x-chip">Required</span>' : '<button class="x-sw' + (on ? " on" : "") + '" role="switch" aria-checked="' + on + '" aria-label="' + esc(n) + '" data-bd-sw="' + ci + "-" + si + '"><span></span></button>') + "</div>").join("") +
        (adding === ci ? '<div class="bd-add"><input id="bdNew" placeholder="Status name" aria-label="New status name"><button class="pill small-pill" data-bd-ok>Add</button></div>' : '<button class="link" data-bd-addst="' + ci + '">Add status</button>') + "</section>").join("") + "</div>";
  };
  HCP.onClick((e) => {
    const t = (s) => e.target.closest(s); let b;
    const sub = B.tab("s-board", "Leads");
    if ((b = t("[data-bd-sw]"))) { const [ci, si] = b.dataset.bdSw.split("-").map(Number); const st = S()[sub][ci].statuses[si]; st[1] = !st[1]; HCP.save(); HCP.render(); return true; }
    if ((b = t("[data-bd-addst]"))) { adding = Number(b.dataset.bdAddst); HCP.render(); const n = document.getElementById("bdNew"); if (n) n.focus(); return true; }
    if (t("[data-bd-ok]")) { const n = document.getElementById("bdNew").value.trim(); if (!n) { toast("Type a status name first"); return true; } S()[sub][adding].statuses.push([n, true]); adding = null; HCP.save(); HCP.render(); toast("Status added"); return true; }
    if (t("[data-bd-addcol]")) { const n = "New column " + (S()[sub].length + 1); S()[sub].push({ name: n, statuses: [[n, true]] }); HCP.save(); HCP.render(); toast("Column added. Rename it by adding statuses under it."); return true; }
    return false;
  });
  // Jobs board on the Pipeline page. Columns follow the help center ("Getting Started with Pipeline").
  HCP.jobsBoard = function () {
    const inv = (j) => (HCP.state.invoices || []).find((x) => x.id === j.id);
    const colOf = (j) => { const i = inv(j); if (j.status === "Completed") return i && i.status === "Paid" ? "Invoice Paid" : i && i.sent ? "Invoice Sent" : "Completed"; return j.status === "Not scheduled" ? "Unscheduled" : j.status; };
    const total = (j) => Math.max(0, j.services.concat(j.materials).reduce((n, r) => n + r.qty * r.price, 0) - Number(j.discount || 0));
    const cols = S().Jobs.filter((c) => c.statuses.some((s) => s[1]));
    return '<div class="ep-body"><div class="bd-cols">' + cols.map((c) => { const list = HCP.state.jobs.filter((j) => colOf(j) === c.name); return '<section class="bd-col"><h4>' + esc(c.name) + ' <span class="x-count">' + list.length + "</span></h4>" + list.map((j) => { const cu = HCP.state.customers.find((x) => x.id === j.customerId); return '<button class="bd-card" data-go="job/' + j.id + '"><b>Job #' + j.id + "</b><span>" + esc(cu ? cu.display : "") + "</span><small>$" + total(j).toFixed(2) + "</small></button>"; }).join("") + "</section>"; }).join("") + "</div></div>";
  };
  HCP.onReset.push(() => { adding = null; });
});

</script>

    wrenchPlus: '<path d="M8 6l3-3 3 3-1 2 8 8-2 2-8-8-2 0z"/><path d="M15 8l3-4 3 3-4 3"/><path d="M5 15v6M2 18h6"/>',
    invoice: '<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M12.5 11.5h-2a1.25 1.25 0 0 0 0 2.5h1a1.25 1.25 0 0 1 0 2.5h-2M11 10.5v7"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M15.5 10.5A4 4 0 0 0 8.7 10M8.5 13.5a4 4 0 0 0 6.8.5"/>',
    order: '<path d="M6 21H5V4h13v7"/><path d="M8 8h7M8 12h3"/><path d="M12 14h9l-1 4h-7z"/><circle cx="14" cy="21" r=".8"/><circle cx="19" cy="21" r=".8"/>',
    chat: '<path d="M4 4h16v13H9l-5 4z"/><path d="M8 9h8M8 13h6"/>',
    dollar: '<circle cx="12" cy="12" r="9"/><path d="M15 9a2.5 2 0 0 0-2.5-1.5h-1a2.25 2.25 0 0 0 0 4.5h1a2.25 2.25 0 0 1 0 4.5h-1A2.5 2 0 0 1 9 15M12 6v12"/>',
    megaphone: '<path d="M3 10v4h4l8 4V6l-8 4z"/><path d="M6 14l1 5h3l-1-4M18 8l2-1M18 12h3M18 16l2 1"/>',
    report: '<rect x="4" y="4" width="16" height="16"/><path d="M8.5 16v-3M12 16V9M15.5 16v-5"/>',
    team: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2.5-6 6-6s6 2 6 6z"/><path d="M15 5.5a3 3 0 0 1 0 5M17 14c2.500.5 4 2.500 4 6h-3"/>',
    tools: '<path d="M4 20L15 9M9 4l-5 5 2 2 5-5zM14 14l6 6M20 4l-3 3-2-1-1-2 3-3"/><path d="M17 7a4 4 0 0 1-3 3"/>',
    grid: '<g fill="currentColor" stroke="none"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></g>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3l1.500 2.500 3-.5 1 3 2.500 1.500-1 3 1 3-2.500 1.500-1 3-3-.5L12 21l-1.500-2.500-3 .5-1-3L4 14.500l1-3-1-3 2.500-1.500 1-3 3 .5z"/>',
    plus: '<path d="M12 4v16M4 12h16"/>',
    chevDown: '<path d="M6 9l6 6 6-6"/>',
    chevRight: '<path d="M9 6l6 6-6 6"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    check: '<path d="M5 12l5 5 9-10"/>',
    pencil: '<path d="M4 20l1-4L16 5l3 3L8 19z"/>',
    collapse: '<path d="M4 4v16M20 12H9M13 7l-5 5 5 5"/>',
    search: '<circle cx="10" cy="10" r="6"/><path d="M15 15l6 6" stroke-width="2.200"/>',
    pin: '<path d="M12 18c-3-3.500-6-6-6-9.500a6 6 0 0 1 12 0c0 3.500-3 6-6 9.500z"/><circle cx="12" cy="8.500" r="2"/><path d="M8 19c-1 .4-2 1-2 1.500C6 21.500 9 22 12 22s6-.5 6-1.500c0-.5-1-1.100-2-1.500"/>',
    bell: '<path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/>',
    checklist: '<path d="M3 7l2 2 3-3M3 16l2 2 3-3M11 8h10M11 17h10"/>',
    history: '<path d="M4 12a8 8 0 1 0 2.500-5.800L4 8.500M4 4v4.500h4.500"/><path d="M13 8l-3 5h4l-2 4"/>',
    bookmark: '<rect x="4" y="4" width="16" height="16"/><path d="M12 4h7v8l-3.500-2-3.500 2z" fill="currentColor"/>',
    personPlus: '<circle cx="9" cy="8" r="3.500"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6zM18 6v6M15 9h6"/>',
    bubble: '<path d="M5 4h14a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H10l-5 4V5a1 1 0 0 1 0-1z"/><path d="M8 9h8M8 13h6"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    calX: '<rect x="4" y="5" width="16" height="16" rx="1"/><path d="M8 3v4M16 3v4M9.500 12l5 5M14.500 12l-5 5"/>',
    chevLeft: '<path d="M15 6l-6 6 6 6"/>',
    truck: '<path d="M2 7h12v10H2zM14 10h4l4 4v3h-8z" fill="currentColor"/><circle cx="7" cy="18" r="2" fill="#fff"/><circle cx="18" cy="18" r="2" fill="#fff"/>',
    place: '<path d="M12 22c-4-5-7-8.500-7-12.500a7 7 0 0 1 14 0c0 4-3 7.500-7 12.500z" fill="currentColor"/><circle cx="12" cy="9.500" r="2.500" fill="#fff" stroke="none"/>',
    phone: '<path d="M5 3h4l2 5-2.500 1.500a12 12 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2C10 21 3 14 3 5a2 2 0 0 1 2-2z"/>',
    car: '<path d="M4 16v-4l2-5h12l2 5v4zM4 12h16M6 16v3M18 16v3"/><circle cx="7.500" cy="14" r=".6"/><circle cx="16.500" cy="14" r=".6"/>',
    tag: '<path d="M3 12V4h8l10 10-8 8z" fill="currentColor"/><circle cx="7.500" cy="8.500" r="1.500" fill="#fff" stroke="none"/>',
    note: '<path d="M4 5h16v10l-5 5H4z" fill="currentColor"/>',
    attach: '<path d="M8 12V7a4 4 0 0 1 8 0v10a5 5 0 0 1-10 0V9"/><path d="M12 8v8"/>',
    fields: '<path d="M4 6h3M4 12h3M4 18h3M10 6h10M10 12h10M10 18h10" stroke-width="3"/>',
    repeat: '<path d="M4 11a7 7 0 0 1 12-5l3 3M20 4v5h-5M20 13a7 7 0 0 1-12 5l-3-3M4 20v-5h5"/>',
    box: '<rect x="4" y="4" width="16" height="16" rx="2"/>',
    mail: '<rect x="3" y="5.500" width="18" height="13" rx="1" fill="currentColor"/><path d="M4 7l8 6 8-6" stroke="#fff"/>',
    dots: '<g fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.800"/><circle cx="12" cy="12" r="1.800"/><circle cx="12" cy="19" r="1.800"/></g>',
    noUser: '<circle cx="12" cy="12" r="8.500"/><path d="M6 6l12 12M12 8a2.500 2.500 0 0 1 2.300 3.500M8 17c.5-2 2-3 4-3"/>',
    undo: '<path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 5 5v1"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.500 9.500a2.500 2.500 0 1 1 4 2c-1 .7-1.500 1.200-1.500 2.500M12 17h.01"/>',
    play: '<path d="M9 6.500v11l9-5.500z" fill="currentColor"/>',
    stop: '<rect x="7.500" y="7.500" width="9" height="9" fill="currentColor"/>',
    send: '<path d="M4 5l17 7-17 7 2-7z" fill="currentColor"/>',
    card: '<rect x="3" y="5.500" width="18" height="13" rx="2"/><path d="M3 10h18" stroke-width="2.500"/>',
    sparkle: '<path d="M11 3l1.800 5.200L18 10l-5.200 1.800L11 17l-1.800-5.200L4 10l5.200-1.800zM18.500 15l.8 2.200 2.200.8-2.200.8-.8 2.200-.8-2.200-2.200-.8 2.200-.8z" fill="currentColor"/>',
    printer: '<path d="M7 8V4h10v4M7 17H4v-6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v6h-3"/><rect x="7" y="14" width="10" height="6"/>',
  };
  const svg = (name) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + "</svg>";
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const fresh = () => ({
    collapsed: false, setupClosed: false, tourDismissed: false, hiddenTasks: [],
    customers: clone(DATA.customers), jobs: clone(DATA.jobs), estimates: clone(DATA.estimates), invoices: clone(DATA.invoices),
    practice: { open: false, index: 0, base: {} },
    seedDup: true,
  });
  let state = load();
  let view = "home";
  let viewArg = "";
  let slide = 0;
  const clickHandlers = [];
  let toastTimer;

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY)) || {};
      const s = Object.assign(fresh(), saved);
      // One time: saved practice data from before Nov 18 gets the duplicate Tom Reyes for Manage duplicates.
      if (!saved.seedDup && saved.customers && !s.customers.some((c) => c.id === "c7")) s.customers.push(clone(DATA.customers.find((c) => c.id === "c7")));
      // Same one-time pass: estimates #315 and #314 get the visit dates the seed now has.
      if (!saved.seedDup) (s.estimates || []).forEach((e) => { const d = DATA.estimates.find((x) => x.id === e.id && x.visit); if (d && !e.visit && (e.id === 315 || e.id === 314)) e.visit = clone(d.visit); });
      s.seedDup = true;
      return s;
    }
    catch (e) { return fresh(); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }
  // Anything we have no screenshot of says so, so nobody takes it for real HCP behaviour.
  const notBuilt = (name) => toast(name + " isn't in the sandbox yet");

  function allNav() {
    const subs = Object.values(DATA.subnav || {}).flat();
    return DATA.nav.flat().concat(subs);
  }
  function findNav(id) {
    return allNav().find((n) => n.id === id);
  }
  // Which top-level menu a sub-item lives under.
  function parentOf(id) {
    return Object.keys(DATA.subnav || {}).find((k) => DATA.subnav[k].some((s) => s.id === id));
  }

  function renderNav() {
    const current = HCP.navFor[view] || view;
    const open = state.navOpen || (state.navOpen = {});
    const par = parentOf(current);
    if (par && open[par] === undefined) open[par] = true;
    const sub = (n) => !(n.menu && open[n.id] && !state.collapsed) ? "" : '<div class="nav-subs">' + DATA.subnav[n.id].map((s) =>
      '<button class="nav-sub' + (current === s.id ? " on" : "") + '" data-nav="' + s.id + '"' + (current === s.id ? ' aria-current="page"' : "") + "><span>" + esc(s.label) + "</span>" +
        (s.badge ? '<span class="nav-badge">' + esc(s.badge) + "</span>" : "") + (s.chip ? '<span class="nav-chip">' + esc(s.chip) + "</span>" : "") + (s.gem ? '<i class="nav-gem">' + svg("sparkle") + "</i>" : "") + "</button>").join("") + "</div>";
    const rows = DATA.nav.map((group) => group.map((n) =>
      '<button class="nav-row' + (current === n.id ? " on" : "") + '" data-nav="' + n.id + '" title="' + esc(n.label) + '"' + (current === n.id ? ' aria-current="page"' : "") + (n.menu ? ' aria-expanded="' + !!open[n.id] + '"' : "") + ">" +
        "<i>" + svg(n.icon) + "</i>" +
        (n.dot ? '<span class="dot"></span>' : "") +
        '<span class="t">' + esc(n.label) + "</span>" +
        (n.menu ? '<i class="chev' + (open[n.id] ? " up" : "") + '">' + svg("chevDown") + "</i>" : "") +
        (n.arrow ? '<i class="chev">' + svg("chevRight") + "</i>" : "") +
      "</button>" + sub(n)).join("")).join('<div class="nav-sep"></div>');
    document.getElementById("nav").innerHTML =
      '<button class="create" data-create aria-haspopup="menu"><i>' + svg("plus") + "</i><span>Create</span></button>" + rows;
  }

  function renderFoot() {
    const u = DATA.user;
    document.getElementById("foot").innerHTML =
      '<button class="foot-settings' + (view === "app-settings" ? " on" : "") + '" data-go="app-settings"><i>' + svg("gear") + "</i><span>Settings</span></button>" +
      '<button class="foot-user" data-top="user"><span class="avatar">' + esc(u.initials) + "</span>" +
        "<div><b>" + esc(u.name) + "</b><small>" + esc(u.role) + "</small></div><i>" + svg("chevRight") + "</i></button>";
  }

  function renderChrome() {
    document.getElementById("shell").classList.toggle("collapsed", state.collapsed);
    document.querySelector(".collapse").innerHTML = svg("collapse");
    document.querySelector(".search-icon").innerHTML = svg("search");
    const n = DATA.counts;
    document.getElementById("topIcons").innerHTML =
      '<button class="top-icon" data-go="map" aria-label="Map" data-tip="Map">' + svg("pin") + "</button>" +
      '<button class="top-icon" data-top="notif" aria-label="' + n.notifications + ' notifications" data-tip="Notifications">' + svg("bell") + '<span class="badge">' + n.notifications + "</span></button>" +
      '<button class="top-icon" data-go="tasks" aria-label="Tasks" data-tip="Tasks">' + svg("checklist") + "</button>" +
      '<button class="top-icon" data-top="activity" aria-label="Activity feed" data-tip="Activity feed">' + svg("history") + "</button>";
    document.getElementById("chat").innerHTML = "<i>" + svg("bubble") + '</i><span class="badge">' + n.chat + "</span>";
  }

  function art(name) {
    if (name === "Invoices") {
      return '<svg class="art" viewBox="0 0 110 60" style="stroke-width:1.500"><path d="M8 10h22" stroke="#0057ff" stroke-width="4"/><path d="M8 20h90M8 27h80M8 34h60M8 48h30" stroke="#ddd" stroke-width="2"/><path d="M78 48h20" stroke="#0057ff" stroke-width="7"/></svg>';
    }
    const row = (y, on) => '<circle cx="12" cy="' + y + '" r="4" ' + (on ? 'fill="#0057ff" stroke="#0057ff"' : 'stroke="#bbb"') + '/><path d="M22 ' + y + 'h' + (on ? 70 : 54) + '" stroke="#ccc" stroke-width="3"/>';
    return '<svg class="art" viewBox="0 0 110 60">' + row(10, true) + row(24, true) + row(38, false) + row(52, false) + "</svg>";
  }

  function renderHome() {
    const h = DATA.home;
    const name = h.tourSlides[slide % h.tourSlides.length];
    const tasks = h.tasks.filter((t) => !state.hiddenTasks.includes(t.id));
    return '<section class="setup' + (state.setupClosed ? " closed" : "") + '">' +
      '<div class="setup-head"><h1>Hi ' + esc(DATA.user.first) + "! Let's get you set up in minutes.</h1>" +
        '<div class="progress"><div class="bar"><b style="width:' + h.progress + '%"></b></div><span>' + h.progress + "%</span>" +
        '<button class="setup-toggle" data-action="setup" aria-label="Show or hide setup" aria-expanded="' + !state.setupClosed + '">' + svg("chevDown") + "</button></div></div>" +
      '<div class="setup-body">' +
        (state.tourDismissed ? "" :
        '<div class="tour"><div class="tour-copy">' +
          '<div class="chips"><span class="chip rec">Recommended</span><span class="chip">2 minutes</span></div>' +
          "<h2>Take a tour of Housecall Pro</h2>" +
          "<p>A fast look at the tools that will help you book jobs, manage schedules, and get paid faster.</p>" +
          '<div class="tour-actions"><button class="pill" data-x-ext="the product tour">Start tour</button><button class="link" data-action="dismiss-tour">Dismiss</button></div>' +
        '</div><div class="tour-art" id="tourArt">' + art(name) + "<span>" + esc(name) + "</span></div></div>") +
        (tasks.length ? '<div class="tasks">' + tasks.map((t) =>
          '<div class="task"><i>' + svg(t.icon) + "</i><b>" + esc(t.label) + "</b>" +
          '<button class="link" data-x-ext="the tutorial video">Watch tutorial</button>' +
          '<button class="x" data-hide-task="' + t.id + '" aria-label="Hide ' + esc(t.label) + '">' + svg("close") + "</button></div>").join("") + "</div>" : "") +
      "</div>" +
      '<div class="help"><div><h3>Need help with any of these items?</h3><p>Our AI team can guide you through each onboarding task with simple, step-by-step instructions.</p></div>' +
        '<button class="pill" data-go="ai-team">Ask AI team</button></div>' +
      "</section>" +
      (HCP.homeBelow ? HCP.homeBelow() : '<div class="below"><div></div><div></div><div></div><div></div></div>');
  }

  function renderSoon(n) {
    return '<div class="soon"><h1>' + esc(n.label) + "</h1><p>This screen isn't in the sandbox yet.</p></div>";
  }

  function render() {
    renderChrome();
    renderNav();
    renderFoot();
    const n = findNav(HCP.navFor[view] || view);
    const custom = HCP.views[view];
    document.getElementById("page").innerHTML = view === "home" ? renderHome() : custom ? custom(viewArg) : renderSoon(n || { label: view });
    document.title = (view === "home" ? "Home" : HCP.titles[view] || (n ? n.label : view)) + " · HCP Sandbox";
    HCP.afterRender.forEach((fn) => fn());
  }

  function parseRoute(route) {
    const [id, arg] = String(route).split("/");
    return HCP.views[id] || findNav(id) ? { id, arg: arg || "" } : { id: "home", arg: "" };
  }

  function showView(route) {
    const r = parseRoute(route);
    // Leaving a page closes any window that was open on it, so it can't block the next page.
    if ((view || "") + "/" + (viewArg || "") !== (r.id || "") + "/" + (r.arg || "")) {
      HCP.onLeave.forEach((fn) => fn());
      const m = document.getElementById("modal");
      if (m && !m.hidden) { m.hidden = true; m.innerHTML = ""; }
    }
    view = r.id;
    viewArg = r.arg;
    const hash = r.arg ? r.id + "/" + r.arg : r.id;
    if (location.hash.slice(1) !== hash) location.hash = hash;
    render();
    document.getElementById("page").scrollTop = 0;
  }

  const HCP = {
    data: DATA, svg, esc, toast, notBuilt, save, render, go: showView, icons: ICONS, titles: {},
    get viewArg() { return viewArg; },
    get state() { return state; },
    get view() { return view; },
    views: {}, navFor: {}, afterRender: [], onReset: [], onLeave: [],
    onClick: (fn) => clickHandlers.push(fn),
    // Academy lesson pages: start a lesson from fresh practice data
    resetAll: () => { state = fresh(); view = "home"; viewArg = ""; HCP.onReset.forEach((fn) => fn()); save(); },
  };  window.HCPX = HCP; // read by the Academy lesson pages (same site)


  document.addEventListener("click", (e) => {
    if (clickHandlers.some((fn) => fn(e))) return;
    const nav = e.target.closest("[data-nav]");
    if (nav) {
      const n = findNav(nav.dataset.nav);
      if (n.menu) {
        if (state.collapsed) { state.collapsed = false; state.navOpen[n.id] = true; }
        else state.navOpen[n.id] = !state.navOpen[n.id];
        save(); render();
      } else if (n.arrow) { if (HCP.openFlyout) HCP.openFlyout(n.id, nav); }
      else showView(n.route || n.id);
      return;
    }
    const go = e.target.closest("[data-go]");
    if (go && !go.closest("tr.row")) { showView(go.dataset.go); return;
    }
    const soon = e.target.closest("[data-soon]");
    if (soon) { notBuilt(soon.dataset.soon); return; }
    const hide = e.target.closest("[data-hide-task]");
    if (hide) { state.hiddenTasks.push(hide.dataset.hideTask); save(); render(); return; }
    const act = e.target.closest("[data-action]");
    if (!act) return;
    const a = act.dataset.action;
    if (a === "collapse") state.collapsed = !state.collapsed;
    if (a === "setup") state.setupClosed = !state.setupClosed;
    if (a === "dismiss-tour") state.tourDismissed = true;
    if (a === "reset") { state = fresh(); view = "home"; viewArg = ""; location.hash = "home"; HCP.onReset.forEach((fn) => fn()); toast("Sandbox reset"); }
    save();
    render();
  });

  document.getElementById("search").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && HCP.search) HCP.search(e.target.value);
  });
  window.addEventListener("hashchange", () => showView(location.hash.slice(1)));

  // The real tour card cycles its illustration on its own.
  setInterval(() => {
    const el = document.getElementById("tourArt");
    if (!el) return;
    slide += 1;
    const name = DATA.home.tourSlides[slide % DATA.home.tourSlides.length];
    el.innerHTML = art(name) + "<span>" + esc(name) + "</span>";
  }, 4000);

  (window.HCP_MODULES || []).forEach((m) => m(HCP));
  const start = parseRoute(location.hash.slice(1));
  view = start.id;
  viewArg = start.arg;
  render();
})();

</script>

</body></html>
