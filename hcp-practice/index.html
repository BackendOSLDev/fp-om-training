  document.addEventListener("focusin", (e) => {
    if (e.target.matches && e.target.matches("[data-ev]")) showCard(e.target);
  });
  document.addEventListener("focusout", (e) => {
    if (e.target.matches && e.target.matches("[data-ev]")) hideCard();
  });
  document.addEventListener("scroll", (e) => {
    if (e.target.classList && e.target.classList.contains("cal-body")) { ui.scroll = e.target.scrollTop; hideCard(); }
    if (e.target.id === "dsp") { ui.dspLeft = e.target.scrollLeft; ui.dspTop = e.target.scrollTop; hideCard(); }
  }, true);
  document.addEventListener("keydown", (e) => {
    const menu = $("createMenu");
    if (e.key === "Escape" && !menu.hidden) {
      menu.hidden = true;
      clearGhost();
    } else if (e.key === "Escape" && ui.win && !e.target.matches("select")) {
      const back = ui.win.returnTo;
      ui.win = null;
      HCP.go(back);
    }
  });

  HCP.sched = {
    timeOptions, teamOptions, chips, avatar, addDays, today,
    setPicker: (p) => { pick = p; },
    weekOf: (anchor) => dayList(anchor, "Week"),
    board: dispatchBoard,
    nav: navCluster,
    aim: aimBoardAtToday,
    people: (j) => (j.appt ? members(j.appt.team) : []),
    at(j, m) {
      const d = parse(j.appt.date);
      return DAYS[d.getDay()].slice(0, 3) + ", " + short(j.appt.date) + " " + d.getDate() + ", " + d.getFullYear() + "<br>" + timeUp(m) + " EST";
    },
    feed(date, m) {
      const d = parse(date);
      return DAYS[d.getDay()].slice(0, 3) + " " + pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + "/" + String(d.getFullYear()).slice(2) + "<br>" + time(m);
    },
    text(j) {
      if (!j.appt) return "";
      const d = parse(j.appt.date);
      return DAYS[d.getDay()].slice(0, 3) + ", " + short(j.appt.date) + " " + d.getDate() + (j.appt.anytime ? " · Anytime" : " · " + range(j.appt.start, j.appt.end));
    },
    team: (j) => (j.appt ? members(j.appt.team).map((e) => e.name).join(", ") : ""),
    stamp(j) {
      if (!j.appt) return "";
      const a = j.appt;
      const d = parse(a.date);
      return DAYS[d.getDay()].slice(0, 3) + ", " + short(a.date) + " " + d.getDate() + ", " + d.getFullYear() + "<br>" + (a.anytime ? "Anytime" : timeUp(a.start) + " - " + timeUp(a.end) + " EST" + (a.arrival ? "<br><em>arrive by " + timeUp(a.start + a.arrival) + "</em>" : ""));
    },
  };

  Object.assign(HCP.views, { schedule: renderSchedule, "schedule-job": renderWindow });
  Object.assign(HCP.navFor, { "schedule-job": "schedule" });
  HCP.afterRender.push(() => {
    hideCard();
    $("page").classList.toggle("flush", HCP.view === "schedule");
    if (HCP.view !== "schedule-job") ui.win = null;
    layoutBoard();
    placeBoardScroll();
    restoreScroll();
  });
  HCP.onReset.push(() => { Object.assign(ui, freshUi()); });
  document.addEventListener("change", (e) => {
    if (e.target.matches("[data-cs-item]")) { ui.calItems[e.target.dataset.csItem] = e.target.checked; HCP.render(); }
  });
});

</script>
<script>
// Intake module: the New Call form. Layout and labels come from the screenshots in Housecall Pro's
// public help article "Customer Intake: Setup Guide" (help article 6266173), because the account we can
// open has no intake flow set up. Request guide questions, reminders and FAQs are sample content.
window.HCP_MODULES = window.HCP_MODULES || [];
window.HCP_MODULES.push(function (HCP) {
  const { svg, esc, toast, notBuilt } = HCP;
  const D = HCP.data;
  const $ = (id) => document.getElementById(id);
  const toNum = (v) => Number(String(v).replace(/[^0-9.]/g, "")) || 0;
  const money = (n) => "$" + Number(n || 0).toFixed(2);
  const pad = (n) => String(n).padStart(2, "0");
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const clock = (m) => { const h = Math.floor(m / 60) % 24; return (h % 12 || 12) + ":" + pad(m % 60) + " " + (h < 12 ? "AM" : "PM"); };

  const blankContact = () => ({ first: "", last: "", email: "", mobile: "", display: "", home: "", company: "", work: "", role: "", type: "Homeowner", street: "", unit: "", city: "", state: "", zip: "", addressNotes: "", notes: "", billsTo: "", lead: "", tags: [], notify: true });
  const blankLine = () => ({ name: "", qty: "1.00", price: "$0.00", description: "" });
  let call = null;

  function blankCall(from) {
    return { from, step: "request", tab: "flow", customerId: "", contact: blankContact(), custQuery: "", addr: "", addrOpen: false, showAll: false, notes: "", answers: {}, unit: "", jobType: "", tags: [], lead: "", services: [blankLine()], materials: [], appt: null, anchor: today(), showReminders: true, remindersOpen: true, faqOpen: {}, faqQuery: "", profile: false, more: false, saveOpen: false, leadWarn: false };
  }
  HCP.startCall = () => {
    call = blankCall(location.hash.slice(1) || "home");
    HCP.go("new-call");
  };

  function setPath(path, value) {
    const parts = path.split(".");
    let o = call;
    parts.slice(0, -1).forEach((p) => { o = o[p]; });
    o[parts[parts.length - 1]] = value;
  }
  function draw() {
    const m = $("ncMain");
    const top = m ? m.scrollTop : 0;
    HCP.render();
    const n = $("ncMain");
    if (n) n.scrollTop = top;
  }
  const lineTotal = (r) => toNum(r.qty) * toNum(r.price);
  const callTotal = () => call.services.concat(call.materials).reduce((n, r) => n + lineTotal(r), 0);
  const nameOf = () => { const c = call.contact; return c.display || (c.first + " " + c.last).trim(); };
  const addressText = () => { const c = call.contact; return [c.street, c.unit, c.city, [c.state, c.zip].filter(Boolean).join(" ")].filter(Boolean).join(", "); };
  const customers = () => HCP.state.customers;
  const addrLine = (a) => (a ? [a.street, a.unit, a.city, a.state, a.zip].filter(Boolean).join(", ") : "");

  const field = (key, label, cls) => {
    const v = key.split(".").reduce((o, k) => o[k], call);
    return '<label class="nc-f' + (cls ? " " + cls : "") + '"><input data-nc="' + key + '" value="' + esc(v) + '" placeholder=" " autocomplete="off"><span>' + label + "</span></label>";
  };
  const pick = (key, label, list) => {
    const v = key.split(".").reduce((o, k) => o[k], call);
    return '<label class="nc-f"><select data-nc="' + key + '" aria-label="' + label + '"><option value="">' + label + "</option>" + list.map((o) => "<option" + (o === v ? " selected" : "") + ">" + esc(o) + "</option>").join("") + "</select></label>";
  };
  const tagField = (scope, label) => {
    const tags = scope === "tags" ? call.tags : call.contact.tags;
    return '<div><label class="nc-f"><input data-nc-tag="' + scope + '" placeholder=" " autocomplete="off"><span>' + label + '</span></label><div class="tags">' + tags.map((t, i) => '<span class="tag">' + esc(t) + '<button data-nc-tag-del="' + scope + "." + i + '" aria-label="Remove ' + esc(t) + '">' + svg("close") + "</button></span>").join("") + "</div></div>";
  };

  // ---------- customer search ----------
  function customerResults() {
    const q = call.custQuery.trim().toLowerCase();
    if (!q) return "";
    const rows = customers().filter((c) => (c.display + " " + c.first + " " + c.last + " " + c.company + " " + c.phones.map((p) => p.number).join(" ")).toLowerCase().includes(q)).slice(0, 8);
    return '<div class="nc-drop"><button class="nc-create" data-nc-create>CREATE CUSTOMER "' + esc(call.custQuery.trim().toUpperCase()) + '"</button>' + rows.map((c) => '<button class="nc-res" data-nc-cust="' + c.id + '"><span>' + esc(c.display) + (c.dns ? ' <em class="status s-dns">Do not service</em>' : "") + "</span><span>" + esc(addrLine(c.addresses[0])) + "</span></button>").join("") + "</div>";
  }
  function useCustomer(c) {
    const a = c.addresses[0] || {};
    Object.assign(call.contact, { first: c.first, last: c.last, display: c.display, email: c.emails[0] || "", mobile: (c.phones[0] || {}).number || "", company: c.company, role: c.role, type: c.type, street: a.street || "", unit: a.unit || "", city: a.city || "", state: a.state || "", zip: a.zip || "", notes: c.notes, lead: c.lead, tags: c.tags.slice(), notify: c.notify });
    call.customerId = c.id;
    call.custQuery = "";
    call.addr = addressText();
  }
  function createFromQuery() {
    const [first, ...rest] = call.custQuery.trim().split(/\s+/);
    Object.assign(call.contact, blankContact(), { first, last: rest.join(" ") });
    call.customerId = "new";
    call.custQuery = "";
    call.step = "contact";
    call.tab = "flow";
  }

  // ---------- steps ----------
  function sideCards() {
    const a = call.appt;
    const when = a ? MONTHS[Number(a.date.slice(5, 7)) - 1] + " " + Number(a.date.slice(8)) + " at " + clock(a.start) + " - " + clock(a.end) : "";
    const card = (step, icon, label, extra, body) => '<div class="nc-step' + (call.step === step ? " on" : "") + '"><button class="nc-step-head" data-nc-step="' + step + '"><i>' + svg(icon) + "</i><b>" + label + "</b>" + extra + "</button>" + (body ? '<div class="nc-step-body">' + esc(body) + "</div>" : "") + "</div>";
    const undo = a ? '<span class="nc-undo" role="button" tabindex="0" data-nc-undo aria-label="Clear schedule">' + svg("undo") + "</span>" : "";
    return card("request", "wrench", "Request", '<span id="ncAmt" class="nc-amt">' + money(callTotal()) + "</span>") + '<i class="nc-link"></i>' + card("schedule", "calendar", "Schedule", undo, when) + '<i class="nc-link"></i>' + card("contact", "person", "Contact", "", nameOf());
  }
  function faqPanel() {
    const q = call.faqQuery.trim().toLowerCase();
    const rows = D.faqs.map((f, i) => [f, i]).filter(([f]) => !q || (f.q + " " + f.a).toLowerCase().includes(q));
    return '<div class="nc-faq-search"><i>' + svg("search") + '</i><input data-nc-faq-search placeholder="Search" aria-label="Search FAQs" value="' + esc(call.faqQuery) + '"><button class="icon-btn" data-nc-faq-clear aria-label="Clear search">' + svg("close") + "</button></div>" +
      '<div id="ncFaqs">' + rows.map(([f, i]) => '<div class="nc-faq"><button data-nc-faq="' + i + '" aria-expanded="' + !!call.faqOpen[i] + '"><span>' + esc(f.q) + "</span><i" + (call.faqOpen[i] ? ' style="transform:rotate(180deg)"' : "") + ">" + svg("chevDown") + "</i></button>" + (call.faqOpen[i] ? "<p>" + esc(f.a) + "</p>" : "") + "</div>").join("") + "</div>";
  }
  function guideRows() {
    return D.requestGuide.filter((g) => !g.showFor || [].concat(call.answers[g.showFor.id] || []).includes(g.showFor.answer)).map((g) => {
      if (g.type === "reminder") return '<div class="g-rem"><div>' + esc(g.title) + "</div><div>" + esc(g.note) + "</div></div>";
      const val = call.answers[g.id];
      const control = g.type === "text"
        ? '<input class="g-text" data-nc="answers.' + g.id + '" value="' + esc(val || "") + '" aria-label="' + esc(g.q) + '">'
        : '<div class="g-pills">' + g.options.map((o) => '<button class="' + ([].concat(val || []).includes(o) ? "on" : "") + '" data-nc-ans="' + g.id + '" data-val="' + esc(o) + '" data-multi="' + (g.type === "multi") + '">' + esc(o) + "</button>").join("") + "</div>";
      return '<div class="g-row"><div class="g-q">' + esc(g.q) + (g.hint ? "<small>" + esc(g.hint) + "</small>" : "") + "</div>" + control + "</div>";
    }).join("");
  }
  function lineRows(key, kind) {
    return call[key].map((r, i) => '<div class="nc-line"><i class="nc-grip"></i><label class="nc-f nc-name"><input list="ncBook-' + kind + '" data-nc-name="' + key + "." + i + '" data-kind="' + kind + '" value="' + esc(r.name) + '" placeholder=" " autocomplete="off"><span>Item name</span></label>' +
      '<label class="nc-f"><input data-nc-num="' + key + "." + i + '.qty" value="' + esc(r.qty) + '" placeholder=" "><span>Qty</span></label><label class="nc-f"><input data-nc-num="' + key + "." + i + '.price" value="' + esc(r.price) + '" placeholder=" "><span>Unit price</span></label>' +
      '<b data-amt="' + key + "." + i + '">' + money(lineTotal(r)) + '</b><button class="icon-btn small" data-nc-line-del="' + key + "." + i + '" aria-label="Remove item">' + svg("close") + "</button>" +
      '<label class="nc-f nc-desc"><input data-nc="' + key + "." + i + '.description" value="' + esc(r.description) + '" placeholder=" "><span>Description (optional)</span></label></div>').join("");
  }
  function requestStep() {
    const book = (kind) => '<datalist id="ncBook-' + kind + '">' + D.priceBook.filter((p) => p.kind === kind).map((p) => '<option value="' + esc(p.name) + '">').join("") + "</datalist>";
    return '<h2 class="nc-h">Request</h2><section class="nc-card"><h3>Request description</h3><label class="nc-f nc-area"><textarea data-nc="notes" placeholder=" ">' + esc(call.notes) + "</textarea><span>Private notes</span></label>" +
      '<h3>Request guide</h3><div class="guide">' + guideRows() + "</div>" +
      '<div class="nc-grid2">' + pick("unit", "Business unit", D.businessUnits) + pick("jobType", "Job type", D.jobTypes) + tagField("tags", "Tags (press enter)") + pick("lead", "Lead source", D.leadSources) + "</div>" +
      '<h3>Line items</h3><div class="nc-lines"><div class="nc-lines-head"><span>Services</span><button class="link" data-go="price-book">SERVICE PRICE BOOK</button></div>' + lineRows("services", "service") +
      (call.materials.length ? '<div class="nc-lines-head"><span>Materials</span><button class="link" data-go="price-book">MATERIAL PRICE BOOK</button></div>' + lineRows("materials", "material") : "") +
      '<div class="nc-add"><button class="link" data-nc-line-add="services">+ SERVICES ITEM</button><button class="link" data-nc-line-add="materials">+ MATERIALS ITEM</button></div>' +
      '<div class="nc-sums"><div><span>Subtotal</span><b id="ncSub">' + money(callTotal()) + '</b></div><div><label class="nc-f nc-tax"><select aria-label="Tax rate"><option>Tax rate</option></select></label><b>$0.00</b></div><div class="big"><span>Total</span><b id="ncTot">' + money(callTotal()) + "</b></div></div></div>" +
      '<p class="nc-thanks">Thank you for doing business with us.</p>' + book("service") + book("material") + "</section>";
  }
  function scheduleStep() {
    const days = HCP.sched.weekOf(call.anchor);
    return '<div class="nc-h-row"><h2 class="nc-h">Schedule</h2><label class="nc-switch"><span>Show reminders</span><input type="checkbox" data-nc-show-rem' + (call.showReminders ? " checked" : "") + "><i></i></label></div>" +
      (call.showReminders ? '<section class="nc-rem"><button class="nc-rem-head" data-nc-rem-fold aria-expanded="' + call.remindersOpen + '"><i>' + svg("note") + "</i><b>Reminder</b><em" + (call.remindersOpen ? ' style="transform:rotate(180deg)"' : "") + ">" + svg("chevDown") + "</em></button>" + (call.remindersOpen ? D.scheduleReminders.map(([a, b]) => "<div><span>" + esc(a) + "</span><span>" + esc(b) + "</span></div>").join("") : "") + "</section>" : "") +
      '<section class="nc-board"><div class="nc-board-bar"><i>' + svg("wrench") + '</i><span class="nc-board-nav">' + HCP.sched.nav(days) + '</span><span class="nc-board-right"><span>Color by</span><button class="drop-btn blue" data-x-ext="the Color by menu"><span>Employee</span><i>' + svg("chevDown") + '</i></button><button class="drop-btn blue" data-x-ext="the calendar view"><span>Dispatch</span><i>' + svg("chevDown") + "</i></button></span></div>" + HCP.sched.board(days) + "</section>";
  }
  function contactStep() {
    const c = call.contact;
    const all = call.showAll;
    return '<h2 class="nc-h">Contact</h2><section class="nc-card"><div class="nc-card-top"><h4><i>' + svg("person") + '</i>Contact info</h4><label class="nc-switch"><span>Show all fields</span><input type="checkbox" data-nc-show-all' + (all ? " checked" : "") + "><i></i></label></div>" +
      '<div class="nc-grid2">' + field("contact.first", "First name") + field("contact.last", "Last name") + field("contact.email", "Email") + field("contact.mobile", "Mobile phone") +
      (all ? '<div><button class="pill outline nc-mini" data-x-ext="a second email field">+ EMAIL</button></div><div></div>' + field("contact.display", "Display name") + field("contact.home", "Home phone") + field("contact.company", "Company") + field("contact.work", "Work phone") + field("contact.role", "Role") + '<div><button class="pill outline nc-mini" data-x-ext="a second phone field">+ PHONE</button></div><div class="nc-radios">' + ["Homeowner", "Business"].map((t) => '<label><input type="radio" name="ncType" data-nc="contact.type" value="' + t + '"' + (c.type === t ? " checked" : "") + "> " + t + "</label>").join("") + "</div><div></div>" : "") +
      "</div><hr>" +
      '<h4><i>' + svg("place") + '</i>Address</h4><div class="nc-addr">' + field("contact.street", "Street", "wide") + field("contact.unit", "Unit") + field("contact.city", "City") + field("contact.state", "State") + field("contact.zip", "Zip") + field("contact.addressNotes", "Address notes", "full") + "</div>" +
      (all ? '<button class="pill outline nc-mini nc-addr-add" data-x-ext="a second address field">+ ADDRESS</button>' : "") + "<hr>" +
      '<h4><i>' + svg("note") + '</i>Notes</h4><div class="nc-grid2">' + field("contact.notes", "Customer notes") + field("contact.billsTo", "This customer bills to") + pick("contact.lead", "Lead source", D.leadSources) + tagField("contact.tags", "Customer tags (press enter)") + "</div>" +
      (all ? '<hr><label class="check"><input type="checkbox" data-nc-notify' + (c.notify ? " checked" : "") + "> Receive notifications</label>" : "") + "</section>";
  }
  function profileView() {
    const c = call.contact;
    return '<nav class="nc-tabs">' + ["Profile", "Estimates", "Jobs", "Invoices"].map((t, i) => (i === 0 ? '<button class="on">' + t.toUpperCase() + "</button>" : '<button data-x-ext="the ' + t + ' tab">' + t.toUpperCase() + "</button>")).join("") + '</nav><div class="nc-profile"><section class="nc-card"><h3>Summary</h3><dl class="kv"><dt>Lifetime value</dt><dd>$0.00</dd><dt>Outstanding balance</dt><dd>$0.00</dd></dl><h3>Contact info</h3><dl class="kv"><dt>Contact</dt><dd>' + esc(nameOf()) + "</dd><dt>Phone</dt><dd>" + esc(c.mobile || "-") + "</dd><dt>Email</dt><dd>" + esc(c.email || "-") + '</dd></dl></section><section class="nc-card"><div class="nc-map">Map isn\'t in the sandbox</div><h3>' + (addressText() ? "1 address" : "No addresses") + "</h3><p>" + esc(addressText()) + "</p></section></div>";
  }
  function barHtml() {
    const c = call.contact;
    const name = call.customerId
      ? '<div class="nc-who"><i>' + svg("person") + "</i><span>" + esc(nameOf() || "New customer") + "</span></div>"
      : '<div class="nc-cust-wrap"><i>' + svg("person") + '</i><input id="ncCustInput" data-nc-cust-search placeholder="Customer name" aria-label="Customer name" value="' + esc(call.custQuery) + '" autocomplete="off"><div id="ncCustDrop">' + customerResults() + "</div></div>";
    const right = call.customerId
      ? (c.mobile ? '<span class="nc-meta"><i>' + svg("phone") + "</i>" + esc(c.mobile) + "</span>" : "") + (c.email ? '<span class="nc-meta"><i>' + svg("mail") + "</i>" + esc(c.email) + "</span>" : '<span class="nc-meta"><i>' + svg("mail") + "</i></span>") +
        (call.customerId === "new" ? "" : '<button class="link nc-prof" data-nc-profile>' + (call.profile ? "HIDE PROFILE" : "SHOW PROFILE") + '<i' + (call.profile ? ' style="transform:rotate(180deg)"' : "") + ">" + svg("chevDown") + "</i></button>") + '<span class="nc-more-wrap"><button class="icon-btn" data-nc-more aria-label="More">' + svg("dots") + "</button>" + (call.more ? '<div class="nc-pop"><button data-nc-detach>Detach customer</button></div>' : "") + "</span>"
      : "";
    return name + '<label class="nc-addr-bar"><i>' + svg("place") + '</i><input data-nc-addr placeholder="Address lookup" aria-label="Address lookup" value="' + esc(call.addr) + '" autocomplete="off"></label>' + right;
  }
  function renderCall() {
    if (!call) call = blankCall("home");
    HCP.sched.setPicker(call.step === "schedule" && !call.profile && call.tab !== "x" ? picker : null);
    const main = call.step === "request" ? requestStep() : call.step === "schedule" ? scheduleStep() : contactStep();
    const can = !!call.customerId;
    return '<div class="nc" role="dialog" aria-modal="true" aria-labelledby="ncTitle"><header class="nc-head"><button class="icon-btn" data-nc-close aria-label="Close">' + svg("close") + '</button><h1 id="ncTitle">New Call</h1><button class="link nc-cancel" data-nc-close>CANCEL</button><span class="nc-save-wrap"><button class="pill nc-save' + (can ? "" : " off") + '" data-nc-save-open' + (can ? "" : " disabled") + ">SAVE AS...</button>" + (call.saveOpen ? '<div class="nc-pop">' + ["Job", "Estimate", "Lead"].map((t) => '<button data-nc-save="' + t + '">' + t + "</button>").join("") + "</div>" : "") + "</span></header>" +
      '<div class="nc-bar">' + barHtml() + "</div>" +
      (call.addrOpen ? '<div class="nc-strip"><div class="nc-strip-top"><button class="link" data-nc-addr-use>USE THIS ADDRESS</button><button class="link" data-nc-addr-close>CLOSE</button></div><div class="nc-map">Map isn\'t in the sandbox</div></div>' : "") +
      (call.profile ? '<div class="nc-prof-body" id="ncMain">' + profileView() + "</div>" :
      '<div class="nc-body"><aside class="nc-side"><div class="nc-tab-row"><button class="' + (call.tab === "flow" ? "on" : "") + '" data-nc-tab="flow">INTAKE FLOW</button><button class="' + (call.tab === "faq" ? "on" : "") + '" data-nc-tab="faq">FAQ</button></div><div class="nc-side-body">' + (call.tab === "faq" ? faqPanel() : sideCards()) + '</div><button class="nc-feedback" data-x-ext="the feedback form"><i>' + svg("bubble") + "</i>GIVE US FEEDBACK<em>" + svg("chevDown") + '</em></button></aside><main class="nc-main" id="ncMain">' + main + "</main></div>") +
      (call.leadWarn ? '<div class="modal"><div class="dialog small-dialog" role="alertdialog" aria-modal="true"><h2>Scheduling information will be lost</h2><p>Saving request guide as a lead won\'t include your scheduling information. Are you sure you want to save this as lead anyway?</p><div><button class="pill outline" data-nc-lead-cancel>CANCEL</button><button class="pill" data-nc-lead-save>SAVE</button></div></div></div>' : "") + "</div>";
  }
  const picker = {
    get anchor() { return call.anchor; },
    set anchor(v) { call.anchor = v; },
    get appt() { return call.appt; },
    onPick(p) { call.appt = { date: p.date, start: p.start, end: p.start + 60, team: p.team }; draw(); },
    refresh: () => draw(),
  };

  // ---------- saving ----------
  function saveCustomer() {
    const c = call.contact;
    const address = c.street.trim() ? { street: c.street.trim(), unit: c.unit, city: c.city, state: c.state, zip: c.zip } : null;
    const phones = c.mobile.trim() ? [{ kind: "Mobile", number: c.mobile.trim(), note: "" }] : [];
    const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    if (call.customerId === "new") {
      const saved = { id: uid("c"), first: c.first.trim(), last: c.last.trim(), display: c.display.trim() || (c.first + " " + c.last).trim(), emails: c.email.trim() ? [c.email.trim()] : [], phones, company: c.company, role: c.role, type: c.type, dns: false, addresses: address ? [Object.assign({ id: uid("a") }, address)] : [], notes: c.notes, tags: c.tags, lead: c.lead, referredBy: "", billsTo: "", notify: c.notify };
      customers().unshift(saved);
      return { customer: saved, addressId: saved.addresses[0] ? saved.addresses[0].id : "" };
    }
    const saved = customers().find((x) => x.id === call.customerId);
    Object.assign(saved, { first: c.first, last: c.last, display: c.display, emails: c.email.trim() ? [c.email.trim()] : [], company: c.company, role: c.role, type: c.type, notes: c.notes, lead: c.lead, tags: c.tags, notify: c.notify });
    if (phones.length) saved.phones = phones.concat(saved.phones.slice(1));
    let match = address && saved.addresses.find((a) => a.street === address.street);
    if (address && !match) { match = Object.assign({ id: uid("a") }, address); saved.addresses.unshift(match); }
    return { customer: saved, addressId: match ? match.id : "" };
  }
  function saveJob() {
    const { customer, addressId } = saveCustomer();
    const id = Math.max.apply(null, HCP.state.jobs.map((x) => x.id)) + 1;
    const lines = (list) => list.filter((r) => r.name.trim()).map((r) => ({ name: r.name.trim(), description: r.description, qty: toNum(r.qty), price: toNum(r.price) }));
    const guide = D.requestGuide.filter((g) => g.type !== "reminder" && [].concat(call.answers[g.id] || []).join("").trim()).map((g) => ({ q: g.q, a: [].concat(call.answers[g.id]).join(", ") }));
    const a = call.appt;
    HCP.state.jobs.unshift({ id, customerId: customer.id, addressId, status: a ? "Scheduled" : "Not scheduled", appt: a ? { date: a.date, start: a.start, end: a.end, anytime: false, team: a.team, arrival: 240 } : null, created: today(), jobType: call.jobType, unit: call.unit, lead: call.lead, tags: call.tags, notes: call.notes, guide, services: lines(call.services), materials: lines(call.materials) });
    HCP.save();
    call = null;
    toast("Job saved");
    HCP.go("job/" + id);
  }

  // ---------- events ----------
  HCP.onClick((e) => {
    if (HCP.view !== "new-call" || !call) return false;
    const t = (s) => e.target.closest(s);
    let b;
    const hadPop = call.saveOpen || call.more;
    if (hadPop && !t("[data-nc-save-open]") && !t("[data-nc-more]") && !t(".nc-pop")) { call.saveOpen = false; call.more = false; draw(); return true; }
    if (t("[data-nc-close]")) { const back = call.from; call = null; HCP.go(back); return true; }
    if ((b = t("[data-nc-tab]"))) { call.tab = b.dataset.ncTab; draw(); return true; }
    if (t("[data-nc-undo]")) { call.appt = null; draw(); return true; }
    if ((b = t("[data-nc-step]"))) { call.step = b.dataset.ncStep; call.profile = false; if (call.step === "schedule") HCP.sched.aim(call.anchor); HCP.render(); const m = $("ncMain"); if (m) m.scrollTop = 0; return true; }
    if ((b = t("[data-nc-cust]"))) { useCustomer(customers().find((c) => c.id === b.dataset.ncCust)); draw(); return true; }
    if (t("[data-nc-create]")) { createFromQuery(); draw(); return true; }
    if ((b = t("[data-nc-ans]"))) {
      const id = b.dataset.ncAns;
      const v = b.dataset.val;
      if (b.dataset.multi === "true") {
        const cur = [].concat(call.answers[id] || []);
        call.answers[id] = cur.includes(v) ? cur.filter((x) => x !== v) : cur.concat(v);
      } else call.answers[id] = call.answers[id] === v ? "" : v;
      draw();
      return true;
    }
    if ((b = t("[data-nc-line-add]"))) { call[b.dataset.ncLineAdd].push(blankLine()); draw(); return true; }
    if ((b = t("[data-nc-line-del]"))) { const [k, i] = b.dataset.ncLineDel.split("."); call[k].splice(Number(i), 1); draw(); return true; }
    if ((b = t("[data-nc-tag-del]"))) { const [scope, sub, idx] = b.dataset.ncTagDel.split("."); const list = sub === "tags" ? call.contact.tags : call.tags; list.splice(Number(sub === "tags" ? idx : sub), 1); if (scope) draw(); return true; }
    if ((b = t("[data-nc-faq]"))) { const i = b.dataset.ncFaq; call.faqOpen[i] = !call.faqOpen[i]; draw(); return true; }
    if (t("[data-nc-faq-clear]")) { call.faqQuery = ""; draw(); return true; }
    if (t("[data-nc-rem-fold]")) { call.remindersOpen = !call.remindersOpen; draw(); return true; }
    if (t("[data-nc-profile]")) { call.profile = !call.profile; draw(); return true; }
    if (t("[data-nc-more]")) { call.more = !call.more; draw(); return true; }
    if (t("[data-nc-detach]")) { Object.assign(call, { customerId: "", contact: blankContact(), more: false, profile: false, addr: "" }); draw(); return true; }
    if (t("[data-nc-addr-close]")) { call.addrOpen = false; draw(); return true; }
    if (t("[data-nc-addr-use]")) {
      const [street, city, rest] = call.addr.split(",").map((x) => x.trim());
      const [state, zip] = (rest || "").split(/\s+/);
      Object.assign(call.contact, { street: street || "", city: city || "", state: state || "", zip: zip || "" });
      call.addrOpen = false;
      draw();
      return true;
    }
    if (t("[data-nc-save-open]")) { call.saveOpen = !call.saveOpen; draw(); return true; }
    if ((b = t("[data-nc-save]"))) {
      call.saveOpen = false;
      const kind = b.dataset.ncSave;
      if (kind === "Job") saveJob();
      else if (kind === "Lead" && call.appt) { call.leadWarn = true; draw(); }
      else { notBuilt("Saving as " + (kind === "Lead" ? "a lead" : "an estimate")); draw(); }
      return true;
    }
    if (t("[data-nc-lead-cancel]")) { call.leadWarn = false; draw(); return true; }
    if (t("[data-nc-lead-save]")) { call.leadWarn = false; notBuilt("Saving as a lead"); draw(); return true; }
    return false;
  });
  function refreshTotals() {
    call.services.concat([]).forEach((r, i) => { const el = document.querySelector('[data-amt="services.' + i + '"]'); if (el) el.textContent = money(lineTotal(r)); });
    call.materials.forEach((r, i) => { const el = document.querySelector('[data-amt="materials.' + i + '"]'); if (el) el.textContent = money(lineTotal(r)); });
    ["ncAmt", "ncSub", "ncTot"].forEach((id) => { if ($(id)) $(id).textContent = money(callTotal()); });
  }
  document.addEventListener("input", (e) => {
    if (HCP.view !== "new-call" || !call) return;
    const el = e.target;
    if (el.dataset.nc) { if (el.type === "radio" && !el.checked) return; setPath(el.dataset.nc, el.value); return; }
    if (el.dataset.ncNum) { setPath(el.dataset.ncNum, el.value); refreshTotals(); return; }
    if (el.dataset.ncName) {
      setPath(el.dataset.ncName + ".name", el.value);
      const p = D.priceBook.find((x) => x.kind === el.dataset.kind && x.name === el.value);
      if (p) { const [k, i] = el.dataset.ncName.split("."); Object.assign(call[k][Number(i)], { price: money(p.price), description: p.description }); draw(); }
      return;
    }
    if (el.matches("[data-nc-cust-search]")) { call.custQuery = el.value; $("ncCustDrop").innerHTML = customerResults(); return; }
    if (el.matches("[data-nc-addr]")) { call.addr = el.value; return; }
    if (el.matches("[data-nc-faq-search]")) { call.faqQuery = el.value; const pos = el.selectionStart; draw(); const n = document.querySelector("[data-nc-faq-search]"); n.focus(); n.setSelectionRange(pos, pos); return; }
  });
  document.addEventListener("change", (e) => {
    if (HCP.view !== "new-call" || !call) return;
    const el = e.target;
    if (el.matches("[data-nc-show-all]")) { call.showAll = el.checked; draw(); }
    if (el.matches("[data-nc-show-rem]")) { call.showReminders = el.checked; draw(); }
    if (el.matches("[data-nc-notify]")) call.contact.notify = el.checked;
  });
  document.addEventListener("keydown", (e) => {
    if (HCP.view !== "new-call" || !call) return;
    const el = e.target;
    if (e.key === "Enter" && el.matches("[data-nc-tag]") && el.value.trim()) {
      e.preventDefault();
      (el.dataset.ncTag === "tags" ? call.tags : call.contact.tags).push(el.value.trim());
      draw();
      const again = document.querySelector('[data-nc-tag="' + el.dataset.ncTag + '"]');
      if (again) again.focus();
    } else if (e.key === "Enter" && el.matches("[data-nc-addr]") && el.value.trim()) {
      e.preventDefault();
      call.addrOpen = true;
      draw();
    } else if ((e.key === "Enter" || e.key === " ") && el.matches("[data-nc-undo]")) {
      e.preventDefault();
      call.appt = null;
      draw();
    }
  });

  HCP.views["new-call"] = renderCall;
  HCP.navFor["new-call"] = "jobs";
  HCP.afterRender.push(() => { if (HCP.view !== "new-call") HCP.sched.setPicker(null); });
  HCP.onReset.push(() => { call = null; });
});

</script>
<script>
// Estimate pipeline module: Pipeline board and table, Estimates list, estimate page.
// Screens, status names and columns are copied from a live Housecall Pro account.
window.HCP_MODULES = window.HCP_MODULES || [];
window.HCP_MODULES.push(function (HCP) {
  const { svg, esc, toast, notBuilt } = HCP;
  const D = HCP.data;
  const $ = (id) => document.getElementById(id);
  const freshUi = () => ({ tab: "leads", mode: "Board", query: "", drawer: false, emp: "", cust: "", list: "All", listQuery: "" });
  const ui = freshUi();

  const money = (n) => "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const estimates = () => HCP.state.estimates;
  const byId = (id) => estimates().find((e) => String(e.id) === String(id));
  const cust = (e) => HCP.state.customers.find((c) => c.id === e.customerId);
  const addrOf = (e) => { const c = cust(e); return c && (c.addresses.find((a) => a.id === e.addressId) || c.addresses[0]); };
  const member = (id) => D.team.find((m) => m.id === id);
  const subtotal = (e) => e.services.concat(e.materials).reduce((n, r) => n + r.qty * r.price, 0);
  const value = (e) => subtotal(e) - (e.discount || 0);
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function ago(date) {
    const days = Math.max(0, Math.round((parse(ymd(new Date())) - parse(date)) / 86400000));
    if (days === 0) return "today";
    if (days === 1) return "a day";
    if (days < 30) return days + " days";
    const months = Math.round(days / 30);
    return months === 1 ? "a month" : months + " months";
  }
  const agoText = (date) => (ago(date) === "today" ? "today" : ago(date) + " ago");
  const columnOf = (status) => D.estimateColumns.find((c) => c.statuses.includes(status));
  const person = (id) => { const m = member(id); return m ? '<span class="mini-av" style="background:' + m.color + '">' + esc(m.initials) + "</span>" : ""; };
  const statusSelect = (e) => '<select class="ep-status" data-ep-status="' + e.id + '" aria-label="Status for estimate ' + e.id + '">' + D.estimateStatuses.map((s) => "<option" + (s === e.status ? " selected" : "") + ">" + s + "</option>").join("") + "</select>";

  function matches(e) {
    const c = cust(e);
    const q = ui.query.trim();
    if (q && String(e.id) !== q) return false;
    if (ui.emp && e.assignee !== ui.emp) return false;
    if (ui.cust.trim() && !(c ? c.display : "").toLowerCase().includes(ui.cust.trim().toLowerCase())) return false;
    return true;
  }
  const shown = () => estimates().filter(matches);

  // ---------- pipeline ----------
  function card(e) {
    const c = cust(e);
    const m = member(e.assignee);
    return '<article class="ep-card"><button class="ep-open" data-go="estimate/' + e.id + '"><span class="ep-num">Estimate #' + e.id + '</span><b>' + esc(c ? c.display : "") + "</b><span>" + money(value(e)) + '</span></button><div class="ep-who">' + person(e.assignee) + "<span>" + esc(m ? m.name : "") + "</span></div>" + statusSelect(e) + "<p>Status updated <strong>" + (ago(e.updated) === "today" ? "today" : ago(e.updated) + "</strong> ago") + (ago(e.updated) === "today" ? "</strong>" : "") + "</p></article>";
  }
  function board() {
    const list = shown();
    return '<div class="ep-board">' + D.estimateColumns.map((col) => {
      const rows = list.filter((e) => col.statuses.includes(e.status));
      return '<section class="ep-col"><header><h3>' + col.name + "</h3><span>" + rows.length + "</span><p>" + money(rows.reduce((n, e) => n + value(e), 0)) + " total</p></header>" + rows.map(card).join("") + "</section>";
    }).join("") + "</div>";
  }
  function dateTwoLine(date) {
    const d = parse(date);
    return String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0") + "/" + d.getFullYear() + "<br>" + DAYS[d.getDay()] + " 9:00PM";
  }
  function table() {
    return '<div class="ep-table"><table><thead><tr><th><input type="checkbox" aria-label="Select all" > Estimate #</th><th>Customer</th><th>Created</th><th>Value</th><th>Assignee</th><th>Status</th><th>Status updated</th></tr></thead><tbody>' +
      shown().filter((e) => columnOf(e.status)).map((e) => { const c = cust(e); const m = member(e.assignee); return '<tr><td><input type="checkbox" aria-label="Select estimate ' + e.id + '" > <button class="ep-link" data-go="estimate/' + e.id + '">Estimate #' + e.id + "</button></td><td>" + esc(c ? c.display : "") + "</td><td>" + dateTwoLine(e.created) + "</td><td>" + money(value(e)) + '</td><td><span class="ep-who">' + person(e.assignee) + "<span>" + esc(m ? m.name : "") + "</span></span></td><td>" + statusSelect(e) + "</td><td>" + agoText(e.updated) + "</td></tr>"; }).join("") + "</tbody></table></div>";
  }
  function drawer() {
    if (!ui.drawer) return "";
    return '<div class="ep-scrim" data-ep-drawer-close></div><aside class="ep-drawer" role="dialog" aria-modal="true" aria-labelledby="epFilters"><header><button class="icon-btn" data-ep-drawer-close aria-label="Close filters">' + svg("close") + '</button><h2 id="epFilters">Filters</h2></header><div class="ep-drawer-body"><h4>Maintain filters</h4><p>Filters will not be cleared and will stay in every Pipeline visit.</p><button class="pill outline" data-x-ext="the saved filters">Maintain filters</button>' +
      '<h4>Employee</h4><select data-ep-filter="emp" aria-label="Employee"><option value="">Employee name</option>' + D.team.map((m) => '<option value="' + m.id + '"' + (ui.emp === m.id ? " selected" : "") + ">" + esc(m.name) + "</option>").join("") + "</select>" +
      '<h4>Job Type</h4><select aria-label="Job type"><option>Job type</option></select><h4>Estimate Tags</h4><input placeholder="Tag name" aria-label="Tag name"><h4>Customer</h4><input data-ep-filter="cust" placeholder="Customer name, email, phone, or address" aria-label="Customer" value="' + esc(ui.cust) + '"><h4>Created date</h4><div class="ep-dates"><input type="date" aria-label="Created from"><span>—</span><input type="date" aria-label="Created to"></div><h4>Scheduled date</h4><select aria-label="Scheduled date"><option></option></select></div></aside>';
  }
  function renderPipeline() {
    const tabs = ["Leads", "Estimates", "Jobs"].map((t) => '<button role="tab" aria-selected="' + (ui.tab === t.toLowerCase()) + '" class="' + (ui.tab === t.toLowerCase() ? "on" : "") + '" data-ep-tab="' + t.toLowerCase() + '">' + t + "</button>").join("");
    const head = '<div class="ep"><div class="ep-head"><h1>Pipeline</h1><div class="ep-tools"><button data-go="app-settings/pipeline" aria-label="Automations">' + svg("tools") + '</button><button data-go="app-settings/pipeline" aria-label="Settings">' + svg("gear") + '</button></div><div class="ep-tabs" role="tablist">' + tabs + "</div></div>";
    if (ui.tab === "jobs") return head + HCP.jobsBoard() + "</div>";
    if (ui.tab === "leads") return head + '<div class="ep-empty"><h2>Close leads faster</h2><p>Track leads here and automate lead outreach.</p><div><button class="pill" data-go="new-lead">Create a lead</button><button class="pill outline" data-x-ext="the pipeline tour">Tour pipeline</button></div></div></div>';
    return head + '<div class="ep-body"><section class="ep-impact"><div><small>Pipeline</small><b>Last 30 days impact</b></div><div class="ep-tile"><i>' + svg("dollar") + "</i><strong>$18,420</strong><span>Revenue from estimates won with Pipeline automations</span></div><div class=\"ep-tile\"><i>" + svg("report") + '</i><strong>5</strong><span>Estimates won with Pipeline automations</span></div></section>' +
      '<div class="ep-bar"><select aria-label="Search by"><option>Estimate # (exact match)</option></select><label class="ep-search"><i>' + svg("search") + '</i><input data-ep-query placeholder="Search by Estimate # (exact match)" aria-label="Search by estimate number" value="' + esc(ui.query) + '"></label><button class="pill outline" data-ep-drawer-open>Filter</button><button class="link" data-x-ext="the archived items list">View archived items</button><div class="ep-mode">' + ["Board", "Table"].map((m) => '<button class="' + (ui.mode === m ? "on" : "") + '" data-ep-mode="' + m + '">' + m + "</button>").join("") + '</div></div><div id="epView">' + (ui.mode === "Board" ? board() : table()) + "</div></div>" + drawer() + "</div>";
  }

  // ---------- estimates list ----------
  const outcome = (s) => (s === "Approved" ? "Won" : s === "Rejected" ? "Lost" : "Open");
  function renderList() {
    const q = ui.listQuery.trim().toLowerCase();
    const rows = estimates().filter((e) => (ui.list === "All" || outcome(e.status) === ui.list) && (!q || (String(e.id) + " " + (cust(e) ? cust(e).display : "")).toLowerCase().includes(q)));
    const cols = ["Estimate #", "Customer name", "Options count", "Employees", "Estimate status", "Created date", "Scheduled date", "Outcome", "Open value", "Won value", "Lost value", "Estimate lead source", "Estimate tags"];
    const fmt = (date) => { const d = parse(date); return MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); };
    return '<div class="el"><div class="el-head"><h1>Estimates</h1><p>' + estimates().length + ' records</p><button class="el-settings" data-go="app-settings/estimates" aria-label="Settings">' + svg("gear") + '</button></div><div class="el-card"><div class="el-bar"><label class="ep-search"><i>' + svg("search") + '</i><input data-el-query placeholder="Search" aria-label="Search estimates" value="' + esc(ui.listQuery) + '"></label><button class="icon-btn" data-x-ext="the filter drawer" aria-label="Filter">' + svg("fields") + '</button><button class="icon-btn" data-x-ext="the Edit columns drawer" aria-label="Edit columns">' + svg("pipeline") + '</button><button class="x-select" data-x-ext="the filter view list">Filter view: System default</button><span></span><button class="pill outline" data-x-ext="the bulk actions menu">Actions</button><button class="pill" data-go="new-estimate">Create estimate</button></div><div class="el-tabs" role="tablist">' + ["All", "Open", "Won", "Lost"].map((t) => '<button role="tab" aria-selected="' + (ui.list === t) + '" class="' + (ui.list === t ? "on" : "") + '" data-el-tab="' + t + '">' + t + "</button>").join("") + '</div><div class="inv-chip"><span>STATUS <b>5 active</b></span></div><div class="el-table"><table><thead><tr><th></th>' + cols.map((c) => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" +
      rows.map((e) => { const c = cust(e); const m = member(e.assignee); const o = outcome(e.status); return '<tr class="row" data-go="estimate/' + e.id + '"><td><input type="checkbox" aria-label="Select estimate ' + e.id + '" ></td><td>' + e.id + "</td><td>" + esc(c ? c.display : "") + "</td><td>1</td><td>" + esc(m ? m.name : "") + "</td><td>" + esc(e.status) + "</td><td>" + fmt(e.created) + "</td><td>" + (e.visit ? fmt(e.visit.date) : "-") + "</td><td>" + o + "</td><td>" + (o === "Open" ? money(value(e)) : "-") + "</td><td>" + (o === "Won" ? money(value(e)) : "-") + "</td><td>" + (o === "Lost" ? money(value(e)) : "-") + "</td><td>" + esc(e.lead || "-") + "</td><td>-</td></tr>"; }).join("") + '</tbody></table></div><div class="el-pager">1-' + rows.length + " of " + rows.length + " &nbsp; Rows per page &nbsp; Page 1 of 1</div></div></div>";
  }

  // ---------- estimate page ----------
  function lineRows(list, kind) {
    return list.map((r, i) => '<div class="li"><div class="li-top"><b>' + esc(r.name) + "</b><span><small>Quantity</small>" + r.qty + "</span><span><small>Unit price</small>" + money(r.price) + "</span><span><small>Total price</small>" + money(r.qty * r.price) + '</span><button class="icon-btn small plus" data-soon="Edit ' + kind + '" data-li="' + i + '" aria-label="Edit ' + esc(r.name) + '">' + svg("pencil") + "</button></div><p>" + esc(r.description || "") + '</p><div class="li-foot"><span><small>Unit cost</small>$0.00</span></div></div>').join("");
  }
  function renderEstimate(id) {
    const e = byId(id);
    if (!e) return '<div class="soon"><h1>Estimate not found</h1></div>';
    const c = cust(e);
    const a = addrOf(e);
    const m = member(e.assignee);
    const sent = ["Sent", "First Follow-Up", "Second Follow-Up", "Third Follow-Up", "On Hold", "Approved", "Rejected"].includes(e.status);
    const approved = e.status === "Approved";
    const st = e.stamps || {};
    const visit = ["Scheduled", "In Progress", "Completed"].indexOf(e.status);
    const steps = [["Schedule", "calendar", st.Schedule || ""], ["OMW", "truck", st.OMW || ""], ["Finish", "stop", st.Finish || ""], ["Send", "send", sent ? "Sent to customer" : ""], ["Approval", "check", approved ? "Approved" : e.status === "Rejected" ? "Declined" : sent ? "Awaiting Approval" : ""], ["Copy to job", "clipboard", e.jobId ? "Job #" + e.jobId : ""]];
    const flags = [visit >= 0 || sent || !!st.Schedule, visit >= 1 || !!st.OMW, visit >= 2 || !!st.Finish, sent, approved || e.status === "Rejected", !!e.jobId];
    const row = (label, icon, body) => '<div class="jp-row' + (body ? " on" : "") + '"><div class="jp-row-head"><i>' + svg(icon) + "</i><span>" + label + '</span><button class="icon-btn small plus" data-soon="' + label + '" aria-label="Add ' + label + '">' + svg("plus") + "</button></div>" + (body ? '<div class="jp-row-body">' + body + "</div>" : "") + "</div>";
    const add = (label) => '<button class="lis-add" data-soon="' + label + '"><span>' + label + "</span><i>" + svg("plus") + "</i></button>";
    const book = (name) => '<button class="link" data-soon="' + name + '">' + name + '<i class="bk">' + svg("bookmark") + "</i></button>";
    return '<div class="eg"><div class="eg-top"><nav class="jp-crumb"><button class="crumb" data-go="estimates">Estimates</button><span>›</span><span>Estimate #' + e.id + '</span></nav><div class="eg-head"><h1>Estimate</h1><div class="eg-options"><button class="on">Option<br>#1</button><button class="link" data-soon="Add option">Add option</button></div><div class="eg-status"><small>Status</small><button class="link" data-go="pipeline">' + esc(e.status) + ' ↗</button></div><button class="pill outline eg-beta" data-soon="Beta view"><i>' + svg("sparkle") + '</i>Try beta view</button></div></div>' +
      '<div class="eg-grid"><div class="jp-left"><section class="jp-card"><div class="jp-head"><i>' + svg("person") + '</i><span>Customer</span></div><div class="jp-street" aria-hidden="true">Street view</div><div class="jp-cust"><div class="jp-line"><span>' + esc(c ? c.display : "") + '</span><button class="pill outline small-pill" data-soon="View details">View details</button></div><div class="jp-line"><span>' + esc(a ? a.street : "") + (a ? "<br>" + esc(a.city + ", " + a.state + " " + a.zip) : "") + '</span><button class="icon-btn" data-soon="Edit address" aria-label="Edit address">' + svg("pencil") + '</button><button class="icon-btn" data-go="map" aria-label="Map">' + svg("place") + '</button></div><div class="jp-line"><span>' + esc(c && c.phones[0] ? c.phones[0].number : "") + '</span><button class="icon-btn" data-go="calls" aria-label="Call">' + svg("phone") + '</button><button class="icon-btn" data-go="chats" aria-label="Message">' + svg("bubble") + "</button></div>" + (c && c.notify ? '<div class="jp-badges"><span class="notif-on">Notifications on</span></div>' : "") + '<div class="jp-line"><span>No payment method</span><button class="icon-btn" data-soon="Payment methods" aria-label="Add payment method">' + svg("card") + '</button></div><button class="link jp-profile" data-go="customer/' + (c ? c.id : "") + '">Customer Profile</button></div></section>' +
      '<section class="jp-card jp-pad"><div class="jp-title-row"><h3 class="eg-h3"><i>' + svg("shield") + '</i>Service plans</h3></div><p class="eg-muted">Customer has no active service plans.</p><h4 class="eg-h4">Offered with this estimate</h4><button class="link" data-go="service-plans">Add a service plan offer</button></section><section class="jp-map"><span>Map isn\'t in the sandbox</span></section>' + row("Fields", "fields", "") + row("Estimate tags", "tag", (e.tags || []).map((t) => '<span class="tag">' + esc(t) + "</span>").join("")) + row("Private notes", "note", esc(e.notes || "")) + row("Attachments", "attach", "") +
      '</div><div class="jp-right"><div class="eg-steps">' + steps.map(([l, i, sub], n) => '<div class="step' + (flags[n] ? " done" : "") + '"><button class="step-btn" data-soon="' + l + '"><i>' + svg(i) + "</i><b>" + l.toUpperCase() + "</b></button><small>" + sub + "</small></div>").join("") + '</div><button class="jp-acc" data-soon="Made for you"><i>' + svg("sparkle") + '</i><span>Made for you</span><i class="caret">' + svg("chevDown") + "</i></button>" +
      '<section class="jp-card jp-pad eg-opt"><div class="jp-title-row"><h2>Estimate <button class="ep-link big" data-soon="Estimate number">#' + e.id + '</button></h2><button class="pill outline" data-soon="Present">Present</button></div><div class="eg-terms"><b>Expiration date:</b><button class="link" data-soon="Expiration date">' + esc(e.expires) + '</button><b>Customer can approve:</b><button class="link" data-soon="Approval option">' + esc(e.approve || "Only one option") + '</button></div></section>' +
      '<section class="jp-card jp-pad eg-lines"><div class="jp-title-row"><h2 class="eg-li">Line items</h2></div><div class="people lis-team"><span class="person">' + person(e.assignee) + esc(m ? m.name : "") + '</span><button class="icon-btn small plus" data-soon="Edit team" aria-label="Edit team">' + svg("pencil") + '</button></div><div class="eg-templates"><button class="link" data-x-ext="estimate templates">Templates<i class="bk">' + svg("bookmark") + '</i></button></div><div class="lis-head"><h4>Services</h4>' + book("Service Price Book") + "</div>" + lineRows(e.services, "service") + add("Add service") + '<div class="lis-head"><h4>Materials</h4>' + book("Material Price Book") + "</div>" + lineRows(e.materials, "material") + add("Add material") + '<div class="lis-sum"><span>Subtotal</span><span>' + money(subtotal(e)) + "</span></div>" + (e.deposit ? '' : "") + (e.discount ? '<div class="lis-sum"><span>Discount<small class="eg-sub">Savings (' + money(e.discount) + ")</small></span><span>-" + money(e.discount) + "</span></div>" : "") + add("Add discount") + '<div class="lis-sum"><span>Tax rate<small class="eg-sub">none</small></span><span>$0.00</span></div><div class="lis-sum eg-total"><span>Total</span><span>' + money(value(e)) + "</span></div>" + (e.deposit ? '<div class="lis-sum"><span>Deposit requested</span><span>' + money(e.deposit) + "</span></div>" : "") + add("Add deposit") + '<button class="eg-send" data-soon="Send and present estimate">Send and present estimate</button><table class="eg-cost"><thead><tr><th>Cost breakdown</th><th>Total cost</th><th>Profit/Loss</th></tr></thead><tbody><tr><td></td><td>$0.00</td><td>100.00 %</td></tr></tbody></table></section>' +
      '<section class="jp-card jp-pad"><div class="jp-title-row"><h2 class="eg-li">Activity feed</h2></div><div class="feed">' + (e.events || []).slice().reverse().map((x) => '<div class="feed-row"><span class="feed-who">' + person(e.assignee) + esc(m ? m.name : "") + "</span><i>" + svg(x.icon) + "</i><span>" + esc(x.text) + "</span><small>" + esc(x.when) + "</small></div>").join("") + '<div class="feed-row"><span class="feed-who">' + person(e.assignee) + esc(m ? m.name : "") + "</span><i>" + svg("clipboard") + "</i><span>Estimate created</span><small>" + esc((() => { const d = parse(e.created); return MONTHS[d.getMonth()].slice(0, 3) + " " + d.getDate() + ", " + d.getFullYear(); })()) + "</small></div></div></section></div></div></div>";
  }

  // ---------- events ----------
  function refreshView() { const v = $("epView"); if (v) v.innerHTML = ui.mode === "Board" ? board() : table(); }
  HCP.onClick((e) => {
    const t = (s) => e.target.closest(s);
    let b;
    if ((b = t("[data-ep-tab]"))) { ui.tab = b.dataset.epTab; HCP.render(); return true; }
    if ((b = t("[data-ep-mode]"))) { ui.mode = b.dataset.epMode; HCP.render(); return true; }
    if (t("[data-ep-drawer-open]")) { ui.drawer = true; HCP.render(); return true; }
    if (t("[data-ep-drawer-close]")) { ui.drawer = false; HCP.render(); return true; }
    if ((b = t("[data-el-tab]"))) { ui.list = b.dataset.elTab; HCP.render(); return true; }
    return false;
  });
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.matches("[data-ep-query]")) { ui.query = el.value; refreshView(); }
    else if (el.matches("[data-el-query]")) { ui.listQuery = el.value; const p = el.selectionStart; HCP.render(); const n = document.querySelector("[data-el-query]"); n.focus(); n.setSelectionRange(p, p); }
    else if (el.matches("[data-ep-filter=cust]")) { ui.cust = el.value; refreshView(); }
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.matches("[data-ep-filter=emp]")) { ui.emp = el.value; refreshView(); }
    if (el.matches("[data-ep-status]")) {
      const est = byId(el.dataset.epStatus);
      est.status = el.value;
      est.updated = ymd(new Date());
      HCP.save();
      refreshView();
      toast("Status changed to " + el.value);
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && ui.drawer) { ui.drawer = false; HCP.render(); }
  });

  Object.assign(HCP.views, { pipeline: renderPipeline, estimates: renderList, estimate: renderEstimate });
  Object.assign(HCP.navFor, { estimate: "estimates" });
  HCP.afterRender.push(() => {
    const p = $("page");
    p.classList.toggle("ep-page", HCP.view === "pipeline" || HCP.view === "estimates");
    p.classList.toggle("eg-page", HCP.view === "estimate");
  });
  HCP.onReset.push(() => { Object.assign(ui, freshUi()); });
});

</script>
<script>
// Receivables module: Invoices list and invoice page, copied from a live Housecall Pro account.
// The Payment and Send invoice windows come from screenshots of the live windows.
// The Card tab is display only, so nobody types a real card number into a training tool.
window.HCP_MODULES = window.HCP_MODULES || [];
window.HCP_MODULES.push(function (HCP) {
  const { svg, esc, toast } = HCP;
  const D = HCP.data;
  const freshUi = () => ({ tab: "All", query: "", promo: true, tip: true, pay: null, send: null });
  const ui = freshUi();
  HCP.onLeave.push(() => { ui.pay = null; ui.send = null; });
  const invoices = () => HCP.state.invoices;
  const cust = (i) => HCP.state.customers.find((c) => c.id === i.customerId);
  const money = (n) => "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const stamp = (s) => { const d = parse(s); return String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0") + "/" + String(d.getFullYear()).slice(2); };
  const total = (i) => Math.max(0, i.services.concat(i.materials).reduce((n, r) => n + r.qty * r.price, 0) - Number(i.discount || 0));
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const longDate = (s) => { if (!s) return "-"; const d = parse(s); return MON[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); };
  const pad2 = (n) => String(n).padStart(2, "0");
  // Service date and due date, worked out the same way on the list and the invoice page.
  function dates(i) {
    const job = HCP.state.jobs.find((j) => j.id === i.id);
    const c = HCP.state.customers.find((x) => x.id === i.customerId);
    const svc = job && job.appt ? job.appt.date : i.sent || i.due || "";
    const terms = (job && job.terms) || (c && c.terms) || "Upon receipt";
    const net = /Net (\d+)/.exec(terms);
    let due = i.due;
    if (!due && svc) { const d = parse(svc); if (net) d.setDate(d.getDate() + Number(net[1])); due = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
    return { svc, terms, due };
  }
  const paidSoFar = (i) => (i.payments || []).reduce((n, p) => n + p.amount, 0);
  const due = (i) => (i.status === "Paid" ? 0 : Math.max(0, total(i) - paidSoFar(i)));
  const isPast = (i) => { const t = new Date(); t.setHours(0, 0, 0, 0); return i.status === "Open" && i.due && parse(i.due) < t; };
  // Our reading of the quick views: we saw the tabs but not the rule behind each.
  const inTab = (i) => ui.tab === "All" || (ui.tab === "Unsent" && !i.sent) || (ui.tab === "Due" && i.status === "Open") || (ui.tab === "Past Due" && isPast(i));

  const sel = new Set();
  function tableRows() {
    const q = ui.query.trim().toLowerCase();
    const rows = invoices().filter(inTab).filter((i) => !q || (i.id + " " + (cust(i) ? cust(i).display : "")).toLowerCase().includes(q));
    return rows.map((i) => {
      const c = cust(i);
      const paid = i.status === "Paid";
      return '<tr class="row" data-go="invoice/' + i.id + '"><td><input type="checkbox" aria-label="Select invoice ' + i.id + '" data-inv-sel="' + i.id + '"' + (sel.has(i.id) ? " checked" : "") + '></td><td class="inv-num">' + i.id + '</td><td class="inv-num">' + esc(c ? c.display : "") + '</td><td><span class="inv-pill ' + (paid ? "paid" : "open") + '">' + i.status + "</span></td><td>" + money(due(i)) + "</td><td>" + (dates(i).due ? stamp(dates(i).due) + " · " + DAYS[parse(dates(i).due).getDay()] + " 5:00 PM" : "") + "</td><td>" + (i.sent ? stamp(i.sent) + " · 5:00 PM" : '<button class="link" data-inv-send="' + i.id + '">Send invoice</button>') + '</td><td class="inv-num">' + i.id + '</td><td class="inv-act"><button class="link' + (paid ? " off" : "") + '" ' + (paid ? "disabled" : 'data-inv-pay="' + i.id + '"') + "><i>" + svg("card") + "</i>Pay</button></td></tr>";
    }).join("") || '<tr><td colspan="9" class="muted">No invoices found</td></tr>';
  }
  function renderList() {
    return '<div class="el"><div class="el-head"><h1>Invoices</h1><p>' + invoices().length + ' records</p><button class="el-settings" data-go="app-settings/invoices" aria-label="Settings">' + svg("gear") + "</button></div>" +
      (ui.promo ? '<section class="inv-promo"><span class="inv-rec">Recommended next step</span><h2>Impress customers with custom invoices</h2><p>Look professional, save time, and get paid faster by customizing your default invoice template and communications.</p><div><button class="pill" data-go="app-settings/invoices">Customize my invoice</button><button class="link" data-inv-promo>Dismiss</button></div></section>' : "") +
      (ui.tip ? '<div class="inv-tip"><span>Use this list view to filter, sort, and track your invoices, using quick views such as \'Past due\' to find invoices requiring action.</span><button class="inv-fb" data-x-ext="the feedback form">Give us feedback</button><button class="icon-btn" data-inv-tip aria-label="Close">' + svg("close") + "</button></div>" : "") +
      '<section class="inv-card"><div class="inv-bar"><label class="ep-search"><i>' + svg("search") + '</i><input data-inv-query placeholder="Search invoices" aria-label="Search invoices" value="' + esc(ui.query) + '"></label><button class="inv-ico" data-x-ext="the invoice filter drawer" aria-label="Filter">' + svg("fields") + '</button><button class="inv-ico" data-x-ext="the Edit columns drawer" aria-label="Edit columns">' + svg("pipeline") + '</button><select class="inv-view" aria-label="Filter view"><option>Filter view: System default</option></select><div class="cl-actions"><button class="pill outline" data-inv-actions>Actions<i>' + svg("chevDown") + "</i></button>" + (ui.actions ? '<div class="cl-menu"><button data-inv-bulk="send">Send selected</button><button data-x-ext="a CSV download of the invoice list">Export</button></div>' : "") + '</div></div>' +
      '<div class="el-tabs inv-tabs" role="tablist">' + ["All", "Unsent", "Due", "Past Due"].map((t) => '<button role="tab" aria-selected="' + (ui.tab === t) + '" class="' + (ui.tab === t ? "on" : "") + '" data-inv-tab="' + t + '">' + t + "</button>").join("") + '</div><div class="inv-chip"><span>INVOICE STATUS <b>3 active</b></span></div>' +
      '<div class="inv-table"><table><thead><tr><th></th><th>Invoice #</th><th>Customer name</th><th>Invoice status</th><th>Amount due</th><th>Due date</th><th>Latest send date</th><th>Job #</th><th class="inv-act">Actions</th></tr></thead><tbody id="invRows">' + tableRows() + "</tbody></table></div></section></div>";
  }
  function renderInvoice(id) {
    const i = invoices().find((x) => String(x.id) === String(id));
    if (!i) return '<div class="soon"><h1>Invoice not found</h1></div>';
    const c = cust(i);
    const a = c && c.addresses[0];
    const job = HCP.state.jobs.find((j) => j.id === i.id);
    const rows = (title, list) => (list.length ? '<div class="pv-head"><span>' + title + "</span><span>qty</span><span>unit price</span><span>amount</span></div>" + list.map((r) => '<div class="pv-row"><b>' + esc(r.name) + "</b><span>" + Number(r.qty).toFixed(1) + "</span><span>" + money(r.price) + "</span><b>" + money(r.qty * r.price) + '</b></div><p class="pv-desc">' + esc(r.description || "") + "</p>").join("") : "");
    const paid = i.status === "Paid";
    const { svc, terms, due: dueDate } = dates(i);
    const pays = (i.payments || []);
    const history = '<div class="pv-hist"><h6>Payment History</h6>' + (pays.length ? pays.map((p) => '<div class="pv-hrow"><span>' + (p.date ? longDate(p.date) : "-") + "</span><span>" + (p.time || "") + "</span><span>" + esc(p.type) + "</span><b>" + money(p.amount) + "</b></div>").join("") : paid ? '<div class="pv-hrow"><span>Marked paid</span><span></span><span></span><b>' + money(total(i)) + "</b></div>" : '<p class="pv-desc">No payments yet</p>') + "</div>";
    return '<div class="iv"><header class="iv-head"><button class="iv-back" data-go="invoices" aria-label="Back to invoices">' + svg("chevLeft") + '</button><h1>Invoice #' + i.id + "</h1>" + (job ? '<button class="link" data-go="job/' + i.id + '">Job #' + i.id + " ↗</button>" : '<button class="link" data-x-ext="the job page">Job #' + i.id + " ↗</button>") + '<span></span><button class="iv-ico" data-x-ext="the print dialog" aria-label="Print">' + svg("printer") + '</button><button class="iv-ico" data-x-ext="a PDF download" aria-label="Download PDF">' + svg("invoice") + '</button><button class="pill outline' + (paid ? " inv-off" : "") + '" ' + (paid ? "disabled" : 'data-inv-pay="' + i.id + '"') + '>Pay</button><button class="pill" data-inv-send="' + i.id + '">Send</button></header>' +
      '<article class="pv"><div class="pv-top"><div><span class="pv-logo" aria-hidden="true">DP</span><h2>' + esc(D.company) + '</h2></div><dl class="pv-box"><dt>INVOICE</dt><dd>#' + i.id + "</dd><dt>SERVICE DATE</dt><dd>" + longDate(svc) + "</dd><dt>PAYMENT TERMS</dt><dd>" + esc(terms) + "</dd><dt>DUE DATE</dt><dd>" + longDate(dueDate) + "</dd><dt class=\"due\">AMOUNT DUE</dt><dd class=\"due\">" + money(due(i)) + '</dd></dl></div><div class="pv-parties"><div><p>' + esc(c ? c.display : "") + "</p><p>" + esc(a ? a.street : "") + "</p><p>" + esc(a ? a.city + ", " + a.state + " " + a.zip : "") + '</p><p class="pv-phone">' + esc(c && c.phones[0] ? c.phones[0].number : "") + '</p></div><div><h6>CONTACT US</h6><p>100 Main St</p><p>Riverton, NY 10990</p><p class="pv-phone">(555) 010-0100</p><p>hello@demoplumbing.example</p></div></div><h3>INVOICE</h3>' + rows("Services", i.services) + rows("Materials", i.materials) +
      '<dl class="pv-sum"><dt>Subtotal</dt><dd>' + money(total(i)) + "</dd><dt>Job Total</dt><dd>" + money(total(i)) + '</dd><dt class="big">Amount Due</dt><dd class="big">' + money(due(i)) + '</dd></dl>' + history + '<p class="pv-terms">See our <a data-go="app-settings/company" href="#">Terms &amp; Conditions</a></p><p class="pv-foot">' + esc(D.company) + " | License PL-000000 · demoplumbing.example</p></article></div>";
  }
  // ---------- payment window ----------
  const OTHER = ["Homeowner financing", "Warranty work", "e-Transfer", "Other credit card processor", "Other payment type"];
  function renderPay() {
    const el = document.getElementById("modal");
    const p = ui.pay;
    if (!p) { el.hidden = true; el.innerHTML = ""; return; }
    const note = '<label class="pay-f"><input data-pay="note" value="' + esc(p.note) + '" placeholder="Payment note" aria-label="Payment note"></label>';
    const body = p.tab === "Card"
      ? '<div class="pay-card"><input disabled placeholder="Name on card" aria-label="Name on card"><input disabled placeholder="Card number" aria-label="Card number"><div><input disabled placeholder="Expiration (MM/YY)" aria-label="Expiration"><input disabled placeholder="CVC" aria-label="CVC"><input disabled placeholder="Postal code" aria-label="Postal code"></div></div><label class="check pay-save"><input type="checkbox" disabled> Save card on file</label><p class="pay-consent">You acknowledge that you have received written or verbal consent from the cardholder to save and charge the card listed above.</p><p class="pay-total">Total: ' + money(Number(p.amount) || 0) + "</p>"
      : p.tab === "Other"
        ? '<div class="pay-radios">' + OTHER.map((o) => '<label><input type="radio" name="payOther" data-pay="other" value="' + o + '"' + (p.other === o ? " checked" : "") + "> " + o + "</label>").join("") + "</div>" + note
        : note;
    const action = p.tab === "Card" ? "Charge card" : "Paid - " + p.tab.toLowerCase();
    el.hidden = false;
    el.innerHTML = '<div class="dialog pay" role="dialog" aria-modal="true" aria-labelledby="payTitle"><h2 id="payTitle">Payment</h2><div class="pay-body"><div class="pay-top"><label class="pay-f"><span>Amount</span><em>$</em><input id="payAmount" data-pay="amount" inputmode="decimal" value="' + esc(p.amount) + '"></label><label class="pay-f"><span>Email receipt</span><input data-pay="email" value="' + esc(p.email) + '"></label></div><div class="pay-tabs" role="tablist">' + ["Card", "Cash", "Check", "Other"].map((t) => '<button role="tab" aria-selected="' + (p.tab === t) + '" class="' + (p.tab === t ? "on" : "") + '" data-pay-tab="' + t + '">' + t + "</button>").join("") + "</div>" + body + '<div class="pay-foot"><label class="check"><input type="checkbox" data-pay="notify"' + (p.notify ? " checked" : "") + '> Notify customer</label><span></span><button class="pill outline" data-pay-cancel>Cancel</button><button class="pill" data-pay-submit>' + action + "</button></div></div></div>";
  }
  function submitPay() {
    const p = ui.pay;
    if (p.tab === "Card") { toast("Card payments are off in the sandbox. Use Cash, Check or Other"); return; }
    if (p.tab === "Other" && !p.other) { toast("Pick a payment type first"); return; }
    const inv = invoices().find((x) => String(x.id) === String(p.id));
    const amount = Number(p.amount);
    if (!(amount > 0) || amount > due(inv) + 0.001) { toast("Enter an amount up to " + money(due(inv))); return; }
    const nd = new Date();
    inv.payments = (inv.payments || []).concat({ amount, type: p.tab === "Other" ? p.other : p.tab, note: p.note, date: nd.getFullYear() + "-" + String(nd.getMonth() + 1).padStart(2, "0") + "-" + String(nd.getDate()).padStart(2, "0"), time: nd.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) });
    if (due(inv) <= 0.001) inv.status = "Paid";
    HCP.save();
    ui.pay = null;
    renderPay();
    toast(money(amount) + " payment recorded" + (p.notify ? ". Customer notified (nothing is really sent)" : ""));
    HCP.render();
  }

  // ---------- send invoice window ----------
  function openSend(inv) {
    const c = cust(inv);
    const mobile = c && c.phones.find((x) => x.kind === "Mobile");
    ui.send = { id: inv.id, by: "Email", to: c && c.emails[0] ? c.emails[0] : "", phone: mobile ? mobile.number : "", subject: "Invoice " + inv.id + " due from " + D.company + " - " + money(due(inv)), message: "Hi " + (c ? c.first || c.display : "") + ",\n\nThank you for choosing " + D.company + ". Please see attached invoice due upon receipt." };
    renderSend();
  }
  const sendReady = () => {
    const p = ui.send;
    const email = p.by !== "Text";
    const text = p.by !== "Email";
    return (!email || (p.to.trim() && p.message.trim())) && (!text || p.phone.trim());
  };
  function renderSend() {
    const el = document.getElementById("modal");
    const p = ui.send;
    if (!p) { el.hidden = true; el.innerHTML = ""; return; }
    const field = (key, label, required) => '<label class="pay-f send-f' + (p[key] ? " filled" : "") + '"><span>' + label + (required ? '<b class="send-star"> *</b>' : "") + '</span><input data-send="' + key + '" value="' + esc(p[key]) + '" aria-label="' + label + '"></label>';
    const email = field("to", "To", p.by === "Email" || p.by === "Email & Text") + field("subject", "Subject") + '<label class="pay-f send-f filled send-msg"><span>Message *</span><textarea data-send="message" aria-label="Message">' + esc(p.message) + '</textarea></label><div class="send-att"><small>Attachments</small>invoice-' + p.id + ".pdf</div>";
    const text = field("phone", "To", true) + '<p class="send-note">Invoice due from ' + esc(D.company) + "</p>";
    el.hidden = false;
    el.innerHTML = '<div class="dialog pay send" role="dialog" aria-modal="true" aria-labelledby="sendTitle"><h2 id="sendTitle">Send invoice</h2><div class="pay-body"><div class="send-by"><span>Send by</span>' + ["Email", "Text", "Email & Text"].map((o) => '<label><input type="radio" name="sendBy" data-send-by="' + o + '"' + (p.by === o ? " checked" : "") + "> " + o + "</label>").join("") + "</div>" + (p.by === "Text" ? text : p.by === "Email" ? email : email + field("phone", "To", true)) + '</div><div class="send-foot"><button class="pill outline" data-send-cancel>Cancel</button><button class="pill' + (sendReady() ? "" : " off") + '" id="sendGo" data-send-go' + (sendReady() ? "" : " disabled") + ">Send</button></div></div>";
  }
  function submitSend() {
    const p = ui.send;
    const inv = invoices().find((x) => String(x.id) === String(p.id));
    const d = new Date();
    inv.sent = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

    ui.send = null;
    renderSend();
    toast("Invoice sent (nothing is really sent)");
    HCP.render();
  }

  HCP.onClick((e) => {
    const t = (s) => e.target.closest(s);
    let b;
    if ((b = t("[data-inv-send]"))) { openSend(invoices().find((x) => String(x.id) === b.dataset.invSend)); return true; }
    if (t("[data-send-cancel]")) { ui.send = null; renderSend(); return true; }
    if (t("[data-send-go]")) { submitSend(); return true; }
    if ((b = t("[data-inv-pay]"))) {
      const inv = invoices().find((x) => String(x.id) === b.dataset.invPay);
      ui.pay = { id: inv.id, tab: "Card", amount: due(inv).toFixed(2), email: "", note: "", other: "", notify: true };
      renderPay();
      return true;
    }
    if ((b = t("[data-pay-tab]"))) { ui.pay.tab = b.dataset.payTab; renderPay(); return true; }
    if (t("[data-pay-cancel]")) { ui.pay = null; renderPay(); return true; }
    if (t("[data-pay-submit]")) { submitPay(); return true; }
    if (t("[data-inv-actions]")) { ui.actions = !ui.actions; HCP.render(); return true; }
    if ((b = t("[data-inv-sel]"))) { const id = Number(b.dataset.invSel); if (b.checked) sel.add(id); else sel.delete(id); e.stopPropagation(); return true; }
    if (t("[data-inv-bulk]")) {
      ui.actions = false;
      if (!sel.size) { toast("Tick the invoices to send first"); HCP.render(); return true; }
      const d = new Date(); const day = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      invoices().filter((x) => sel.has(x.id)).forEach((x) => (x.sent = day));
      toast(sel.size + " invoice" + (sel.size > 1 ? "s" : "") + " sent (nothing is really sent)"); sel.clear(); HCP.save(); HCP.render(); return true;
    }
    if ((b = t("[data-inv-tab]"))) { ui.tab = b.dataset.invTab; HCP.render(); return true; }
    if (t("[data-inv-promo]")) { ui.promo = false; HCP.render(); return true; }
    if (t("[data-inv-tip]")) { ui.tip = false; HCP.render(); return true; }
    return false;
  });
  document.addEventListener("input", (e) => {
    const sk = e.target.dataset && e.target.dataset.send;
    if (sk && ui.send) {
      ui.send[sk] = e.target.value;
      e.target.parentElement.classList.toggle("filled", !!e.target.value);
      const go = document.getElementById("sendGo");
      go.disabled = !sendReady();
      go.classList.toggle("off", !sendReady());
      return;
    }
    if (e.target.dataset && e.target.dataset.sendBy && ui.send) { ui.send.by = e.target.dataset.sendBy; renderSend(); return; }
    const k = e.target.dataset && e.target.dataset.pay;
    if (k && ui.pay) { if (e.target.type === "radio" && !e.target.checked) return; ui.pay[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value; return; }
    if (e.target.matches("[data-inv-query]")) { ui.query = e.target.value; document.getElementById("invRows").innerHTML = tableRows(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && ui.pay) { ui.pay = null; renderPay(); }
    if (e.key === "Escape" && ui.send) { ui.send = null; renderSend(); }
  });
  Object.assign(HCP.views, { invoices: renderList, invoice: renderInvoice });
  Object.assign(HCP.navFor, { invoice: "invoices" });
  HCP.afterRender.push(() => {
    const p = document.getElementById("page");
    p.classList.toggle("inv-page", HCP.view === "invoices");
    p.classList.toggle("iv-page", HCP.view === "invoice");
  });
  HCP.onReset.push(() => { Object.assign(ui, freshUi()); renderPay(); renderSend(); });
});
