<script>
// Job page actions: OMW, Start, Finish, Invoice, Pay, Undo, and the editors on the job page.
// Payment and Send invoice reuse the windows in invoices.js (laid out from the live windows).
// Labels on the small editing windows are ours where the live window was not mapped; see the build notes.
window.HCP_MODULES = window.HCP_MODULES || [];
window.HCP_MODULES.push(function (HCP) {
  const { esc, toast } = HCP;
  const D = HCP.data;
  const S = () => HCP.sched;
  const job = () => HCP.state.jobs.find((x) => String(x.id) === String(HCP.viewArg));
  const cust = (j) => HCP.state.customers.find((c) => c.id === j.customerId);
  const money = (n) => "$" + Number(n || 0).toFixed(2);
  const nowM = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const log = (j, text, icon) => { (j.events = j.events || []).push({ text, icon, date: S().today(), m: nowM() }); };
  const stampNow = (j, key) => { j.live = true; const d = new Date(); (j.stamps = j.stamps || {})[key] = d.toDateString().slice(0, 10).replace(" ", ", ") + "<br>" + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); };
  const modal = () => document.getElementById("modal");
  let edit = null;

  function invoiceFor(j) {
    let inv = HCP.state.invoices.find((x) => x.id === j.id);
    if (!inv) { inv = { id: j.id, customerId: j.customerId, status: "Open", due: null, sent: null, services: [], materials: [] }; HCP.state.invoices.unshift(inv); }
    inv.services = JSON.parse(JSON.stringify(j.services));
    inv.materials = JSON.parse(JSON.stringify(j.materials));
    inv.discount = Number(j.discount || 0);
    return inv;
  }
  function fire(attr, id) {
    const b = document.createElement("button");
    b.setAttribute(attr, String(id));
    b.hidden = true;
    document.body.appendChild(b);
    b.click();
    b.remove();
  }

  // ---------- small editing window ----------
  function open(kind, title, body, okLabel) {
    edit = { kind };
    const el = modal();
    el.hidden = false;
    el.innerHTML = '<div class="dialog pay ja" role="dialog" aria-modal="true" aria-labelledby="jaTitle"><h2 id="jaTitle">' + esc(title) + '</h2><div class="pay-body">' + body + '</div><div class="send-foot"><button class="pill outline" data-ja-cancel>Cancel</button><button class="pill" data-ja-ok>' + esc(okLabel || "Save") + "</button></div></div>";
    const f = el.querySelector("input, select, textarea");
    if (f) f.focus();
  }
  function close() { edit = null; const el = modal(); el.hidden = true; el.innerHTML = ""; }
  // Leaving the page (Back button, a link) closes this window so it never acts on the wrong record.
  HCP.afterRender.push(() => { if (edit && HCP.view !== "job") close(); });
  const val = (k) => { const e = modal().querySelector('[data-ja="' + k + '"]'); return e ? (e.type === "checkbox" ? e.checked : e.value) : ""; };
  const field = (k, label, v, type) => '<label class="pay-f send-f filled"><span>' + label + '</span><input data-ja="' + k + '" type="' + (type || "text") + '" value="' + esc(v == null ? "" : v) + '" aria-label="' + label + '"></label>';
  const area = (k, label, v) => '<label class="pay-f send-f filled send-msg"><span>' + label + '</span><textarea data-ja="' + k + '" aria-label="' + label + '">' + esc(v || "") + "</textarea></label>";
  const select = (k, label, opts, v) => '<label class="pay-f send-f filled"><span>' + label + '</span><select data-ja="' + k + '" aria-label="' + label + '">' + opts.map((o) => '<option' + (o === v ? " selected" : "") + ">" + esc(o) + "</option>").join("") + "</select></label>";

  const TERMS = ["Upon receipt", "Net 3", "Net 5", "Net 7", "Net 10", "Net 14", "Net 15", "Net 20", "Net 30", "Net 40", "Net 45", "Net 60", "Net 90"];
  const LINK = { "Service Price Book": "price-book", "Material Price Book": "price-book", Estimate: "new-estimate" };
  const EXT = {
    "Made for you": "the Made for you suggestions", Commissions: "the commissions card", "Job inputs": "the job inputs card", "Job costing breakdown": "the job costing breakdown",
    "Photo reports": "the photo report builder", Attachments: "your computer's file picker", Checklists: "the checklist picker", Tasks: "the task form",
    Location: "the location sharing setting", "Job options": "the job options menu", "Payment methods": "the payment method actions",
  };

  function act(name, b) {
    const j = job();
    if (!j) return false;
    const c = cust(j);
    const inv = HCP.state.invoices.find((x) => x.id === j.id);
    if (LINK[name]) { HCP.go(LINK[name]); return true; }
    if (EXT[name]) { toast("In Housecall Pro this opens " + EXT[name] + ". The practice copy stays here."); return true; }
    switch (name) {
      case "OMW":
        if (j.status !== "Scheduled") { toast("OMW is for a scheduled job that hasn't started"); return true; }
        open("omw", "On my way", '<p>Let ' + esc(c ? c.display : "the customer") + " know you're on the way.</p>" + '<label class="check"><input type="checkbox" data-ja="notify"' + (c && c.notify ? " checked" : "") + "> Notify customer</label>", "OMW");
        return true;
      case "Start":
        if (j.status === "Completed") { toast("This job is already finished"); return true; }
        if (j.status === "In Progress") { toast("This job is already started"); return true; }
        j.status = "In Progress"; stampNow(j, "Start"); log(j, "Job started", "play"); HCP.save(); HCP.render(); return true;
      case "Finish":
        if (j.status !== "In Progress") { toast("Start the job before you finish it"); return true; }
        j.status = "Completed"; stampNow(j, "Finish"); log(j, "Job finished", "stop"); HCP.save(); HCP.render(); return true;
      case "Invoice":
      case "Send invoice":
        if (name === "Invoice" && j.status !== "Completed") { toast("Finish the job before you invoice it"); return true; }
        invoiceFor(j); HCP.save(); fire("data-inv-send", j.id); return true;
      case "Pay": {
        const i = invoiceFor(j); HCP.save();
        if (i.status === "Paid") { toast("This invoice is paid"); return true; }
        fire("data-inv-pay", j.id); return true;
      }
      case "Undo": {
        if (inv && inv.status === "Paid") { toast("Payments are removed from the invoice, not with Undo"); return true; }
        if (j.status === "Completed" && inv && inv.sent) { inv.sent = null; delete (j.stamps || {}).Invoice; log(j, "Invoice send undone", "send"); }
        else if (j.status === "Completed") { j.status = "In Progress"; delete (j.stamps || {}).Finish; log(j, "Finish undone", "stop"); }
        else if (j.status === "In Progress") { j.status = "Scheduled"; delete (j.stamps || {}).Start; log(j, "Start undone", "play"); }
        else if (j.omw) { j.omw = false; delete (j.stamps || {}).OMW; log(j, "On my way undone", "truck"); }
        HCP.save(); HCP.render(); return true;
      }
      case "Edit team":
        if (!j.appt) { toast("Schedule the job first, then add the team"); return true; }
        open("team", "Edit team", D.team.map((e) => '<label class="check"><input type="checkbox" data-ja-team="' + e.id + '"' + (j.appt.team.includes(e.id) ? " checked" : "") + "> " + esc(e.name) + "</label>").join(""));
        return true;
      case "Add service":
      case "Add material": {
        const kind = name === "Add service" ? "service" : "material";
        const items = D.priceBook.filter((p) => p.kind === kind);
        open("add-" + kind, name, select("item", "Price book item", items.map((p) => p.name), items[0].name) + field("qty", "Quantity", 1, "number"), "Add");
        return true;
      }
      case "Edit service":
      case "Edit material": {
        const key = name === "Edit service" ? "services" : "materials";
        const idx = Number(b.dataset.li);
        const r = j[key][idx];
        if (!r) return true;
        edit = null;
        open("line", name, field("name", "Name", r.name) + field("qty", "Quantity", r.qty, "number") + field("price", "Unit price", r.price, "number") + area("desc", "Description", r.description) + '<label class="check"><input type="checkbox" data-ja="remove"> Remove this line</label>');
        edit.key = key; edit.idx = idx;
        return true;
      }
      case "Add discount": open("discount", "Add discount", field("amount", "Discount ($)", j.discount || "", "number")); return true;
      case "Add deposit": open("deposit", "Add deposit", field("amount", "Deposit ($)", j.deposit || "", "number")); return true;
      case "Private notes": open("notes", "Private notes", area("text", "Add a private note here", j.notes)); return true;
      case "Summary of work": open("summary", "Summary of work", area("text", "Summary of work", j.summary)); return true;
      case "Invoice message": open("invmsg", "Invoice message", area("text", "Message on this invoice", j.invMsg)); return true;
      case "Invoice due date": open("terms", "Due", select("terms", "Payment terms", TERMS, j.terms || "Upon receipt")); return true;
      case "Auto invoice": j.autoInv = !j.autoInv; HCP.save(); HCP.render(); toast("Auto invoice " + (j.autoInv ? "on" : "off") + " for this job"); return true;
      case "Job tags": open("tags", "Job tags", field("tags", "Tags (comma between tags)", (j.tags || []).join(", "))); return true;
      case "Lead source": open("lead", "Lead source", select("lead", "Lead source", [""].concat(D.leadSources), j.lead || "")); return true;
      case "Job name": open("name", "Job name", field("name", "Job name", j.name || "")); return true;
      case "View details": if (c) HCP.go("customer/" + c.id); return true;
      case "Edit address":
        if (!c) return true;
        open("addr", "Service address", select("addr", "Address", c.addresses.map((a) => a.street + (a.unit ? ", " + a.unit : "") + ", " + a.city), (() => { const a = c.addresses.find((x) => x.id === j.addressId); return a ? a.street + (a.unit ? ", " + a.unit : "") + ", " + a.city : ""; })()));
        return true;
    }
    return false;
  }

  function save() {
    const j = job();
    if (!j) { close(); return; }
    const c = cust(j);
    const k = edit.kind;
    if (k === "omw") { j.omw = true; stampNow(j, "OMW"); log(j, "Job on my way", "truck"); if (val("notify") && c && c.phones[0]) log(j, "On my way SMS sent to " + c.phones[0].number, "bubble"); }
    if (k === "team") { j.appt.team = [...modal().querySelectorAll("[data-ja-team]")].filter((x) => x.checked).map((x) => x.dataset.jaTeam); }
    if (k === "add-service" || k === "add-material") {
      const kind = k.slice(4); const p = D.priceBook.find((x) => x.kind === kind && x.name === val("item")); const q = Math.max(1, Number(val("qty")) || 1);
      j[kind === "service" ? "services" : "materials"].push({ name: p.name, description: p.description, qty: q, price: p.price });
    }
    if (k === "line") {
      const list = j[edit.key];
      if (val("remove")) list.splice(edit.idx, 1);
      else Object.assign(list[edit.idx], { name: val("name") || list[edit.idx].name, qty: Math.max(0, Number(val("qty")) || 0), price: Math.max(0, Number(val("price")) || 0), description: val("desc") });
    }
    if (k === "discount") j.discount = Math.max(0, Number(val("amount")) || 0);
    if (k === "deposit") j.deposit = Math.max(0, Number(val("amount")) || 0);
    if (k === "notes") j.notes = val("text");
    if (k === "summary") j.summary = val("text");
    if (k === "invmsg") j.invMsg = val("text");
    if (k === "terms") j.terms = val("terms");
    if (k === "tags") j.tags = val("tags").split(",").map((t) => t.trim()).filter(Boolean);
    if (k === "lead") j.lead = val("lead");
    if (k === "name") j.name = val("name").trim();
    if (k === "addr") { const a = c.addresses.find((x) => x.street + (x.unit ? ", " + x.unit : "") + ", " + x.city === val("addr")); if (a) j.addressId = a.id; }
    const inv = HCP.state.invoices.find((x) => x.id === j.id);
    if (inv && inv.status !== "Paid") invoiceFor(j);
    close();
    HCP.save();
    HCP.render();
  }

  HCP.onClick((e) => {
    const t = (s) => e.target.closest(s);
    let b;
    if (t("[data-ja-cancel]")) { close(); return true; }
    if (t("[data-ja-ok]")) { save(); return true; }
    if (HCP.view !== "job") return false;
    if ((b = t("[data-job-act]"))) return act(b.dataset.jobAct, b);
    if ((b = t("[data-soon]")) && b.closest("#page")) return act(b.dataset.soon, b);
    return false;
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && edit) close(); });
  // Marks the Invoice step done once the invoice is sent, and logs it on the job.
  HCP.afterRender.push(() => {
    if (HCP.view !== "job") return;
    const j = job(); if (!j) return;
    const inv = HCP.state.invoices.find((x) => x.id === j.id);
    if (!j.seeded) { j.seeded = true; j.stamps = j.stamps || {}; if (inv && inv.sent) j.stamps.Invoice = j.stamps.Invoice || "Sent"; if (inv && inv.status === "Paid") j.stamps.Pay = j.stamps.Pay || "Paid"; }
    if (inv && inv.sent && !(j.stamps || {}).Invoice) { stampNow(j, "Invoice"); log(j, "Invoice sent", "send"); HCP.save(); HCP.render(); }
    if (inv && inv.status === "Paid" && !(j.stamps || {}).Pay) { stampNow(j, "Pay"); log(j, "Payment recorded", "card"); HCP.save(); HCP.render(); }
  });
  HCP.onReset.push(() => { edit = null; });
});

    switch (name) {
      case "Schedule":
        open("sched", "Schedule estimate", field("date", "Date", e.visit ? e.visit.date : ymd(new Date()), "date") + field("from", "From", e.visit ? e.visit.from : "09:00", "time") + field("to", "To", e.visit ? e.visit.to : "11:00", "time") + select("emp", "Employee", D.team.map((m) => m.name), (D.team.find((m) => m.id === e.assignee) || D.team[0]).name), "Schedule");
        return true;
      case "OMW":
        if (e.status !== "Scheduled") { toast("OMW is for a scheduled estimate visit"); return true; }
        open("omw", "On my way", "<p>Let " + esc(c ? c.display : "the customer") + " know you're on the way.</p>" + '<label class="check"><input type="checkbox" data-ea="notify"' + (c && c.notify ? " checked" : "") + "> Notify customer</label>", "OMW");
        return true;
      case "Finish":
        if (e.status !== "In Progress") { toast("Tap OMW before you finish the visit"); return true; }
        e.status = "Completed"; e.updated = ymd(new Date()); stamp(e, "Finish"); log(e, "Estimate visit finished", "stop"); HCP.save(); HCP.render(); return true;
      case "Send":
      case "Send and present estimate": {
        if (!e.services.length && !e.materials.length) { toast("Add a service or material before you send"); return true; }
        const mobile = c && c.phones.find((p) => p.kind === "Mobile");
        open("send", "Send estimate", radios("by", ["Email", "Text", "Email & Text"], "Email") + field("to", "To (email)", c && c.emails[0] ? c.emails[0] : "") + field("phone", "To (mobile)", mobile ? mobile.number : "") + area("msg", "Message", "Hi " + (c ? c.first || c.display : "") + ",\n\nHere is your estimate from " + D.company + ". You can review and approve it online."), "Send");
        return true;
      }
      case "Approval":
        if (!sent) { toast("Send the estimate before you mark the customer's answer"); return true; }
        open("approve", "Customer answer", radios("ans", ["Approved", "Declined"], e.status === "Rejected" ? "Declined" : "Approved") + "<p>Use this when the customer said yes or no by phone or in person.</p>", "Save");
        return true;
      case "Copy to job": {
        if (e.jobId) { HCP.go("job/" + e.jobId); return true; }
        const multi = e.approve === "Multiple options";
        open("copy", "Copy to job", "<p>This copies the line items, customer and lead source on estimate #" + e.id + " to a new job.</p>", multi ? "Approve and copy" : "Copy");
        return true;
      }
      case "__copy": {
        const id = Math.max(...HCP.state.jobs.map((j) => j.id)) + 1;
        const a = c && (c.addresses.find((x) => x.id === e.addressId) || c.addresses[0]);
        HCP.state.jobs.unshift({ id, customerId: e.customerId, addressId: a ? a.id : "", status: "Not scheduled", appt: null, jobType: "", unit: "Plumbing", lead: e.lead || "", tags: [], notes: "Copied from estimate #" + e.id, services: JSON.parse(JSON.stringify(e.services)), materials: JSON.parse(JSON.stringify(e.materials)), discount: e.discount || 0, created: ymd(new Date()) });
        if (e.approve === "Multiple options" && e.status !== "Approved") { e.status = "Approved"; log(e, "Estimate approved", "check"); }
        e.jobId = id; log(e, "Copied to job #" + id, "clipboard"); HCP.save(); toast("Copied to job #" + id); HCP.go("job/" + id); return true;
      }
      case "Expiration date": open("exp", "Expiration date", field("exp", "Expiration date", e.expires)); return true;
      case "Approval option": open("appr", "Customer can approve", select("appr", "Customer can approve", ["Only one option", "Multiple options"], e.approve || "Only one option")); return true;
      case "Edit team": open("team", "Assigned to", select("emp", "Employee", D.team.map((m) => m.name), (D.team.find((m) => m.id === e.assignee) || D.team[0]).name)); return true;
      case "Add service":
      case "Add material": {
        const kind = name === "Add service" ? "service" : "material";
        const items = D.priceBook.filter((p) => p.kind === kind);
        open("add-" + kind, name, select("item", "Price book item", items.map((p) => p.name), items[0].name) + field("qty", "Quantity", 1, "number"), "Add");
        return true;
      }
      case "Edit service":
      case "Edit material": {
        const key = name === "Edit service" ? "services" : "materials";
        const idx = Number(b.dataset.li);
        const r = e[key][idx];
        if (!r) return true;
        open("line", name, field("name", "Name", r.name) + field("qty", "Quantity", r.qty, "number") + field("price", "Unit price", r.price, "number") + area("desc", "Description", r.description) + '<label class="check"><input type="checkbox" data-ea="remove"> Remove this line</label>');
        edit.key = key; edit.idx = idx;
        return true;
      }
      case "Add discount": open("discount", "Add discount", field("amount", "Discount ($)", e.discount || "", "number")); return true;
      case "Add deposit": open("deposit", "Add deposit", field("amount", "Deposit ($)", e.deposit || "", "number")); return true;
      case "Private notes": open("notes", "Private notes", area("text", "Add a private note here", e.notes)); return true;
      case "Estimate tags": open("tags", "Estimate tags", field("tags", "Tags (comma between tags)", (e.tags || []).join(", "))); return true;
      case "View details": if (c) HCP.go("customer/" + c.id); return true;
      case "Edit address": {
        if (!c) return true;
        const lab = (a) => a.street + (a.unit ? ", " + a.unit : "") + ", " + a.city;
        const cur = c.addresses.find((x) => x.id === e.addressId) || c.addresses[0];
        open("addr", "Service address", select("addr", "Address", c.addresses.map(lab), cur ? lab(cur) : ""));
        return true;
      }
    }
    return false;
  }

  function save() {
    const e = est();
    if (!e) { close(); return; }
    const c = cust(e);
    const k = edit.kind;
    const radio = (key) => { const r = modal().querySelector('[data-ea-r="' + key + '"]:checked'); return r ? r.value : ""; };
    if (k === "copy") { close(); act("__copy"); return; }
    if (k === "sched") {
      if (!val("date")) { toast("Pick a date"); return; }
      e.visit = { date: val("date"), from: val("from"), to: val("to") };
      const m = D.team.find((x) => x.name === val("emp")); if (m) e.assignee = m.id;
      if (!SENT.includes(e.status)) e.status = "Scheduled";
      const fmtT = (t) => { const [h, m] = t.split(":").map(Number); return ((h % 12) || 12) + ":" + String(m).padStart(2, "0") + " " + (h < 12 ? "AM" : "PM"); };
      const sd = new Date(val("date") + "T12:00:00");
      stamp(e, "Schedule", sd.toDateString().slice(0, 3) + ", " + sd.toDateString().slice(4, 10) + ", " + sd.getFullYear() + "<br>" + fmtT(val("from")) + " - " + fmtT(val("to")) + " EST"); log(e, "Estimate scheduled for " + val("date"), "calendar");
    }
    if (k === "omw") { e.status = "In Progress"; stamp(e, "OMW"); log(e, "Estimate on my way", "truck"); if (val("notify") && c && c.phones[0]) log(e, "On my way SMS sent to " + c.phones[0].number, "bubble"); }
    if (k === "send") {
      const by = radio("by");
      if ((by !== "Text" && !val("to").trim()) || (by !== "Email" && !val("phone").trim())) { toast("Fill in where to send it"); return; }
      e.status = "Sent"; stamp(e, "Send"); log(e, "Estimate sent by " + by.toLowerCase() + " (nothing is really sent)", "send"); toast("Estimate sent (nothing is really sent)");
    }
    if (k === "approve") { const yes = radio("ans") === "Approved"; e.status = yes ? "Approved" : "Rejected"; log(e, yes ? "Estimate approved" : "Estimate declined", "check"); }
    if (k === "exp") e.expires = val("exp");
    if (k === "appr") e.approve = val("appr");
    if (k === "team") { const m = D.team.find((x) => x.name === val("emp")); if (m) e.assignee = m.id; }
    if (k === "add-service" || k === "add-material") {
      const kind = k.slice(4); const p = D.priceBook.find((x) => x.kind === kind && x.name === val("item")); const q = Math.max(1, Number(val("qty")) || 1);
      e[kind === "service" ? "services" : "materials"].push({ name: p.name, description: p.description, qty: q, price: p.price });
    }
    if (k === "line") {
      const list = e[edit.key];
      if (val("remove")) list.splice(edit.idx, 1);
      else Object.assign(list[edit.idx], { name: val("name") || list[edit.idx].name, qty: Math.max(0, Number(val("qty")) || 0), price: Math.max(0, Number(val("price")) || 0), description: val("desc") });
    }
    if (k === "discount") e.discount = Math.max(0, Number(val("amount")) || 0);
    if (k === "deposit") e.deposit = Math.max(0, Number(val("amount")) || 0);
    if (k === "notes") e.notes = val("text");
    if (k === "tags") e.tags = val("tags").split(",").map((t) => t.trim()).filter(Boolean);
    if (k === "addr") { const a = c.addresses.find((x) => x.street + (x.unit ? ", " + x.unit : "") + ", " + x.city === val("addr")); if (a) e.addressId = a.id; }
    e.updated = ymd(new Date());
    close();
    HCP.save();
    HCP.render();
  }

  HCP.onClick((ev) => {
    const t = (s) => ev.target.closest(s);
    let b;
    if (t("[data-ea-cancel]")) { close(); return true; }
    if (t("[data-ea-ok]")) { save(); return true; }
    if (HCP.view !== "estimate") return false;
    if ((b = t("[data-soon]")) && b.closest("#page")) return act(b.dataset.soon, b);
    return false;
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && edit) close(); });
  HCP.onReset.push(() => { edit = null; });
});

</script>
<script>
// Customer profile laid out from the live profile (Customers map, "Customer profile", Nov 12 2026).
// Card entry stays out of the practice copy on purpose: Add card and Request card only explain.
window.HCP_MODULES = window.HCP_MODULES || [];
window.HCP_MODULES.push(function (HCP) {
  const { svg, esc, toast } = HCP;
  const D = HCP.data;
  const ui = { tab: "Profile", promo: true, kebab: false, noteTab: "Customer", modal: null };
  const cust = () => HCP.state.customers.find((c) => c.id === HCP.viewArg);
  const money = (n) => "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const line = (a) => [a.street, a.unit, a.city, a.state, a.zip].filter(Boolean).join(", ");
  const invTotal = (i) => Math.max(0, i.services.concat(i.materials).reduce((n, r) => n + r.qty * r.price, 0) - Number(i.discount || 0));
  const paid = (i) => (i.status === "Paid" ? invTotal(i) : (i.payments || []).reduce((n, p) => n + p.amount, 0));
  const pad = (n) => String(n).padStart(2, "0");
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  const fmt = (s) => { if (!s) return "-"; const [y, m, d] = s.split("-").map(Number); return pad(m) + "/" + pad(d) + "/" + y; };
  const TERMS = ["Upon receipt", "Net 3", "Net 5", "Net 7", "Net 10", "Net 14", "Net 15", "Net 20", "Net 30", "Net 40", "Net 45", "Net 60", "Net 90"];

  const row = (label, icon, act, body) => '<div class="cp-row"><div class="cp-row-h"><i>' + svg(icon) + "</i><span>" + label + '</span><button class="icon-btn small plus" ' + act + ' aria-label="Add ' + label + '">' + svg("plus") + "</button></div>" + (body ? '<div class="cp-row-b">' + body + "</div>" : "") + "</div>";

  function notesSection(c) {
    const notes = (c.notesList || []).concat(c.notes ? [{ text: c.notes, kind: "Customer" }] : []);
    const shown = notes.filter((n) => ui.noteTab === "All" || n.kind === ui.noteTab);
    return '<section class="cp-card"><div class="cp-h"><h3>Private notes</h3><button class="pill outline" data-cp="note">+ Add customer note</button></div><div class="cp-seg">' + ["All", "Customer", "Leads", "Estimates", "Jobs"].map((t) => '<button class="' + (ui.noteTab === t ? "on" : "") + '" data-cp-note="' + t + '">' + t + "</button>").join("") + "</div>" +
      (shown.length ? shown.map((n) => '<p class="cp-note">' + esc(n.text) + "</p>").join("") : '<div class="cp-empty"><b>No customer notes</b><p class="x-muted">All notes added to this customer\'s profile will appear here.</p></div>') + "</section>";
  }
  function profileTab(c) {
    const jobs = HCP.state.jobs.filter((j) => j.customerId === c.id);
    const invs = HCP.state.invoices.filter((i) => i.customerId === c.id);
    const life = invs.reduce((n, i) => n + paid(i), 0);
    const owed = invs.filter((i) => i.status !== "Paid").reduce((n, i) => n + Math.max(0, invTotal(i) - paid(i)), 0);
    const mobile = c.phones[0];
    const upcoming = jobs.filter((j) => j.appt && j.appt.date >= today()).sort((a, b) => a.appt.date.localeCompare(b.appt.date));
    const feed = [];
    jobs.forEach((j) => { (j.events || []).forEach((e) => feed.push([e.text, e.icon, "Job #" + j.id, e.date])); feed.push(["Job created", "wrench", "Job #" + j.id, j.created || (j.appt ? j.appt.date : "")]); });
    const left =
      '<section class="cp-card"><div class="cp-sum"><div><small>Created</small><b>' + fmt(c.created || "") + '</b></div><div><small>Lifetime value</small><b>' + money(life) + '</b></div><div><small>Outstanding balance</small><b>' + money(owed) + "</b></div></div></section>" +
      '<section class="cp-card"><div class="cp-h"><h3>Contact info</h3><button class="icon-btn small" data-cp="contact" aria-label="Edit contact info">' + svg("pencil") + "</button></div>" +
        '<small class="cp-lab">Contact</small><p>' + esc((c.first + " " + c.last).trim() || c.display) + "</p>" +
        (mobile ? '<small class="cp-lab">Phone</small><div class="cp-line"><span>' + esc(mobile.number) + '</span><button class="icon-btn small" data-go="calls" aria-label="Call">' + svg("phone") + '</button><button class="icon-btn small" data-go="chats" aria-label="Text">' + svg("bubble") + "</button></div>" : "") +
        (c.emails[0] ? '<small class="cp-lab">Email</small><p>' + esc(c.emails[0]) + "</p>" : "") +
        '<div class="cp-line"><span>Customer portal</span><button class="pill outline small-pill" data-cp="portal">' + (c.portalSent ? "Resend invite" : "Send invite") + "</button></div></section>" +
      (ui.promo ? '<section class="cp-card cp-ai"><i>' + svg("sparkle") + '</i><h3>Manage customer calls with AI</h3><p>With CSR AI, answer customer calls whether you\'re on the job or off the clock.</p><div class="cp-line"><button class="pill cl-purple" data-go="ai-team">Learn more</button><button class="icon-btn small" data-cp="promo" aria-label="Close">' + svg("close") + "</button></div></section>" : "") +
      '<section class="cp-card"><h3>Payment method</h3><p class="cp-empty-t">Wallet is empty</p><p class="x-muted">Save a card to automatically charge completed jobs</p><div class="cp-line"><button class="pill outline" data-x-ext="the add card form (the practice copy never takes card numbers)">+ Add card</button><button class="pill outline" data-x-ext="the card request text to the customer">Request card</button></div></section>' +
      '<section class="cp-card"><h3>Payment terms</h3><p class="x-muted">How this customer is expected to pay. Applies to all new invoices for ' + esc(c.first || c.display) + '.</p><label class="cp-line"><span>Set custom terms for this customer</span>' + '<input type="checkbox" data-cp-terms' + (c.terms ? " checked" : "") + ' aria-label="Set custom terms"></label>' + (c.terms ? '<select data-cp-termsel aria-label="Payment terms">' + TERMS.map((t) => "<option" + (t === c.terms ? " selected" : "") + ">" + t + "</option>").join("") + "</select>" : "") + "</section>" +
      '<section class="cp-card"><h3><i>' + svg("megaphone") + "</i> Communication preferences</h3>" + '<div class="cp-line"><span>Notifications enabled</span><button class="link" data-cp="notify">' + (c.notify ? "Yes" : "No") + '</button></div><div class="cp-line"><span>Text message consent</span>' + (c.notify ? '<span class="x-chip green">Opted-in</span>' : '<span class="x-chip">Opted-out</span>') + "</div></section>" +
      row("Customer tags", "tag", 'data-cp="tags"', c.tags.map((t) => '<span class="tag">' + esc(t) + "</span>").join("")) +
      row("Attachments", "attach", 'data-x-ext="your computer\'s file picker"', "") +
      row("Lead source", "target", 'data-cp="lead"', esc(c.lead || "")) +
      row("Auto invoice", "invoice", 'data-cp="autoinv"', c.autoInv ? "On" : "");
    const right =
      '<section class="cp-card"><h3>Upcoming appointments</h3>' + (upcoming.length ? '<table class="cp-t"><thead><tr><th>Date</th><th>Time</th><th>Work</th><th>Employee</th></tr></thead><tbody>' + upcoming.map((j) => "<tr><td>" + fmt(j.appt.date) + "</td><td>" + esc(HCP.sched.text(j).split("· ")[1] || "") + '</td><td><button class="link" data-go="job/' + j.id + '">Job #' + j.id + " - " + esc(j.name || (j.services[0] && j.services[0].name) || "") + "</button></td><td>" + esc(HCP.sched.team(j)) + "</td></tr>").join("") + "</tbody></table>" : '<p class="x-muted">No upcoming appointments</p>') + "</section>" +
      row("Tasks", "clipboard", 'data-x-ext="the task form"', "") +
      '<section class="cp-card"><div class="cp-map">Map isn\'t in the practice copy</div><div class="cp-h"><h3>' + c.addresses.length + " address" + (c.addresses.length === 1 ? "" : "es") + '</h3><button class="icon-btn small" data-cp="addr" aria-label="Add address">' + svg("plus") + "</button></div>" + c.addresses.map((a) => '<div class="cp-line"><span>' + esc(line(a)) + (c.billingAddr === a.id ? ' <span class="x-muted">(Billing address)</span>' : "") + '</span><button class="icon-btn small" data-x-ext="the address menu" aria-label="Address options">' + svg("dots") + "</button></div>").join("") + "</section>" +
      notesSection(c) +
      '<section class="cp-card"><h3>Activity feed</h3>' + (feed.length ? feed.map((f) => '<div class="feed-row"><i>' + svg(f[1]) + "</i><span>" + esc(f[0]) + '<br><small>' + esc(f[2]) + " · " + fmt(f[3]) + "</small></span></div>").join("") : '<p class="x-muted">No activity yet</p>') + "</section>";
    return '<div class="cp-grid"><div class="cp-left">' + left + '</div><div class="cp-right">' + right + "</div></div>";
  }
  function listTab(c, tab) {
    if (tab === "Jobs") { const l = HCP.state.jobs.filter((j) => j.customerId === c.id); return '<section class="cp-card">' + (l.length ? '<table class="cp-t"><thead><tr><th>Job #</th><th>Status</th><th>Schedule</th></tr></thead><tbody>' + l.map((j) => '<tr class="row" data-go="job/' + j.id + '"><td>' + j.id + "</td><td>" + esc(j.status) + "</td><td>" + esc(HCP.sched.text(j) || "-") + "</td></tr>").join("") + "</tbody></table>" : '<p class="x-muted">No jobs</p>') + "</section>"; }
    if (tab === "Estimates") { const l = HCP.state.estimates.filter((e) => e.customerId === c.id); return '<section class="cp-card">' + (l.length ? '<table class="cp-t"><thead><tr><th>Estimate #</th><th>Status</th></tr></thead><tbody>' + l.map((e) => '<tr class="row" data-go="estimate/' + e.id + '"><td>' + e.id + "</td><td>" + esc(e.status) + "</td></tr>").join("") + "</tbody></table>" : '<p class="x-muted">No estimates</p>') + "</section>"; }
    if (tab === "Invoices") { const l = HCP.state.invoices.filter((i) => i.customerId === c.id); return '<section class="cp-card">' + (l.length ? '<table class="cp-t"><thead><tr><th>Invoice #</th><th>Status</th><th>Amount</th></tr></thead><tbody>' + l.map((i) => '<tr class="row" data-go="invoice/' + i.id + '"><td>' + i.id + "</td><td>" + esc(i.status) + "</td><td>" + money(invTotal(i)) + "</td></tr>").join("") + "</tbody></table>" : '<p class="x-muted">No invoices</p>') + "</section>"; }
    if (tab === "Leads") return '<section class="cp-card"><p class="x-muted">No leads</p><button class="pill outline" data-go="new-lead">+ Lead</button></section>';
    if (tab === "Notes") return notesSection(c);
    return '<section class="cp-card"><div class="cp-empty"><b>No attachments</b><p class="x-muted">Files added to this customer will appear here.</p></div></section>';
  }
  function render() {
    const c = cust();
    if (!c) return '<div class="soon"><h1>Customer not found</h1></div>';
    const tabs = ["Profile", "Leads", "Estimates", "Jobs", "Invoices", "Attachments", "Notes"];
    return '<div class="cp"><header class="cp-head"><nav class="jp-crumb"><button class="crumb" data-go="customers">Customers</button><span>›</span><span>' + esc(c.display) + "</span></nav>" +
      '<div class="cp-title"><h1>' + esc(c.display) + (c.dns ? ' <span class="status s-dns">Do not service</span>' : "") + '</h1><div class="cp-btns"><button class="pill outline" data-x-ext="the add card form (the practice copy never takes card numbers)">+ Add card</button><button class="pill outline" data-x-ext="the card request text to the customer">Request card</button><span class="cp-div"></span><button class="pill outline" data-new-job-for="' + c.id + '">+ Job</button><button class="pill outline" data-go="new-estimate">+ Estimate</button><button class="pill outline" data-go="new-lead">+ Lead</button><button class="pill outline" data-go="service-plans">+ Service plan</button><button class="pill outline cp-ask" data-go="ai-team"><i>' + svg("sparkle") + '</i>Ask AI</button><span class="cp-kebab"><button class="icon-btn" data-cp="kebab" aria-label="More">' + svg("dots") + "</button>" + (ui.kebab ? '<div class="cl-menu"><button data-cp="delete">Delete customer</button></div>' : "") + "</span></div></div>" +
      '<div class="tabs cp-tabs" role="tablist">' + tabs.map((t) => '<button role="tab" aria-selected="' + (ui.tab === t) + '" class="' + (ui.tab === t ? "on" : "") + '" data-cp-tab="' + t + '">' + t + "</button>").join("") + "</div></header>" +
      (ui.tab === "Profile" ? profileTab(c) : listTab(c, ui.tab)) + "</div>";
  }

  // ---------- small windows ----------
  function open(kind, title, body, ok) {
    ui.modal = kind;
    const el = document.getElementById("modal");
    el.hidden = false;
    el.innerHTML = '<div class="dialog pay ja" role="dialog" aria-modal="true" aria-labelledby="cpT"><h2 id="cpT">' + esc(title) + '</h2><div class="pay-body">' + body + '</div><div class="send-foot"><button class="pill outline" data-cp-cancel>' + (kind === "delete" ? "Keep" : "Cancel") + '</button><button class="pill' + (kind === "delete" ? " cp-red" : "") + '" data-cp-ok>' + esc(ok || "Save") + "</button></div></div>";
    const f = el.querySelector("input, select, textarea"); if (f) f.focus();
  }
  function close() { ui.modal = null; const el = document.getElementById("modal"); el.hidden = true; el.innerHTML = ""; }
  const f = (k, label, v) => '<label class="pay-f send-f filled"><span>' + label + '</span><input data-cpf="' + k + '" value="' + esc(v || "") + '" aria-label="' + label + '"></label>';
  const v = (k) => { const x = document.querySelector('[data-cpf="' + k + '"]'); return x ? x.value.trim() : ""; };
  function save() {
    const c = cust(); const k = ui.modal;
    if (!c) { close(); return; }
    if (k === "contact") {
      c.first = v("first"); c.last = v("last"); c.display = v("display") || (c.first + " " + c.last).trim() || c.display; c.company = v("company");
      if (v("mobile")) { const m = c.phones.find((p) => p.kind === "Mobile"); if (m) m.number = v("mobile"); else c.phones.unshift({ kind: "Mobile", number: v("mobile"), note: "" }); }
      c.emails = v("email") ? [v("email")].concat(c.emails.slice(1)) : c.emails.slice(1);
    }
    if (k === "tags") c.tags = v("tags").split(",").map((t) => t.trim()).filter(Boolean);
    if (k === "lead") { const s = document.querySelector("[data-cpf-sel]"); c.lead = s ? s.value : c.lead; }
    if (k === "addr") { if (!v("street") || !v("city")) { toast("Street and city are needed"); return; } const nid = "a" + Date.now().toString(36); c.addresses.push({ id: nid, street: v("street"), unit: v("unit"), city: v("city"), state: v("state"), zip: v("zip") }); const bx = document.querySelector("[data-cpf-billing]"); if (bx && bx.checked) c.billingAddr = nid; }
    if (k === "note") { const t = document.querySelector("[data-cpf-note]"); if (t && t.value.trim()) (c.notesList = c.notesList || []).unshift({ text: t.value.trim(), kind: "Customer" }); }
    if (k === "delete") { HCP.state.customers.splice(HCP.state.customers.indexOf(c), 1); close(); HCP.save(); toast("Customer deleted. Reset brings the practice data back."); HCP.go("customers"); return; }
    close(); HCP.save(); HCP.render();
  }

  HCP.onClick((e) => {
    const t = (s) => e.target.closest(s);
    let b;
    if (t("[data-cp-cancel]")) { close(); return true; }
    if (t("[data-cp-ok]")) { save(); return true; }
    if (HCP.view !== "customer") return false;
    if ((b = t("[data-cp-tab]"))) { ui.tab = b.dataset.cpTab; HCP.render(); return true; }
    if ((b = t("[data-cp-note]"))) { ui.noteTab = b.dataset.cpNote; HCP.render(); return true; }
    if ((b = t("[data-cp]"))) {
      const c = cust(); const a = b.dataset.cp;
      if (a === "kebab") { ui.kebab = !ui.kebab; HCP.render(); }
      if (a === "promo") { ui.promo = false; HCP.render(); }
      if (a === "portal") { c.portalSent = true; HCP.save(); HCP.render(); toast("Customer portal invite sent (nothing is really sent)"); }
      if (a === "notify") { c.notify = !c.notify; HCP.save(); HCP.render(); }
      if (a === "autoinv") { c.autoInv = !c.autoInv; HCP.save(); HCP.render(); toast("Auto invoice " + (c.autoInv ? "on" : "off") + " for this customer"); }
      if (a === "contact") open("contact", "Contact info", f("first", "First name", c.first) + f("last", "Last name", c.last) + f("display", "Display name (shown on invoices)", c.display) + f("company", "Company", c.company) + f("mobile", "Mobile phone", (c.phones.find((p) => p.kind === "Mobile") || {}).number) + f("email", "Email", c.emails[0]));
      if (a === "tags") open("tags", "Customer tags", f("tags", "Tags (comma between tags)", c.tags.join(", ")));
      if (a === "lead") open("lead", "Lead source", '<label class="pay-f send-f filled"><span>Lead source</span><select data-cpf-sel aria-label="Lead source">' + [""].concat(D.leadSources).map((s) => "<option" + (s === c.lead ? " selected" : "") + ">" + esc(s) + "</option>").join("") + "</select></label>");
      if (a === "addr") open("addr", "Add address", f("street", "Street") + f("unit", "Unit") + f("city", "City") + f("state", "State") + f("zip", "Zip") + '<label class="check"><input type="checkbox" data-cpf-billing> Set as billing</label>', "Add");
      if (a === "note") open("note", "Add customer note", '<label class="pay-f send-f filled send-msg"><span>Note</span><textarea data-cpf-note aria-label="Note"></textarea></label>', "Add");
      if (a === "delete") { ui.kebab = false; open("delete", "Delete customer?", "<p>Are you sure you want to delete this customer? This action cannot be undone.</p>", "Delete"); }
      return true;
    }
    return false;
  });
  document.addEventListener("change", (e) => {
    if (HCP.view !== "customer") return;
    const c = cust(); if (!c) return;
    if (e.target.matches("[data-cp-terms]")) { c.terms = e.target.checked ? "Upon receipt" : ""; HCP.save(); HCP.render(); }
    if (e.target.matches("[data-cp-termsel]")) { c.terms = e.target.value; HCP.save(); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && ui.modal) close(); });
  HCP.afterRender.push(() => { if (HCP.view !== "customer") { ui.tab = "Profile"; ui.kebab = false; if (ui.modal) close(); } });
  HCP.views.customer = render;
  HCP.onReset.push(() => Object.assign(ui, { tab: "Profile", promo: true, kebab: false, noteTab: "Customer", modal: null }));
});

</script>

    el.innerHTML = ui.pop === "notif" ? notifPop() : ui.pop === "activity" ? feedDrawer() : ui.pop === "user" ? userMenu() : ui.pop === "fly" ? flyout() : "";
    if (ui.pop === "fly") {
      const btn = document.querySelector('[data-nav="my-apps"]');
      const r = btn.getBoundingClientRect();
      const box = el.firstChild; box.style.left = r.right + 4 + "px"; box.style.top = Math.max(8, r.top - 200) + "px";
    }
    if (ui.pop === "user") {
      const r = document.querySelector(".foot-user").getBoundingClientRect();
      const box = el.firstChild; box.style.left = r.left + 80 + "px"; box.style.bottom = window.innerHeight - r.top + 8 + "px";
    }
  }
  HCP.closePop = () => { if (ui.pop) { ui.pop = ""; drawPop(); } };

  // ---------- chat panel ----------
  HCP.convos = function () {
    const first = ["Sue", "Henry", "Yosef", "Nicole", "Debra", "Gaspare", "Robert", "Ally", "Richard", "Reza"];
    const lasts = ["Garcia", "Moss", "Adler", "Brandt", "Owens", "Vitale", "Lane", "Price", "Porter", "Tafoya"];
    const prev = ["Thank you", "Do you think you can get it done today?", "excellent, thank you", "You're welcome", "Thanks", "Sounds good, see you then", "Your welcome", "Thank you!", "Yes. Can you please send me the invoice?", "Tech shared 1 attachment"];
    const when = ["7:20 AM", "3:20 AM", "2:45 AM", "Yesterday", "Yesterday", "Yesterday", "Yesterday", "Yesterday", "Yesterday", "Tue"];
    return first.map((f, i) => ({ id: "cv" + i, name: f + " " + lasts[i], others: i % 3 === 1 ? 4 : 3, preview: prev[i], when: when[i], unread: [1, 2, 1, 0, 0, 2, 1, 0, 2, 1][i], group: i % 4 === 3 ? "Employees" : "Customers" }));
  };
  function chatPanel() {
    const unreadOnly = B.isOn("chat-unreads", false);
    return '<aside class="x-chatpanel" aria-label="Chats"><header><h2>Chats</h2><span class="x-count">99+</span><button class="icon-btn" data-x-ext="" aria-label="More">' + svg("dots") + '</button><button class="icon-btn" data-go="chats" aria-label="New message">' + svg("compose") + '</button><button class="icon-btn" data-x-chat aria-label="Close chats">' + svg("close") + "</button></header>" +
      '<div class="x-chat-tiles"><button data-go="ai-team"><i>' + svg("sparkle") + '</i>AI Team</button><button data-x-ext="the Housecall Pro support chat"><i class="sq">' + svg("bubble") + "</i>Support</button></div>" +
      '<div class="x-chat-bar"><select aria-label="Conversation group"><option>All Comms</option><option>Customers</option><option>Employees</option></select><label>Unreads ' + B.sw("chat-unreads", false, "Unreads") + "</label></div>" +
      '<div class="x-chat-list">' + HCP.convos().filter((c) => !unreadOnly || c.unread).map((c) => '<button class="x-convo" data-go="chats/' + c.id + '"><span class="x-init">' + c.name.split(" ").map((p) => p[0]).join("") + "</span><span><b>" + esc(c.name) + " &amp; " + c.others + " others</b><small>" + esc(c.preview) + '</small></span><span class="x-when"><small>' + c.when + "</small>" + (c.unread ? '<span class="x-unread">' + c.unread + "</span>" : "") + "</span></button>").join("") + "</div></aside>";
  }
  function drawChat() {
    document.getElementById("shell").classList.toggle("chat-open", ui.chat);
    let el = $("xChat");
    if (!el) { el = document.createElement("div"); el.id = "xChat"; document.getElementById("shell").appendChild(el); }
    el.innerHTML = ui.chat ? chatPanel() : "";
    $("chat").hidden = ui.chat;
  }

  // ---------- search ----------
  HCP.search = function (text) {
    const q = String(text || "").trim().toLowerCase();
    ui.q.global = q;
    HCP.go("search");
  };
  HCP.views.search = function () {
    const q = ui.q.global || "";
    const custs = HCP.state.customers.filter((c) => (c.display + " " + c.emails.join(" ") + " " + c.phones.map((p) => p.number).join(" ") + " " + c.addresses.map((a) => a.street).join(" ")).toLowerCase().includes(q));
    const jobs = HCP.state.jobs.filter((j) => String(j.id).includes(q) || (B.cust(j.customerId) || { display: "" }).display.toLowerCase().includes(q));
    const ests = HCP.state.estimates.filter((e) => String(e.id).includes(q) || (B.cust(e.customerId) || { display: "" }).display.toLowerCase().includes(q));
    const invs = HCP.state.invoices.filter((e) => String(e.id).includes(q) || (B.cust(e.customerId) || { display: "" }).display.toLowerCase().includes(q));
    const sec = (t, rows) => '<section class="x-card x-pad"><h3>' + t + " (" + rows.length + ")</h3>" + (rows.length ? rows.join("") : '<p class="x-muted">No matches</p>') + "</section>";
    return '<div class="x-page">' + B.head("Search results", { sub: q ? "for “" + esc(q) + "”" : "Type in Search records and press Enter" }) + '<div class="x-grid2">' +
      sec("Customers", custs.map((c) => '<button class="x-hit" data-go="customer/' + c.id + '"><b>' + esc(c.display) + "</b><small>" + esc((c.addresses[0] || {}).street || "") + " " + esc((c.phones[0] || {}).number || "") + "</small></button>")) +
      sec("Jobs", jobs.map((j) => '<button class="x-hit" data-go="job/' + j.id + '"><b>Job #' + j.id + "</b><small>" + esc((B.cust(j.customerId) || {}).display || "") + " · " + esc(j.status) + "</small></button>")) +
      sec("Estimates", ests.map((e) => '<button class="x-hit" data-go="estimate/' + e.id + '"><b>Estimate #' + e.id + "</b><small>" + esc((B.cust(e.customerId) || {}).display || "") + " · " + esc(e.status) + "</small></button>")) +
      sec("Invoices", invs.map((e) => '<button class="x-hit" data-go="invoice/' + e.id + '"><b>Invoice #' + e.id + "</b><small>" + esc((B.cust(e.customerId) || {}).display || "") + " · " + esc(e.status) + "</small></button>")) + "</div></div>";
  };
  HCP.titles.search = "Search";

  // ---------- events ----------
  HCP.onClick((e) => {
    const t = (s) => e.target.closest(s);
    let b;
    if ((b = t("[data-top]"))) { const p = b.dataset.top; ui.pop = ui.pop === p ? "" : p; drawPop(); return true; }
    if (t("#chat") || t("[data-x-chat]")) { ui.chat = !ui.chat; drawChat(); return true; }
    if (t("[data-x-close]")) { ui.pop = ""; drawPop(); return true; }
    if ((b = t("[data-x-notif]"))) { ui.notifTab = b.dataset.xNotif; drawPop(); return true; }
    if (t("[data-x-readall]")) { ui.readAll = true; drawPop(); toast("All notifications marked as read"); return true; }
    if ((b = t("[data-x-feed]"))) { ui.feedOpen[b.dataset.xFeed] = !ui.feedOpen[b.dataset.xFeed]; drawPop(); return true; }
    if (t("[data-x-signout]")) { ui.pop = ""; drawPop(); toast("Sign out is turned off in the practice copy"); return true; }
    if ((b = t("[data-x-ext]"))) { toast(b.dataset.xExt ? "In Housecall Pro this opens " + b.dataset.xExt + ". The practice copy stays here." : "In Housecall Pro this opens more options. The practice copy stays here."); return true; }
    if ((b = t("[data-x-tab]"))) { ui.tab[b.dataset.xTab] = b.dataset.val; HCP.render(); return true; }
    if ((b = t("[data-x-acc]"))) { ui.acc[b.dataset.xAcc] = !ui.acc[b.dataset.xAcc]; HCP.render(); return true; }
    if ((b = t("[data-x-gone]"))) { ui.gone[b.dataset.xGone] = true; HCP.render(); return true; }
    if ((b = t("[data-x-sw]"))) { const k = b.dataset.xSw; S().toggles[k] = !B.isOn(k, b.dataset.def === "1"); HCP.save(); if (b.closest(".x-chatpanel")) drawChat(); else HCP.render(); return true; }
    // A click on any page control closes an open popover, like the live app.
    if (ui.pop && !t(".x-pop") && !t("[data-nav=my-apps]")) { ui.pop = ""; drawPop(); }
    return false;
  });
  // Route changes from inside a popover close it.
  window.addEventListener("hashchange", () => { if (ui.pop) { ui.pop = ""; drawPop(); } });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.matches("[data-x-cb]")) { S().toggles[el.dataset.xCb] = el.checked; HCP.save(); }
    if (el.matches("[data-x-radio]")) { S().toggles[el.dataset.xRadio] = el.value; HCP.save(); HCP.render(); }
  });
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.matches("[data-x-q]")) { ui.q[el.dataset.xQ] = el.value; const p = el.selectionStart; const k = el.dataset.xQ; HCP.render(); const n = document.querySelector('[data-x-q="' + k + '"]'); if (n) { n.focus(); n.setSelectionRange(p, p); } }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && ui.pop === "fly") { ui.pop = ""; drawPop(); } });
  HCP.afterRender.push(() => { drawChat(); const p = $("page"); p.classList.toggle("x-grey", !!HCP.greyPages && HCP.greyPages.includes(HCP.view)); });
  HCP.onReset.push(() => { Object.assign(ui, { tab: {}, on: {}, gone: {}, acc: {}, q: {}, sel: {}, pop: "", chat: false, notifTab: "All", feedOpen: {}, readAll: false }); drawPop(); });
});

</script>
<script>
// Pages module: Home widgets, Leads, Service plans, Purchase orders, Price book, Map, Tasks, All Apps,
// and every sidebar submenu page (Inbox, Money, Marketing, Reporting, Team).
// Layout and wording are copied from a live Housecall Pro account (Nov 12 2026). All data is fictional.
window.HCP_MODULES = window.HCP_MODULES || [];
window.HCP_MODULES.push(function (HCP) {
  const { svg, esc, toast } = HCP;
  const D = HCP.data;
  const B = HCP.b;
  const ui = HCP.ux;
  const S = HCP.extra;

  // ---------- Home widgets (below the setup card) ----------
  HCP.homeBelow = function () {

    const done = HCP.state.jobs.filter((j) => j.status === "Completed");
    const rev = done.reduce((n, j) => n + jobTotal(j), 0);
    const kpi = (label, val) => '<div class="x-card x-kpi"><small>' + label + "</small><strong>" + val + '</strong><span class="x-up-txt">' + svg("trend") + "12% increased from same time period last year</span></div>";
    const day = B.tab("home-emp", "Today");
    const target = new Date(); if (day === "Tomorrow") target.setDate(target.getDate() + 1);
    const ymd = target.getFullYear() + "-" + String(target.getMonth() + 1).padStart(2, "0") + "-" + String(target.getDate()).padStart(2, "0");
    const time = (m) => { const h = Math.floor(m / 60), mm = m % 60; return (h % 12 || 12) + ":" + String(mm).padStart(2, "0") + (h >= 12 ? "pm" : "am"); };
    const emp = D.team.map((m) => {
      const appts = HCP.state.jobs.filter((j) => j.appt && j.appt.date === ymd && (j.appt.team || []).includes(m.id));
      return '<div class="x-emp"><div class="x-emp-name">' + B.av(m) + "<b>" + esc(m.name) + '</b><button class="icon-btn small" data-x-ext="your phone to call ' + esc(m.name) + '" aria-label="Call">' + svg("phone") + '</button><button class="icon-btn small" data-go="chats" aria-label="Message">' + svg("bubble") + "</button></div>" +
        (appts.length ? appts.map((j) => '<button class="x-emp-appt" data-go="job/' + j.id + '">' + time(j.appt.start) + " - " + time(j.appt.end) + " " + esc(cname(j.customerId)) + " • Job " + j.id + "</button>").join("") : '<p class="x-muted">No appointments</p>') + "</div>";
    }).join("");
    return '<div class="x-home">' +
      '<div class="x-home-row">' + widget("Estimates", openEst.length, openEst.reduce((n, e) => n + e.services.concat(e.materials).reduce((a, r) => a + r.qty * r.price, 0), 0), "estimates", "View all estimates", "Open estimates", "clipboard", "new-estimate") + widget("Jobs", unsched.length, unsched.reduce((n, j) => n + jobTotal(j), 0), "jobs", "View all jobs", "Unscheduled jobs", "wrench", "new-job") + widget("Invoices", openInv.length, openInv.reduce((n, i) => n + i.services.concat(i.materials).reduce((a, r) => a + r.qty * r.price, 0), 0), "invoices", "View all invoices", "Open invoices", "invoice", "") +
        '<div class="x-card x-widget"><div class="x-widget-top"><h3><i class="ic">' + svg("shield") + '</i>Service Plans</h3></div><p class="x-caught"><b>You\'re all caught up!</b><small>0 unscheduled service visits</small></p><button class="link" data-go="service-plans">Manage visits</button></div></div>' +
      '<div class="x-home-h"><h3>Week to date</h3><button class="pill outline" data-x-ext="the time frame picker">Change time frame</button><button class="link" data-go="reports">View all reports</button><button class="icon-btn" data-x-ext="report filters" aria-label="Filter">' + svg("filter") + "</button></div>" +
      '<div class="x-kpis">' + kpi("JOB REVENUE EARNED", B.money(rev)) + kpi("JOBS COMPLETED", done.length) + kpi("AVERAGE JOB SIZE", B.money(done.length ? rev / done.length : 0)) + kpi("TOTAL NEW JOBS BOOKED", HCP.state.jobs.length) + kpi("NEW JOBS BOOKED ONLINE", 0) + "</div>" +
      '<div class="x-home-2"><section class="x-card x-pad"><div class="x-home-h"><h3>Employee Status</h3>' + B.seg("home-emp", ["Today", "Tomorrow"], "Today") + '</div><div class="x-emp-grid"><div>' + emp + '</div><div class="x-mapbox">' + HCP.fakeMap(true) + "</div></div></section>" +
      '<section class="x-card x-pad"><div class="x-home-h"><h3>Recent activity</h3></div>' + HCP.feed(8).map((r) => '<div class="x-act"><i>' + svg(r[0]) + "</i><div><b>" + esc(r[1]) + "</b><small>" + r[2] + " min ago</small></div></div>").join("") + '<button class="x-fb" data-x-ext="the feedback form"><i>' + svg("feedback") + "</i>Give us feedback</button></section></div></div>";
  };

  // ---------- fake map (no map tiles in the sandbox) ----------
  HCP.fakeMap = function (small) {
    const pins = HCP.state.jobs.slice(0, 7).map((j, i) => { const m = member((j.appt && j.appt.team || [])[0]); const x = 18 + (i * 37) % 70, y = 15 + (i * 23) % 70; return '<g transform="translate(' + x + "," + y + ')"><circle r="' + (small ? 3 : 2.400) + '" fill="' + (m ? m.color : "#555") + '" stroke="#fff" stroke-width=".8"/></g>'; }).join("");
    return '<svg class="x-map" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="Map of jobs and team"><rect width="100" height="100" fill="#e8f0e3"/><path d="M78 0 C70 30 82 60 72 100 L100 100 L100 0Z" fill="#aadaff"/><path d="M0 40 L100 46 M30 0 L36 100 M55 0 L60 100 M0 75 L100 70" stroke="#fff" stroke-width="1.600" fill="none"/><path d="M36 10 L44 30 L52 50 L58 80" stroke="#0057ff" stroke-width=".9" fill="none"/>' + pins + "</svg>";
  };
  HCP.views.map = function () {
    return '<div class="x-mappage"><div class="x-head"><div><h1>Map</h1></div><div class="x-head-tools"><button class="x-sq" data-x-ext="map settings" aria-label="Settings">' + svg("gear") + '</button></div></div><div class="x-mapstrip"><select aria-label="Customers"><option>Customers</option><option>All customers</option><option>Customers with jobs today</option></select><select aria-label="Employees"><option>Employees</option>' + D.team.map((m) => "<option>" + esc(m.name) + "</option>").join("") + '</select><span></span><span>Business is open</span><i class="ic">' + svg("info") + '</i></div><div class="x-mapwrap">' + B.seg("maptype", ["Map", "Hybrid", "HCP Map"], "HCP Map") + '<button class="x-mapbtn fs" data-x-ext="full screen" aria-label="Toggle fullscreen view">' + svg("fullscreen") + '</button><div class="x-mapzoom"><button data-x-ext="" aria-label="Zoom in">+</button><button data-x-ext="" aria-label="Zoom out">−</button></div>' + HCP.fakeMap() + "</div></div>";
  };

  // ---------- Leads ----------
  HCP.views.leads = function () {
    const tab = B.tab("leads", "All");
    const q = B.q("leads");
    const rows = S().leads.filter((l) => (tab === "All" || (tab === "Active") === !l.archived) && (!q || (l.id + " " + cname(l.customerId)).toLowerCase().includes(q))).map((l) => '<tr class="row" data-go="leads"><td><input type="checkbox" aria-label="Select lead"></td><td>' + l.id + "</td><td>" + esc(cname(l.customerId)) + "</td><td>" + esc(l.note || "") + "</td><td>" + esc(l.source || "") + '</td><td><span class="x-chip blue">Open</span></td><td>' + esc((l.tags || []).join(", ")) + "</td><td>" + esc(l.created) + "</td><td>" + esc(l.created) + "</td><td>" + esc((member(l.assignee) || {}).name || "") + "</td><td>" + B.money(l.value) + "</td></tr>");
    return page(B.head("Leads", { sub: S().leads.length + " records" }) +
      (ui.gone.leadBanner ? "" : '<div class="x-banner purple"><i>' + svg("target") + '</i><span>Get more leads, set up Lead Forms</span><button class="pill purple" data-go="app-settings/leads">Set up now</button><button class="icon-btn" data-x-gone="leadBanner" aria-label="Close">' + svg("close") + "</button></div>") +
      B.listCard({ key: "leads", ph: "Search leads", view: true, right: '<button class="pill outline" data-x-ext="">Actions<i class="ic s">' + svg("chevDown") + '</i></button><button class="pill" data-go="new-lead">+ Create lead</button>', tabs: B.tabs("leads", ["All", "Active", "Inactive"], "All", "small"), cols: ["Lead #", "Customer name", "Description", "Lead source", "Status", "Tags", "Last activity", "Created date", "Assignee", "Value"].map((c, i) => (i === 0 ? '<input type="checkbox" aria-label="Select all"></th><th>' : "") + c), rows, empty: B.empty("clipboard", "No leads") }));
  };

  // ---------- Service plans ----------
  HCP.views["service-plans"] = function () {

    return page('<div class="x-head"><div class="x-row"><button class="x-sq" aria-label="Menu" data-x-ext="">' + svg("menu") + '</button><h1 class="x-h5">Service plans</h1></div><div class="x-head-tools"><button class="x-sq" data-x-ext="the plan settings" aria-label="Settings">' + svg("gear") + '</button><button class="x-sq" data-x-ext="the feedback form" aria-label="Feedback">' + svg("feedback") + '</button><button class="pill outline" data-x-ext="the service plan builder">+ Service plan</button><button class="x-sq" aria-label="More" data-x-ext="">' + svg("dots") + "</button></div></div>" +
      '<section class="x-card x-hero"><h2>Get started with service plans</h2><p>Build recurring revenue with maintenance plans your customers can sign up for.</p><button class="pill" data-x-ext="the service plan builder">Create a plan</button><button class="link" data-x-ext="industry templates">View industry templates</button></section>' +
      '<div class="x-grid4">' + card("Plan summary", "<strong>0</strong><span>$0.00</span>" + '<div class="x-links">' + counts + '</div><button class="link" data-x-ext="">View all</button>') + card("Recurring revenue", '<button class="link" data-go="reports">View reporting</button><strong>$0.00</strong><span>$0.00</span>') + card("Revenue collected", "<strong>$0.00</strong>" + '<button class="link" data-go="payments">View all</button>') + card("Plan templates", '<button class="icon-btn" data-x-ext="the plan template builder" aria-label="Add template">' + svg("plus") + "</button>") + "</div>" +
      '<div class="x-grid2"><section class="x-card x-pad"><h3>Due for billing</h3>' + B.table(["Customer", "Phone", "Due date", "Status", "Amount"], [], "Nothing due") + '<button class="link" data-x-ext="">View more</button></section><section class="x-card x-pad"><h3>Unscheduled visits</h3>' + B.table(["Customer Name", "Address", "Phone", "Plan", "Visit date"], [], "No unscheduled visits") + '<button class="link" data-x-ext="">View more</button></section></div>');
  };

  // ---------- Purchase orders ----------
  HCP.views["purchase-orders"] = function () {
    const top = B.tab("po-top", "Purchase orders");
    const statuses = ["All", "Draft", "Issued", "Confirmed", "Partially Received", "Received", "Backorder", "Completed", "Canceled"];
    const body = top === "Vendors" ? B.listCard({ key: "vendors", ph: "Search vendors", right: '<button class="pill" data-x-ext="the new vendor form">Add vendor</button>', cols: ["Vendor", "Contact", "Phone", "Email", "Open orders"], rows: [], empty: B.empty("order", "No vendors") })
      : B.listCard({ key: "po", ph: "Search", right: '<button class="pill" data-x-ext="the new purchase order form">Create purchase order</button>', tabs: B.tabs("po-status", statuses.map((s) => [s, s, ' <span class="x-cnt">0</span>']), "All", "small"), cols: ['<input type="checkbox" aria-label="Select all">', "PO #", "Status", "Vendor", "Sales Order #", "Job", "Fulfillment method", "Order Date", "Needed by", "Expected by", "Total"], rows: [], empty: B.empty("order", "No purchase orders") });
    return page(B.head("Purchase Orders", { sub: "0 records" }) + B.tabs("po-top", ["Purchase orders", "Vendors"], "Purchase orders") + body);
  };

  // ---------- Price book ----------
  const INDUSTRIES = ["Plumbing", "HVAC", "Electrical", "Drain & Sewer", "Water Heaters", "General"];
  HCP.views["price-book"] = function (arg) {
    const tab = B.tab("pb", "Services");
    let body;
    if (tab === "Services" && arg) {
      const kind = "service";
      const rows = D.priceBook.filter((p) => p.kind === kind).map((p) => [esc(p.name), esc(p.description), B.money(p.price), '<button class="icon-btn small" data-x-ext="the service editor" aria-label="Edit">' + svg("pencil") + "</button>"]);

    const cats = { Jobs: ["Date", "Paid in full jobs", "Customer", "Type", "Time tracking", "Job costing", "Employee", "Line items"], Estimates: ["Date", "Customer", "Employee", "Outcome", "Line items"], Leads: ["Date", "Lead source", "Status"], "Service plans": ["Plans", "Visits", "Revenue"], Invoices: ["Date", "Status", "Aging"], Payments: ["Date", "Method", "Employee"], Custom: ["Saved reports"] }[tab];
    return page(B.head("Reports") + B.tabs("rep", ["Jobs", "Estimates", "Leads", "Service plans", "Invoices", "Payments", "Custom"], "Jobs") + '<div class="x-row x-between"><h2 class="x-h1">' + tab + '</h2><div class="x-row"><button class="pill" data-x-ext="the report builder">Create report</button><button class="pill purple" data-x-ext="Analyst AI">Ask Analyst AI</button></div></div><div class="x-tiles">' + cats.map((c) => '<button class="x-card x-tile" data-x-ext="the ' + esc(c) + ' report"><i>' + svg("report") + "</i><b>" + c + "</b></button>").join("") + '</div><button class="link" data-x-ext="the reporting help article">reporting help</button>');
  };

  // ---------- Team ----------
  HCP.views["team-members"] = () => page(B.head("Team Members") + '<section class="x-card x-pad"><div class="x-row x-between"><h3>Employees</h3><div class="x-row"><button class="pill outline" data-go="payroll">Manage pay</button><button class="pill" data-x-ext="the add team member form">Add team member</button><button class="icon-btn" aria-label="More" data-x-ext="">' + svg("dots") + "</button></div></div>" +
    B.table(["Name", "Company POC", "Role", "Rating", "Reviews", "App version", "Last login", "Tags", ""], D.team.map((m, i) => ['<span class="x-row">' + B.av(m) + esc(m.name) + "</span>", i === 0 ? "Yes" : "", i === 0 ? "Admin" : i === 3 ? "Office staff" : "Field tech", i ? "4." + (9 - i) : "--", i ? i * 3 : 0, i ? "6.12" : "Web", "Today", i && i < 3 ? '<span class="x-chip">Plumbing</span>' : "", '<button class="icon-btn small" aria-label="Edit" data-x-ext="the team member editor">' + svg("pencil") + "</button>"])) + "</section>");
  HCP.views["ai-team"] = () => page(B.head("AI Team") + '<section class="x-card x-pad">' + B.table(["AI Team", "Description", "Status", ""], [["CSR AI", "Answers calls and texts, books jobs", '<span class="x-chip">Off</span>'], ["Analyst AI", "Answers questions about your reports", '<span class="x-chip green">On</span>'], ["Coach AI", "Reviews calls and gives tips", '<span class="x-chip">Off</span>']].map((r) => r.concat('<button class="icon-btn small" aria-label="More" data-x-ext="the AI team settings">' + svg("dots") + "</button>"))) + "</section>");
  HCP.views["time-attendance"] = function () {
    const days = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push((d.getMonth() + 1) + "/" + d.getDate()); }
    const grid = B.tab("ta-view", "Grid view") === "Grid view";
    return page(B.head("Time & Attendance") + B.tabs("ta", ["Time tracking"], "Time tracking") + '<div class="x-row x-between"><h3>Track your team\'s time</h3><div class="x-row"><button class="pill outline" data-x-ext="a CSV download">Export</button><button class="pill purple" data-go="payroll">Sync to payroll · offer available</button></div></div>' +
      '<div class="x-bar"><label class="x-field"><small>From</small><input type="date" aria-label="From"></label><label class="x-field"><small>To</small><input type="date" aria-label="To"></label><select aria-label="Team"><option>Full team selected (' + D.team.length + ")</option></select>" + B.seg("ta-view", ["Grid view", "List view"], "Grid view") + "</div>" +
      (grid ? B.table(["Date"].concat(D.team.map((m) => '<span class="x-row">' + B.av(m) + esc(m.name) + "</span>")), days.map((d) => [d].concat(D.team.map(() => "--")))) : B.table(["Employee", "Date", "Clock in", "Clock out", "Total"], [], "No time entries")));
  };
  HCP.views.payroll = () => page(B.head("Payroll") + B.upsell({ key: "pay", eyebrow: "PAYROLL", h: "Payroll, HR, Benefits - all in Housecall Pro", p: "$40/mo + $6 per employee/month", cta: ["Learn more"],
    mid: '<section class="x-plans">' + [["Starter", "$40/mo", "+ $6 per employee/month", ""], ["Advanced", "$80/mo", "+ $12 per employee/month", "$0 for 3 mo"], ["Advanced plus", "$169/mo", "+ $20 per employee/month", "$0 for 3 mo"]].map((p, i) => '<div class="x-card x-plan' + (i === 1 ? " rec" : "") + '">' + (i === 1 ? '<span class="x-chip blue">Recommended</span>' : "") + "<h3>" + p[0] + "</h3><strong>" + p[1] + "</strong>" + (p[3] ? '<span class="x-green">' + p[3] + "</span>" : "") + "<small>" + p[2] + '</small><button class="pill" data-x-ext="the ' + p[0] + ' payroll checkout">Select plan</button></div>').join("") + "</section>",
    quote: ["Payroll runs itself now, and time from jobs flows right in.", "HVAC company owner"], faq: ["How does payroll sync with time tracking?", "Can I switch plans later?", "Do you file payroll taxes?"] }));

  // ---------- estimate page: the one-time "Prepare for upcoming changes" notice ----------
  HCP.afterRender.push(() => {
    let el = document.getElementById("xNotice");
    if (HCP.view !== "estimate" || S().estNoticeSeen) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement("div"); el.id = "xNotice"; document.body.appendChild(el); }
    el.innerHTML = '<div class="modal"><div class="dialog x-notice" role="dialog" aria-modal="true" aria-labelledby="xnT"><h2 id="xnT">Prepare for upcoming changes</h2><div class="x-video"><b>Quote more easily with the <em>refreshed estimates view</em></b><button class="x-play" data-x-ext="the walkthrough video" aria-label="Play video">' + svg("play") + '</button><small>3:26</small></div><p>Soon, the current estimate layout will be replaced with a more intuitive and user-friendly experience.</p><p>This view better separates estimate details from option details and includes new functionality like naming your estimates and adding a summary of work. Try it now so you\'re ready when the switch happens.</p><button class="link" data-x-ext="the Help Center">Read more in Help Center</button><div class="x-row x-end"><button class="pill outline" data-x-notice>Skip</button><button class="pill" data-x-notice="new">Switch to new view</button></div></div></div>';
  });
  HCP.onClick((e) => {
    const b = e.target.closest("[data-x-notice]");
    if (!b) return false;
    S().estNoticeSeen = true; HCP.save(); HCP.render();
    if (b.dataset.xNotice === "new") toast("The new estimates view is not in the practice copy yet. You are on the current view.");
    return true;
  });

  // Every new screen highlights its parent row in the sidebar.
  Object.assign(HCP.navFor, { apps: "my-apps" });
  Object.assign(HCP.titles, { map: "Map", tasks: "Tasks", apps: "My Apps", search: "Search" });
  HCP.greyPages = ["leads", "service-plans", "purchase-orders", "tasks", "payments", "chats", "mkt-dashboard", "reviews", "online-booking", "dashboards", "reports", "team-members", "ai-team", "time-attendance", "financing", "price-book"];
});

</script>
<script>
// Settings module: the Settings area with its own left nav and all 24 pages.

window.HCP_MODULES = window.HCP_MODULES || [];
window.HCP_MODULES.push(function (HCP) {

  // Second tabs, copied from a live HCP account with these features in use (Nov 12 2026). Company details are replaced with Demo Plumbing.
  const TABS = {
    "company/Business hours": () => '<section class="s-sec"><div class="s-sec-h"><h6>Operating hours</h6><button class="link s-edit" data-x-ext="the hours editor">Edit</button></div><div class="s-hours">' + [["Monday - Friday", "7:00 AM - 6:00 PM"], ["Saturday", "8:00 AM - 12:00 PM"], ["Sunday", "Closed"]].map((r) => "<span>" + r[0] + "</span><h6>" + r[1] + "</h6>").join("") + "</div></section>",
    "company/Service area": () => '<div class="s-right"><button class="pill" data-x-ext="the service zone map">Add service zone</button></div>' + acc("svc-area", "Service Area", '<p class="x-muted">Riverton, NY 10990 · Locust Hill, NY 10991 · Bayview, NY 10992</p>'),
    "billing/Explore Plans": () => '<section class="x-card x-pad"><div class="s-plan-now"><div><h6>Current plan</h6><h3>MAX</h3><p class="x-muted">$329/month</p></div><div><p>Subscribed since: 10/3/2026</p><p>Next billing date: 11/25/2026</p></div><div><p>' + (D.team.length + 4) + " users included</p><p>" + D.team.length + "/" + (D.team.length + 4) + ' user logins assigned</p></div><button class="pill outline" data-go="team-members">Manage users</button></div></section><h2 class="s-center">Update your plan</h2><p class="x-muted s-center">Plan selection limited by current team size. To access all plans, <button class="link" data-go="team-members">manage team members</button>.</p><div class="x-plans">' +
      [["Basic", "1 user", "$79", "", ["Scheduling and dispatching", "Quotes and proposals", "Invoices and payments", "Online booking", "Premium review management", "Job cost tracking", "Price book", "Customer communication"]], ["Essentials", "1-5 users", "$189", "All Basic features, plus:", ["QuickBooks online and desktop", "Flat-rate pricing", "Customer equipment tracking", "Photo annotations", "Commissions", "Employee GPS tracking", "Checklists"]], ["MAX", "1-8+ users", "$329", "All Essential features, plus:", ["Advanced custom reporting", "Dedicated onboarding specialist", "Escalated phone support", "Add-ons included: Sales Proposal Tool, Recurring Service Plans"]]].map((p) => '<div class="x-card x-plan"><h6>' + p[0] + "</h6><small>" + p[1] + "</small><strong>" + p[2] + '</strong><small>per month</small><button class="pill' + (p[0] === "MAX" ? " off" : "") + '" ' + (p[0] === "MAX" ? "disabled" : 'data-x-ext="the plan change checkout"') + ">" + (p[0] === "MAX" ? "Current plan" : "Select plan") + "</button>" + (p[3] ? "<b>" + p[3] + "</b>" : "") + "<ul>" + p[4].map((f) => "<li>" + f + "</li>").join("") + "</ul></div>").join("") + '</div><p class="x-muted">All prices in USD ($)</p>' + acc("cmp", "Compare all features", '<p class="x-muted">Full feature table on the live page.</p>'),
    "notifications/Team": () => (ui.gone.teamNotif ? "" : '<section class="x-card x-pad s-promo"><h6>Get live updates on work in progress</h6><p>Set up notifications your way, so your team never misses a beat.</p><div class="x-row"><button class="pill" data-x-ext="the help article">Learn more</button><button class="link" data-x-gone="teamNotif">Dismiss</button></div></section>') +
      [["Add-on requests", ["Add-on requested by a customer"]], ["Estimates", ["Estimate approved", "Estimate declined", "Estimate viewed"]], ["Expense Cards", ["Card transaction"]], ["Invoices & payments", ["Payment received", "Invoice viewed", "Payment failed"]], ["Purchase Orders", ["Purchase order received"]], ["Tasks", ["Task assigned to me", "Task due"]]].map(([g, rows]) => '<section class="s-block"><h3>' + g + "</h3>" + B.table(["Notification type", "Delivery method", "Recipients"], rows.map((r, i) => [esc(r), '<select aria-label="Delivery method"><option>In-app and email</option><option>In-app</option><option>Email</option><option>Text</option></select>', '<select aria-label="Recipients"><option>Admins</option><option>Assigned employees</option><option>Everyone</option></select>'])) + "</section>").join("") + '<button class="x-fb" data-x-ext="the feedback form"><i>' + svg("feedback") + "</i>Give us feedback</button>",
    "notifications/Email Domain": () => '<section class="x-card x-pad"><h3>Email Domain</h3><p class="x-muted">Send customer emails from your own domain so they land in the inbox.</p><button class="pill" data-x-ext="the domain setup">Set up email domain</button></section>',
    "booking/Services & Pricing": () => '<section class="s-block"><div class="x-row x-between"><h3>Pricing Forms</h3><button class="link" data-go="price-book">MANAGE PRICING FORMS IN PRICE BOOK</button></div><p>Create a pricing form</p><p class="x-muted">Set dynamic pricing based on the size of the home or property.</p><button class="link" data-go="price-book">+ Add pricing form in price book</button></section><section class="s-block"><div class="x-row x-between"><h3>Available services</h3><button class="link" data-go="price-book">MANAGE SERVICES IN PRICE BOOK</button></div><p class="x-muted">Drag and drop services and categories to rearrange the order on your booking page</p>' + B.tabs("s-book-cat", ["Plumbing", "Drain & Sewer"], "Plumbing", "small") + '<section class="x-card x-pad"><h3>Book Online Today! ' + esc(B.tab("s-book-cat", "Plumbing")) + "</h3>" + B.table(["Services", "Price", "Duration", "Booked as"], D.priceBook.filter((x) => x.kind === "service").slice(0, B.tab("s-book-cat", "Plumbing") === "Plumbing" ? 4 : 2).map((x) => [esc(x.name), B.money(x.price), "1 hr", '<select aria-label="Booked as"><option>Job</option><option>Estimate</option></select>'])) + "</section></section>",
    "booking/Online Booking": () => '<section class="x-card x-pad"><div class="x-row x-between"><h6>Preview and share your booking page</h6><button class="pill outline" data-x-ext="your booking page preview">Preview</button></div>' + codeBox('<!--Start of Housecallpro Online booking button--> <button data-token="demo" class="hcp-button">Book online</button>') + codeBox("https://book.housecallpro.example/book/Demo-Plumbing") + '</section><section class="s-block"><h3 class="b">Pricing & Payments</h3>' + toggleRow("ob-prices", "Show service prices", "", true) + '<div class="s-trow"><div><p class="s-t">Payments & deposits</p><p class="x-muted">Charge for your services in online booking. This will add one more step to the booking flow.</p><p>Require full payments</p></div><button class="pill outline" data-x-ext="the payment settings">Edit</button></div>' + toggleRow("ob-cancel", "Automatically cancel unpaid bookings within 1 hour", "", false) + '</section><section class="s-block"><h3 class="b">Booking Flow</h3><h6>Booking steps</h6>' + toggleRow("ob-multi", "Allow to book multiple services.", "", true) + toggleRow("ob-photos", "Show troubleshooting questions and allow to upload photos.", "", true) + "<h6>Existing customers</h6>" + toggleRow("ob-match", "Match customers using their contact details to prevent duplicates.", "", true) + '</section><section class="s-block"><h3 class="b">Advanced settings</h3><div class="s-trow"><div><p class="s-t">Tracking attribute</p><p class="x-muted">Add a tracking attribute to your booking page.</p></div><button class="pill outline" data-x-ext="the tracking attribute form">Add attribute</button></div><div class="s-trow"><div><p class="s-t">Booking redirect</p><p class="x-muted">Redirect your customers to a custom link after successful booking.</p></div><button class="pill outline" data-x-ext="the redirect form">Add redirect</button></div></section>',
    "booking/Reserve with Google": () => '<section class="s-block"><h3>Google integration</h3><p class="x-muted">Get bookings directly to your inbox from your Google Business Profile. <button class="link" data-x-ext="the help article">Learn more</button></p></section><section class="x-card x-pad"><h6>Need help with your Google Business Page? Book a call with our team</h6><p class="x-muted">Schedule a call with our team to get 1:1 assistance setting up your Google Business Profile.</p><button class="pill" data-x-ext="the booking calendar for a free call">Schedule a free call</button></section>',

    "portal/Referral program": () => '<section class="x-card">' + B.table(["Setting", "Actions"], [["Offer customers a reward for referring friends", B.sw("portal-ref", false, "Referral program")]]) + "</section>",
    "estimates/Customer view": () => '<section class="s-block"><h3>Customer view</h3><p class="x-muted">Configure the default content on all future estimates. This can be adjusted on each estimate.</p></section><div class="s-cv"><div>' + acc("ecv-vis", "Visibility", "") + '<div class="x-card x-pad"><h6>Estimate, business, customer</h6>' + [["Business logo", 1], ["Business name", 1], ["Business address", 1], ["Estimate #", 1], ["Estimate name", 1], ["Estimate summary", 1], ["Customer display name", 0], ["Customer company name", 0], ["Estimate date", 0], ["Expiration date", 1], ["Service date", 1], ["Technician name", 0], ["Estimate message", 1]].map((r) => B.cb("ecv-" + r[0], !!r[1], r[0])).join("") + "</div>" + acc("ecv-s", "Services", B.cb("ecv-sq", true, "Quantity") + B.cb("ecv-sp", true, "Unit price")) + acc("ecv-m", "Materials", B.cb("ecv-mq", true, "Quantity")) + acc("ecv-p", "Print and PDF settings", B.cb("ecv-pp", true, "Include line item descriptions")) + '</div><div class="x-card x-pad s-preview">' + B.seg("ecv-layout", ["simple", "side by side", "stacked"], "side by side") + "<p>Estimate #1234</p><h3>Estimate for Customer Name</h3><p>For: 1234 Street Name, City, State, Zip</p><p class=\"x-muted\">Expires on: " + new Date(Date.now() + 18 * 864e5).toDateString() + "</p>" + ["Option #1", "Option #2", "Option #3"].map((o) => '<div class="s-opt"><h6>' + o + '</h6><button class="link" data-x-ext="">Show details</button></div>').join("") + '<p class="x-muted">Thank you for your business!</p></div></div>',
