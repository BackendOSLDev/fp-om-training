<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="robots" content="noindex, nofollow">
<title>HCP Practice Copy</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
/* Sizes and colors are read from the live Housecall Pro pages at 1440x860. */
:root {
  --blue: #0057ff;
  --blue-soft: #e3eefa;
  --banner: #dcebfb;
  --ink: #15181d;
  --ink-2: #6b7487;
  --muted: #757575;
  --line: #e0e0e0;
  --foot: #f5f5f5;
  --search: #f1f5ff;
  --green: #00a344;
  --badge: #e0245e;
  --side-w: 264px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #fff;
  color: var(--ink);
  font-family: Manrope, "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.4;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); height: 100vh; }
.shell.collapsed { --side-w: 76px; }

/* sidebar */
.side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: #fff; }
.side-top { display: flex; align-items: center; justify-content: space-between; flex: none; height: 77px; padding: 12px 16px 0 24px; }
.logo {
  width: 57px; height: 40px; border-radius: 2px; background: #15395f; color: #fff;
  display: grid; place-items: center; text-align: center;
  font-size: 9px; font-weight: 700; line-height: 1.1;
}
.icon-btn { width: 24px; height: 24px; color: var(--ink-2); }
.side-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 24px 12px; scrollbar-width: thin; }
.create {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; height: 40px; margin-bottom: 20px; border-radius: 200px;
  background: var(--blue); color: #fff; font-size: 13.125px; font-weight: 600;
}
.create i { width: 18px; height: 18px; }
.create svg { stroke-width: 2; }
.nav-row {
  position: relative; display: flex; align-items: center; gap: 16px; font-size: 15px;
  width: 100%; height: 30px; margin-bottom: 4px; padding: 0 8px; border-radius: 4px;
  text-align: left; white-space: nowrap;
}
.nav-row:hover { background: #eee; }
.nav-row.on { background: rgba(187, 222, 251, .4); }
.nav-row i { flex: none; width: 20px; height: 20px; color: rgba(0, 0, 0, .54); }
.nav-row .chev { width: 16px; height: 16px; margin-left: auto; }
.nav-row .dot { position: absolute; left: 25px; top: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
.nav-sep { height: 1px; margin: 4px 0 7px; background: var(--line); }
.side-foot { flex: none; height: 128px; padding: 23px 25px 0; background: var(--foot); }
.foot-settings { display: flex; align-items: center; gap: 12px; width: 100%; font-size: 13.125px; color: #424242; }
.foot-settings i { width: 18px; height: 18px; }
.foot-user { display: flex; align-items: center; gap: 16px; width: 100%; margin-top: 18px; text-align: left; }
.avatar { flex: none; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: #c8390f; color: #fff; font-size: 16px; }
.foot-user b { display: block; font-size: 15px; font-weight: 400; }
.foot-user small { display: block; color: var(--ink-2); font-size: 13.125px; }
.foot-user i { width: 18px; height: 18px; margin-left: auto; }

.collapsed .logo { width: 36px; height: 26px; font-size: 0; }
.collapsed .side-top { flex-direction: column; justify-content: center; gap: 6px; padding: 10px 0 0; }
.collapsed .collapse svg { transform: scaleX(-1); }
.collapsed .side-scroll { padding: 6px 12px 12px; }
.collapsed .create span, .collapsed .nav-row span.t, .collapsed .nav-row .chev,
.collapsed .foot-settings span, .collapsed .foot-user div, .collapsed .foot-user > i:last-child { display: none; }
.collapsed .nav-row { justify-content: center; padding: 0; }
.collapsed .nav-row .dot { left: 30px; }
.collapsed .side-foot { padding: 25px 14px 0; }

/* top bar */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { flex: none; display: flex; align-items: center; gap: 24px; height: 64px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.search { flex: 1 1 720px; display: flex; align-items: center; gap: 12px; max-width: 720px; height: 39px; margin-top: 1px; padding: 0 8px 0 14px; border-radius: 8px; background: var(--search); }
.search-icon { flex: none; width: 20px; height: 20px; color: var(--ink-2); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.top-icons { display: flex; gap: 28px; margin-left: auto; }
.top-icon { position: relative; width: 24px; height: 24px; color: var(--ink-2); }
.top-icon .badge { position: absolute; left: 7px; top: -9px; min-width: 25px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--blue); color: #fff; font-size: 12px; line-height: 18px; text-align: center; }

/* page */
.page { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 16px 60px 21px; scrollbar-width: none; }
.setup { border: 1px solid var(--blue); border-radius: 6px; overflow: hidden; }
.setup-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px 24px; padding: 24px 24px 28px; }
.setup-head h1 { flex: 0 1 380px; margin: 0; font-size: 28px; font-weight: 400; line-height: 37px; }
.progress { display: flex; align-items: center; gap: 16px; flex: 0 1 412px; padding-top: 8px; }
.bar { flex: 1; height: 20px; border-radius: 10px; background: #eee; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--green); }
.setup-toggle { width: 22px; height: 22px; margin-left: 12px; color: var(--ink-2); }
.setup.closed .setup-toggle svg { transform: rotate(180deg); }
.setup.closed .setup-body { display: none; }
.setup-body { padding: 0 24px 24px; }

.tour { display: grid; grid-template-columns: minmax(0, 1fr) 258px; min-height: 209px; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 8px rgba(0, 0, 0, .12); }
.tour-copy { padding: 24px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { padding: 2px 8px; border-radius: 12px; background: #f1f1f1; font-size: 13px; }
.chip.rec { background: var(--blue-soft); font-weight: 600; }
.tour h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
.tour p { margin: 0 0 16px; }
.tour-actions { display: flex; align-items: center; gap: 22px; }
.pill { height: 32px; padding: 0 12px; border-radius: 200px; background: var(--blue); color: #fff; font-size: 13.125px; font-weight: 600; white-space: nowrap; }
.link { color: var(--blue); font-size: 13.125px; font-weight: 600; white-space: nowrap; }
.tour-art { display: grid; place-content: center; justify-items: center; gap: 10px; background: linear-gradient(160deg, #fff 0%, #dcebfb 70%); font-weight: 500; }
.art { width: 110px; height: 60px; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }

.tasks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px 16px; margin-top: 16px; }
.task { display: flex; align-items: center; gap: 12px; min-height: 53px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 6px; }
.task > i { flex: none; width: 22px; height: 22px; color: var(--ink-2); }
.task b { flex: 1; font-weight: 500; line-height: 1.25; }
.task .x { flex: none; width: 18px; height: 18px; margin-left: 8px; color: var(--ink-2); }

.help { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding: 14px 24px; background: var(--banner); }
.help h3 { margin: 0; font-size: 17px; font-weight: 600; }
.help p { margin: 0; font-size: 14.5px; }

.below { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
.below div { height: 110px; border: 1px solid var(--line); border-radius: 6px; }

/* create menu and customer dialog */
.menu { position: fixed; z-index: 30; min-width: 163px; padding: 8px 0; border-radius: 4px; background: #fff; box-shadow: 0 3px 14px rgba(0, 0, 0, .22); }
.menu[hidden], .modal[hidden], .practice[hidden], .practice-open[hidden] { display: none; }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; height: 35px; padding: 0 16px; font-size: 15px; text-align: left; white-space: nowrap; }
.menu button i { flex: none; width: 20px; height: 20px; color: var(--ink-2); }
.menu button.sel { background: rgba(14, 111, 190, .24); }
.menu.view { min-width: 206px; }
.menu.view button:last-child { height: 57px; font-size: 13.125px; }
.menu.color { min-width: 175px; }
.menu hr { margin: 10px 0; border: 0; border-top: 1px solid var(--line); }
.menu-new { padding: 1px 8px; border-radius: 4px; background: #d5e8fa; font-size: 12px; font-weight: 600; }
.menu button:hover { background: var(--blue-soft); }
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .45); }
.dialog { display: flex; flex-direction: column; width: min(640px, 100%); max-height: calc(100vh - 32px); border-radius: 8px; background: #fff; }
.dialog-head, .dialog-foot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; }
.dialog-head { border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 0; font-size: 20px; font-weight: 500; }
.dialog-foot { border-top: 1px solid var(--line); }
.dialog-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 16px; }
.sec-title { margin: 16px -20px 12px; padding: 6px 20px; background: var(--foot); font-size: 14px; font-weight: 600; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields .wide { grid-column: 1 / -1; }
.fields label, label.block { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
.fields small { color: var(--muted); }
input:not([type=checkbox]):not([type=radio]), select, textarea { width: 100%; min-height: 36px; padding: 6px 10px; border: 1px solid #c4c4c4; border-radius: 4px; background: #fff; color: var(--ink); font: inherit; font-size: 15px; }
textarea { min-height: 72px; resize: vertical; }
.search input:not([type=checkbox]):not([type=radio]) { min-height: 0; padding: 0; border: 0; background: none; }
.phone-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.radios { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; font-size: 14px; color: var(--ink-2); }
.fields .radios label { display: flex; align-items: center; gap: 6px; color: var(--ink); }
label.check, .fields label.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); }
.form-error { margin: 12px 0 0; color: #b3261e; font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; padding: 2px 8px; border-radius: 12px; background: #eee; font-size: 13px; }
.tag button { width: 14px; height: 14px; }
.icon-btn.small { flex: none; width: 18px; height: 18px; }

/* jobs and customers */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.page-head h1 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0; font-size: 26px; font-weight: 400; }
.crumb { color: var(--blue); font-size: 14px; font-weight: 500; }
.pill.small { justify-self: start; height: 32px; }
.job-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
.job-col { display: grid; gap: 16px; min-width: 0; }
.card { display: grid; gap: 8px; padding: 16px; border: 1px solid var(--line); border-radius: 6px; background: #fff; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card h3 { margin: 0; font-size: 16px; font-weight: 600; }
.card h4 { margin: 8px 0 0; font-size: 14px; font-weight: 600; }
.card p { margin: 0; }
.strong { font-weight: 600; }
.muted { color: var(--muted); }
.addr { display: flex; align-items: center; gap: 8px; }
.link.big { font-size: 16px; }
.search-wrap { position: relative; }
.dropdown { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 2px); max-height: 260px; overflow-y: auto; border-radius: 6px; background: #fff; box-shadow: 0 3px 14px rgba(0, 0, 0, .22); }
.dropdown button { display: block; width: 100%; padding: 8px 12px; text-align: left; }
.dropdown button:hover { background: var(--blue-soft); }
.dropdown small { display: block; color: var(--muted); }
.dropdown .none { padding: 10px 12px; color: var(--muted); font-size: 14px; }
.total { display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--line); }
.status { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.s-sch { background: var(--blue-soft); color: #0a5596; }
.s-uns { background: #eee; color: var(--ink-2); }
.s-go { background: #fdf0d8; color: #8a5200; }
.s-done { background: #e1f3e8; color: #1a6b43; }
.s-dns { background: #fbe4e2; color: #b3261e; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.tabs button { padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--ink-2); font-size: 14px; }
.tabs button.on { border-color: var(--blue); color: var(--blue); font-weight: 600; }
.list-search { max-width: 360px; margin-bottom: 12px; }
.table { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px; }
th { padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 500; text-align: left; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td b { font-weight: 500; }
tr.row { cursor: pointer; }
tr.row:hover td { background: #f6f9fd; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.job-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 6px 0; color: var(--blue); }

/* practice rail: ours, not part of HCP, so it's styled to look different */
.shell.practicing { grid-template-columns: var(--side-w) minmax(0, 1fr) 320px; }
.practice { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; padding: 16px; border-left: 1px solid #e6dfcf; background: #fbf8f1; font-size: 14px; }
.p-head { display: flex; align-items: center; justify-content: space-between; color: #6b5b2e; font-size: 12px; font-weight: 600; }
.practice h2 { margin: 0; font-size: 18px; font-weight: 600; }
.practice blockquote { margin: 0; padding: 10px 12px; border-left: 3px solid #b8892b; border-radius: 0 6px 6px 0; background: #fff; }
.practice ol { display: grid; gap: 6px; margin: 0; padding-left: 20px; }
.practice .pill { align-self: flex-start; flex: none; }
.p-results { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.p-results li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; }
.p-results i { width: 16px; height: 16px; margin-top: 2px; }
.p-results .ok { color: #1a6b43; }
.p-results .bad { color: #b3261e; }
.p-sum { margin: 0; font-weight: 600; }
.p-nav { display: flex; justify-content: space-between; }
.p-nav .link:disabled { color: var(--muted); cursor: default; }
.p-note { margin: auto 0 0; color: #6b5b2e; font-size: 12px; }
.practice-open { position: fixed; z-index: 10; right: 88px; bottom: 32px; height: 36px; padding: 0 16px; border: 1px solid #b8892b; border-radius: 18px; background: #fbf8f1; color: #6b5b2e; font-size: 14px; font-weight: 600; box-shadow: 0 1px 6px rgba(0, 0, 0, .18); }
.shell.practicing ~ .chat { display: none; }

/* screens we don't have a screenshot of yet */
.soon { max-width: 460px; margin: 80px auto; text-align: center; color: var(--ink-2); }
.soon h1 { margin: 0 0 8px; font-size: 24px; font-weight: 400; color: var(--ink); }
.soon p { margin: 0; }

/* floating */
.chat { position: fixed; right: 20px; bottom: 22px; display: grid; place-items: center; width: 55px; height: 55px; border-radius: 50%; background: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
.chat i { width: 28px; height: 28px; }
.chat .badge { position: absolute; right: -2px; top: -8px; min-width: 25px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--badge); font-size: 12px; line-height: 20px; }
.demo-label { position: fixed; left: 12px; bottom: 2px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.demo-label button { color: var(--blue); text-decoration: underline; }
.toast { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 9px 16px; border-radius: 6px; background: #323232; color: #fff; font-size: 14px; }
.toast[hidden] { display: none; }
.toast { z-index: 60; }
.demo-label { z-index: 50; }

/* schedule page */
.page.flush { display: flex; padding: 0; overflow: hidden; }
.sch { --gut: 57px; flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; font-size: 13.125px; }
.sch-actions { flex: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 16px; padding: 10px 8px 4px; }
.pill.outline { background: #fff; border: 1px solid var(--blue); color: var(--blue); }
.pill.purple { justify-self: start; background: #623cc9; }
.small-pill { height: 32px; }
.sch-bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 0; min-height: 58px; padding: 6px 16px 0 10px; border-bottom: 1px solid rgba(0, 0, 0, .12); }
.sch-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-left: auto; }
.sch-right .bar-btn.lg { margin-left: -16px; }
[data-sch-menu=color] { width: 116px; }
[data-sch-menu=view] { min-width: 85px; }
.bar-btn { position: relative; flex: none; width: 36px; height: 36px; padding: 6px; border-radius: 50%; color: #263238; }
.bar-btn:hover { background: rgba(0, 0, 0, .04); }
.bar-btn.lg { width: 48px; height: 48px; padding: 12px; color: var(--ink-2); }
.sch-bar .small-pill { margin: 0 16px 0 24px; padding: 0 11px; min-width: 64px; }
.pill.outline { padding: 0 11px; }
.sch-bar .bar-btn.lg.uns-btn { margin-left: 16px; }
.sch-panel > * { flex: none; }
.uns-btn .badge { position: absolute; left: 24px; top: 2px; min-width: 22px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--badge); color: #fff; font-size: 12px; line-height: 20px; text-align: center; }
.sch-bar .bar-btn + .bar-btn { margin-left: 4px; }
.range-btn { display: inline-flex; align-items: center; gap: 14px; margin-left: 4px; font-size: 15px; font-weight: 500; white-space: nowrap; }
.range-btn i { width: 14px; height: 14px; }
.seg { display: inline-flex; overflow: hidden; border: 1px solid var(--blue); border-radius: 8px; }
.seg button { width: 48px; height: 34px; padding: 5px 12px; color: var(--blue); }
.seg button + button { border-left: 1px solid var(--blue); }
.seg button.on { background: var(--blue); color: #fff; }
.color-by { font-size: 15px; white-space: nowrap; margin-right: -8px; }
.drop-btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; height: 39px; padding: 0 11px 0 14px; border: 1px solid rgba(0, 0, 0, .23); border-radius: 4px; white-space: nowrap; font-size: 15px; }
.drop-btn i { width: 13px; height: 13px; color: var(--ink-2); }
.drop-btn.blue { height: 32px; padding: 0 9px; border-color: var(--blue); border-radius: 200px; color: var(--blue); font-size: 13.125px; font-weight: 600; }
.drop-btn.blue i { color: var(--blue); }
.sch-body { flex: 1; display: flex; min-height: 0; }
.sch-panel { flex: none; display: flex; flex-direction: column; width: 275px; margin-right: 2px; padding: 16px 16px 24px 10px; overflow-y: auto; background: #fff; scrollbar-width: none; }
.mini { height: 318px; }
.mini-head { display: flex; align-items: center; height: 30px; margin-bottom: 8px; padding: 0 12px; }
.mini-head b { flex: 1; font-size: 15px; font-weight: 700; }
.mini-head .bar-btn { width: 32px; height: 32px; padding: 4px; color: var(--ink-2); }
.mini-head .bar-btn:first-of-type { margin-right: 18px; }

/* popovers */

.x-notif { right: 70px; top: 52px; width: 430px; max-height: calc(100vh - 70px); display: flex; flex-direction: column; }
.x-notif header { display: flex; align-items: center; gap: 8px; padding: 14px 14px 6px; }
.x-notif header h2 { margin: 0 auto 0 4px; font-size: 26.25px; font-weight: 400; }
.x-notif-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 10px; }
.x-notif-bar select { height: 36px; border: 1px solid rgba(0, 0, 0, .23); border-radius: 8px; padding: 0 8px; font: inherit; }
.x-notif-list { overflow-y: auto; }
.x-notif-row { display: grid; grid-template-columns: 10px 1fr auto 28px; gap: 8px; align-items: start; padding: 10px 14px; border-top: 1px solid #eef0f4; }

.x-scrim { position: fixed; inset: 0; z-index: 59; background: rgba(0, 0, 0, .45); }

.x-drawer header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.x-drawer header h2 { margin: 0; font-size: 18px; font-weight: 500; }
.x-feed { overflow-y: auto; }
.x-feed-row { display: grid; grid-template-columns: 22px 1fr 32px; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #eef0f4; }
.x-feed-row > i { width: 20px; height: 20px; color: var(--ink-2); margin-top: 2px; }
.x-feed-row b { display: block; font-size: 13.5px; font-weight: 500; }
.x-feed-row small { color: var(--ink-2); font-size: 12px; }

.x-user, .x-fly { width: 220px; padding: 6px 0; }
.x-user button, .x-fly button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 6px 16px; font-size: 14px; text-align: left; }
.x-user button:hover, .x-fly button:hover { background: var(--blue-soft); }
.x-user i { width: 20px; height: 20px; color: var(--ink-2); flex: none; }
.x-user small { display: block; color: var(--ink-2); font-size: 12px; }

.x-fly button { min-height: 47px; font-size: 15px; }

/* chat panel */
.shell.chat-open { grid-template-columns: var(--side-w) minmax(0, 1fr) 300px; }
.x-chatpanel { display: flex; flex-direction: column; height: 100vh; border-left: 1px solid var(--line); background: #fff; }

.x-chat-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 12px; }
.x-chat-tiles button { display: grid; justify-items: center; gap: 6px; padding: 12px 6px; border-radius: 8px; background: #eef3ff; font-size: 13px; font-weight: 600; }

.x-convo b { display: block; font-size: 13.5px; }

.x-init { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: #e0e4ec; color: #444; font-size: 12px; font-weight: 700; flex: none; }

.x-when { display: grid; justify-items: end; gap: 4px; }
.x-when small { color: var(--blue); font-size: 11.5px; }
.x-unread { min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--blue); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }

/* inbox page */
.x-tight { gap: 8px; }
.x-inbox { display: grid; grid-template-columns: 360px 1fr; min-height: 560px; overflow: hidden; }
.x-inbox-list { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100vh - 230px); }
.x-inbox-h { display: flex; align-items: center; gap: 6px; padding: 12px; }

.x-thread-empty { display: grid; place-content: center; justify-items: center; color: #9aa3b5; }

.x-compose { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }

/* reviews, reports, search */
.x-rating strong { display: block; font-size: 48px; }
.x-stars { display: flex; gap: 2px; color: #f5a623; }

.x-stars.small svg { width: 14px; height: 14px; }
.x-review p { margin: 8px 0; }
.x-bars { display: flex; align-items: flex-end; gap: 12px; height: 180px; padding-top: 12px; }
.x-bars.small { height: 110px; gap: 6px; }
.x-bar-col { display: grid; justify-items: center; gap: 4px; flex: 1; }
.x-bar-col span { width: 70%; max-width: 40px; border-radius: 3px 3px 0 0; background: var(--blue); }
.x-bar-col small { font-size: 11px; color: var(--ink-2); }
.x-rep h4 { margin: 0; font-size: 15px; font-weight: 600; }
.x-rep strong { font-size: 24px; }
.x-hit { display: block; width: 100%; padding: 8px 0; border-bottom: 1px solid var(--line); text-align: left; }
.x-hit small { display: block; color: var(--ink-2); }
.x-results { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; display: grid; border-radius: 4px; background: #fff; box-shadow: 0 4px 14px rgba(0, 0, 0, .2); }
.x-results button { padding: 8px 12px; text-align: left; }
.x-results button:hover { background: var(--blue-soft); }
.x-results small { display: block; color: var(--ink-2); }
.x-results p { padding: 8px 12px; }

/* settings */
.s-wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100%; }
.s-side { padding: 20px 12px 24px 22px; border-right: 1px solid var(--line); background: #fff; }

.s-foot { margin-top: 24px; font-size: 11px; color: var(--ink-2); }

.s-logo { display: grid; place-items: center; width: 96px; height: 96px; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; font-weight: 700; text-align: center; }
.s-right { display: flex; justify-content: flex-end; }
.s-block { display: grid; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--line); }

.s-block h3.b { font-weight: 600; }
.s-block h6.b { margin-top: 12px; font-size: 20.625px; }
.s-group { overflow: hidden; }
.s-group-h { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 70px; padding: 0 16px; }

.s-group-h i { width: 22px; height: 22px; }
.s-nrow { display: grid; grid-template-columns: 1fr 90px 90px 36px 36px; align-items: center; height: 67px; padding: 0 16px; border-top: 1px solid var(--line); }

.s-promo { background: #f5f8ff; }
.s-help { margin: 0; font-size: 15px; }
.s-wizard { display: grid; justify-items: center; gap: 10px; text-align: center; }

.s-inds { display: grid; gap: 6px; width: 320px; text-align: left; }

.s-wiz-foot { width: 100%; margin-top: 40px; }
.s-steps { display: grid; gap: 16px; max-width: 769px; }
.s-step { display: grid; gap: 2px; padding: 12px 16px; text-align: left; }

.s-step small { color: var(--ink-2); font-size: 13.125px; }
.s-step-body { display: grid; gap: 8px; }
.s-pct { width: 101px; min-width: 0; }
.s-indent { padding-left: 32px; }
.s-list { display: grid; }
.s-li { display: flex; align-items: center; gap: 10px; height: 44px; border-bottom: 1px solid var(--line); }
.s-li i { width: 18px; height: 18px; color: var(--ink-2); }
.s-li span { flex: 1; }
.s-tagbar { max-width: 820px; }
.s-tags { max-width: 820px; }
.s-ji h6 { font-size: 16.875px; }
.x-nc { border: 1px dashed #c5cbd6; box-shadow: none; }
.s-table th { background: #fff; font-size: 13.125px; font-weight: 600; color: var(--ink-2); }

/* create forms */
.shell.x-full .side, .shell.x-full .top { visibility: hidden; }
.f-form .nj-head .pill { width: auto; padding: 0 16px; }

.nj-sp { flex: 1; }
.f-type { position: absolute; left: 60px; top: 50px; z-index: 30; }
.nj-head { position: relative; }
.f-dt { flex-wrap: nowrap; margin-bottom: 8px; }
.f-dt span { width: 40px; font-size: 13px; }
.f-dt input { height: 36px; padding: 0 8px; border: 1px solid rgba(0, 0, 0, .23); border-radius: 4px; font: inherit; min-width: 0; }
.f-dt input[type=date] { flex: 1.4; }
.f-dt input[type=time] { flex: 1; }
.person.grey { color: var(--ink-2); }
.f-add select { width: 100%; height: 38px; margin: 6px 0; }
.f-rec { padding: 16px 20px; display: grid; gap: 10px; }

.f-help { font-size: 11px; }
.nj-card-body.stack { display: grid; gap: 10px; }
.f-form .x-field input { width: 100%; }

@media (max-width: 900px) {
  .x-grid2, .x-grid3, .x-grid4, .x-home-row, .x-home-2, .x-emp-grid, .x-plans, .x-inbox { grid-template-columns: 1fr; }
  .s-wrap { grid-template-columns: 1fr; }
  .s-side { border-right: 0; border-bottom: 1px solid var(--line); }
  .x-notif, .x-drawer { width: calc(100vw - 16px); right: 8px; }
}

/* schedule additions */
.menu-note { margin: 0; padding: 4px 16px 6px; color: var(--ink-2); font-size: 11.5px; max-width: 206px; }
.cs-pen { width: 16px !important; height: 16px !important; margin-left: auto; }
.range-pop { padding: 4px 8px; }
.menu.range { min-width: 260px; }
.emp-h { display: grid; justify-items: center; gap: 2px; }
.emp-h .mini-av { width: 28px; height: 28px; line-height: 28px; font-size: 11px; }
.mo { display: grid; grid-template-rows: auto 1fr; height: 100%; }
.mo-head { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line); }
.mo-head small { padding: 6px; text-align: center; color: var(--ink-2); font-size: 11px; }

.dialog.cs { width: 470px; padding: 20px 24px; gap: 10px; }
.cs h2 { margin: 0 0 6px; font-size: 22px; font-weight: 500; }
.cs h3 { margin: 10px 0 0; font-size: 16px; font-weight: 500; }
.cs-tg { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.cs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 13.5px; }
.cs-foot { display: flex; justify-content: flex-end; }
.s-nrow h6 { margin: 0; font-size: 16.875px; font-weight: 600; }
.x-notif-bar .x-seg { flex: none; }

.x-search input { border: 0 !important; height: auto !important; padding: 0 !important; box-shadow: none !important; background: none; }
.dialog.x-notice { width: 436px; padding: 20px 18px; gap: 10px; font-size: 14px; }
.x-notice h2 { margin: 0; font-size: 22px; font-weight: 500; }

.x-end { justify-content: flex-end; }

/* settings second tabs (from a live account) */
.s-info { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 24px; margin-top: 14px; }
.s-info small { color: var(--ink-2); font-size: 12px; }
.s-info p { margin: 2px 0 0; font-size: 15px; }
.s-acc { overflow: hidden; margin-bottom: 8px; }

.s-acc-body { padding: 0 16px 14px; }

.s-trow { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 8px 0; }

.s-center { text-align: center; margin: 4px 0; }
h2.s-center { font-size: 37.5px; font-weight: 400; }
.x-plan ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; }
.x-plan b { font-size: 13.5px; }
.x-plan .pill.off { background: #e0e0e0; color: #757575; }
.s-cv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.s-preview { display: grid; gap: 6px; }
.s-preview h3, .s-preview p { margin: 0; }
.s-opt { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
.s-nrow { grid-template-columns: 1fr 120px 120px 36px 36px; height: auto; min-height: 67px; padding: 8px 16px; }

<script>
// Jobs and customers module: Create menu, new customer, New job, Customers and Jobs lists, job page, practice calls.
// New job and the job page are matched to a live Housecall Pro account. The Customers pages and the
// add-customer dialog follow HCP's help articles and haven't been compared with the live screens.
window.HCP_MODULES = window.HCP_MODULES || [];
window.HCP_MODULES.push(function (HCP) {
  const { svg, esc, toast, notBuilt } = HCP;
  const D = HCP.data;
  const ui = { line: null, confirmClose: false, jobFold: {}, job: null, jobFrom: "", cust: null, afterCust: null, custQuery: "", jobTab: "All", listQuery: "", error: "", results: {} };
  HCP.onLeave.push(() => { ui.cust = null; ui.line = null; ui.afterCust = null; });

  const digits = (t) => String(t || "").replace(/\D/g, "");
  const money = (n) => "$" + Number(n || 0).toFixed(2);
  const custById = (id) => HCP.state.customers.find((c) => c.id === id);
  const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const line = (a) => a ? [a.street, a.unit, a.city, a.state, a.zip].filter(Boolean).join(", ") : "";
  const options = (list, val, ph) => (ph ? '<option value="">' + esc(ph) + "</option>" : "") +
    list.map((o) => "<option" + (o === val ? " selected" : "") + ">" + esc(o) + "</option>").join("");

  function setPath(path, value) {
    const parts = path.split(".");
    let o = ui;
    parts.slice(0, -1).forEach((p) => { o = o[p]; });
    o[parts[parts.length - 1]] = value;
  }
  function refocus(id) {
    const el = id && document.getElementById(id);
    if (el) el.focus();
  }

  // ---------- Create menu ----------
  function toggleCreateMenu(btn) {
    const menu = document.getElementById("createMenu");
    if (!menu.hidden) { menu.hidden = true; return; }
    const r = btn.getBoundingClientRect();
    menu.className = "menu";
    menu.style.left = r.left + "px";
    menu.style.top = r.bottom + 4 + "px";
    menu.innerHTML = [["job", "Job", "wrench"], ["Recurring Job", "Recurring Job", "repeat"], ["Estimate", "Estimate", "clipboard"], ["Event", "Event", "calendar"], ["customer", "Customer", "person"], ["Intake", "Intake", "phone"], ["Lead", "Lead", "target"]]
      .map(([id, label, icon]) => '<button data-new="' + id + '"><i>' + svg(icon) + "</i>" + label + (label === "Recurring Job" ? '<span class="menu-new">New</span>' : "") + "</button>").join("");
    menu.hidden = false;
  }

  // ---------- customer form ----------
  function blankCustomer() {
    return { first: "", last: "", display: "", emails: [""], phones: [{ kind: "Mobile", number: "", note: "" }, { kind: "Home", number: "", note: "" }, { kind: "Work", number: "", note: "" }], company: "", role: "", type: "Homeowner", dns: false, addresses: [{ street: "", unit: "", city: "", state: "", zip: "" }], notes: "", tags: [], tagText: "", lead: "", referredBy: "", billsTo: "", notify: true };
  }
  function openCustomer(afterCust) {
    ui.cust = blankCustomer();
    ui.afterCust = afterCust || null;
    ui.error = "";
    renderModal();
    refocus("cf-first");
  }
  const custOptions = (val, ph) => '<option value="">' + ph + "</option>" + HCP.state.customers.map((c) => '<option value="' + c.id + '"' + (c.id === val ? " selected" : "") + ">" + esc(c.display) + "</option>").join("");
  function tagChips(tags, scope) {
    return tags.map((t, i) => '<span class="tag">' + esc(t) + '<button data-tag-del="' + scope + "." + i + '" aria-label="Remove ' + esc(t) + '">' + svg("close") + "</button></span>").join("");
  }
  const STATES = ["AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "FL", "GA", "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME", "MD", "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", "NJ", "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY", "DC"];
  const custValid = (c) => !!(c.first.trim() || c.last.trim() || c.company.trim());
  function phoneField(kind, label) {
    const c = ui.cust;
    let i = c.phones.findIndex((p) => p.kind === kind);
    if (i < 0) { c.phones.push({ kind, number: "", note: "" }); i = c.phones.length - 1; }
    return '<label>' + label + '<input type="tel" data-b="cust.phones.' + i + '.number" value="' + esc(c.phones[i].number) + '"></label>';
  }
  function renderModal() {
    const c = ui.cust;
    const el = document.getElementById("modal");
    if (!c) { el.hidden = true; el.innerHTML = ""; return; }
    el.hidden = false;
    el.innerHTML = '<div class="dialog cust-big" role="dialog" aria-modal="true" aria-labelledby="custTitle">' +
      '<div class="dialog-head"><h2 id="custTitle">Add new customer</h2><button class="icon-btn" data-close-modal aria-label="Close">' + svg("close") + "</button></div>" +
      '<div class="dialog-body">' +
      '<div class="sec-title">Contact info</div><div class="fields cust-grid">' +
        '<label>First name<input id="cf-first" data-b="cust.first" value="' + esc(c.first) + '"></label>' +
        '<label>Last name<input data-b="cust.last" value="' + esc(c.last) + '"></label>' +
        phoneField("Mobile", "Mobile phone") +
        '<label>Company<input data-b="cust.company" value="' + esc(c.company) + '"></label>' +
        '<label class="span2">Display name (shown on invoices)<input data-b="cust.display" value="' + esc(c.display) + '"></label>' +
        phoneField("Home", "Home phone") +
        '<label>Role<input data-b="cust.role" value="' + esc(c.role) + '"></label>' +
        c.emails.map((m, i) => '<label class="span2">Email<input type="email" data-b="cust.emails.' + i + '" value="' + esc(m) + '"></label>').join("") +
        phoneField("Work", "Work phone") +
        '<div class="radios">' + ["Homeowner", "Business"].map((t) => '<label><input type="radio" name="ctype" data-b="cust.type" value="' + t + '"' + (c.type === t ? " checked" : "") + "> " + t + "</label>").join("") + "</div>" +
        c.phones.map((p, i) => (i < 3 ? "" : '<div class="span4 phone-row"><label>Type<select data-b="cust.phones.' + i + '.kind">' + options(["Mobile", "Home", "Work"], p.kind) + '</select></label><label>Phone<input type="tel" data-b="cust.phones.' + i + '.number" value="' + esc(p.number) + '"></label><label>Note<input data-b="cust.phones.' + i + '.note" value="' + esc(p.note) + '"></label></div>')).join("") +
        '<div class="span4 cust-adds"><button class="pill outline" data-add="email">+ Email</button><button class="pill outline" data-add="phone">+ Phone</button><label class="check"><input type="checkbox" data-b="cust.dns"' + (c.dns ? " checked" : "") + '> Mark as <span class="status s-dns">Do not service</span></label><small class="cust-dns-note">Notifications will be turned off and it won\'t be possible to schedule a job or estimate.</small></div>' +
      "</div>" +
      '<div class="sec-title">Address</div><div class="fields cust-grid">' +
        c.addresses.map((a, i) => '<label class="span3">Street<input data-b="cust.addresses.' + i + '.street" value="' + esc(a.street) + '"></label>' +
          '<label>Unit<input data-b="cust.addresses.' + i + '.unit" value="' + esc(a.unit) + '"></label>' +
          '<label class="span2">City<input data-b="cust.addresses.' + i + '.city" value="' + esc(a.city) + '"></label>' +
          '<label>State<select data-b="cust.addresses.' + i + '.state">' + options(STATES, a.state, "State") + "</select></label>" +
          '<label>Zip<input data-b="cust.addresses.' + i + '.zip" value="' + esc(a.zip) + '"></label>' +
          '<label class="span3">Address Notes<input data-b="cust.addresses.' + i + '.notes" value="' + esc(a.notes || "") + '"></label>').join("") +
        '<div class="span4"><button class="pill outline" data-add="address">+ Address</button></div>' +
      "</div>" +
      '<div class="sec-title">Notes</div><div class="fields">' +
        '<label class="wide">Customer notes <small>Internal only</small><textarea data-b="cust.notes">' + esc(c.notes) + "</textarea></label>" +
        '<div class="wide"><label>Customer tags<input id="cf-tag" data-tag-input="cust" placeholder="Type a tag and press Enter"></label><div class="tags">' + tagChips(c.tags, "cust") + "</div></div>" +
        '<label>This customer bills to<select data-b="cust.billsTo">' + custOptions(c.billsTo, "None") + "</select></label>" +
        '<label>Lead source<select data-b="cust.lead">' + options(D.leadSources, c.lead, "Select") + "</select></label>" +
      "</div>" +
      '<button class="sec-title sec-fold" data-cust-terms-fold>Payment terms <i>' + svg("chevDown") + "</i></button>" + (c.termsOpen ? '<div class="fields">' +
        '<p class="wide muted">Auto-applies to new invoices for this customer. Can be overridden per invoice.</p>' +
        '<label class="wide check"><input type="checkbox" data-b="cust.customTerms"' + (c.customTerms ? " checked" : "") + '> Set custom terms for this customer</label>' +
        (c.customTerms ? '<div class="wide radios"><label><input type="radio" name="tkind" data-b="cust.termsKind" value="Upon"' + (c.termsKind !== "Net" ? " checked" : "") + '> Upon <select data-b="cust.termsUpon"><option>receipt</option></select></label><label><input type="radio" name="tkind" data-b="cust.termsKind" value="Net"' + (c.termsKind === "Net" ? " checked" : "") + '> Net <select data-b="cust.termsNet">' + options(["3", "5", "7", "10", "14", "15", "20", "30", "40", "45", "60", "90"], c.termsNet || "30") + "</select></label></div>" : "") +
      "</div>" : "") +
      '<div class="sec-title">Referred by</div><div class="fields">' +
        '<label class="wide">Referred by<select data-b="cust.referredBy">' + custOptions(c.referredBy, "Search customers") + "</select></label>" +
      "</div>" +
      (ui.error ? '<p class="form-error" role="alert">' + esc(ui.error) + "</p>" : "") +
      "</div>" +
      '<div class="dialog-foot"><label class="check"><input type="checkbox" data-b="cust.notify"' + (c.notify ? " checked" : "") + '> Send notifications</label><span></span><button class="pill outline" data-close-modal>Cancel</button><button class="pill' + (custValid(c) ? "" : " off") + '" data-save-customer' + (custValid(c) ? "" : " disabled") + '>Create customer</button></div>' +
      "</div>";
  }
  function saveCustomer() {
    const c = ui.cust;
    if (!c.first.trim() && !c.last.trim() && !c.company.trim()) {
      ui.error = "Add a name or a company first.";
      renderModal();
      return;

  function dupGroups() {

    HCP.state.customers.forEach((c) => {

  function mergeCustomers(ids) {
    const list = ids.map(custById).filter(Boolean).sort((a, b) => String(a.created || "").localeCompare(String(b.created || "")));
    if (list.length < 2) return;
    const keep = list[0];
    list.slice(1).forEach((c) => {
      c.emails.forEach((m) => { if (!keep.emails.some((x) => x.toLowerCase() === m.toLowerCase())) keep.emails.push(m); });
      c.phones.forEach((p) => { if (!keep.phones.some((x) => digits(x.number) === digits(p.number))) keep.phones.push(p); });
      c.addresses.forEach((a) => { if (!keep.addresses.some((x) => line(x).toLowerCase() === line(a).toLowerCase())) keep.addresses.push(a); });
      (c.tags || []).forEach((t) => { if (!keep.tags.includes(t)) keep.tags.push(t); });
      if (c.notes) keep.notes = [keep.notes, c.notes].filter(Boolean).join("\n");
      if (!keep.lead && c.lead) keep.lead = c.lead;
      if (!keep.company && c.company) keep.company = c.company;
      if (c.dns) keep.dns = true;
      const addrMap = {};
      c.addresses.forEach((a) => { const m = keep.addresses.find((x) => line(x).toLowerCase() === line(a).toLowerCase()); if (m) addrMap[a.id] = m.id; });
      ["jobs", "estimates", "invoices"].forEach((k) => (HCP.state[k] || []).forEach((r) => { if (r.customerId === c.id) { r.customerId = keep.id; if (r.addressId && addrMap[r.addressId]) r.addressId = addrMap[r.addressId]; } }));
      HCP.state.customers.forEach((o) => { if (o.billsTo === c.id) o.billsTo = keep.id; if (o.referredBy === c.id) o.referredBy = keep.id; });
      HCP.state.customers.splice(HCP.state.customers.indexOf(c), 1);
    });
    HCP.save();
    return keep;
  }

  document.addEventListener("input", (e) => {

<script>
// Scheduling module: Schedule calendar, unscheduled jobs, the "Schedule a time" window.
// Screens, labels and dropdown options are copied from a live Housecall Pro account.
// One behaviour couldn't be checked without changing live data, so it's our best guess:
// dropping an unscheduled job opens the window with the time filled in.
window.HCP_MODULES = window.HCP_MODULES || [];
window.HCP_MODULES.push(function (HCP) {
  const { svg, esc, toast, notBuilt } = HCP;
  const D = HCP.data;
  const PX = 56; // height of one hour
  const DAY_W = 1400; // the dispatch board's width for one day, 6:00am to 11:30pm
  const PER_MIN = 80 / 60; // dispatch board pixels per minute
  const DAY_FROM = 360;
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const today = () => ymd(new Date());
  const clock = (m) => { const h = Math.floor(m / 60) % 24; return { h: h % 12 || 12, mm: pad(m % 60), ap: h < 12 ? "am" : "pm" }; };
  const time = (m) => { const c = clock(m); return c.h + ":" + c.mm + c.ap; };
  const timeUp = (m) => { const c = clock(m); return c.h + ":" + c.mm + " " + c.ap.toUpperCase(); };
  const range = (s, e) => { const c = clock(s); return c.h + ":" + c.mm + "-" + time(e); };
  const money = (n) => "$" + Number(n || 0).toFixed(2);
  const short = (s) => MONTHS[parse(s).getMonth()].slice(0, 3);
  const $ = (id) => document.getElementById(id);

  const jobs = () => HCP.state.jobs;
  const jobById = (id) => jobs().find((j) => String(j.id) === String(id));
  const custOf = (j) => HCP.state.customers.find((c) => c.id === j.customerId);
  const addrOf = (j) => { const c = custOf(j); return c && c.addresses.find((a) => a.id === j.addressId); };
  const member = (id) => D.team.find((e) => e.id === id);
  const members = (ids) => (ids || []).map(member).filter(Boolean);
  const total = (j) => j.services.concat(j.materials).reduce((n, r) => n + Number(r.qty || 0) * Number(r.price || 0), 0);
  const title = (j) => (j.services[0] && j.services[0].name) || j.notes || "";
  const avatar = (e) => '<span class="mini-av" style="background:' + e.color + '">' + esc(e.initials) + "</span>";

  const freshUi = () => ({ anchor: today(), month: today().slice(0, 7), view: "Week", colorBy: "Employee", byEmp: false, csOpen: false, calSet: { biz: true, hol: true, cap: false }, calItems: { "Arrival window": true, Customer: true, "Job name": true, Team: true }, panel: window.innerWidth > 760 ? "calendar" : null, filter: "", unsFilter: "", off: {}, teamOpen: true, menuFor: "", win: null, scroll: 0, dspLeft: 0, dspTop: 0, slot: null });
  const ui = freshUi();
  // Set while the New Call form borrows the dispatch board to pick a time.
  let pick = null;

  function dayList(anchor, view) {
    if (view === "Day" || view === "Schedule") return [anchor];
    if (view === "Month") { const [y, m] = anchor.split("-").map(Number); const n = new Date(y, m, 0).getDate(); return Array.from({ length: n }, (_, i) => y + "-" + pad(m) + "-" + pad(i + 1)); }
    const sunday = addDays(anchor, -parse(anchor).getDay());
    const from = view === "Monday-Friday" ? 1 : 0;
    const count = view === "Monday-Friday" ? 5 : 7;
    return Array.from({ length: count }, (_, i) => addDays(sunday, from + i));
  }
  function rangeLabel(days) {
    const a = parse(days[0]);
    const b = parse(days[days.length - 1]);
    if (ui.view === "Month" && days.length > 20 && !ui.win && !pick) return MONTHS[a.getMonth()] + " " + a.getFullYear();
    if (days.length === 1) return DAYS[a.getDay()] + ", " + MONTHS[a.getMonth()] + " " + a.getDate() + ", " + a.getFullYear();
    if (a.getMonth() === b.getMonth()) return MONTHS[a.getMonth()] + " " + pad(a.getDate()) + "-" + pad(b.getDate()) + ", " + a.getFullYear();
    return short(days[0]) + " " + pad(a.getDate()) + " - " + short(days[days.length - 1]) + " " + pad(b.getDate()) + ", " + b.getFullYear();
  }

  function shown(j) {
    const team = j.appt.team;
    const on = team.length ? team.some((id) => !ui.off[id]) : !ui.off.none;

    const c = custOf(j);
    return !q || [c ? c.display : ""].concat(j.tags || []).join(" ").toLowerCase().includes(q);
  }

  // Overlapping appointments share the width of the day, side by side.
  function placeEvents(list) {
    const sorted = list.slice().sort((a, b) => a.start - b.start || b.end - a.end);
    const out = [];
    let group = [];
    let groupEnd = -1;
    const flush = () => {
      const cols = [];
      group.forEach((e) => {
        let c = cols.findIndex((end) => end <= e.start);
        if (c < 0) { c = cols.length; cols.push(0); }
        cols[c] = e.end;
        e.col = c;
      });
      group.forEach((e) => { e.cols = cols.length; out.push(e); });
      group = [];
    };
    sorted.forEach((e) => {
      if (group.length && e.start >= groupEnd) { flush(); groupEnd = -1; }
      group.push(e);
      groupEnd = Math.max(groupEnd, e.end);
    });
    if (group.length) flush();
    return out;
  }

  function eventHtml(e, from, inWindow) {
    const j = e.job;

    return '<button class="' + cls + '" data-ev="' + j.id + '"' + (inWindow ? "" : ' data-go="job/' + j.id + '"') + ' style="' + place + '">' +
      '<span class="ev-name"><i>' + svg("wrench") + "</i>" + (opt.Customer ? esc(c ? c.display : "") : "") + (opt["Job number"] ? " #" + j.id : "") + (opt["Job name"] && !opt.Customer ? "Job " + j.id : "") + "</span>" +
      (opt.Team ? '<span class="ev-team">' + team.map(avatar).join("") + "</span>" : "") +
      (opt["Arrival window"] ? '<span class="ev-time"><i>' + svg("truck") + "</i>" + range(e.start, e.end) + "</span>" : "") +
      (opt.Amount ? '<span class="ev-time">$' + (j.services.concat(j.materials).reduce((n, r) => n + r.qty * r.price, 0)).toFixed(2) + "</span>" : "") +
      (opt["City & State"] ? '<span class="ev-time">' + esc((addrOf(j) || {}).city || "") + "</span>" : "") + "</button>";
  }
  const AREA_COLORS = ["#0089d1", "#c0370c", "#00a344", "#7b1fa2", "#ef6c00", "#455a64"];
  function areaColor(j) { const a = addrOf(j); const city = a ? a.city : ""; let h = 0; for (const ch of city) h = (h * 31 + ch.charCodeAt(0)) % 997; return AREA_COLORS[h % AREA_COLORS.length]; }

  // ---------- Schedule view: one column per team member for one day ----------
  function empCalendar(day) {
    const cols = [{ id: "none", name: "Unassigned", color: "#757575" }].concat(D.team);
    const items = jobs().filter((j) => j.appt && j.appt.date === day && !j.appt.anytime && shown(j));
    const from = 390, to = 1410;
    const hours = []; for (let m = 420; m < to; m += 60) hours.push(m);
    const grid = "grid-template-columns:var(--gut) repeat(" + cols.length + ",minmax(0,1fr))";
    return '<div class="cal-inner"><div class="cal-head" style="' + grid + '"><div></div>' + cols.map((m) => '<div class="dh emp-h"><span class="mini-av" style="background:' + m.color + '">' + (m.id === "none" ? "--" : esc(m.initials)) + "</span><small>" + esc(m.name.split(" ")[0]) + (m.name.split(" ")[1] ? " " + m.name.split(" ")[1][0] + "." : "") + "</small></div>").join("") + "</div>" +
      '<div class="cal-body"><div class="cal-grid" style="' + grid + ";height:" + (to - from) / 60 * PX + 'px"><div class="hours">' + hours.map((m) => '<span style="top:' + ((m - from) / 60 * PX - 8) + 'px">' + clock(m).h + clock(m).ap + "</span>").join("") + "</div>" +
      cols.map((m) => '<div class="day" data-day="' + day + '" data-from="' + from + '"><div class="after-hours" style="top:0;height:' + (420 - from) / 60 * PX + 'px"></div>' + placeEvents(items.filter((j) => (j.appt.team[0] || "none") === m.id).map((j) => ({ job: j, date: day, start: j.appt.start, end: j.appt.end, anytime: false, team: j.appt.team, cur: false }))).map((e) => eventHtml(e, from, false)).join("") + "</div>").join("") + "</div></div></div>";
  }
  // ---------- Month view ----------
  function monthGrid() {
    const [y, m] = ui.anchor.split("-").map(Number);
    const first = new Date(y, m - 1, 1);
    const start = addDays(ymd(first), -first.getDay());

    }
    return '<div class="mo"><div class="mo-head">' + DAYS.map((d) => "<small>" + d.slice(0, 3).toUpperCase() + "</small>").join("") + '</div><div class="mo-grid">' + cells.join("") + "</div></div>";
  }
  // ---------- Calendar settings ----------
  const ITEM_OPTS = ["Amount", "Arrival window", "City & State", "Customer", "Description", "Job name", "Job number", "Job tags", "Phone number", "Schedule", "Street", "Team", "Zip code"];
  function settingsModal() {
    const c = ui.calSet;
    const tg = (k, l) => '<label class="cs-tg"><button class="x-sw' + (c[k] ? " on" : "") + '" role="switch" aria-checked="' + !!c[k] + '" data-cs-tg="' + k + '"><span></span></button>' + l + "</label>";
    return '<div class="modal" id="calSet"><div class="dialog cs" role="dialog" aria-modal="true" aria-labelledby="csT"><h2 id="csT">Calendar settings</h2><label class="x-field"><small>Timezone</small><select aria-label="Timezone"><option>(GMT-05:00) Eastern Time - New York</option><option>(GMT-06:00) Central Time - Chicago</option><option>(GMT-07:00) Mountain Time - Denver</option><option>(GMT-08:00) Pacific Time - Los Angeles</option></select></label>' +
      tg("biz", "Only display business hours") + tg("hol", "Display US holidays") + tg("cap", "Display capacity information") +
      '<h3>Calendar items options</h3><div class="cs-grid">' + ITEM_OPTS.map((o) => '<label class="check"><input type="checkbox" data-cs-item="' + o + '"' + (ui.calItems[o] ? " checked" : "") + "> " + o + "</label>").join("") + '</div><div class="cs-foot"><button class="pill" data-cs-done>Done</button></div></div></div>';
  }

          if (!hit) break;

  // Drive times are made up: the sandbox has no map.
  function suggestions(w) {
    const staff = w.emps.length ? w.emps : D.team.filter((e) => e.id !== D.team[0].id).map((e) => e.id);
    const out = [];
    const now = new Date();
    const earliest = Math.ceil((now.getHours() * 60 + now.getMinutes()) / 15) * 15;
    for (let i = 0; i < 7 && out.length < 12; i++) {

          (c && c.notify ? '<span class="notif">Notifications on</span>' : "") + '<hr><p>' + esc(title(j)) + '</p><div class="sw-sub"><b>Services subtotal</b><b>' + money(services) + "</b></div>") +

        '<div class="sch-right">' + seg + '<button class="drop-btn blue" data-x-ext="the employee filter"><span>Filter by employee</span><i>' + svg("chevDown") + '</i></button><button class="drop-btn blue" data-x-ext="the view options"><span>View options</span><i>' + svg("chevDown") + '</i></button><button class="bar-btn lg" data-x-ext="the calendar settings" aria-label="Calendar settings">' + svg("gear") + "</button></div></div>" +
        '<div class="cal" id="swCal">' + calendar(dayList(w.anchor, "Week"), true) + "</div></div></div></div>";
  }

  function saveWindow() {

    HCP.save();
    const back = w.returnTo;

  }

      '<div class="c-row"><i>' + svg("calendar") + "</i><div>" + esc(title(j)) + "</div></div>" +
      '<div class="c-row"><i>' + svg("dollar") + "</i><div>" + money(total(j)) + "</div></div>" +
      '<div class="c-row"><i>' + svg("person") + '</i><div class="c-main"><button class="link big" data-go="customer/' + (c ? c.id : "") + '">' + esc(c ? c.display : "") + "</button><small>" + esc(addr ? addr.street : "") + "</small><small>" + esc(addr ? addr.city + " " + addr.state + " " + addr.zip : "") + "</small><small>" + esc(c && c.phones[0] ? c.phones[0].number : "") + '</small></div><div class="c-acts"><button class="icon-btn" data-go="chats" aria-label="Message">' + svg("bubble") + '</button><button class="icon-btn" data-go="calls" aria-label="Call">' + svg("phone") + "</button></div></div>" +
      (a && a.team.length ? '<div class="c-row"><i>' + svg("clipboard") + '</i><div class="c-team">' + members(a.team).map((e) => "<span>" + avatar(e) + esc(e.name) + "</span>").join("") + "</div></div>" : "") +
      ((j.tags || []).length ? '<div class="c-row"><i>' + svg("tag") + '</i><div class="c-tags">' + j.tags.map((t) => "<span>" + esc(t) + "</span>").join("") + "</div></div>" : "");

  // ---------- menus ----------
  function openMenu(html, x, y, corner, kind) {
    const m = $("createMenu");
    m.className = "menu" + (kind ? " " + kind : "");
    m.innerHTML = html;
    m.hidden = false;
    m.style.left = x + "px";
    m.style.top = y + "px";
    if (corner) {
      m.style.left = Math.max(8, x - m.offsetWidth) + "px";
      m.style.top = Math.max(8, y - m.offsetHeight) + "px";
    }
    const r = m.getBoundingClientRect();
    if (r.right > window.innerWidth - 8) m.style.left = Math.max(8, window.innerWidth - 8 - r.width) + "px";
    if (r.bottom > window.innerHeight - 8) m.style.top = Math.max(8, window.innerHeight - 8 - r.height) + "px";
  }
  function clearGhost() {
    document.querySelectorAll(".ghost").forEach((g) => g.remove());
  }
  const slotAt = (day, y) => Number(day.dataset.from) + Math.floor((y - day.getBoundingClientRect().top) / PX * 4) * 15;

  function clickSlot(day, e) {
    const start = slotAt(day, e.clientY);
    const date = day.dataset.day;
    if (ui.win) {
      const length = ui.win.end - ui.win.start;
      Object.assign(ui.win, { date, endDate: date, start, end: Math.min(1425, start + (length > 0 ? length : 60)) });
      refreshWin();
      return;
    }
    const from = Number(day.dataset.from);
    const ghost = document.createElement("div");
    ghost.className = "ghost";
    ghost.style.top = (start - from) / 60 * PX + "px";
    ghost.style.height = PX + "px";
    ghost.textContent = timeUp(start).padStart(8, "0") + " - " + timeUp(start + 60).padStart(8, "0");
    day.appendChild(ghost);
    ui.slot = { date, start, team: [D.team[0].id] };
    openSlotMenu(e);
  }

  function openSlotMenu(e) {
    openMenu('<button data-slot-new="job"><i>' + svg("wrenchPlus") + '</i>Job</button><button data-slot-new="Recurring job"><i>' + svg("repeat") + '</i>Recurring job</button><hr><button data-slot-new="Estimate"><i>' + svg("clipboard") + '</i>Estimate</button><button data-slot-new="Event"><i>' + svg("calendar") + "</i>Event</button>", e.clientX, e.clientY, "up-left");
  }

  HCP.onClick((e) => {
    const t = (s) => e.target.closest(s);
    const menu = $("createMenu");
    let b;
    if (!t("#createMenu")) clearGhost();
    if ((b = t("[data-sch-menu]"))) {
      const name = b.dataset.schMenu;
      if (!menu.hidden && ui.menuFor === name) { menu.hidden = true; return true; }
      ui.menuFor = name;
      const r = b.getBoundingClientRect();
      if (name === "color") openMenu('<button class="' + (ui.colorBy === "Area" ? "sel" : "") + '" data-sch-color="Area">Area<i class="cs-pen" data-x-ext="the areas editor">' + svg("pencil") + '</i></button><button class="' + (ui.colorBy === "Employee" ? "sel" : "") + '" data-sch-color="Employee">Employee</button>', r.left - 30, r.bottom, null, "color");
      else openMenu(D.scheduleViews.map((v) => '<button class="' + (v === ui.view ? "sel" : "") + '" data-sch-view="' + v + '">' + v + "</button>").join("") + '<hr><button data-sch-byemp><i>' + svg(ui.byEmp ? "check" : "box") + "</i>View by employee</button><p class=\"menu-note\">View by options available in Day, Week and Monday-Friday</p>", r.right + 48 - 206, r.bottom, null, "view");
      return true;
    }
    if ((b = t("[data-sch-view]"))) {
      menu.hidden = true;
      const v = b.dataset.schView;
      ui.view = v; if (v === "Dispatch") aimBoardAtToday(); HCP.render();
      return true;
    }
    if ((b = t("[data-sch-color]"))) {
      menu.hidden = true;
      if (e.target.closest(".cs-pen")) { notBuilt("Editing areas"); return true; }
      ui.colorBy = b.dataset.schColor; HCP.render();
      return true;
    }
    if ((b = t("[data-slot-new]"))) {
      menu.hidden = true;
      if (b.dataset.slotNew === "job") {
        const s = ui.slot;
        HCP.startJob({ date: s.date, endDate: s.date, start: String(s.start), end: String(s.start + 60), anytime: false, team: s.team, notify: false }, "schedule");
      } else { clearGhost(); notBuilt(b.dataset.slotNew); }
      return true;
    }
    if ((b = t("[data-sch]"))) {
      if (b.dataset.sch === "panel") ui.panel = ui.panel ? null : "calendar";
      else ui.panel = ui.panel === "unscheduled" ? "calendar" : "unscheduled";
      HCP.render();
      return true;
    }
    if (t("[data-cs-open]")) { ui.csOpen = true; HCP.render(); return true; }
    if ((b = t("[data-cs-tg]"))) { ui.calSet[b.dataset.csTg] = !ui.calSet[b.dataset.csTg]; HCP.render(); return true; }
    if (t("[data-cs-done]") || (ui.csOpen && e.target.id === "calSet")) { ui.csOpen = false; HCP.render(); return true; }

    if (t("[data-range-pick]")) { const r = t("[data-range-pick]").getBoundingClientRect(); ui.month = ui.anchor.slice(0, 7); openMenu('<div class="range-pop">' + miniMonth() + "</div>", r.left, r.bottom + 4, null, "range"); ui.menuFor = "range"; return true; }
    if ((b = t("[data-cal-nav]"))) {

      const step = !ui.win && !pick && (ui.view === "Day" || ui.view === "Schedule") ? 1 : 7;
      if (!ui.win && !pick && ui.view === "Month" && dir !== "today") { const [y, m] = target.anchor.split("-").map(Number); target.anchor = ymd(new Date(y, m - 1 + Number(dir), 1)); }
      else target.anchor = dir === "today" ? today() : addDays(target.anchor, Number(dir) * step);

    if (ui.win) {
      const w = ui.win;

      if (t("[data-w-save]")) { saveWindow(); return true; }
      if ((b = t("[data-w-tab]"))) { w.tab = b.dataset.wTab; HCP.render(); return true; }
      if ((b = t("[data-w-fold]"))) { w.fold[b.dataset.wFold] = !w.fold[b.dataset.wFold]; HCP.render(); return true; }
      if ((b = t("[data-w-team-del]"))) { w.team = w.team.filter((id) => id !== b.dataset.wTeamDel); HCP.render(); return true; }
      if ((b = t("[data-w-emp-del]"))) { w.emps = w.emps.filter((id) => id !== b.dataset.wEmpDel); HCP.render(); return true; }
      if (t("[data-w-suggest]")) {

  document.addEventListener("input", (e) => {

  document.addEventListener("change", (e) => {

      $("schPanel").innerHTML = calendarPanel();
      return;
    }

      $("schPanel").innerHTML = calendarPanel();
      return;

    const w = ui.win;

    if (el.matches("[data-w-team]") && el.value) { w.team.push(el.value); HCP.render(); return; }

    if (el.matches("[data-w-dur]")) {
      const m = el.value.trim().match(/^(\d{1,2}):(\d{2})$/);

      if (mins > 0) w.duration = mins;
      else toast("Enter the duration as hours and minutes, like 02:00");
      HCP.render();
      return;
    }
    if (!el.dataset.w) return;
    const key = el.dataset.w;
    if (key === "date") {
      if (!el.value) return;
      w.date = el.value;
      w.endDate = el.value;
      w.anchor = el.value;
    } else if (key === "endDate") {
      if (el.value) w.endDate = el.value;
    } else if (key === "start") {
      const length = w.end - w.start;
      w.start = Number(el.value);
      w.end = Math.min(1425, w.start + length);
    } else if (key === "end") {
      w.end = Number(el.value);
    } else if (key === "arrival") {
      w.arrival = Number(el.value);
    } else if (key === "repeat") {
      if (el.value !== "Does not repeat") { notBuilt("Repeating jobs"); el.value = "Does not repeat"; }
      return;
    } else if (key === "notify") {
      w.notify = el.checked;
      return;
    } else if (key === "anytime") {
