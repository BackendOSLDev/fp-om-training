<script>window.HCP_CONTENT = {"hm2-1": {"id": "m2-1", "sec": "module-2", "title": "Schedule a job with an arrival window", "badge": "All plans", "bcls": "b-all", "goal": "Put a job on the calendar with a date, a time, a tech and an arrival window the customer can count on.", "why": "The arrival window is what the customer hears. A job with no tech or no window leads to calls asking where the tech is.", "steps": ["Open the job. In the action bar, click the first button, <b>Add appointment</b>. Once the job is scheduled, the date and time show under it.", "Set the start date and time, and the end time.", "Add the tech with <b>Edit team</b>.", "Pick the <b>Arrival window</b> (None, 15 minutes, 30 minutes, 1 to 4 hours). The window starts at the scheduled time.", "Leave <b>Notify customer</b> ticked unless your manager says not to. Click <b>Save</b>."], "watch": ["The arrival window doesn't move the job on the calendar. A 9:00 job with a 2-hour window still sits at 9:00.", "The company default window lives in Settings &gt; Booking &gt; General. It covers new jobs, estimates and online bookings.", "Estimates need at least one employee. Jobs can be saved with no one assigned, so check the team every time."], "verify": [], "qs": [["A job is set for 12:00 with a 30-minute window. What does the customer get?", ["12:00 exactly", "12:00 to 12:30", "11:30 to 12:30"], 1, "The window starts at the scheduled time."], ["Which of these can be saved with no employee on it?", ["A job", "An estimate"], 0, "Jobs can be unassigned. Estimates need at least one employee."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Jobs > #2260 (Ana Kowalski, not scheduled) > Add appointment. Set a day this week, 9:00am to 11:00am, Michael Ortiz, arrival window 2 hours. Save.", "help": [["Scheduling Jobs and Estimates", "https://help.housecallpro.com/en/articles/6758788-scheduling-jobs-and-estimates"], ["Setting Your Arrival Window", "https://help.housecallpro.com/en/articles/918018-how-do-i-set-an-arrival-window"]], "vids": [["Pro Power Hour: Scheduling & Dispatching, Q&A on arrival windows", "https://www.youtube.com/watch?v=Pyq6xaF_XlQ&t=2437s", " \u00b7 plays 40:37 to 43:12 (3 min) of a 57 min session \u00b7 Aug 2026"]], "vnote": "No video shows setting the arrival window yet. This clip is Pros talking about how they use arrival windows."}, "hm2-2": {"id": "m2-2", "sec": "module-2", "title": "Assign or swap the tech", "badge": "All plans", "bcls": "b-all", "goal": "Put the right tech on a job, or move it to another tech, without losing the time.", "why": "A job on the wrong tech's schedule gets missed or doubled. The customer may also get a text with the wrong name.", "steps": ["Open the job.", "On a job with one visit, go to <b>Line items</b> and click the pencil next to the team. Tick the new tech, untick the old one, and click <b>Save</b>.", "On a job with appointments, change the team in the <b>Appointments</b> section instead.", "Or open the schedule window and change the team there, then <b>Save</b>."], "watch": ["The first employee listed is treated as the lead tech. There's no separate lead role.", "Changing the tech or the time sends the Scheduled message to the customer again.", "There are no crews in Housecall Pro. Put each person on the job."], "verify": [], "qs": [["You change the tech on a scheduled job. What can the customer get?", ["Nothing", "A new Scheduled message", "An invoice"], 1, "Changing the tech or time sends the Scheduled message again."], ["Who counts as the lead tech?", ["The Admin", "The first employee listed", "Nobody"], 1, "The first employee listed is treated as the lead."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Jobs > #2259 (Lena Rosati) > swap Dana Mills for Francisco Diaz. Keep the same time.", "help": [["Scheduling and Calendar FAQ", "https://help.housecallpro.com/en/articles/9483598-scheduling-and-calendar-faq"], ["Scheduling Jobs and Estimates", "https://help.housecallpro.com/en/articles/6758788-scheduling-jobs-and-estimates"]], "vids": [["Pro Power Hour: Scheduling & Dispatching, find a time and reassigning jobs", "https://www.youtube.com/watch?v=Pyq6xaF_XlQ&t=1325s", " \u00b7 plays 22:05 to 28:22 (6 min) of a 57 min session \u00b7 Aug 2026"], ["Pro Power Hour: Dispatching and April Platform Updates, bulk reassign and reschedule", "https://www.youtube.com/watch?v=yi6PI8shnx4&t=905s", " \u00b7 plays 15:05 to 17:33 (2 min) of a 31 min session \u00b7 May 2026"]]}, "hm2-3": {"id": "m2-3", "sec": "module-2", "title": "Work the unscheduled jobs list", "badge": "All plans", "bcls": "b-all", "goal": "Get every unscheduled job onto the calendar, or close it out.", "why": "Unscheduled jobs are booked work nobody is going to. Each one is a customer waiting and revenue sitting still.", "steps": ["Open <b>Schedule</b>. Click the calendar icon with the red x (top left). The unscheduled list opens.", "Drag a job tile onto the calendar at the right day and time. The schedule window opens with the time filled in.", "Check the tech, the window and Notify customer, then <b>Save</b>.", "If the work is already done, finish the job instead (untick Notify customer)."], "watch": ["The list only clears when each job is scheduled or completed.", "Unscheduled estimates don't show in this list. Find them on the customer's Estimates tab."], "verify": [], "qs": [["Where do you find unscheduled jobs?", ["Settings", "The calendar icon with a red x on Schedule", "Reports"], 1, "The Unscheduled icon on the Schedule page."], ["How does the list get cleared?", ["Delete the jobs", "Schedule or complete each job", "It clears every night"], 1, "Each job must be scheduled or completed."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Schedule > unscheduled icon > drag the Sam Chen tile (job #2258) onto tomorrow at 10:00am. Pick a tech and save. The tiles show the customer name, not the job number.", "help": [["How to Use the Schedule Tab (Calendar)", "https://help.housecallpro.com/en/articles/6367496-how-to-use-the-schedule-tab-calendar"], ["Jobs & Estimates: Unschedule and Undo Actions", "https://help.housecallpro.com/en/articles/2823066-jobs-estimates-unschedule-and-undo-actions"]], "vids": [["Pro Power Hour: Scheduling & Dispatching, unscheduled jobs", "https://www.youtube.com/watch?v=Pyq6xaF_XlQ&t=582s", " \u00b7 plays 9:42 to 10:19 (1 min) of a 57 min session \u00b7 Aug 2026"], ["Pro Power Hour: Reporting, unscheduled jobs on the homepage", "https://www.youtube.com/watch?v=3lswUEKtC38&t=405s", " \u00b7 plays 6:45 to 7:21 (1 min) of a 52 min session \u00b7 Jan 2026"]]}, "hm2-4": {"id": "m2-4", "sec": "module-2", "title": "Reschedule or cancel a job", "badge": "All plans", "bcls": "b-all", "goal": "Move a job to a new time, or take it off the calendar the right way.", "why": "Unschedule, cancel and delete do different things. Picking the wrong one either texts the customer by mistake or loses the job.", "steps": ["To move it: open the job and click the first button in the action bar (it shows the date and time), or the pencil on the visit in the <b>Appointments</b> card. Change the date or time and <b>Save</b>.", "To take it off the calendar and keep it: use <b>Unschedule job</b>. No message goes out.", "To cancel: click the gear and wrench icon, <b>Cancel job</b>, choose <b>Notify Customer</b> or not, then <b>Yes, Cancel the Job</b>.", "To delete: gear and wrench icon, <b>Delete job</b>, then <b>Delete</b>. Deleted jobs can be restored from Jobs &gt; Actions."], "watch": ["Cancel sends the customer a text and an email if Notify Customer is ticked. Unschedule and delete send nothing.", "Deleting a job deletes its invoice too.", "A job with appointments can't be unscheduled. Delete the appointments first.", "A restored job has to be scheduled again by hand."], "verify": [], "qs": [["A customer wants to move Friday's visit and hasn't picked a new day. What do you do?", ["Cancel the job", "Unschedule the job", "Delete the job"], 1, "Unschedule keeps the job and sends nothing."], ["What happens to the invoice when you delete a job?", ["It stays", "It's deleted too", "It's voided"], 1, "Deleting a job deletes its invoice."]], "pcls": "p-chk", "pstat": "Partly in the practice copy", "task": "Jobs > #2263 (Lena Rosati) > click the first button in the action bar (it shows the date) > move it one day later and save. Unschedule, Cancel and Delete aren't in the practice copy yet.", "help": [["What's the difference between Unschedule, Cancel, and Delete?", "https://help.housecallpro.com/en/articles/2865052-unschedule-vs-cancel-vs-delete"], ["Jobs & Invoices: How to Delete, Cancel, and Restore", "https://help.housecallpro.com/en/articles/2832091-jobs-invoices-how-to-delete-cancel-and-restore"], ["Jobs & Estimates: Unschedule and Undo Actions", "https://help.housecallpro.com/en/articles/2823066-jobs-estimates-unschedule-and-undo-actions"]], "vids": [["Pro Power Hour: Technician Onboarding Wrap-up + Office Staff Onboarding, deleting and canceling jobs", "https://www.youtube.com/watch?v=Lukm3HqgLKY&t=3079s", " \u00b7 plays 51:19 to 52:12 (1 min) of a 59 min session \u00b7 Sep 2026"], ["Pro Power Hour: Dispatching and April Platform Updates, bulk reassign and reschedule", "https://www.youtube.com/watch?v=yi6PI8shnx4&t=905s", " \u00b7 plays 15:05 to 17:33 (2 min) of a 31 min session \u00b7 May 2026"]]}, "hm2-5": {"id": "m2-5", "sec": "module-2", "title": "Add a second appointment to a job", "badge": "All plans", "bcls": "b-all", "goal": "Book a return visit on the same job, so the work stays on one invoice.", "why": "A second job for the same work splits the invoice and the job history. Appointments keep it all together.", "steps": ["Check that appointments are on: Settings &gt; Jobs &gt; General &gt; <b>Appointments</b>.", "Open the job. In the <b>Appointments</b> section, click <b>+ Appointment</b>.", "Set the date, time and team for the next visit, then save.", "Each appointment shows as its own tile on the
