<script>window.HCP_CONTENT = {"hm5-1": {"id": "m5-1", "sec": "module-5", "title": "Check QuickBooks sync alerts", "badge": "All plans", "bcls": "b-all", "goal": "Clear QuickBooks sync alerts every week so the books match Housecall Pro.", "why": "A payment that never reaches QuickBooks is money the bookkeeper can't see. Our audits often find dozens of old sync alerts nobody opened.", "steps": ["Click the <b>QuickBooks</b> icon at the top right.", "Read each alert. Fix the cause in QuickBooks first (for example a tax rate name).", "Then click the three dots next to the alert and <b>Sync again</b>.", "For Invoice Number Already Taken, pick a regenerate option and click <b>Submit</b>."], "watch": ["Dismiss can't be undone. Only dismiss an alert you're sure about.", "Tax rate names must match exactly in both systems, down to spaces and capitals.", "Housecall Pro doesn't support compound tax rates.", "Editing a job brings a dismissed alert back."], "verify": [], "qs": [["An alert says a tax rate doesn't match. What do you fix first?", ["Housecall Pro", "QuickBooks, then sync again", "Nothing"], 1, "Fix the cause in QuickBooks, then sync again."], ["Can you undo Dismiss?", ["Yes", "No"], 1, "Dismiss can't be undone."]], "pcls": "p-no", "pstat": "Not in the practice copy yet", "task": "Read only. QuickBooks isn't in the practice copy.", "help": [["QuickBooks Online: Sync Alerts", "https://help.housecallpro.com/en/articles/975825-common-quickbooks-online-errors"], ["QuickBooks Online: Settings in Housecall Pro", "https://help.housecallpro.com/en/articles/1835834-quickbooks-online-settings-in-housecall-pro"]], "vids": [["Pro Power Hour: QuickBooks Online Integration, the QuickBooks box on a job and pushing an invoice", "https://www.youtube.com/watch?v=A0JZu5c2V1Q&t=1185s", " \u00b7 plays 19:45 to 21:28 (2 min) of a 57 min session \u00b7 Dec 2024"], ["Pro Power Hour: QuickBooks Online Integration Pt. 2, Q&A on sync errors", "https://www.youtube.com/watch?v=X4GYeOiylFc&t=1357s", " \u00b7 plays 22:37 to 24:13 (2 min) of a 51 min session \u00b7 Feb 2025"]], "vnote": "No video shows the QuickBooks alert screen yet."}, "hm5-2": {"id": "m5-2", "sec": "module-5", "title": "Keep job costs on jobs", "badge": "All plans", "bcls": "b-all", "goal": "Get real costs onto jobs so each job shows its true profit.", "why": "Without costs, every job looks 100% profit and the owner can't tell good work from bad.", "steps": ["Ask your manager which job costing settings are on (Settings > Jobs > <b>Costs & Materials</b>): Show job costing breakdown, Material job inputs, Miscellaneous job inputs and Show expected job costs.", "Put parts on the job as <b>materials</b> with a cost. Click the pencil on the line item, fill in <b>Unit Cost</b> next to <b>Unit Price</b>, then <b>Save</b>.", "Costs the customer shouldn't see go in the job's <b>job inputs</b> (materials or other costs). They count in job costing but don't change the invoice.", "Check the job: open its <b>Job Costing Breakdown</b>.", "Reports: <b>Reporting</b>, <b>Reports</b>, <b>Jobs</b>, then the Job Costing reports (for example Profit by date)."], "watch": ["A unit cost on a service doesn't count as a real cost. It only shows as an expected cost, and only when Show expected job costs is on.", "Revenue for job costing is the job subtotal minus discounts. Tax and tips are left out.", "Labor cost uses each person's rate times time on the job, including travel. It needs time tracking on and a fully loaded rate (pay plus added costs) for each person.", "A rate change doesn't change labor cost already tracked.", "Job inputs don't carry over to recurring jobs."], "verify": [], "qs": [["What happens to profit when no costs are entered?", ["It looks too high", "It looks too low", "Nothing"], 0, "No costs makes every job look like pure profit."], ["A part is added as a service with a unit cost. Does it count as a real cost?", ["Yes", "No, only as an expected cost"], 1, "Service costs are expected costs. Add parts as materials with a cost."], ["Is tax counted in job costing revenue?", ["Yes", "No"], 1, "Tax and tips are left out."]], "pcls": "p-chk", "pstat": "Partly in the practice copy", "task": "Settings > Jobs > Costs & Materials: read which job costing switches are on. Line item unit cost isn't in the practice copy's line editor yet.", "help": [["Job Costing: Complete Set-Up Guide", "https://help.housecallpro.com/en/articles/6536636-job-costing-complete-set-up-guide"], ["Job Inputs and Flat Rate Services", "https://help.housecallpro.com/en/articles/6973952-job-inputs-and-flat-rate-services"]], "vids": [["Pro Power Hour: Job Costing/Commissions, commissions, labor and materials on a job", "https://www.youtube.com/watch?v=-JLe4lQ0230&t=1475s", " \u00b7 plays 24:35 to 32:55 (8 min) of a 52 min session \u00b7 Apr 2026"], ["Pro Power Hour: Job Costing, costs on a job and receipts", "https://www.youtube.com/watch?v=o3DNDcozP_c&t=846s", " \u00b7 plays 14:06 to 18:05 (4 min) of a 39 min session \u00b7 Mar 2025"]]}, "hm5-3": {"id": "m5-3", "sec": "module-5", "title": "Review timesheets before payroll", "badge": "All plans", "bcls": "b-all", "goal": "Check every shift before payroll so pay is right.", "why": "A missed clock-out pays someone for 20 hours. A missing shift means a short paycheck and an upset tech.", "steps": ["Open the <b>Timesheet</b> app (My Apps, or Team &gt; Time &amp; Attendance).", "Look for missing clock-outs and shifts that look too long.", "Click a shift to fix it, or <b>+ Time Entry</b> for a missed one. Click <b>Save</b>.", "Mark checked hours with the Paid icon once payroll is done."], "watch": ["Employees can only clock in and out in the mobile app.", "Travel and time on jobs isn't part of the clocked-in total.", "Archived employees drop off the timesheet report, so finish their hours first."], "verify": [], "qs": [["Where do employees clock in?", ["The web app", "The mobile app"], 1, "Only in the mobile app."], ["A tech forgot to clock out. What do you do?", ["Leave it", "Fix the shift before payroll", "Delete the employee"], 1, "Fix the shift before payroll."]], "pcls": "p-chk", "pstat": "Partly in the practice copy", "task": "Team > Time & Attendance: open the grid and the list view. Editing shifts isn't in the practice copy yet.", "help": [["Time Tracking Overview Guide", "https://help.housecallpro.com/en/articles/2795146-time-tracking-overview-guide"]], "vids": [["Pro Power Hour: Employee Management, time tracking and time cards", "https://www.youtube.com/watch?v=K3BrhpSj7Pw&t=1651s", " \u00b7 plays 27:31 to 32:23 (5 min) of a 49 min session \u00b7 Jul 2025"], ["Pro Power Hour: Time Tracking, the time tracking dashboard and fixing time", "https://www.youtube.com/watch?v=KAwymNGY_1g&t=2029s", " \u00b7 plays 33:49 to 38:23 (5 min) of a 56 min session \u00b7 Oct 2026"]]}, "hm5-4": {"id": "m5-4", "sec": "module-5", "title": "Set up a new hire's login", "badge": "All plans", "bcls": "b-all", "goal": "Give a new hire their own login with the right role.", "why": "Shared logins hide who did what. The wrong role either blocks the person or gives them too much.", "steps": ["Open <b>Team</b>, <b>Team Members</b>, <b>Add team member</b>.", "Fill in preferred name, last name, email and mobile. All are required.", "Pick the role: Admin, Office staff or Field tech. Tick only the permissions they need.", "Click <b>Save</b>. The invite goes by email and text."], "watch": ["Field techs can only log in on the mobile app. Office people need Office staff.", "Permissions can't be changed in the mobile app.", "Only one person can be the Dispatch / Messaging point of contact."], "verify": [], "qs": [["A new dispatcher needs the web app. Which role?", ["Field tech", "Office staff"], 1, "Field techs are mobile only."], ["Which details are required?", ["Name only", "Preferred name, last name, email and mobile", "Email only"], 1, "All four are required."]], "pcls": "p-no", "pstat": "Not in the practice copy yet", "task": "Read only <script>/* Academy: what happened in each knowledge check, saved for the trainer (lesson_events rows, part "open"):

   finished again after the first time = another "practice" row with its hints. Called from inside the lesson engine. */
function acadKc(what, id, mode, done, steps, hints){ try{
  var T = window.FPTrack; if(!T || mode !== "practice") return;
  var me = (T.me && T.me()) || {}; if(!me.id) return;
  if(what === "hint"){ T.event(id, "open", {hints:1}); return; }
  if(what === "left"){ if(done === steps || (!done && !hints)) return; T.event(id, "open", {score:done, total:steps, hints:hints}); return; }
  if(what === "done"){ var K = "acad-kcdone:" + me.id, o = JSON.parse(localStorage.getItem(K) || "{}");
    if(o[id]) T.event(id, "practice", {hints:hints}); else { o[id] = 1; localStorage.setItem(K, JSON.stringify(o)); } }
}catch(e){} }
(function seedKcDone(n){ try{ var T = window.FPTrack, me = T && T.me && T.me();
  if(!me || !me.id){ if(n < 20) setTimeout(function(){ seedKcDone(n + 1); }, 1000); return; }
  T.myEvents().then(function(rows){ var K = "acad-kcdone:" + me.id, o = JSON.parse(localStorage.getItem(K) || "{}");
    (rows || []).forEach(function(r){ if(r.part === "practice") o[r.lesson_id] = 1; }); localStorage.setItem(K, JSON.stringify(o)); });
}catch(e){} })(0);
