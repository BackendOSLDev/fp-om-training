<script>window.HCP_CONTENT = {"hm3-1": {"id": "m3-1", "sec": "module-3", "title": "Create and send an invoice from a job", "badge": "All plans", "bcls": "b-all", "goal": "Send the invoice as soon as the job is finished.", "why": "Every day an invoice sits unsent is a day the money isn't coming. In our audits, finished jobs with no invoice are one of the biggest money leaks.", "steps": ["Open the finished job.", "Click <b>Invoice</b> in the action bar. The send window opens.", "Pick <b>Email</b>, <b>Text</b> or <b>Email &amp; Text</b>. Check the address and the message.", "Click <b>Send</b>. The Invoice step shows done.", "Several invoices to send? Open <b>Invoices</b>, tick them, click the <b>Bulk send</b> icon, then <b>Send invoices</b>."], "watch": ["Texts only go to a Mobile number.", "Check the line items and the total before you send. The customer sees exactly what's on the job."], "verify": ["The help center page on sending an invoice from a job wasn't read for this lesson. The steps follow the practice copy's Send invoice window, which was copied from the live window. Check on a live account."], "qs": [["When should the invoice go out?", ["At month end", "When the job is finished", "When the customer asks"], 1, "Send it when the job is finished."], ["A customer has only a home phone. Can the invoice go by text?", ["Yes", "No, use email"], 1, "Texts only go to a Mobile number."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Jobs > #2264 (Sam Chen) > OMW, Start, Finish, then Invoice. Send it by email.", "help": [["Invoice List View", "https://help.housecallpro.com/en/articles/8959660-invoice-list-view"], ["Batch Invoicing: Send Invoices & Take Payments", "https://help.housecallpro.com/en/articles/2782323-batch-invoicing-send-invoices-take-payments"]], "vids": [["Pro Power Hour: Office Staff Onboarding, invoicing, payments and batch invoicing", "https://www.youtube.com/watch?v=LnlCsSc0gV8&t=2336s", " \u00b7 plays 38:56 to 45:45 (7 min) of a 61 min session \u00b7 Nov 2025"]]}, "hm3-2": {"id": "m3-2", "sec": "module-3", "title": "Find finished jobs with no invoice", "badge": "All plans", "bcls": "b-all", "goal": "Catch every finished job that was never invoiced.", "why": "A finished job with no invoice is free work. Nobody chases money they don't know is owed.", "steps": ["Open <b>Jobs</b> and click the <b>Completed</b> tab.", "Open <b>Invoices</b> and click <b>Unsent</b>.", "Every completed job should have a sent invoice. Open any that don't and send it.", "On Pipeline, the Jobs board shows Completed, Invoice Sent and Invoice Paid. A job stuck in Completed has no sent invoice."], "watch": ["Quick views like Unsent can't take extra filters. Use All for filters.", "Invoice Paid on Pipeline only shows jobs paid in the last 7 days."], "verify": [], "qs": [["A job sits in the Completed column on the Pipeline Jobs board. What's missing?", ["A tech", "A sent invoice", "A lead source"], 1, "Completed jobs move to Invoice Sent once the invoice goes out."], ["Which invoice quick view shows invoices that never went out?", ["Due", "Unsent", "Past Due"], 1, "Unsent."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Pipeline > Jobs. Find the jobs in Completed. Then Invoices > Unsent and match them up.", "help": [["Invoice List View", "https://help.housecallpro.com/en/articles/8959660-invoice-list-view"], ["Getting Started with Pipeline", "https://help.housecallpro.com/en/articles/6185127-getting-started-with-pipeline"]], "vids": [["Pro Power Hour: Homepage & Dashboard, tracking jobs that still need billing", "https://www.youtube.com/watch?v=7PggUpZAzKs&t=1295s", " \u00b7 plays 21:35 to 26:11 (5 min) of a 28 min session \u00b7 Dec 2025"], ["Pro Power Hour: Intake & Pipeline, the Jobs pipeline", "https://www.youtube.com/watch?v=-cKYanX2oT0&t=650s", " \u00b7 plays 10:50 to 16:07 (5 min) of a 53 min session \u00b7 Jul 2026"]]}, "hm3-3": {"id": "m3-3", "sec": "module-3", "title": "Record a cash or check payment", "badge": "All plans", "bcls": "b-all", "goal": "Record a cash or check payment on the right invoice, the same day.", "why": "An unrecorded payment shows as owed money. The customer gets reminders for a bill they paid.", "steps": ["Open the job or invoice and click <b>Pay</b>.", "Check the <b>Amount</b>.", "Pick <b>Cash</b> or <b>Check</b>. Put the check number in the payment note.", "Keep <b>Notify customer</b> ticked to send a receipt.", "Click <b>Paid - cash</b> or <b>Paid - check</b>."], "watch": ["One check for several jobs: record Paid - check on each job.", "A payment can't be more than what's owed.", "With several open invoices on a job, the payment goes to the oldest one first."], "verify": [], "qs": [["Where does the check number go?", ["Private notes", "The payment note", "Tags"], 1, "Put it in the payment note."], ["One check pays three jobs. How do you record it?", ["On one job only", "Paid - check on each job", "As Other"], 1, "Record it on each job."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Invoices > #2252 (Lena Rosati, $295) > Pay > Check. Note: check #1043. Record it.", "help": [["Take Payments", "https://help.housecallpro.com/en/articles/2785726-take-payments"], ["Marking Invoices and Jobs as paid", "https://help.housecallpro.com/en/articles/7062125-marking-invoices-and-jobs-as-paid"]], "vids": [["Pro Power Hour: Technician Onboarding & Mobile App Crash Course, the Pay button: cash, check or other", "https://www.youtube.com/watch?v=S-KSsam9Agc&t=2641s", " \u00b7 plays 44:01 to 44:28 (1 min) of a 60 min session \u00b7 Nov 2025"]]}, "hm3-4": {"id": "m3-4", "sec": "module-3", "title": "Save a card on file and charge it", "badge": "All plans", "bcls": "b-all", "goal": "Save the customer's card on file, and charge it only when it's agreed.", "why": "A card on file gets the office paid without chasing. Charging the wrong amount loses trust fast.", "steps": ["Open the customer's profile, Profile tab, <b>Payment method</b>.", "If the customer gives the card on the phone: click <b>Add credit card</b>, enter the card number, expiration, CVC and zip, then <b>Add card</b>.", "If the customer would rather type it in: click <b>Request card on file</b>, pick <b>Email</b> or <b>Text message</b>, and <b>Send request</b>.", "To charge it: open the job, click <b>Pay</b>, pick <b>Card on file</b>, check the amount and click <b>Charge card</b>.", "To remove or replace a card: the three dots next to it, then <b>Remove</b> or <b>Replace</b>."], "watch": ["Jobs paid with a card on file carry a 3.49% card-not-present fee.", "Always confirm the amount with the customer before you charge.", "A charge on a card on file always emails the customer a receipt.", "Requests by text only work once the company is registered for texting.", "Ask your manager which way your company takes cards."], "verify": [], "qs": [["The customer doesn't want to read the card number out on the phone. What do you do?", ["Write it in the notes", "Send a Request card on file", "Text it to the tech"], 1, "Send the request so the customer enters it."], ["What fee does a card on file carry?", ["None", "3.49%", "10%"], 1, "3.49% card-not-present."]], "pcls": "p-no", "pstat": "Not in the practice copy yet", "task": "Read only. The practice copy never takes card numbers, so Add card and Request card only explain.", "help": [["Card on File", "https://help.housecallpro.com/en/articles/6570769-card-on-file"]], "vids": [["Pro Power Hour: Card on File, saving a card and charging it", "https://www.youtube.com/watch?v=5y_FtIYPovM&t=250s", " \u00b7 plays 4:10 to 6:13 (2 min) of a 26 min session \u00b7 Oct 2025"], ["Pro Power Hour: Invoicing, card on file and request a card", "https://www.youtube.com/watch?v=mYvajLXP0TQ&t=2527s", " \u00b7 plays 42:07 to 47:17 (5 min) of a 49 min session \u00b7 Sep 2026"]]}, "hm3-5": {"id": "m3-5", "sec": "module-3", "title": "Turn on and use invoice reminders", "badge": "All plans", "bcls": "b-all", "goal": "Let Housecall Pro re ions", "https://www.youtube.com/watch?v=3m4KQqQ3jwY&t=950s", " \u00b7 plays 15:50 to 18:16 (2 min) of a 27 min session \u00b7 Apr 2025"]]}, "hm3-6": {"id": "m3-6", "sec": "module-3", "title": "Read unpaid invoices by age", "badge": "All plans", "bcls": "b-all", "goal": "Know how much is owed and how old it is, every week.", "why": "The older a bill gets, the less likely it's paid. Calling at 30 days works better than at 90.", "steps": ["Open <b>Invoices</b> and click <b>Past Due</b>.", "Sort by due date. Start with the oldest.", "For a full view, open <b>Reporting</b>, <b>Reports</b>, <b>Invoices</b>, then <b>Aging (past due invoices)</b> or <b>Open invoices</b>.", "Open invoices split into No Due Date, Due &amp; Sent, Due &amp; Unsent, Past Due &amp; Sent and Past Due &amp; Unsent."], "watch": ["An open invoice with no due date doesn't show as past due. Check No Due Date too.", "With a due term like Due upon completion of work, there's no due date until the job is marked finished.", "The Aging and Open invoices reports start at invoices created in the last 365 days. Pick a longer range in the report's date drop-down to see older ones.", "Report totals include tax and leave out tips."], "verify": [], "qs": [["Which open invoices never show as past due?", ["Ones with no due date", "Ones over 90 days", "Paid ones"], 0, "No due date means never past due."], ["Which quick view shows overdue bills?", ["Unsent", "Past Due", "All"], 1, "Past Due."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Invoices > Past Due. Write down each one, its customer and how much is owed.", "help": [["Invoices Reporting", "https://help.housecallpro.com/en/articles/9834481-invoices-reporting"], ["Invoice List View", "https://help.housecallpro.com/en/articles/8959660-invoice-list-view"], ["Managing Reports", "https://help.housecallpro.com/en/articles/7336458-managing-reports"]], "vids": [["Pro Power Hour: Reporting, open invoices and aging reports", "https://www.youtube.com/watch?v=ykteJWfi_EE&t=2226s", " \u00b7 plays 37:06 to 39:11 (2 min) of a 56 min session \u00b7 Jul 2026"]]}, "hm3-7": {"id": "m3-7", "sec": "module-3", "title": "Void an invoice", "badge": "All plans", "bcls": "b-all", "goal": "Fix a wrong progress invoice the right way.", "why": "Deleting a job to fix an invoice loses the job history and the invoice with it.", "steps": ["With progress invoicing on, open the job's invoice summary, click the three dots on the invoice, <b>Void</b>, then <b>Void Invoice</b>.", "To fix an amount or due date on a progress invoice, void it and make a new one.", "A void doesn't give money back. To refund a payment, see lesson M3-10."], "watch": ["A voided invoice can't be marked paid. It shows Void.", "Cancelling or deleting a job cancels its invoices. They show as Canceled on the invoice list."], "verify": [], "qs": [["Does voiding an invoice refund the customer?", ["Yes", "No"], 1, "Voiding doesn't refund a payment."], ["A progress invoice has the wrong due date. How do you fix it?", ["Edit it", "Void it and make a new one", "Delete the job"], 1, "Void and re-invoice."]], "pcls": "p-no", "pstat": "Not in the practice copy yet", "task": "Read only. Void isn't in the practice copy yet.", "help": [["Invoice Actions and Summary", "https://help.housecallpro.com/en/articles/8160826-invoice-actions-and-summary"], ["Progress Invoicing Basics and FAQs", "https://help.housecallpro.com/en/articles/8142156-progress-invoicing-basics-and-faqs"], ["Invoice List View", "https://help.housecallpro.com/en/articles/8959660-invoice-list-view"]], "vids": [["Pro Power Hour: Invoicing, invoice settings and voiding", "https://www.youtube.com/watch?v=mYvajLXP0TQ&t=251s", " \u00b7 plays 4:11 to 9:56 (6 min) of a 49 min session \u00b7 Sep 2026"], ["Pro Power Hour: Technician Onboarding Wrap-up + Office Staff Onboarding, managing invoices and voiding", "https://www.youtube.com/watch?v=Lukm3HqgLKY&t=2955s", " \u00b7 plays 49:15 to 51:25 (2 min) of a 59 min session \u00b7 Sep 2026"]]}, "hm3-8": {"id": "m3-8", "sec": "module-3", "title": "Take a deposit or a progress payment", "badge": "All plans", "bcls": "b-all", "goal": "Take part of the money up front or as the work goes, and see what's still owed.", "why": "Big jobs paid all at the end leave the company carrying the cost of materials and labor.", "steps": ["For a part payment: open the job, click <b>Pay</b>, lower the <b>Amount</b>, pick the method and record it.", "For planned stages, ask your manager whether <b>Progressive invoicing</b> is on (Settings &gt; Invoices &gt; Configuration).", "With it on, click <b>+ Invoice</b> on the job and set a percent or a dollar amount in <b>Details</b>.", "Deposits taken on an approved estimate copy over to the job."], "watch": ["You can't take more than the invoice cost, and can't invoice over 100% of the job.", "Progress invoicing only shows on jobs created after it's turned on.", "Quick views on the invoice list allow part payments unless progress invoicing is on."], "verify": [], "qs": [["Can you take a payment bigger than what's owed?", ["Yes", "No"], 1, "Only at or below the invoice cost."], ["Where is progressive invoicing turned on?", ["Settings > Invoices > Configuration", "The job", "Reports"], 0, "Settings > Invoices > Configuration."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Invoices > #2249 (Northgate Homes, $650) > Pay > Cash, amount $200. Then check what's still owed.", "help": [["Partial Payments", "https://help.housecallpro.com/en/articles/937862-partial-payments"], ["Progress Invoicing Basics and FAQs", "https://help.housecallpro.com/en/articles/8142156-progress-invoicing-basics-and-faqs"]], "vids": [["Pro Power Hour: Invoicing, deposits and progress billing on a job", "https://www.youtube.com/watch?v=mYvajLXP0TQ&t=1439s", " \u00b7 plays 23:59 to 31:57 (8 min) of a 49 min session \u00b7 Sep 2026"], ["Pro Power Hour: Progress Invoicing & Invoice Reminders, turning on progress invoicing", "https://www.youtub
