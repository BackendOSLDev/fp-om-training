<script>window.HCP_CONTENT = {"hf-1": {"id": "f-1", "sec": "foundations", "title": "Create a new customer", "badge": "All plans", "bcls": "b-all", "goal": "Add a new customer with everything the office needs later: name, cell number, address, type and lead source.", "why": "Every job, estimate and invoice hangs off the customer. A wrong cell number means no texts go out. A missing lead source means the owner can't tell which ads pay.", "steps": ["Search first. Type the caller's name or phone in Search records at the top. If they're already there, use that record and stop here.", "Click <b>Create</b> (top left), then <b>Customer</b>. The <b>Add new customer</b> window opens.", "Under Contact Info, type the first and last name. Put the cell number in <b>Mobile</b>, not Home or Work.", "Add the email. Leave the type as <b>Homeowner</b>, or pick <b>Business</b> for a company and fill in Company.", "Under Address, start typing and pick the match from the dropdown list.", "In the Notes section, set the <b>Lead source</b>. Add customer notes or tags only if your company uses them.", "Make sure <b>Send notifications</b> is ticked (bottom left), unless your manager said otherwise. Click <b>Create customer</b>."], "watch": ["A cell number typed in Home or Work won't get texts. HCP only texts the Mobile number.", "Pick the address from the dropdown. A typed address can set the wrong time zone on the job.", "Unticking Send notifications turns off every notification for that customer, not just one.", "Our audits found many customers saved with no lead source, so HCP lets you skip it. Fill it in every time."], "verify": [], "qs": [["A caller gives you his cell number. Where does it go?", ["Home", "Mobile", "Work"], 1, "Mobile. HCP only texts the Mobile number."], ["What do you do before you click Create?", ["Search for the caller", "Ask for a card", "Call the tech"], 0, "Search first, so you don't make a duplicate."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Create > Customer (or + Create customer on the Customers page). Create Rosa Delgado, cell (555) 010-0181, 9 Birch Ln, Riverton, NY 10990, Homeowner, lead source Google Search. The practice copy has plain address fields with no suggestions, so type the address in.", "help": [["Adding New Customers", "https://help.housecallpro.com/en/articles/2813289-adding-new-customers"], ["Customer Profile Overview", "https://help.housecallpro.com/en/articles/9764383-customer-profile-overview"]], "vids": [["Managing customers (HCP onboarding video)", "https://fast.wistia.net/embed/iframe/7db7uz2y9l", " \u00b7 2 min video \u00b7 2024"]]}, "hf-2": {"id": "f-2", "sec": "foundations", "title": "Add a second address or a bill-to customer", "badge": "All plans", "bcls": "b-all", "goal": "Keep one customer record when someone owns more than one property, and bill the right person when someone else pays.", "why": "A second record for the same person splits their history. Billing the tenant when the landlord pays means a chase later.", "steps": ["Open <b>Customers</b>, then the customer's profile, then the <b>Profile</b> tab.", "Click the <b>+</b> under the map. The <b>Add address</b> window opens.", "Type the address and pick the Google match. Put <b>#</b> before a unit number.", "Tick <b>Set as billing</b> only if bills should go to this address. Click <b>Add</b>.", "On a new job or estimate, pick the right address. It becomes the service address for that job.", "If a different person or company pays (a landlord or a property manager), set up a sub-customer: use <b>This customer bills to</b> (in the Notes section on a new customer, or the pencil next to Contact Info on an existing one)."], "watch": ["One owner with many properties: add addresses to one customer. Don't make sub-customers for that.", "With a sub-customer, the scheduled, on my way and finished texts go to the sub-customer. Invoices, estimates and receipts go to the parent.", "Create the parent customer first, then link the sub-customer to it.", "An address tied to a service plan or property profile can't be deleted."], "verify": ["The help center doesn't cover adding a second contact person to one customer. Check on a live account whether that exists."], "qs": [["A homeowner buys a rental. What do you do?", ["Make a new customer", "Add the rental as a second address", "Make a sub-customer"], 1, "Add an address. It's the same person."], ["A property manager pays for a tenant's repair. Who gets the invoice if you set up a sub-customer?", ["The tenant", "The parent (the property manager)", "Nobody"], 1, "Invoices go to the parent."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Customers > Tom Reyes (tom.reyes@example.com, the one with jobs) > the + next to the address count > add 18 Cedar Ct, Locust Hill, NY 10991 (his rental). Leave Set as billing unticked.", "help": [["Add Multiple Addresses to a Customer", "https://help.housecallpro.com/en/articles/932653-add-multiple-addresses-to-a-customer"], ["Set Up Sub-Customers (Parent/Child Billing)", "https://help.housecallpro.com/en/articles/910988-set-up-sub-customers-parent-child-billing"]], "vids": [["Pro Power Hour: Sub-Customers and Property Profiles, parent and child customers", "https://www.youtube.com/watch?v=1tEhtJFkmmw&t=485s", " \u00b7 plays 8:05 to 9:11 (1 min) of a 34 min session \u00b7 Feb 2026"]]}, "hf-3": {"id": "f-3", "sec": "foundations", "title": "Use tags the right way", "badge": "All plans", "bcls": "b-all", "goal": "Add tags from your company's list so jobs and customers can be found and reported on.", "why": "Tags only help if everyone uses the same ones. A typo makes a new tag that no report picks up.", "steps": ["On a job: open the job, scroll to <b>Job tags</b> on the left and click <b>+</b>. Pick a tag from the list.", "On a customer: open the profile and use <b>Customer tags</b>. Type a few letters and click the match.", "To see the whole company list: open <b>Settings</b>, then <b>Tags</b> (under Tags &amp; Tools). Only change the list if your manager asked you to."], "watch": ["On a job, typing a new name and pressing Enter saves and applies a new tag. Pick from the list instead, so everyone uses the same tags.", "Merged tags can't be unmerged.", "Tags are for the office (the help center calls them internal identifiers). But job tags show on the job in the tech's app, so a customer can see them if the tech hands over the phone. Keep tag names plain."], "verify": ["Whether a tag typed on a job or customer joins the company tag list isn't spelled out in the help center. Check on a live account."], "qs": [["You type 'Emerg' and press Enter on a job. What happens?", ["Nothing", "A new tag called 'Emerg' is made for the company", "HCP finds 'Emergency'"], 1, "It saves a new tag. Pick from the list."], ["Who are tags for?", ["The office, to find and report on work", "The customer", "The tech's payroll"], 0, "The office. The help center calls tags internal identifiers. Job tags can still show if a tech hands a customer the phone, so keep names plain."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Jobs > #2262 (Northgate Homes) > Job tags: check that Contractor is on it. Add no new tags.", "help": [["Tags Overview", "https://help.housecallpro.com/en/articles/8490475-using-tags-customers-jobs-and-estimates"], ["Where can I manage my Tags?", "https://help.housecallpro.com/en/articles/358414-where-can-i-manage-my-customer-and-job-tags"]], "vids": [["Pro Power Hour: Tags, customer tags", "https://www.youtube.com/watch?v=nakQXbcES4A&t=691s", " \u00b7 plays 11:31 to 16:20 (5 min) of a 55 min session \u00b7 Sep 2026"], ["Pro Power Hour: Tags, job tags on the schedule", "https://www.youtube.com/watch?v=nakQXbcES4A&t=1728s", " \u00b7 plays 28:48 to 32:34 (4 min) of a 55 min session \u00b7 Sep 2026"]]}, "hf-4": {"id": "f-4", "sec": "foundations", "title": "Give every customer and job a lead source", "badge": "All plans", "bcls": "b-all", "goal": "Record where every customer and job came from, every time.", "why": "In the HCP accounts we've audited, most customers had no lead source. Without it the owner can't see which ads bring in work.", "steps": ["On a new customer: set <b>Lead source</b> in the Notes section (bottom right) before you save.", "On an existing customer: open the profile, <b>Profile</b> tab, scroll to <b>Lead source</b>.", "On a new job or estimate: click the <b>+</b> next to <b>Lead source</b> on the left and pick one.", "On an existing job: click the <b>+</b> next to <b>Lead source</b>.", "Ask the caller how they found you. Use their answer, not a guess."], "watch": ["You can type a brand new source from the record, and it's added to the company list. Pick an existing one unless your manager says to add it.", "Editing a lead source name in Settings updates all existing leads with that name. Ask your manager before renaming one.", "Accounts we audited have many customers with no lead source, so don't count on HCP to stop you."], "verify": ["The help center doesn't say whether lead source can be made required. Check on a live account."], "qs": [["A caller says a neighbor told them about you. Which source fits best?", ["Google Search", "Referral", "Yard sign"], 1, "Referral."], ["Can you count on HCP to make you fill in lead source?", ["Yes", "No, so you check it every time"], 1, "No. Accounts we audited have many customers saved without one."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Open Rosa Delgado (made in lesson F-1) and check her lead source is Google Search. Then create a job for her and set the job's lead source to Google Search.", "help": [["How to Use Lead Sources", "https://help.housecallpro.com/en/articles/5434315-how-to-use-lead-sources"]], "vids": [["Pro Power Hour: Job & Estimate Fields, Q&A on lead source on customers and jobs", "https://www.youtube.com/watch?v=DVstdpIiTBc&t=2541s", " \u00b7 plays 42:21 to 43:34 (1 min) of a 51 min session \u00b7 Sep 2025"]]}, "hf-5": {"id": es", "https://help.housecallpro.com/en/articles/2865944-manage-team-member-profiles"]], "vids": [["Pro Power Hour: Workarounds & Employee Permissions, office staff permissions", "https://www.youtube.com/watch?v=Q6Igefu6jzA&t=684s", " \u00b7 plays 11:24 to 17:16 (6 min) of a 58 min session \u00b7 Nov 2025"], ["Pro Power Hour: Employee Management, permissions", "https://www.youtube.com/watch?v=JdFwNF4fWsU&t=231s", " \u00b7 plays 3:51 to 7:42 (4 min) of a 56 min session \u00b7 Oct 2026"]]}, "hf-7": {"id": "f-7", "sec": "foundations", "title": "Know how texts and emails go out", "badge": "All plans", "bcls": "b-all", "goal": "Know which messages HCP sends customers on its own, and where their replies go.", "why": "Customers get texts about times and invoices without anyone typing them. If a setting is off, nothing goes out and nobody notices.", "steps": ["Open <b>Settings &gt; Notifications &gt; Customer</b>. Look through Jobs (Scheduled, On my way, Finished, Reminder, Cancelled), Estimates and Invoices (Sent, Reminder, Refund, Receipt).", "On one customer: open the profile, click the pencil next to Contact info, and look at <b>Send notifications</b>.", "For a single message: untick <b>Notify customer</b> in the On my way, Finish or Pay pop-up.", "Texting registration lives in <b>Settings &gt; Inbox &gt; Text Messaging</b>. Texting starts after the registration is approved.", "Replies: while a job is in progress, they go to the tech's app plus the office. Otherwise they land in the Customers channel of the HCP Inbox."], "watch": ["On my way and Finished are text only. A customer with no Mobile number gets neither.", "Changing the time or the tech sends the Scheduled message again.", "Texting registration needs the legal name, address and EIN exactly as on the IRS EIN letter. A mismatch causes registration problems."], "verify": [], "qs": [["A customer has only a landline. Will they get the On my way text?", ["Yes", "No"], 1, "No. HCP can't text a landline."], ["Where do ail. Two people can share a name. Leave those alone.", "If either record is set to Do not service, the merged one is too."], "verify": ["The help center doesn't say what happens to jobs and invoices on a merge. Check on a live account."], "qs": [["Two 'John Smith' records have different phones and addresses. Merge?", ["Yes", "No, they may be two people"], 1, "Don't merge. Check first."], ["Can you undo a merge?", ["Yes, from Actions", "No"], 1, "No."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Customers > Actions > Manage duplicates. Match on Name, open the Tom Reyes group and check both have the same mobile and address. Tick both, click Merge, then Merge Customers.", "help": [["Manage and Merge Duplicate Customers", "https://help.housecallpro.com/en/articles/8500499-manage-and-merge-duplicate-customers"]], "vids": []}};
