<script>window.HCP_CONTENT = {"hf-1": {"id": "f-1", "sec": "foundations", "title": "Create a new customer", "badge": "All plans", "bcls": "b-all", "goal": "Add a new customer with everything the office needs later: name, cell number, address, type and lead source.", "why": "Every job, estimate and invoice hangs off the customer. A wrong cell number means no texts go out. A missing lead source means the owner can't tell which ads pay.", "steps": ["Search first. Type the caller's name or phone in Search records at the top. If they're already there, use that record and stop here.", "Click <b>Create</b> (top left), then <b>Customer</b>. The <b>Add new customer</b> window opens.", "Under Contact Info, type the first and last name. Put the cell number in <b>Mobile</b>, not Home or Work.", "Add the email. Leave the type as <b>Homeowner</b>, or pick <b>Business</b> for a company and fill in Company.", "Under Address, start typing and pick the match from the dropdown list.", "In the Notes section, set the <b>Lead source</b>. Add customer notes or tags only if your company uses them.", "Make sure <b>Send notifications</b> is ticked (bottom left), unless your manager said otherwise. Click <b>Create customer</b>."], "watch": ["A cell number typed in Home or Work won't get texts. HCP only texts the Mobile number.", "Pick the address from the dropdown. A typed address can set the wrong time zone on the job.", "Unticking Send notifications turns off every notification for that customer, not just one.", "Our audits found many customers saved with no lead source, so HCP lets you skip it. Fill it in every time."], "verify": [], "qs": [["A caller gives you his cell number. Where does it go?", ["Home", "Mobile", "Work"], 1, "Mobile. HCP only texts the Mobile number."], ["What do you do before you click Create?", ["Search for the caller", "Ask for a card", "Call the tech"], 0, "Search first, so you don't make a duplicate."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Create > Customer (or + Create customer on the Customers page). Create Rosa Delgado, cell (555) 010-0181, 9 Birch Ln, Riverton, NY 10990, Homeowner, lead source Google Search. The practice copy has plain address fields with no suggestions, so type the address in.", "help": [["Adding New Customers", "https://help.housecallpro.com/en/articles/2813289-adding-new-customers"], ["Customer Profile Overview", "https://help.housecallpro.com/en/articles/9764383-customer-profile-overview"]], "vids": [["Managing customers (HCP onboarding video)", "https://fast.wistia.net/embed/iframe/7db7uz2y9l", " \u00b7 2 min video \u00b7 2024"]]}, "hf-2": {"id": "f-2", "sec": "foundations", "title": "Add a second address or a bill-to customer", "badge": "All plans", "bcls": "b-all", "goal": "Keep one customer record when someone owns more than one property, and bill the right person when someone else pays.", "why": "A second record for the same person splits their history. Billing the tenant when the landlord pays means a chase later.", "steps": ["Open <b>Customers</b>, then the customer's profile, then the <b>Profile</b> tab.", "Click the <b>+</b> under the map. The <b>Add address</b> window opens.", "Type the address and pick the Google match. Put <b>#</b> before a unit number.", "Tick <b>Set as billing</b> only if bills should go to this address. Click <b>Add</b>.", "On a new job or estimate, pick the right address. It becomes the service address for that job.", "If a different person or company pays (a landlord or a property manager), set up a sub-customer: use <b>This customer bills to</b> (in the Notes section on a new customer, or the pencil next to Contact Info on an existing one)."], "watch": ["One owner with many properties: add addresses to one customer. Don't make sub-customers for that.", "With a sub-customer, the scheduled, on my way and finished texts go to the sub-customer. Invoices, estimates and receipts go to the parent.", "Create the parent customer first, then link the sub-customer to it.", "An address tied to a service plan or property profile can't be deleted."], "verify": ["The help center doesn't cover adding a second contact person to one customer. Check on a live account whether that exists."], "qs": [["A homeowner buys a rental. What do you do?", ["Make a new customer", "Add the rental as a second address", "Make a sub-customer"], 1, "Add an address. It's the same person."], ["A property manager pays for a tenant's repair. Who gets the invoice if you set up a sub-customer?", ["The tenant", "The parent (the property manager)", "Nobody"], 1, "Invoices go to the parent."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Customers > Tom Reyes (tom.reyes@example.com, the one with jobs) > the + next to the address count > add 18 Cedar Ct, Locust Hill, NY 10991 (his rental). Leave Set as billing unticked.", "help": [["Add Multiple Addresses to a Customer", "https://help.housecallpro.com/en/articles/932653-add-multiple-addresses-to-a-customer"], ["Set Up Sub-Customers (Parent/Child Billing)", "https://help.housecallpro.com/en/articles/910988-set-up-sub-customers-parent-child-billing"]], "vids": [["Pro Power Hour: Sub-Customers and Property Profiles, parent and child customers", "https://www.youtube.com/watch?v=1tEhtJFkmmw&t=485s", " \u00b7 plays 8:05 to 9:11 (1 min) of a 34 min session \u00b7 Feb 2026"]]}, "hf-3": {"id": "f-3", "sec": "foundations", "title": "Use tags the right way", "badge": "All plans", "bcls": "b-all", "goal": "Add tags from your company's list so jobs and customers can be found and reported on.", "why": "Tags only help if everyone uses the same ones. A typo makes a new tag that no report picks up.", "steps": ["On a job: open the job, scroll to <b>Job tags</b> on the left and click <b>+</b>. Pick a tag from the list.", "On a customer: open the profile and use <b>Customer tags</b>. Type a few letters and click the match.", "To see the whole company list: open <b>Settings</b>, then <b>Tags</b> (under Tags &amp; Tools). Only change the list if your manager asked you to."], "watch": ["On a job, typing a new name and pressing Enter saves and applies a new tag. Pick from the list instead, so everyone uses the same tags.", "Merged tags can't be unmerged.", "Tags are for the office (the help center calls them internal identifiers). But job tags show on the job in the tech's app, so a customer can see them if the tech hands over the phone. Keep tag names plain."], "verify": ["Whether a tag typed on a job or customer joins the company tag list isn't spelled out in the help center. Check on a live account."], "qs": [["You type 'Emerg' and press Enter on a job. What happens?", ["Nothing", "A new tag called 'Emerg' is made for the company", "HCP finds 'Emergency'"], 1, "It saves a new tag. Pick from the list."], ["Who are tags for?", ["The office, to find and report on work", "The customer", "The tech's payroll"], 0, "The office. The help center calls tags internal identifiers. Job tags can still show if a tech hands a customer the phone, so keep names plain."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Jobs > #2262 (Northgate Homes) > Job tags: check that Contractor is on it. Add no new tags.", "help": [["Tags Overview", "https://help.housecallpro.com/en/articles/8490475-using-tags-customers-jobs-and-estimates"], ["Where can I manage my Tags?", "https://help.housecallpro.com/en/articles/358414-where-can-i-manage-my-customer-and-job-tags"]], "vids": [["Pro Power Hour: Tags, customer tags", "https://www.youtube.com/watch?v=nakQXbcES4A&t=691s", " \u00b7 plays 11:31 to 16:20 (5 min) of a 55 min session \u00b7 Sep 2026"], ["Pro Power Hour: Tags, job tags on the schedule", "https://www.youtube.com/watch?v=nakQXbcES4A&t=1728s", " \u00b7 plays 28:48 to 32:34 (4 min) of a 55 min session \u00b7 Sep 2026"]]}, "hf-4": {"id": "f-4", "sec": "foundations", "title": "Give every customer and job a lead source", "badge": "All plans", "bcls": "b-all", "goal": "Record where every customer and job came from, every time.", "why": "In the HCP accounts we've audited, most customers had no lead source. Without it the owner can't see which ads bring in work.", "steps": ["On a new customer: set <b>Lead source</b> in the Notes section (bottom right) before you save.", "On an existing customer: open the profile, <b>Profile</b> tab, scroll to <b>Lead source</b>.", "On a new job or estimate: click the <b>+</b> next to <b>Lead source</b> on the left and pick one.", "On an existing job: click the <b>+</b> next to <b>Lead source</b>.", "Ask the caller how they found you. Use their answer, not a guess."], "watch": ["You can type a brand new source from the record, and it's added to the company list. Pick an existing one unless your manager says to add it.", "Editing a lead source name in Settings updates all existing leads with that name. Ask your manager before renaming one.", "Accounts we audited have many customers with no lead source, so don't count on HCP to stop you."], "verify": ["The help center doesn't say whether lead source can be made required. Check on a live account."], "qs": [["A caller says a neighbor told them about you. Which source fits best?", ["Google Search", "Referral", "Yard sign"], 1, "Referral."], ["Can you count on HCP to make you fill in lead source?", ["Yes", "No, so you check it every time"], 1, "No. Accounts we audited have many customers saved without one."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Open Rosa Delgado (made in lesson F-1) and check her lead source is Google Search. Then create a job for her and set the job's lead source to Google Search.", "help": [["How to Use Lead Sources", "https://help.housecallpro.com/en/articles/5434315-how-to-use-lead-sources"]], "vids": [["Pro Power Hour: Job & Estimate Fields, Q&A on lead source on customers and jobs", "https://www.youtube.com/watch?v=DVstdpIiTBc&t=2541s", " \u00b7 plays 42:21 to 43:34 (1 min) of a 51 min session \u00b7 Sep 2025"]]}, "hf-5": {"id": "f-5", "sec": "foundations", "title": "Fill in job type and business unit", "badge": "All plans", "bcls": "b-all", "goal": "Put a job type and a business unit on every job, so reports can split the work.", "why": "In the HCP accounts we checked, job type was blank on most jobs. Then the owner can't see what kind of work pays, or split plumbing from HVAC.", "steps": ["On a new or existing job, find <b>Job type</b> and <b>Business unit</b> and pick from the dropdowns.", "Tick <b>Callback</b> if this job is a return visit for earlier work.", "The lists live in <b>Settings &gt; Fields</b>, on the <b>Job Fields</b> tab. Only Admins, and office staff with permission, can change them."], "watch": ["Deleting a value in Job Fields takes it off every job that used it, and out of reports.", "Pick the closest type. Don't leave it blank because none fits perfectly. Tell your manager if a type is missing."], "verify": ["The help center doesn't say whether job type or business unit can be made required. Check on a live account."], "qs": [["A tech goes back to fix a leak he repaired last week. What do you tick?", ["Callback", "Install", "Maintenance"], 0, "Callback."], ["What happens if someone deletes a job type in Settings?", ["Nothing", "It comes off every job that had it", "It's archived"], 1, "It's removed from every job and from reports."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Jobs > #2260 (Ana Kowalski) > check the job type is Maintenance and the business unit is Plumbing.", "help": [["Get Started with Job Fields", "https://help.housecallpro.com/en/articles/5610489-get-started-with-job-fields"], ["How to Create a Job", "https://help.housecallpro.com/en/articles/3181752-how-to-create-a-job"]], "vids": [["Pro Power Hour: Job & Estimate Fields, job type and business unit", "https://www.youtube.com/watch?v=DVstdpIiTBc&t=213s", " \u00b7 plays 3:33 to 4:55 (1 min) of a 51 min session \u00b7 Sep 2025"], ["Pro Power Hour: Jobs and Job Fields", "https://www.youtube.com/watch?v=Og4AmFZrBZQ&t=166s", " \u00b7 plays 2:46 to 5:51 (3 min) of a 40 min session \u00b7 Mar 2026"]]}, "hf-6": {"id": "f-6", "sec": "foundations", "title": "Know the team, roles and permissions", "badge": "All plans", "bcls": "b-all", "goal": "Know who has which role, and what each role can see and do.", "why": "Shared logins and too many Admins are common in our audits. They hide who did what and who can change settings.", "steps": ["Open <b>Team</b> (left menu), then <b>Team Members</b>.", "Click a name or the pencil, then the <b>Permissions</b> tab, to see what that person can do.", "Roles: <b>Admin</b> (full access; the help center calls it Admin/Owner), <b>Office staff</b> (with permission toggles) and <b>Field tech</b> (mobile app only).", "Office staff toggles include access reporting, update company info, see job costing margins, access Pipeline and chat with customers.", "Field tech toggles include add or edit jobs, take payments and see prices, and see customer phone and email."], "watch": ["Admin means full access. Keep it to the owners.", "There's only one Dispatch / Messaging point of contact. Picking a new one switches off the old one.", "A role change only takes effect after the person logs out and back in.", "One person, one login. If a login looks shared (a company name), tell your manager."], "verify": [], "qs": [["Which role works only in the mobile app?", ["Admin", "Office staff", "Field tech"], 2, "Field tech."], ["Your manager changes your role. What do you do?", ["Nothing", "Log out and back in", "Call HCP support"], 1, "The change shows after you log in again."]], "pcls": "p-chk", "pstat": "Partly in the practice copy", "task": "Team > Team Members: read each person's role. Settings > Team & Permissions shows the same list. Editing a person only explains in the practice copy.", "help": [["Team Member Roles & Permissions", "https://help.housecallpro.com/en/articles/1073431-team-member-roles-permissions"], ["Manage Team Member Profiles", "https://help.housecallpro.com/en/articles/2865944-manage-team-member-profiles"]], "vids": [["Pro Power Hour: Workarounds & Employee Permissions, office staff permissions", "https://www.youtube.com/watch?v=Q6Igefu6jzA&t=684s", " \u00b7 plays 11:24 to 17:16 (6 min) of a 58 min session \u00b7 Nov 2025"], ["Pro Power Hour: Employee Management, permissions", "https://www.youtube.com/watch?v=JdFwNF4fWsU&t=231s", " \u00b7 plays 3:51 to 7:42 (4 min) of a 56 min session \u00b7 Oct 2026"]]}, "hf-7": {"id": "f-7", "sec": "foundations", "title": "Know how texts and emails go out", "badge": "All plans", "bcls": "b-all", "goal": "Know which messages HCP sends customers on its own, and where their replies go.", "why": "Customers get texts about times and invoices without anyone typing them. If a setting is off, nothing goes out and nobody notices.", "steps": ["Open <b>Settings &gt; Notifications &gt; Customer</b>. Look through Jobs (Scheduled, On my way, Finished, Reminder, Cancelled), Estimates and Invoices (Sent, Reminder, Refund, Receipt).", "On one customer: open the profile, click the pencil next to Contact info, and look at <b>Send notifications</b>.", "For a single message: untick <b>Notify customer</b> in the On my way, Finish or Pay pop-up.", "Texting registration lives in <b>Settings &gt; Inbox &gt; Text Messaging</b>. Texting starts after the registration is approved.", "Replies: while a job is in progress, they go to the tech's app plus the office. Otherwise they land in the Customers channel of the HCP Inbox."], "watch": ["On my way and Finished are text only. A customer with no Mobile number gets neither.", "Changing the time or the tech sends the Scheduled message again.", "Texting registration needs the legal name, address and EIN exactly as on the IRS EIN letter. A mismatch causes registration problems."], "verify": [], "qs": [["A customer has only a landline. Will they get the On my way text?", ["Yes", "No"], 1, "No. HCP can't text a landline."], ["Where do customer text replies go when no job is in progress?", ["The tech's phone", "The Customers channel of the Inbox", "Nowhere"], 1, "The Customers channel of the Inbox."]], "pcls": "p-chk", "pstat": "Partly in the practice copy", "task": "Settings > Notifications > Customer: look through the Jobs, Estimates and Invoices messages. Then open a customer and find Notifications enabled.", "help": [["Customer Notifications in Settings", "https://help.housecallpro.com/en/articles/14171435-customer-notifications-in-settings"], ["Customer Notifications Overview", "https://help.housecallpro.com/en/articles/357613-customer-notifications-overview"], ["Texting Number", "https://help.housecallpro.com/en/articles/887351-texting-number"]], "vids": [["Pro Power Hour: Customer Communications, texting registration", "https://www.youtube.com/watch?v=ZXVq4XEjTow&t=369s", " \u00b7 plays 6:09 to 9:38 (3 min) of a 48 min session \u00b7 Jul 2025"], ["Pro Power Hour: Customer Communications, job reminders and notifications", "https://www.youtube.com/watch?v=ZXVq4XEjTow&t=1188s", " \u00b7 plays 19:48 to 21:11 (1 min) of a 48 min session \u00b7 Jul 2025"]]}, "hf-8": {"id": "f-8", "sec": "foundations", "title": "Merge duplicate customers", "badge": "All plans", "bcls": "b-all", "goal": "Find and merge customers that were entered twice.", "why": "A duplicate splits a customer's jobs and invoices across two records, so the office misses history and owed money.", "steps": ["Open <b>Customers</b>, click <b>Actions</b>, then <b>Manage duplicates</b>.", "Open a group (Name, Mobile, Home, Work or Email) and expand a row.", "Check the records really are the same person: same phone, same address.", "Select the duplicates and click <b>Merge</b> (upper right). Check the pop-up, then <b>Merge Customers</b>.", "Or tick two or more customers in the list, click <b>Merge customers</b>, and pick the right contact details."], "watch": ["A merge can't be undone. Check twice.", "HCP matches only on name, phone or email. Two people can share a name. Leave those alone.", "If either record is set to Do not service, the merged one is too."], "verify": ["The help center doesn't say what happens to jobs and invoices on a merge. Check on a live account."], "qs": [["Two 'John Smith' records have different phones and addresses. Merge?", ["Yes", "No, they may be two people"], 1, "Don't merge. Check first."], ["Can you undo a merge?", ["Yes, from Actions", "No"], 1, "No."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Customers > Actions > Manage duplicates. Match on Name, open the Tom Reyes group and check both have the same mobile and address. Tick both, click Merge, then Merge Customers.", "help": [["Manage and Merge Duplicate Customers", "https://help.housecallpro.com/en/articles/8500499-manage-and-merge-duplicate-customers"]], "vids": []}, "hm1-1": {"id": "m1-1", "sec": "module-1", "title": "Take a new call and book the job", "badge": "All plans", "bcls": "b-all", "goal": "Turn a new caller into a customer and a booked job in one go, with nothing missing.", "why": "Most office work starts with a call. A job booked with no job type, no lead source or no note costs the tech and the owner later.", "steps": ["Every account: click <b>Create</b>, then <b>Job</b>. Search the caller by name, email, phone or address. New caller: click <b>+ New customer</b> and fill in name, Mobile, address and lead source.", "Fill in job type, business unit, lead source, tags and a private note about the problem.", "Add the schedule (date, time, arrival window, tech) if the caller agrees a time. Otherwise leave it unscheduled. Click <b>Save job</b>.", "Accounts with Intake (it comes with Voice, HCP Assist or Pipeline): open <b>+ Create &gt; Intake</b>. With Voice, answering a call opens it in a new tab with the caller filled in.", "In Intake, search the caller. New caller: click <b>Create customer</b>. Fill in the request, the schedule and the contact, then click <b>Save</b> and pick job, estimate or lead. Saving a Voice call this way links it to the call."], "watch": ["With Voice, the dialer (phone icon, upper right) has to be open to take calls. Don't refresh it during a call.", "Good habit: start each shift by opening the dialer and setting yourself to Available (the arrow next to your picture). While you're Unavailable, or the dialer is closed, calls don't ring you.", "Search before you create. Callers often use a new phone."], "verify": [], "qs": [["A new caller found you on Google. What do you do first?", ["Create the customer", "Search for them", "Book the tech"], 1, "Search first."], ["With Voice, what links the job to the call?", ["Saving it from Intake as a job", "Adding a tag", "Nothing can"], 0, "Saving from Intake links it."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Practice calls > 'New homeowner' (Maya Torres, kitchen sink). Click Check my work when done.", "help": [["How to Create a Job", "https://help.housecallpro.com/en/articles/3181752-how-to-create-a-job"], ["Customer Intake: Setup Guide", "https://help.housecallpro.com/en/articles/6266173-customer-intake-setup-guide"], ["Voice: How to Use the Dialer", "https://help.housecallpro.com/en/articles/6184954-voice-how-to-use-the-dialer"]], "vids": [["Pro Power Hour: Office Staff Onboarding, booking jobs and the intake form", "https://www.youtube.com/watch?v=LnlCsSc0gV8&t=407s", " \u00b7 plays 6:47 to 18:17 (12 min) of a 61 min session \u00b7 Nov 2025"], ["Pro Power Hour: Intake & Pipeline, the intake form", "https://www.youtube.com/watch?v=-cKYanX2oT0&t=1958s", " \u00b7 plays 32:38 to 41:20 (9 min) of a 53 min session \u00b7 Jul 2026"], ["Pro Power Hour: HCP Voice, live call and intake pop-up", "https://www.youtube.com/watch?v=peV2eN3OcXk&t=2533s", " \u00b7 plays 42:13 to 45:09 (3 min) of a 56 min session \u00b7 Aug 2026"]]}, "hm1-2": {"id": "m1-2", "sec": "module-1", "title": "Book a job for a customer you already have", "badge": "All plans", "bcls": "b-all", "goal": "Use the existing record and the right address when a known customer calls.", "why": "A second record for a known customer splits their history. The wrong address sends the tech to the wrong house.", "steps": ["Search by the phone number the caller gives.", "Pick the existing customer. Read the notes on their profile.", "Pick the address the work is at. A customer can have more than one.", "Fill in job type, business unit and a note, then <b>Save job</b>."], "watch": ["If the caller is on a new phone, add the number to their record. Don't make a new customer."], "verify": [], "qs": [["Ana owns a home and a rental. She calls about the rental. Which address?", ["Her home", "The rental", "Either"], 1, "The rental, where the work is."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Practice calls > 'Existing customer, second address' (Ana Kowalski, rental on Mill Ln).", "help": [["How to Create a Job", "https://help.housecallpro.com/en/articles/3181752-how-to-create-a-job"], ["Add Multiple Addresses to a Customer", "https://help.housecallpro.com/en/articles/932653-add-multiple-addresses-to-a-customer"]], "vids": [["Pro Power Hour: Customer Profiles, profile walkthrough", "https://www.youtube.com/watch?v=_VMcAWUeDF8&t=464s", " \u00b7 plays 7:44 to 13:34 (6 min) of a 32 min session \u00b7 Mar 2026"]]}, "hm1-3": {"id": "m1-3", "sec": "module-1", "title": "Book a business or property manager", "badge": "All plans", "bcls": "b-all", "goal": "Set up a company caller as a Business customer, with the unit or site in the notes.", "why": "Business accounts get billed differently. Typed as a homeowner, they're mixed into the wrong numbers.", "steps": ["Search first by the company and the caller's number.", "Create the customer with type <b>Business</b> and the company name. Put the caller's work number in Work, or Mobile if it's a cell.", "Create the job. Put the unit number or site detail in the private note.", "If the company pays for several properties, ask your manager whether to use addresses or sub-customers."], "watch": ["Business customers don't see consumer financing offers."], "verify": [], "qs": [["A property manager calls about Unit 7C. Where does '7C' go?", ["The job's private note (and the address with #)", "A tag", "Nowhere"], 0, "In the note, and with # in the address."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Practice calls > 'New business customer' (Harbor Landing Apartments).", "help": [["Adding New Customers", "https://help.housecallpro.com/en/articles/2813289-adding-new-customers"], ["Set Up Sub-Customers (Parent/Child Billing)", "https://help.housecallpro.com/en/articles/910988-set-up-sub-customers-parent-child-billing"]], "vids": [["Pro Power Hour: Sub-Customers and Property Profiles, parent and child customers", "https://www.youtube.com/watch?v=1tEhtJFkmmw&t=485s", " \u00b7 plays 8:05 to 9:11 (1 min) of a 34 min session \u00b7 Feb 2026"], ["Pro Power Hour: Office Staff Onboarding, billing to another customer", "https://www.youtube.com/watch?v=LnlCsSc0gV8&t=859s", " \u00b7 plays 14:19 to 18:17 (4 min) of a 61 min session \u00b7 Nov 2025"]]}, "hm1-4": {"id": "m1-4", "sec": "module-1", "title": "Check the customer before you book", "badge": "All plans", "bcls": "b-all", "goal": "Read the profile before booking, and don't book a customer marked Do not service.", "why": "Some customers owe money or were dropped by the owner. Booking them sends a tech out for free.", "steps": ["Search by phone and open the profile.", "Look for <b>Do not service</b>, and read the customer notes.", "If it's set, don't book. Tell the caller you'll pass it on, and tell your manager."], "watch": ["Do not service carries over when two records are merged."], "verify": [], "qs": [["The profile says Do not service. The caller is upset. What do you do?", ["Book it anyway", "Don't book, and tell your manager", "Book it for next week"], 1, "Don't book. Pass it to your manager."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Practice calls > 'Check the customer first' (Dale Whitcomb).", "help": [["Adding New Customers", "https://help.housecallpro.com/en/articles/2813289-adding-new-customers"]], "vids": [["Pro Power Hour: Customer Profiles, communication preferences and tags", "https://www.youtube.com/watch?v=_VMcAWUeDF8&t=814s", " \u00b7 plays 13:34 to 15:44 (2 min) of a 32 min session \u00b7 Mar 2026"]], "vnote": "No video shows Do not service yet. This clip shows what else is on the customer profile."}, "hm1-5": {"id": "m1-5", "sec": "module-1", "title": "Return missed calls and voicemails", "badge": "Needs the Voice add-on", "bcls": "b-add", "goal": "Call back every missed caller and every voicemail the same day.", "why": "A missed caller who doesn't hear back calls the next plumber.", "steps": ["Open <b>Inbox &gt; Calls</b>. On the Voice Call log, open the <b>Missed</b> tab, then the <b>Voicemails</b> tab.", "Click a call to open Quick View. Play the voicemail under Recording.", "Call back from the dialer: Call log &gt; Missed calls &gt; the row &gt; Call details.", "After the call, book the job or add call notes. Fix the caller with <b>Edit caller</b> if HCP didn't match them."], "watch": ["The blue badge counts missed calls plus voicemails. Opening a missed call clears its badge, and playing a voicemail clears that one. Open them only when you'll act.", "Voicemails can't be deleted. Recordings older than 6 months are deleted by HCP."], "verify": ["HCP Voice can send a missed-call text (the Pro Power Hour clip shows it: \"sorry we missed your call\"). The help center pages read for this lesson don't cover it. Check on a live account where it's set."], "qs": [["Where are missed calls?", ["Inbox > Calls > Missed tab", "Jobs list", "Reporting"], 0, "Inbox > Calls, Missed tab."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Inbox > Calls > Voice > Call log. Open the Missed tab, then Voicemails. Open the voicemail from (555) 010-0190, read it, and use Call back.", "help": [["Voice: Overview Page & Call Log Guide", "https://help.housecallpro.com/en/articles/8345671-voice-overview-page-call-log-guide"], ["Voice: How to Use the Dialer", "https://help.housecallpro.com/en/articles/6184954-voice-how-to-use-the-dialer"], ["Voice FAQs", "https://help.housecallpro.com/en/articles/6666356-voice-faqs"]], "vids": [["Pro Power Hour: HCP Voice, missed call texts", "https://www.youtube.com/watch?v=peV2eN3OcXk&t=2008s", " \u00b7 plays 33:28 to 34:40 (1 min) of a 56 min session \u00b7 Aug 2026"], ["Pro Power Hour: HCP Voice, the call log", "https://www.youtube.com/watch?v=peV2eN3OcXk&t=2709s", " \u00b7 plays 45:09 to 47:47 (3 min) of a 56 min session \u00b7 Aug 2026"]]}, "hm1-6": {"id": "m1-6", "sec": "module-1", "title": "Work HCP Assist and CSR AI messages", "badge": "Needs HCP Assist or CSR AI", "bcls": "b-add", "goal": "Follow up every call your answering service or AI took for you.", "why": "When the office doesn't pick up, HCP Assist or CSR AI answers. Their messages wait in HCP until someone calls back.", "steps": ["HCP Assist: open <b>Inbox &gt; Calls</b>, then the <b>HCP Assist</b> tab (its call log). Filter by Status. Work every <b>Action required</b> and <b>To do</b>.", "Call the customer back and book or note the result. Statuses are Action required, To do, In progress and Reviewed.", "Post-call messages land in the Employees inbox. Use @mentions or internal notes to hand one to a teammate.", "CSR AI: open <b>Inbox &gt; CSR AI &gt; Call log</b> (CSR AI isn't in the practice copy). Each call shows a summary and how urgent it is.", "If CSR AI couldn't book, HCP texts you and posts an inbox alert. Call the customer back."], "watch": ["You can't reply to one post-call message or start a thread on it.", "Calling back from HCP Assist call details needs Voice."], "verify": ["Check on a live account how the office moves an HCP Assist call to In Progress or Reviewed. The help center lists the statuses only."], "qs": [["Which HCP Assist statuses need you first?", ["Reviewed", "Action required and To do", "In Progress"], 1, "Action required and To do."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Inbox > Calls > HCP Assist. Open each Action required call, read the call notes, and change the status after you act.", "help": [["HCP Assist: Call Log Overview", "https://help.housecallpro.com/en/articles/8150011-hcp-assist-call-log-overview"], ["HCP Assist: Post-Call Inbox FAQs", "https://help.housecallpro.com/en/articles/6282797-hcp-assist-post-call-inbox-faqs"], ["CSR AI Overview", "https://help.housecallpro.com/en/articles/9740104-csr-ai-overview"]], "vids": [["HCP Assist call log (help center clip)", "https://fast.wistia.net/embed/iframe/4ck4plh8lg", " \u00b7 1 min video \u00b7 2025"], ["Pro Power Hour: CSR AI & Job Inbox, CSR AI call log", "https://www.youtube.com/watch?v=zI8iox6f9sE&t=1162s", " \u00b7 plays 19:22 to 21:29 (2 min) of a 50 min session \u00b7 Aug 2026"]]}, "hm1-7": {"id": "m1-7", "sec": "module-1", "title": "Work new leads and online booking requests", "badge": "All plans", "bcls": "b-all", "goal": "Answer every web request, online booking and Google request quickly, and turn it into an estimate or job.", "why": "A booking request sent when no time slot is free lands as a lead, not a booking, and nobody gets a time until the office acts. Reserve with Google requests land as leads too.", "steps": ["New requests land in the <b>Job Inbox</b> (Inbox &gt; Chats, then Job inbox). Online booking and Reserve with Google requests show there.", "All leads are listed under <b>Leads</b> in the left menu (on the older layout, Customers &gt; Leads). Statuses are Open, Won and Lost.", "Contact the customer. Set the lead source if it's blank.", "Turn the lead into an estimate or a job. On the mobile app: <b>Copy to estimate</b> or <b>Copy to job</b>, which marks the lead Won.", "To add a lead yourself: <b>Create &gt; Lead</b>."], "watch": ["A booking request is 'not a booking'. Nobody is scheduled until you act. Bookings made in an open time slot are real bookings.", "The Job Inbox auto-reply is on by default and goes out under the Dispatch contact's first name.", "Reserve with Google and Google LSA look the same in the Job Inbox."], "verify": ["The help center only documents turning a lead into a job on mobile. Check the web steps on a live account."], "qs": [["No time slots were free, so a customer sent a booking request. Is the job booked?", ["Yes", "No, it's a lead until you act"], 1, "It's a lead."]], "pcls": "p-chk", "pstat": "Partly in the practice copy", "task": "Create > Lead for Sam Chen with lead source Google Search and save it. Find it under Leads. Turning a lead into a job isn't in the practice copy yet.", "help": [["Job Inbox Overview", "https://help.housecallpro.com/en/articles/5541672-job-inbox-overview"], ["How to Create a Lead", "https://help.housecallpro.com/en/articles/16889869-how-to-create-a-lead"], ["How to Use Leads on Mobile", "https://help.housecallpro.com/en/articles/12833580-how-to-use-leads-on-mobile"], ["Job Inbox: Integration with Reserve with Google", "https://help.housecallpro.com/en/articles/8234776-reserve-with-google-integration"], ["Online Booking Overview", "https://help.housecallpro.com/en/articles/7034474-online-booking-overview"]], "vids": [["Online Booking with Housecall Pro (help center video)", "https://fast.wistia.net/embed/iframe/i67xduvavc", " \u00b7 5 min video \u00b7 Jan 2026"], ["Pro Power Hour: Job Inbox and Lead Management", "https://www.youtube.com/watch?v=Vawv431mE5U&t=86s", " \u00b7 plays 1:26 to 3:10 (2 min) of a 59 min session \u00b7 Feb 2026"]]}, "hm1-8": {"id": "m1-8", "sec": "module-1", "title": "Book the job before the tech goes", "badge": "All plans", "bcls": "b-all", "goal": "Make sure every job is in HCP before the visit, even when the owner or a tech took the call.", "why": "In our audits, about half the jobs at one account were entered at or after the visit. Then no confirmation text went out and the time on the job was lost.", "steps": ["Ask the owner and techs to send you every job they book on their own phones, the same day.", "Create the job right away: customer, schedule, tech, job type, business unit, lead source and a note.", "Make sure <b>Notify customer</b> is ticked, so the confirmation goes out.", "No time agreed yet? Leave it unscheduled. Find it later under Schedule (the calendar with a red x) or the Unscheduled status filter on Jobs."], "watch": ["Recurring jobs can't be unscheduled."], "verify": [], "qs": [["The owner booked a job by text for tomorrow. When do you enter it?", ["After the visit", "Today, before the visit", "At the end of the week"], 1, "Today, so the customer gets the confirmation."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Create > Job (or Create job on the Jobs page). Book Lena Rosati, 22 Ocean Ave, tomorrow 9 to 11 AM with Dana Mills: water heater flush, Maintenance, Plumbing, lead source Existing customer.", "help": [["How to Create a Job", "https://help.housecallpro.com/en/articles/3181752-how-to-create-a-job"], ["Scheduling Jobs and Estimates", "https://help.housecallpro.com/en/articles/6758788-scheduling-jobs-and-estimates"], ["Jobs & Estimates: Unschedule and Undo Actions", "https://help.housecallpro.com/en/articles/2823066-jobs-estimates-unschedule-and-undo-actions"]], "vids": [["Pro Power Hour: Scheduling & Dispatching, unscheduled jobs", "https://www.youtube.com/watch?v=Pyq6xaF_XlQ&t=582s", " \u00b7 plays 9:42 to 10:19 (1 min) of a 57 min session \u00b7 Aug 2026"]]}, "hm1-9": {"id": "m1-9", "sec": "module-1", "title": "Catch jobs with no lead source or job type", "badge": "All plans", "bcls": "b-all", "goal": "Once a week, find jobs missing a lead source or job type and fix them.", "why": "One weekly pass keeps the owner's reports true.", "steps": ["Open <b>Jobs</b>. Click <b>Edit columns</b> and add the <b>Job lead source</b> and <b>Job type</b> columns. Click <b>Done</b>.", "Use <b>Filter</b> to narrow to this week's created jobs, then <b>Apply</b>.", "Scan the two columns for blanks. Open each job and fill them in.", "To work in a spreadsheet: <b>Actions &gt; Export &gt; Send file</b>. The file is emailed to you."], "watch": ["The export goes to the email of whoever is logged in."], "verify": ["The help center doesn't show a filter for a blank lead source or job type, or saved views. Check on a live account."], "qs": [["How do you see lead source on the Jobs list?", ["Edit columns", "Settings", "Reporting only"], 0, "Edit columns."]], "pcls": "p-chk", "pstat": "Partly in the practice copy", "task": "Jobs list: read the columns that show. Edit columns and Filter only explain in the practice copy.", "help": [["Job & Estimate List Reporting", "https://help.housecallpro.com/en/articles/8241575-customers-job-estimate-list-reporting"]], "vids": [["Pro Power Hour: Job & Estimate Fields, a jobs report by job fields (not the Jobs list)", "https://www.youtube.com/watch?v=DVstdpIiTBc&t=1080s", " \u00b7 plays 18:00 to 19:56 (2 min) of a 51 min session \u00b7 Sep 2025"]]}, "hm2-1": {"id": "m2-1", "sec": "module-2", "title": "Schedule a job with an arrival window", "badge": "All plans", "bcls": "b-all", "goal": "Put a job on the calendar with a date, a time, a tech and an arrival window the customer can count on.", "why": "The arrival window is what the customer hears. A job with no tech or no window leads to calls asking where the tech is.", "steps": ["Open the job. In the action bar, click the first button, <b>Add appointment</b>. Once the job is scheduled, the date and time show under it.", "Set the start date and time, and the end time.", "Add the tech with <b>Edit team</b>.", "Pick the <b>Arrival window</b> (None, 15 minutes, 30 minutes, 1 to 4 hours). The window starts at the scheduled time.", "Leave <b>Notify customer</b> ticked unless your manager says not to. Click <b>Save</b>."], "watch": ["The arrival window doesn't move the job on the calendar. A 9:00 job with a 2-hour window still sits at 9:00.", "The company default window lives in Settings &gt; Booking &gt; General. It covers new jobs, estimates and online bookings.", "Estimates need at least one employee. Jobs can be saved with no one assigned, so check the team every time."], "verify": [], "qs": [["A job is set for 12:00 with a 30-minute window. What does the customer get?", ["12:00 exactly", "12:00 to 12:30", "11:30 to 12:30"], 1, "The window starts at the scheduled time."], ["Which of these can be saved with no employee on it?", ["A job", "An estimate"], 0, "Jobs can be unassigned. Estimates need at least one employee."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Jobs > #2260 (Ana Kowalski, not scheduled) > Add appointment. Set a day this week, 9:00am to 11:00am, Michael Ortiz, arrival window 2 hours. Save.", "help": [["Scheduling Jobs and Estimates", "https://help.housecallpro.com/en/articles/6758788-scheduling-jobs-and-estimates"], ["Setting Your Arrival Window", "https://help.housecallpro.com/en/articles/918018-how-do-i-set-an-arrival-window"]], "vids": [["Pro Power Hour: Scheduling & Dispatching, Q&A on arrival windows", "https://www.youtube.com/watch?v=Pyq6xaF_XlQ&t=2437s", " \u00b7 plays 40:37 to 43:12 (3 min) of a 57 min session \u00b7 Aug 2026"]], "vnote": "No video shows setting the arrival window yet. This clip is Pros talking about how they use arrival windows."}, "hm2-2": {"id": "m2-2", "sec": "module-2", "title": "Assign or swap the tech", "badge": "All plans", "bcls": "b-all", "goal": "Put the right tech on a job, or move it to another tech, without losing the time.", "why": "A job on the wrong tech's schedule gets missed or doubled. The customer may also get a text with the wrong name.", "steps": ["Open the job.", "On a job with one visit, go to <b>Line items</b> and click the pencil next to the team. Tick the new tech, untick the old one, and click <b>Save</b>.", "On a job with appointments, change the team in the <b>Appointments</b> section instead.", "Or open the schedule window and change the team there, then <b>Save</b>."], "watch": ["The first employee listed is treated as the lead tech. There's no separate lead role.", "Changing the tech or the time sends the Scheduled message to the customer again.", "There are no crews in Housecall Pro. Put each person on the job."], "verify": [], "qs": [["You change the tech on a scheduled job. What can the customer get?", ["Nothing", "A new Scheduled message", "An invoice"], 1, "Changing the tech or time sends the Scheduled message again."], ["Who counts as the lead tech?", ["The Admin", "The first employee listed", "Nobody"], 1, "The first employee listed is treated as the lead."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Jobs > #2259 (Lena Rosati) > swap Dana Mills for Francisco Diaz. Keep the same time.", "help": [["Scheduling and Calendar FAQ", "https://help.housecallpro.com/en/articles/9483598-scheduling-and-calendar-faq"], ["Scheduling Jobs and Estimates", "https://help.housecallpro.com/en/articles/6758788-scheduling-jobs-and-estimates"]], "vids": [["Pro Power Hour: Scheduling & Dispatching, find a time and reassigning jobs", "https://www.youtube.com/watch?v=Pyq6xaF_XlQ&t=1325s", " \u00b7 plays 22:05 to 28:22 (6 min) of a 57 min session \u00b7 Aug 2026"], ["Pro Power Hour: Dispatching and April Platform Updates, bulk reassign and reschedule", "https://www.youtube.com/watch?v=yi6PI8shnx4&t=905s", " \u00b7 plays 15:05 to 17:33 (2 min) of a 31 min session \u00b7 May 2026"]]}, "hm2-3": {"id": "m2-3", "sec": "module-2", "title": "Work the unscheduled jobs list", "badge": "All plans", "bcls": "b-all", "goal": "Get every unscheduled job onto the calendar, or close it out.", "why": "Unscheduled jobs are booked work nobody is going to. Each one is a customer waiting and revenue sitting still.", "steps": ["Open <b>Schedule</b>. Click the calendar icon with the red x (top left). The unscheduled list opens.", "Drag a job tile onto the calendar at the right day and time. The schedule window opens with the time filled in.", "Check the tech, the window and Notify customer, then <b>Save</b>.", "If the work is already done, finish the job instead (untick Notify customer)."], "watch": ["The list only clears when each job is scheduled or completed.", "Unscheduled estimates don't show in this list. Find them on the customer's Estimates tab."], "verify": [], "qs": [["Where do you find unscheduled jobs?", ["Settings", "The calendar icon with a red x on Schedule", "Reports"], 1, "The Unscheduled icon on the Schedule page."], ["How does the list get cleared?", ["Delete the jobs", "Schedule or complete each job", "It clears every night"], 1, "Each job must be scheduled or completed."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Schedule > unscheduled icon > drag the Sam Chen tile (job #2258) onto tomorrow at 10:00am. Pick a tech and save. The tiles show the customer name, not the job number.", "help": [["How to Use the Schedule Tab (Calendar)", "https://help.housecallpro.com/en/articles/6367496-how-to-use-the-schedule-tab-calendar"], ["Jobs & Estimates: Unschedule and Undo Actions", "https://help.housecallpro.com/en/articles/2823066-jobs-estimates-unschedule-and-undo-actions"]], "vids": [["Pro Power Hour: Scheduling & Dispatching, unscheduled jobs", "https://www.youtube.com/watch?v=Pyq6xaF_XlQ&t=582s", " \u00b7 plays 9:42 to 10:19 (1 min) of a 57 min session \u00b7 Aug 2026"], ["Pro Power Hour: Reporting, unscheduled jobs on the homepage", "https://www.youtube.com/watch?v=3lswUEKtC38&t=405s", " \u00b7 plays 6:45 to 7:21 (1 min) of a 52 min session \u00b7 Jan 2026"]]}, "hm2-4": {"id": "m2-4", "sec": "module-2", "title": "Reschedule or cancel a job", "badge": "All plans", "bcls": "b-all", "goal": "Move a job to a new time, or take it off the calendar the right way.", "why": "Unschedule, cancel and delete do different things. Picking the wrong one either texts the customer by mistake or loses the job.", "steps": ["To move it: open the job and click the first button in the action bar (it shows the date and time), or the pencil on the visit in the <b>Appointments</b> card. Change the date or time and <b>Save</b>.", "To take it off the calendar and keep it: use <b>Unschedule job</b>. No message goes out.", "To cancel: click the gear and wrench icon, <b>Cancel job</b>, choose <b>Notify Customer</b> or not, then <b>Yes, Cancel the Job</b>.", "To delete: gear and wrench icon, <b>Delete job</b>, then <b>Delete</b>. Deleted jobs can be restored from Jobs &gt; Actions."], "watch": ["Cancel sends the customer a text and an email if Notify Customer is ticked. Unschedule and delete send nothing.", "Deleting a job deletes its invoice too.", "A job with appointments can't be unscheduled. Delete the appointments first.", "A restored job has to be scheduled again by hand."], "verify": [], "qs": [["A customer wants to move Friday's visit and hasn't picked a new day. What do you do?", ["Cancel the job", "Unschedule the job", "Delete the job"], 1, "Unschedule keeps the job and sends nothing."], ["What happens to the invoice when you delete a job?", ["It stays", "It's deleted too", "It's voided"], 1, "Deleting a job deletes its invoice."]], "pcls": "p-chk", "pstat": "Partly in the practice copy", "task": "Jobs > #2263 (Lena Rosati) > click the first button in the action bar (it shows the date) > move it one day later and save. Unschedule, Cancel and Delete aren't in the practice copy yet.", "help": [["What's the difference between Unschedule, Cancel, and Delete?", "https://help.housecallpro.com/en/articles/2865052-unschedule-vs-cancel-vs-delete"], ["Jobs & Invoices: How to Delete, Cancel, and Restore", "https://help.housecallpro.com/en/articles/2832091-jobs-invoices-how-to-delete-cancel-and-restore"], ["Jobs & Estimates: Unschedule and Undo Actions", "https://help.housecallpro.com/en/articles/2823066-jobs-estimates-unschedule-and-undo-actions"]], "vids": [["Pro Power Hour: Technician Onboarding Wrap-up + Office Staff Onboarding, deleting and canceling jobs", "https://www.youtube.com/watch?v=Lukm3HqgLKY&t=3079s", " \u00b7 plays 51:19 to 52:12 (1 min) of a 59 min session \u00b7 Sep 2026"], ["Pro Power Hour: Dispatching and April Platform Updates, bulk reassign and reschedule", "https://www.youtube.com/watch?v=yi6PI8shnx4&t=905s", " \u00b7 plays 15:05 to 17:33 (2 min) of a 31 min session \u00b7 May 2026"]]}, "hm2-5": {"id": "m2-5", "sec": "module-2", "title": "Add a second appointment to a job", "badge": "All plans", "bcls": "b-all", "goal": "Book a return visit on the same job, so the work stays on one invoice.", "why": "A second job for the same work splits the invoice and the job history. Appointments keep it all together.", "steps": ["Check that appointments are on: Settings &gt; Jobs &gt; General &gt; <b>Appointments</b>.", "Open the job. In the <b>Appointments</b> section, click <b>+ Appointment</b>.", "Set the date, time and team for the next visit, then save.", "Each appointment shows as its own tile on the calendar."], "watch": ["Appointments: several visits, one invoice. Segments: parts of a job, each with its own invoice. Recurring jobs: a new job each time.", "Recurring jobs can't have more than one appointment."], "verify": ["The help center page on adding an appointment wasn't read for this lesson. Check the exact window and buttons on a live account."], "qs": [["A repipe takes three visits. How do you keep it on one invoice?", ["Three jobs", "Three appointments on one job", "A recurring job"], 1, "Appointments keep the visits on one job and one invoice."], ["Which one makes a new job each time?", ["Appointments", "Segments", "Recurring jobs"], 2, "Recurring jobs make a new, separate job on a set schedule."]], "pcls": "p-no", "pstat": "Not in the practice copy yet", "task": "Read only. The practice copy keeps one visit per job, so + APPOINTMENT opens the schedule window for that visit.", "help": [["Appointments vs. Segments vs. Recurring Jobs", "https://help.housecallpro.com/en/articles/12892543-appointments-vs-segments-vs-recurring-jobs"]], "vids": [["Pro Power Hour: Multi-Day Appointments & Multi-Option Approvals, appointments vs. segments", "https://www.youtube.com/watch?v=ruDCEotehjg&t=124s", " \u00b7 plays 2:04 to 4:18 (2 min) of a 40 min session \u00b7 Apr 2025"], ["Pro Power Hour: Multi-Day Appointments & Multi-Option Approvals, setting up appointments on a job", "https://www.youtube.com/watch?v=ruDCEotehjg&t=831s", " \u00b7 plays 13:51 to 16:42 (3 min) of a 40 min session \u00b7 Apr 2025"]]}, "hm2-6": {"id": "m2-6", "sec": "module-2", "title": "Check that techs tap On my way, Start and Finish", "badge": "All plans", "bcls": "b-all", "goal": "Make sure each job moves through On my way, Start and Finish, and fix it from the office when a tech forgets.", "why": "These taps send the customer's texts, track time on the job, and tell the office what's done. A job left at Scheduled looks like it never happened.", "steps": ["Open the job. The action bar shows <b>OMW</b>, <b>Start</b>, <b>Finish</b>, <b>Invoice</b> and <b>Pay</b>.", "A done step shows a time under it. A missing time means the tech skipped it.", "Ask the tech first. If the office has to do it, click the step for them.", "Tapped by mistake? Click <b>Undo</b>. It takes back the last step tapped."], "watch": ["On my way is a text. The customer only gets it the first time On my way is tapped.", "Finish has a Notify customer box. Untick it when the customer shouldn't get the Finished text, for example when you close out an old job.", "With Vehicle GPS Tracking (a paid feature), the On my way text includes a map with the tech's location."], "verify": [], "qs": [["A finished job shows no time under Start. What does that mean?", ["The tech skipped Start", "It's fine", "The job was cancelled"], 0, "No time means the step wasn't tapped."], ["The office tapped Start by mistake. What fixes it?", ["Delete the job", "Undo", "Call support"], 1, "Undo takes back the last step."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Jobs > #2264 (Sam Chen) > click OMW, then Start, then Finish. Then use Undo once and look at what changes.", "help": [["Jobs & Estimates: Unschedule and Undo Actions", "https://help.housecallpro.com/en/articles/2823066-jobs-estimates-unschedule-and-undo-actions"], ["Vehicle GPS Tracking: Overview", "https://help.housecallpro.com/en/articles/6060351-vehicle-gps-tracking-overview"]], "vids": [["Pro Power Hour: Technician Onboarding & Mobile App Crash Course, On my way, start, pause and finish", "https://www.youtube.com/watch?v=S-KSsam9Agc&t=2002s", " \u00b7 plays 33:22 to 36:54 (4 min) of a 60 min session \u00b7 Nov 2025"], ["Pro Power Hour: Technician Onboarding Wrap-up + Office Staff Onboarding, office view of field time and the activity feed", "https://www.youtube.com/watch?v=Lukm3HqgLKY&t=2540s", " \u00b7 plays 42:20 to 46:18 (4 min) of a 59 min session \u00b7 Sep 2026"]]}, "hm2-7": {"id": "m2-7", "sec": "module-2", "title": "Check that finished jobs are closed out (checklist)", "badge": "All plans", "bcls": "b-all", "goal": "Put the closeout checklist on jobs and check it was finished before the job counts as done.", "why": "A job marked Finished with no checklist means no photos, no notes and no proof of the work. That's what the owner needs when a customer calls back.", "steps": ["When you book the job, add the checklist under <b>Checklists</b> (left side of the job).", "In the field, the tech opens the job, taps <b>Checklists Incomplete</b> and ticks each item.", "When every item is ticked, the job shows <b>Checklists Complete</b>.", "Each day, open yesterday's finished jobs and look for any without a complete checklist."], "watch": ["The checklist has to exist in Settings &gt; Checklists before you can add it to a job.", "If your company auto-adds a checklist to jobs, still check it was finished."], "verify": [], "qs": [["What does a fini leted column on the Pipeline Jobs board. What's missing?", ["A tech", "A sent invoice", "A lead source"], 1, "Completed jobs move to Invoice Sent once the invoice goes out."], ["Which invoice quick view shows invoices that never went out?", ["Due", "Unsent", "Past Due"], 1, "Unsent."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Pipeline > Jobs. Find the jobs in Completed. Then Invoices > Unsent and match them up.", "help": [["Invoice List View", "https://help.housecallpro.com/en/articles/8959660-invoice-list-view"], ["Getting Started with Pipeline", "https://help.housecallpro.com/en/articles/6185127-getting-started-with-pipeline"]], "vids": [["Pro Power Hour: Homepage & Dashboard, tracking jobs that still need billing", "https://www.youtube.com/watch?v=7PggUpZAzKs&t=1295s", " \u00b7 plays 21:35 to 26:11 (5 min) of a 28 min session \u00b7 Dec 2025"], ["Pro Power Hour: Intake & Pipeline, the Jobs pipeline", "https://www.youtube.com/watch?v=-cKYanX2oT0&t=650s", " \u00b7 plays 10:50 to 16:07 (5 min) of a 53 min session \u00b7 Jul 2026"]]}, "hm3-3": {"id": "m3-3", "sec": "module-3", "title": "Record a cash or check payment", "badge": "All plans", "bcls": "b-all", "goal": "Record a cash or check payment on the right invoice, the same day.", "why": "An unrecorded payment shows as owed money. The customer gets reminders for a bill they paid.", "steps": ["Open the job or invoice and click <b>Pay</b>.", "Check the <b>Amount</b>.", "Pick <b>Cash</b> or <b>Check</b>. Put the check number in the payment note.", "Keep <b>Notify customer</b> ticked to send a receipt.", "Click <b>Paid - cash</b> or <b>Paid - check</b>."], "watch": ["One check for several jobs: record Paid - check on each job.", "A payment can't be more than what's owed.", "With several open invoices on a job, the payment goes to the oldest one first."], "verify": [], "qs": [["Where does the check number go?", ["Private notes", "The payment note", "Tags"], 1, "Put it in the payment note."], ["One check pays three jobs. How do you record it?", ["On one job only", "Paid - check on each job", "As Other"], 1, "Record it on each job."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Invoices > #2252 (Lena Rosati, $295) > Pay > Check. Note: check #1043. Record it.", "help": [["Take Payments", "https://help.housecallpro.com/en/articles/2785726-take-payments"], ["Marking Invoices and Jobs as paid", "https://help.housecallpro.com/en/articles/7062125-marking-invoices-and-jobs-as-paid"]], "vids": [["Pro Power Hour: Technician Onboarding & Mobile App Crash Course, the Pay button: cash, check or other", "https://www.youtube.com/watch?v=S-KSsam9Agc&t=2641s", " \u00b7 plays 44:01 to 44:28 (1 min) of a 60 min session \u00b7 Nov 2025"]]}, "hm3-4": {"id": "m3-4", "sec": "module-3", "title": "Save a card on file and charge it", "badge": "All plans", "bcls": "b-all", "goal": "Save the customer's card on file, and charge it only when it's agreed.", "why": "A card on file gets the office paid without chasing. Charging the wrong amount loses trust fast.", "steps": ["Open the customer's profile, Profile tab, <b>Payment method</b>.", "If the customer gives the card on the phone: click <b>Add credit card</b>, enter the card number, expiration, CVC and zip, then <b>Add card</b>.", "If the customer would rather type it in: click <b>Request card on file</b>, pick <b>Email</b> or <b>Text message</b>, and <b>Send request</b>.", "To charge it: open the job, click <b>Pay</b>, pick <b>Card on file</b>, check the amount and click <b>Charge card</b>.", "To remove or replace a card: the three dots next to it, then <b>Remove</b> or <b>Replace</b>."], "watch": ["Jobs paid with a card on file carry a 3.49% card-not-present fee.", "Always confirm the amount with the customer before you charge.", "A charge on a card on file always emails the customer a receipt.", "Requests by text only work once the company is registered for texting.", "Ask your manager which way your company takes cards."] ob.", "Progress invoicing only shows on jobs created after it's turned on.", "Quick views on the invoice list allow part payments unless progress invoicing is on."], "verify": [], "qs": [["Can you take a payment bigger than what's owed?", ["Yes", "No"], 1, "Only at or below the invoice cost."], ["Where is progressive invoicing turned on?", ["Settings > Invoices > Configuration", "The job", "Reports"], 0, "Settings > Invoices > Configuration."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Invoices > #2249 (Northgate Homes, $650) > Pay > Cash, amount $200. Then check what's still owed.", "help": [["Partial Payments", "https://help.housecallpro.com/en/articles/937862-partial-payments"], ["Progress Invoicing Basics and FAQs", "https://help.housecallpro.com/en/articles/8142156-progress-invoicing-basics-and-faqs"]], "vids": [["Pro Power Hour: Invoicing, deposits and progress billing on a job", "https://www.youtube.com/watch?v=mYvajLXP0TQ&t=1439s", " \u00b7 plays 23:59 to 31:57 (8 min) of a 49 min session \u00b7 Sep 2026"], ["Pro Power Hour: Progress Invoicing & Invoice Reminders, turning on progress invoicing", "https://www.youtube.com/watch?v=3m4KQqQ3jwY&t=728s", " \u00b7 plays 12:08 to 15:50 (4 min) of a 27 min session \u00b7 Apr 2025"]]}, "hm3-9": {"id": "m3-9", "sec": "module-3", "title": "Bill a property manager (sub-customers)", "badge": "All plans", "bcls": "b-all", "goal": "Send the bill to the company that pays, while the work and texts stay with the property.", "why": "Billing the tenant when the property manager pays means the invoice is never paid.", "steps": ["Make sure the paying company exists as a customer first (the parent).", "On the tenant or property customer, set <b>This customer bills to</b> and pick the parent.", "Book jobs on the sub-customer as usual.", "Invoices, estimates and receipts go to the parent. Scheduled, On my way and Finished texts go to the sub-customer."], "watch": ["One owner with many properties: add addresses to one
