<script>window.HCP_CONTENT = {"hm4-1": {"id": "m4-1", "sec": "module-4", "title": "Build an estimate with options", "badge": "All plans", "bcls": "b-all", "goal": "Build an estimate with clear line items, and more than one option when the customer has a choice.", "why": "Options help customers say yes. One price with no choice is easy to turn down.", "steps": ["Click <b>Create</b>, then <b>Estimate</b>. Pick the customer or click <b>+ New customer</b>.", "Add line items from the price book search.", "Set the schedule and the team if there's a visit.", "To add a choice, click <b>+ New option</b> and build it.", "Click <b>Save estimate</b>."], "watch": ["Payment can only be taken on a job, not on an estimate.", "Check each option's total before you send."], "verify": [], "qs": [["Where do you take payment for an estimate?", ["On the estimate", "On the job after it's copied", "In Settings"], 1, "Payment is only taken on a job."], ["How do you add a second choice?", ["+ New option", "A second estimate", "A tag"], 0, "Use + New option."]], "pcls": "p-chk", "pstat": "Partly in the practice copy", "task": "Estimates > #318 (Ana Kowalski) > Add service: Water heater flush. Options aren't in the practice copy yet (Add option only explains).", "help": [["How to Create an Estimate", "https://help.housecallpro.com/en/articles/1185469-how-to-create-an-estimate"]], "vids": [["Pro Power Hour: Estimates Deep Dive, building options, including more than one", "https://www.youtube.com/watch?v=fQRoQzOG1RM&t=1277s", " \u00b7 plays 21:17 to 26:26 (5 min) of a 44 min session \u00b7 May 2026"], ["Pro Power Hour: Multi-Day Appointments & Multi-Option Approvals, multi-option estimates", "https://www.youtube.com/watch?v=ruDCEotehjg&t=1197s", " \u00b7 plays 19:57 to 22:45 (3 min) of a 40 min session \u00b7 Apr 2025"]]}, "hm4-2": {"id": "m4-2", "sec": "module-4", "title": "Send it for e-signature and ask for a deposit", "badge": "All plans", "bcls": "b-all", "goal": "Send the estimate so the customer can approve it online, with a deposit if your company takes one.", "why": "An estimate sitting unsent can't be approved. A deposit at approval locks in the job.", "steps": ["Before sending, click <b>Add deposit</b> in the line items if a deposit is needed. Enter a dollar amount or a percent.", "Click <b>Send</b> in the action bar. Check the preview.", "Pick <b>Email</b> or <b>Text</b> and click <b>Send</b>.", "The customer's answer comes back by email and the status changes. The help center calls it Customer Approved or Customer Declined. The practice copy shows Approved or Rejected."], "watch": ["With deposits required, the customer must pay the deposit before approving.", "Texts only go to a Mobile number. A customer who replied STOP gets no texts.", "You can send to several emails, split with commas."], "verify": [], "qs": [["With deposits on, what must the customer do before approving?", ["Call the office", "Pay the deposit", "Sign twice"], 1, "The deposit is paid before approval."], ["A customer replied STOP to a text. Will the estimate text reach them?", ["Yes", "No"], 1, "STOP blocks texts."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Estimates > #318 (after the last lesson) > Add deposit $100 > Send by email.", "help": [["How to Send an Estimate", "https://help.housecallpro.com/en/articles/120533-how-to-send-an-estimate"], ["Collect Deposits on Estimates", "https://help.housecallpro.com/en/articles/12151673-collect-deposits-on-estimates"]], "vids": [["Pro Power Hour: Compliance Tools, requiring e-signatures and the approval flow", "https://www.youtube.com/watch?v=7Zycp8FztSw&t=655s", " \u00b7 plays 10:55 to 12:23 (1 min) of a 35 min session \u00b7 Mar 2025"], ["Pro Power Hour: Estimates Deep Dive, Q&A on expiration dates and deposits", "https://www.youtube.com/watch?v=fQRoQzOG1RM&t=2161s", " \u00b7 plays 36:01 to 41:02 (5 min) of a 44 min session \u00b7 May 2026"]]}, "hm4-3": {"id": "m4-3", "sec": "module-4", "title": "Follow up on open estimates (Pipeline)", "badge": "Needs the Pipeline add-on on some plans", "bcls": "b-add", "goal": "Work the open estimates every week so none go quiet.", "why": "Most estimates are won on the follow-up, not the first send. Our audits often find open estimates nobody called back.", "steps": ["Open <b>Pipeline</b>, then the <b>Estimates</b> board.", "Work the Sent column from oldest to newest.", "After each call or text, move the estimate to the next status (First Follow-Up, Second Follow-Up, Third Follow-Up).", "Use <b>Filter</b> to see one employee's estimates."], "watch": ["Pipeline doesn't create estimates. It shows the ones you already have.", "Created on Job only shows when Estimates on Job is turned on.", "Pipeline is an add-on on some plans."], "verify": [], "qs": [["Which column do you work first?", ["Approved", "Sent, oldest first", "Rejected"], 1, "Sent, oldest first."], ["Can you create an estimate from Pipeline?", ["Yes", "No"], 1, "Pipeline doesn't create items."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Pipeline > Estimates > #312 (Sam Chen): change its status from First Follow-Up to Second Follow-Up.", "help": [["Getting Started with Pipeline", "https://help.housecallpro.com/en/articles/6185127-getting-started-with-pipeline"]], "vids": [["Pro Power Hour: Pipeline, the Pipeline board", "https://www.youtube.com/watch?v=MTId3qIc3nM&t=421s", " \u00b7 plays 7:01 to 14:50 (8 min) of a 47 min session \u00b7 May 2025"], ["Pro Power Hour: Intake & Pipeline, estimate follow-up automations", "https://www.youtube.com/watch?v=-cKYanX2oT0&t=1811s", " \u00b7 plays 30:11 to 31:27 (1 min) of a 53 min session \u00b7 Jul 2026"]]}, "hm4-4": {"id": "m4-4", "sec": "module-4", "title": "Mark an estimate won or lost, with a reason", "badge": "All plans", "bcls": "b-all", "goal": "Close every estimate as approved or declined, so the close rate is real.", "why": "Estimates left open forever make the close rate look worse and hide why work was lost.", "steps": ["If the customer said yes or no by phone, open the estimate and record their answer.", "The help center calls the result Customer Approved or Customer Declined. The practice copy shows Approved or Rejected.", "If your company tracks lost reasons, add the reason tag your manager set up."], "watch": ["Don't leave a dead estimate open. Mark it declined.", "Once an estimate is approved or declined, it can't go back to undecided. Check before you click.", "Use the company's reason tags, not new ones."], "verify": ["The help center pages read for this lesson don't show the window for marking an answer by hand. Check it on a live account, and check the status names it shows."], "qs": [["A customer says no on the phone. What do you do?", ["Leave it open", "Mark it declined", "Delete it"], 1, "Mark it declined so the numbers are real."], ["Why close dead estimates?", ["To free up space", "So the close rate is real", "Housecall Pro requires it"], 1, "Open ones hide the true close rate."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Estimates > #311 (Tom Reyes) > Approval > Declined. Save.", "help": [["How to Send an Estimate", "https://help.housecallpro.com/en/articles/120533-how-to-send-an-estimate"], ["How to Use Multi-Option Estimates (Web & Mobile)", "https://help.housecallpro.com/en/articles/2883373-how-to-use-multi-option-estimates-web-mobile"]], "vids": [["Pro Power Hour: Technician Onboarding, approve or decline an estimate on mobile", "https://www.youtube.com/watch?v=iP8cPbqV_xI&t=3178s", " \u00b7 plays 52:58 to 53:31 (1 min) of a 56 min session \u00b7 Sep 2026"]], "vnote": "No video shows adding a lost reason yet."}, "hm4-5": {"id": "m4-5", "sec": "module-4", "title": "Copy the sold option to a job", "badge": "All plans", "bcls": "b-all", "goal": "Turn an approved estimate into a job with the same line items.", "why": "Retyping an approved estimate as a job leads to wrong prices and missing items.", "steps": ["Open the approved estimate.", "Click <b>Copy to job</b>.", "Click <b>Copy</b> (one option) or <b>Approve and copy</b> (more than one option).", "The new job opens. Schedule it."], "watch": ["Options copied to a job count as approved.", "The new job number may not match the estimate number.", "Jobs can't be merged later, so copy once."], "verify": [], "qs": [["The customer approved one option. Which button?", ["Approve and copy", "Copy"], 1, "Copy for a single option."], ["What should you do right after the job opens?", ["Schedule it", "Delete the estimate", "Send an invoice"], 0, "Schedule it."]], "pcls": "p-ok", "pstat": "In the practice copy", "task": "Estimates > #309 (Northgate Homes, approved) > Copy to job > Copy. Then schedule the new job.", "help": [["How to Copy or Convert Jobs and Estimates", "https://help.housecallpro.com/en/articles/2883009-copy-estimate-to-job"]], "vids": [["Pro Power Hour: Technician Onboarding, approve and copy to a job on mobile", "https://www.youtube.com/watch?v=iP8cPbqV_xI&t=3178s", " \u00b7 plays 52:58 to 53:31 (1 min) of a 56 min session \u00b7 Sep 2026"]]}};

function acadKc(what, id, mode, done, steps, hints){ try{
  var T = window.FPTrack; if(!T || mode !== "practice") return;
  var me = (T.me && T.me()) || {}; if(!me.id) return;
  if(what === "hint"){ T.event(id, "open", {hints:1}); return; }
  if(what === "left"){ if(done === steps || (!done && !hints)) return; T.event(id, "open", {score:done, total:steps, hints:hints}); return; }
  if(what === "done"){ var K = "acad-kcdone:" + me.id, o = JSON.parse(localStorage.getItem(K) || "{}");
    if(o[id]) T.event(id, "practice", {hints:hints}); else { o[id] = 1; localStorage.setItem(K, JSON.stringify(o)); } }
}catch(e){} }
(function seedKcDone(n){ try{ var T = window.FPTrack, me = T && T.me && T.me();
  if(!me || !me.id){ if(n < 20) setTimeout(function(){ seedKcDone(n + 1); }, 1000); return; }
  T.myEvents().then(function(rows){ var K = "acad-kcdone:" + me.id, o = JSON.parse(localStorage.getItem(K) || "{}");
    (rows || []).forEach(function(r){ if(r.part === "practice") o[r.lesson_id] = 1; }); localStorage.setItem(K, JSON.stringify(o)); });
}catch(e){} })(0);

(function(){ var last = ""; function upd(){ var id = (location.hash || "").slice(1), x = window.ACAD && window.ACAD.BY[id]; if(!x) return; var t = "Housecall Pro · " + window.ACAD.dayName(x.day) + " · " + window.ACAD_MODNAME[x.mod]; if(t !== last){ last = t; var el = document.getElementById("bcbh-day"); if(el) el.textContent = t; } } setInterval(upd, 500); document.addEventListener("DOMContentLoaded", upd); })();</script>
