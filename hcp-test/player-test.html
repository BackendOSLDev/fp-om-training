<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Video Player Test</title>
<style>
:root{--bg:#f4f6f2;--ink:#1d232b;--muted:#5c6570;--link:#1F5FAD}
@media (prefers-color-scheme:dark){:root{--bg:#11161d;--ink:#e7eaee;--muted:#9ba5b1;--link:#7fb0ef}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:24px 16px}
.w{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:0} p{margin:0} ol{margin:0;padding-left:22px;display:grid;gap:10px}
.g-vbtn{background:none;border:0;padding:0;font:inherit;color:var(--link);cursor:pointer;text-align:left;text-decoration:underline}
small{color:var(--muted)} #log{font:13px/1.4 ui-monospace,monospace;color:var(--muted);white-space:pre-wrap}
#hx-vp{position:fixed;z-index:60;right:16px;bottom:16px;width:min(520px,calc(100vw - 32px));background:#141a22;color:#eef2f6;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.35);overflow:hidden;font:14px/1.4 "Source Sans 3",system-ui,sans-serif}
#hx-vp .vp-h{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px}
#hx-vp .vp-h b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hx-vp .vp-x{background:none;border:0;color:inherit;font-size:24px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:6px}
#hx-vp .vp-x:hover,#hx-vp .vp-x:focus-visible{background:rgba(255,255,255,.12);outline:none}
#hx-vp .vp-f{position:relative;aspect-ratio:16/9;background:#000}
#hx-vp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#hx-vp .vp-n{margin:0;padding:8px 14px 10px;color:#aab3be;font-size:12.5px}
#hx-vp .vp-n a{color:#f3a55a}
#hx-vp .vp-fb{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;background:#0d1117}
#hx-vp .vp-fb p{margin:0;color:#c9d1db} #hx-vp .vp-fb .vp-sm{font-size:12.5px;color:#9ba5b1}
#hx-vp .vp-yt{display:inline-block;background:#c8402c;color:#fff;font-weight:700;text-decoration:none;padding:10px 16px;border-radius:6px}
#hx-vp .vp-yt:hover,#hx-vp .vp-yt:focus-visible{background:#a8341f;outline:none}
</style>
</head>
<body>
<div class="w">
<h1>Video player test</h1>
<p>Test page for the HCP Academy video player (Nov 2026). Not linked from the site. Each video should start at the first time and stop by itself at the second.</p>
<ol>
<li><button type="button" class="g-vbtn" data-yt="5y_FtIYPovM" data-s="250" data-e="258" data-t="Short test: Card on File, 4:10 to 4:18" data-u="https://www.youtube.com/watch?v=5y_FtIYPovM&amp;t=250s">Short test: Card on File, 4:10 to 4:18</button> <small>8 seconds, to see it stop</small></li>
<li><button type="button" class="g-vbtn" data-yt="5y_FtIYPovM" data-s="250" data-e="373" data-t="Pro Power Hour: Card on File, saving a card and charging it" data-u="https://www.youtube.com/watch?v=5y_FtIYPovM&amp;t=250s">Pro Power Hour: Card on File, saving a card and charging it</button> <small>M3-4 clip, 4:10 to 6:13</small></li>
</ol>
<p id="log">Player status shows here.</p>
</div>
<script>
(function(){
"use strict";
var E = function(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
var VPT = null, VPI = null;
function mmss(n){ n = +n; return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); }
function closeVP(){ clearTimeout(VPT); clearInterval(VPI); var p = document.getElementById("hx-vp"); if(p) p.remove(); }
function vpFallback(p, d){ clearInterval(VPI); var f = p.querySelector(".vp-f"); if(!f) return;
  f.outerHTML = '<div class="vp-fb"><p>The video can\'t play here.</p><a class="vp-yt" href="' + E(d.u) + '" target="_blank" rel="noopener">Watch on YouTube from ' + mmss(d.s) + '</a><p class="vp-sm">Stop it at ' + mmss(d.e) + ', where this part ends.</p></div>';
  var n = p.querySelector(".vp-n"); if(n) n.remove(); }
function openVP(b){ closeVP(); var d = b.dataset, p = document.createElement("div"); p.id = "hx-vp"; p.setAttribute("role", "dialog"); p.setAttribute("aria-label", "Video");
  var org = location.origin && location.origin !== "null" ? "&origin=" + encodeURIComponent(location.origin) : "";
  var src = "https://www.youtube-nocookie.com/embed/" + d.yt + "?start=" + d.s + "&end=" + d.e + "&autoplay=1&rel=0&modestbranding=1&enablejsapi=1" + org;
  p.innerHTML = '<div class="vp-h"><b>' + E(d.t) + '</b><button type="button" class="vp-x" aria-label="Close video">&times;</button></div>' +
    '<div class="vp-f"><iframe src="' + src + '" title="' + E(d.t) + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>' +
    '<p class="vp-n">Plays ' + mmss(d.s) + " to " + mmss(d.e) + ', then stops. Not playing? <a href="' + E(d.u) + '" target="_blank" rel="noopener">Watch it on YouTube</a>.</p>';
  document.body.appendChild(p); p.querySelector(".vp-x").focus();
  var fr = p.querySelector("iframe"); p.__ok = false;
  VPI = setInterval(function(){ try{ fr.contentWindow.postMessage(JSON.stringify({ event: "listening", id: 1 }), "*"); }catch(e){} }, 500);
  VPT = setTimeout(function(){ if(!p.__ok && document.body.contains(p)) vpFallback(p, d); }, 6000); }
window.addEventListener("message", function(e){ if(!/youtube(-nocookie)?\.com$/.test(String(e.origin))) return; var p = document.getElementById("hx-vp"); if(!p) return;
  var f = p.querySelector("iframe"); if(f && e.source === f.contentWindow){ p.__ok = true; clearInterval(VPI); } });

var ST = {"-1": "not started", 0: "ended", 1: "playing", 2: "paused", 3: "loading", 5: "ready"}, LT = null, LS = null;
window.addEventListener("message", function(e){ if(!/youtube(-nocookie)?\.com$/.test(String(e.origin))) return; try{ var j = JSON.parse(e.data), i = j.info || {};
  if(i.currentTime != null) LT = i.currentTime; if(i.playerState != null) LS = i.playerState;
  document.getElementById("log").textContent = "Player reports: time " + (LT == null ? "?" : LT.toFixed(1)) + " s, state " + (ST[LS] || LS); }catch(x){} });
document.addEventListener("click", function(e){ var b = e.target.closest(".g-vbtn"); if(b){ e.preventDefault(); openVP(b); return; } if(e.target.closest(".vp-x")) closeVP(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeVP(); });
})();
</script>
</body>
</html>
