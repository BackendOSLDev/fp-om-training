<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BCB Partners Academy · Foundations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>/* Practice copy of FieldPulse. Light only on purpose: it copies the FieldPulse web app, which is light. */
#px{--nv:#0b0a4d;--bl:#1976d2;--bl-d:#135ea8;--bl-l:#e3f0fc;--gr:#5cb531;--gr-d:#4a9827;--pg:#eef1f5;--sf:#fff;--ln:#d9dee5;--ln2:#eceff3;--ink:#1f2633;--ink2:#5b6474;--ink3:#8a93a3;--ok:#2e7d32;--ok-l:#e5f4e6;--bad:#c62828;--bad-l:#fdecea;--warn:#8a5a00;--warn-l:#fff4dc;--hl:#f5a623;
  color-scheme:light;color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.4}
#px *{box-sizing:border-box}
:where(#px button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:where(#px input,#px select,#px textarea){font:inherit;color:var(--ink);background:#fff;border:1px solid #c5ccd6;border-radius:4px;padding:6px 8px;min-width:0;max-width:100%}
:where(#px textarea){width:100%}
#px :focus-visible{outline:2px solid var(--bl);outline-offset:1px}
#px .muted{color:var(--ink2)} #px .fp-small{font-size:12px} #px .ok{color:var(--ok)} #px .bad{color:var(--bad)} #px .warn{color:var(--warn)} #px .req{color:var(--bad);font-size:11px;font-weight:600}
#px .lnk{color:var(--bl);text-align:left} #px .lnk:hover{text-decoration:underline}
.px-days{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.px-days button{display:grid;text-align:left;border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:120px;background:var(--bg);color:var(--fg)}
.px-days button.on{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.px-days span{font-size:12px;color:var(--muted)} .px-days small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.px-read{font-size:13px;color:var(--muted);margin:0 0 10px}
.px-read .lnk{color:var(--accent)}
.fp-frame{display:grid;grid-template-columns:186px minmax(0,1fr) 300px;min-height:720px;background:var(--pg);border:1px solid var(--ln);border-radius:6px;overflow:hidden}
.fp-side{background:#fff;border-right:1px solid var(--ln);padding:10px 8px;min-width:0}
.fp-me{display:flex;align-items:center;gap:8px;padding:2px 6px 10px;border-bottom:1px solid var(--ln2);margin-bottom:6px}
.fp-av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.fp-av.sm{width:24px;height:24px;font-size:10px;vertical-align:middle}
.fp-nav{display:flex;flex-direction:column;gap:1px}
.fp-ni{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 6px;border-radius:4px;font-size:13.5px;color:var(--ink)}
.fp-ni:hover{background:#f2f5f9} .fp-ni.on{background:var(--bl-l);color:var(--bl-d);font-weight:600}
.fp-ni.grp{cursor:default;font-weight:600;margin-top:6px} .fp-ni.grp:hover{background:none}
.fp-ni.sub{padding-left:36px;font-size:13px}
.fp-ico{width:22px;height:22px;border-radius:5px;display:inline-grid;place-items:center;color:#fff;flex:none}
.fp-mainwrap{display:flex;flex-direction:column;min-width:0}
.fp-top{height:46px;background:var(--nv);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px}
.fp-top .fp-title{font-size:15px} .fp-back{color:#fff!important;display:grid;place-items:center}
.fp-prac{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.06em;background:#ffe9b3;color:#6b4500;border-radius:3px;padding:2px 6px}
.fp-now{font-size:12px;opacity:.85;white-space:nowrap}
.fp-main{padding:14px 16px 28px;min-width:0;overflow:auto;max-height:860px}
.fp-ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.fp-ph h1{font-size:20px;margin:0;font-weight:600} .fp-ph .r{display:flex;gap:6px}
.fp-bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;margin-bottom:10px}
.fp-btn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:4px;font-size:13.5px;font-weight:600;white-space:nowrap}
.fp-btn.blue{background:var(--bl);color:#fff!important} .fp-btn.blue:hover{background:var(--bl-d)}
.fp-btn.green{background:var(--gr);color:#fff!important} .fp-btn.green:hover{background:var(--gr-d)}
.fp-btn.ghost{border:1px solid #c5ccd6;background:#fff} .fp-btn.ghost.on{border-color:var(--bl);color:var(--bl)}
.fp-btn.danger{border:1px solid var(--bad);color:var(--bad)!important;background:#fff}
.fp-btn.link{height:auto;padding:0;color:var(--bl)!important;font-weight:600}
.fp-btn.sm{height:26px;padding:0 9px;font-size:12.5px}
.fp-card{background:#fff;border:1px solid var(--ln);border-radius:6px;margin-bottom:10px;min-width:0}
.fp-card.pad,.fp-card .pad{padding:12px 14px}
.fp-card h3{font-size:14.5px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.fp-card h4{margin:10px 0 4px;font-size:13px}
.fp-card p{margin:0 0 6px}
.fp-tw{overflow-x:auto}
.fp-t{border-collapse:collapse;width:100%;font-size:13px}
.fp-t th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:8px;border-bottom:1px solid var(--ln);white-space:nowrap}
.fp-t td{padding:8px;border-bottom:1px solid var(--ln2);vertical-align:top}
.fp-t.sm td,.fp-t.sm th{padding:5px 8px}
.fp-t tr.cl{cursor:pointer} .fp-t tr.cl:hover td{background:#f6f9fd}
.fp-t tr.refund td{color:var(--bad);font-size:12px}
.fp-foot{padding:8px 10px;color:var(--ink2);font-size:12px;display:flex;justify-content:space-between;align-items:center}
.fp-pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11.5px;font-weight:600;background:#eef2f6;color:var(--ink2);white-space:nowrap}
.fp-pill.ok{background:var(--ok-l);color:var(--ok)} .fp-pill.bad{background:var(--bad-l);color:var(--bad)}
.fp-search{position:relative;display:flex;align-items:center} .fp-search svg{position:absolute;left:8px;color:var(--ink3)} .fp-search input{padding-left:28px;width:240px}
.fp-ltabs{display:flex;gap:16px;border-bottom:1px solid var(--ln);margin:0 0 10px;flex-wrap:wrap}
.fp-ltabs button{padding:7px 2px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.5px}
.fp-ltabs button.on{color:var(--bl);border-bottom-color:var(--bl);font-weight:600}
.fp-ltabs.sub{gap:12px} .fp-ltabs.sub button{font-size:12.5px}
.fp-ttabs{display:flex;gap:16px;margin:10px 0;border-bottom:1px solid var(--ln)}
.fp-ttabs button{padding:6px 2px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--ink2)} .fp-ttabs button.on{color:var(--bl);border-bottom-color:var(--bl);font-weight:600}
.fp-rec{display:grid;gap:4px;min-width:0}
.fp-rh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;background:#fff;border:1px solid var(--ln);border-radius:6px;padding:12px 14px}
.fp-rh h1{margin:0;font-size:20px;font-weight:600} .fp-rh .r{display:flex;gap:6px;flex-wrap:wrap}
.fp-qb{font-size:12px;color:var(--ink2);margin-top:4px;display:flex;gap:8px;align-items:center} .fp-qb.bad{color:var(--bad)}
.fp-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fp-two>.fp-card{margin-bottom:0} .fp-rec>.fp-two{margin-bottom:10px}
.fp-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px} .fp-kv dt{color:var(--ink2)} .fp-kv dd{margin:0}
.fp-tag{display:inline-flex;align-items:center;gap:4px;background:#e8edf3;border-radius:10px;padding:1px 8px;font-size:12px}
.fp-tag button{color:var(--ink2);font-size:14px;line-height:1}
.fp-pm{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.fp-star{color:#b0b8c4;vertical-align:middle} .fp-star.on{color:#f5a623}
.fp-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fp-chip{border:1px solid #c5ccd6;border-radius:14px;padding:3px 11px;font-size:12.5px;background:#fff}
.fp-chip.on{background:#d9f0fb;border-color:#4fb3e0;font-weight:700;color:#075985}
.fp-mwrap{position:relative;display:inline-block}
.fp-menu{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--ln);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.16);z-index:30;padding:6px 0;min-width:180px;display:grid}
.fp-menu.wide{display:flex;gap:4px;padding:8px;min-width:0;flex-wrap:wrap;width:max-content;max-width:min(560px,80vw)}
.fp-menu.right{right:0}
.fp-menu button{text-align:left;padding:6px 14px;font-size:13px;white-space:nowrap} .fp-menu button:hover{background:#f2f5f9}
.fp-mg{display:grid;min-width:130px} .fp-mg b{font-size:12px;color:var(--ink2);padding:4px 14px}
.fp-dd{position:absolute;left:0;top:100%;background:#fff;border:1px solid var(--ln);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:20;display:grid;min-width:220px;padding:4px 0}
.fp-dd button{text-align:left;padding:6px 12px} .fp-dd button:hover{background:#f2f5f9} .fp-dd button.new{color:var(--bad);border-top:1px solid var(--ln2)}
.fp-dd .muted{padding:6px 12px}
.fp-tags{position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid #c5ccd6;border-radius:4px;padding:4px 6px;background:#fff}
.fp-tags .fp-tagin{border:0;padding:3px;flex:1;min-width:120px}
.fp-filt .fp-fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fp-chk{display:flex;gap:6px;align-items:flex-start;font-size:13px;padding:2px 0;cursor:pointer}
.fp-chk input{margin-top:2px}
.fp-fld{display:grid;gap:2px;min-width:0} .fp-fld>label{font-size:12px;color:var(--ink2);font-weight:600}
.fp-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:8px}
.fp-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px} .fp-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fp-grid2 select,.fp-grid2 input,.fp-grid3 select,.fp-fld select,.fp-fld input{width:100%}
.fp-bar .fp-fld select,.fp-bar .fp-fld input{width:auto}
.fp-seg{display:inline-flex;border:1px solid var(--bl);border-radius:4px;overflow:hidden;margin:4px 0}
.fp-seg button{padding:4px 12px;color:var(--bl);font-size:13px} .fp-seg button.on{background:var(--bl);color:#fff}
.fp-days{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px} .fp-days button{border:1px solid #c5ccd6;border-radius:4px;padding:4px 10px;background:#fff;font-size:12.5px} .fp-days button.on{background:var(--bl);color:#fff;border-color:var(--bl)}
.fp-sched{display:grid;grid-template-columns:minmax(0,1fr);gap:10px} .fp-sched.withun{grid-template-columns:170px minmax(0,1fr)}
.fp-un{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:8px;display:grid;gap:6px;align-content:start}
.fp-unjob{display:grid;text-align:left;border:1px solid var(--ln);border-left:3px solid var(--hl);border-radius:4px;padding:5px 7px;font-size:12.5px;background:#fffdf7;cursor:grab}
.fp-unjob small{color:var(--ink2)} .fp-unjob.on{outline:2px solid var(--bl)}
.fp-board{background:#fff;border:1px solid var(--ln);border-radius:6px;overflow-x:auto}
.fp-brow{display:grid;grid-template-columns:110px minmax(520px,1fr);border-bottom:1px solid var(--ln2);min-height:46px}
.fp-brow .who{font-size:12.5px;font-weight:600;padding:8px;border-right:1px solid var(--ln2)}
.fp-brow .cells{position:relative;display:grid;grid-template-columns:repeat(11,1fr)}
.fp-brow.head{min-height:0} .fp-brow.head .cells span{font-size:11px;color:var(--ink3);padding:4px 2px;border-left:1px solid var(--ln2)}
.fp-brow .cell{border-left:1px solid var(--ln2);min-height:46px} .fp-brow .cell:hover{background:#f4f8fd}
.fp-brow .blk{position:absolute;top:5px;height:36px;border-radius:4px;background:#dbe9fb;border-left:3px solid var(--bl);font-size:11.5px;text-align:left;padding:2px 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:grab}
.fp-brow .blk.v{background:#e7f5e1;border-left-color:var(--gr)} .fp-brow .blk .tdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:5px;vertical-align:middle} .fp-brow .blk.on{outline:2px solid var(--hl)}
.fp-selnote{font-size:12.5px;background:var(--warn-l);color:var(--warn);border-radius:4px;padding:4px 8px}
.fp-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fp-tile{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:12px} .fp-tile small{display:block;color:var(--ink2);font-size:12px} .fp-tile b{font-size:20px}
.fp-prev{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.fp-doc{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:16px;min-width:0} .fp-doc h2{margin:0 0 6px}
.fp-send{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:12px;display:grid;gap:8px;align-content:start}
.fp-tot{text-align:right;font-weight:700;margin:6px 0 0}
.fp-big{font-size:26px;font-weight:700;margin:0}
.fp-tsrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--ln2)}
.fp-tsrow small{display:block;font-size:12px;color:var(--ink2)} .fp-tsrow small.ok{color:var(--ok);font-weight:600} .fp-tsrow .r{text-align:right;font-size:13px}
.fp-green{background:#4caf50;color:#fff;border-radius:6px;padding:10px 12px;margin-bottom:10px}
.fp-entry{display:grid;width:100%;text-align:left;border:1px solid var(--ln);border-radius:6px;padding:8px 10px;margin-bottom:6px;background:#fff} .fp-entry small{color:var(--ink2)}
.fp-rep{display:grid;grid-template-columns:minmax(0,1fr);gap:10px} .fp-rep.withp{grid-template-columns:minmax(0,1fr) 230px}
.fp-repmain{min-width:0}
.fp-group{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#f4f6f9;border:1px dashed #b9c2cf;border-radius:4px;padding:6px 10px;margin-bottom:8px;font-size:12.5px;color:var(--ink2)}
.fp-group select{font-size:12px;padding:3px 6px}
.fp-rpanel{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:8px;max-height:520px;overflow:auto;display:grid;align-content:start;gap:2px}
.fp-fgh{font-weight:700;font-size:12px;color:var(--ink2);margin-top:8px;padding:4px 0;border-top:1px solid var(--ln2)}
.fp-fhead{display:flex;gap:4px;align-items:center;width:100%;text-align:left;padding:4px 2px;font-size:12.5px;font-weight:600}
.fp-fhead .dot{width:7px;height:7px;border-radius:50%;background:var(--bl);display:inline-block}
.fp-fbody{padding:2px 0 6px 18px;display:grid;gap:2px}
.fp-fbody input,.fp-fbody select{width:100%}
.fp-grp summary{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--ln2)}
.fp-note{background:var(--warn-l);color:var(--warn);border-radius:4px;padding:6px 10px;font-size:12.5px;margin-bottom:10px}
.fp-x{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:var(--ink2)} .fp-x:hover{background:#eef1f5}
.fp-nowrap{white-space:nowrap}
.fp-ov{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:60;display:grid;place-items:center;padding:16px}
.fp-md{background:#fff;border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.3);width:min(520px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.fp-md.wide{width:min(720px,100%)}
.fp-mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px} .fp-mh h2{font-size:17px;margin:0}
.fp-mb{padding:6px 16px 10px;overflow:auto;display:grid;gap:8px;font-size:13.5px}
.fp-mb h4{margin:8px 0 0;font-size:13px}
.fp-mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--ln2);flex-wrap:wrap}
.fp-uchk{display:flex;flex-wrap:wrap;gap:4px 14px}
.fp-slots{display:grid;gap:4px;background:#f4f8fd;border-radius:6px;padding:8px} .fp-slots button{text-align:left;border:1px solid #c8d8ee;border-radius:4px;padding:5px 8px;background:#fff}
.fp-picker{display:grid;gap:4px;border:1px solid var(--ln);border-radius:6px;padding:8px;background:#fafbfd}
.fp-picker>button{text-align:left;padding:5px 8px;border-radius:4px} .fp-picker>button:hover{background:#eef3fa} .fp-picker>button.new{color:var(--bad)}
.fp-otabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--ln);padding-bottom:4px}
.fp-otabs>button{border:1px solid var(--ln);border-radius:4px 4px 0 0;padding:4px 10px} .fp-otabs>button.on{background:var(--bl-l);border-color:var(--bl);font-weight:600}
.fp-merge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:13px}
.fp-merge input{width:100%}
.fp-pick{display:block;width:100%;text-align:left;border:1px solid var(--ln);border-radius:4px;padding:5px 8px;margin-top:4px} .fp-pick.on{border-color:var(--bl);background:var(--bl-l)}
.fp-sub{padding:4px 0;font-size:13px}
#px .fp-snack{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;background:#2b2f38;color:#fff;border-radius:4px;padding:10px 14px;max-width:min(460px,calc(100% - 32px));font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.3);border-left:4px solid #66bb6a}
.fp-snack.s-bad{border-left-color:#ef5350} .fp-snack.s-rk{border-left-color:var(--hl)}
/* drawer (training layer, not FieldPulse) */
.px-drawer{background:#fbfaf6;border-left:1px solid var(--ln);border-top:3px solid var(--hl);display:flex;flex-direction:column;min-width:0}
.px-dh{padding:12px 14px 8px;border-bottom:1px solid var(--ln);display:grid;gap:6px}
.px-dt{display:flex;justify-content:space-between;gap:8px;font-size:14px} .px-dt span{font-variant-numeric:tabular-nums;color:var(--ink2)}
.px-prog{height:6px;background:var(--ln);border-radius:3px;overflow:hidden} .px-prog i{display:block;height:100%;background:var(--ok)}
.px-dots{display:flex;flex-wrap:wrap;gap:5px}
.px-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid #b9c2cf!important;background:#fff!important}
.px-dot.s{background:var(--ok)!important;border-color:var(--ok)!important} .px-dot.h{background:var(--hl)!important;border-color:var(--hl)!important}
.px-dot.cur{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--bl)}
.px-task{padding:12px 14px;display:grid;gap:8px;align-content:start;flex:1 1 auto;overflow:auto}
.px-task h3{margin:0;font-size:16px}
.px-brief{margin:0;font-size:14px}
.px-phone{background:#eef3fb;border-radius:6px;padding:8px 10px;font-size:12.5px;display:grid;gap:3px}
.px-q p{margin:0 0 4px;font-size:13px;font-weight:600}
.px-opts{display:grid;gap:4px} .px-opts button{text-align:left;border:1px solid #c5ccd6;border-radius:5px;padding:6px 9px;background:#fff;font-size:13px}
.px-opts button.right{border-color:var(--ok);background:var(--ok-l);color:var(--ok);font-weight:600} .px-opts button.wrong{border-color:var(--bad);background:var(--bad-l);color:var(--bad)}
.px-done{border:1px solid var(--ok);background:var(--ok-l);color:var(--ok);border-radius:6px;padding:8px 10px;font-weight:600}
.px-hintb{justify-self:start;color:var(--warn);font-weight:600;font-size:13px}

/* Option B shell: FieldPulse navy header, white Trainual-style cards. Light only. */
:root{--page:#f4f6fa;--hdr:#0b0a4d;--hdr-muted:#b9bce6;--accent:#1976d2;--accent-ink:#1565c0;--accent-soft:#eaf3fd;--accent-line:#c9e0fa;--fg:#1f2a37;--muted:#667085;--line:#e4e7ec;color-scheme:light}
html,body{margin:0;background:var(--page);color:var(--fg)}
body{font-family:"Inter","Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.ob-hdr{background:var(--hdr);color:#fff}
.ob-hdr .in{max-width:1440px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.ob-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem}
.ob-brand i{width:28px;height:28px;border-radius:7px;background:var(--accent);box-shadow:inset 0 0 0 7px #fff;flex:none}
.ob-brand small{display:block;font-weight:400;color:var(--hdr-muted);font-size:.8rem}
.ob-tabs{display:flex;gap:2px;background:rgba(255,255,255,.12);border-radius:8px;padding:3px}
.ob-tabs button{font:inherit;font-weight:600;font-size:.9rem;border:0;background:transparent;color:#fff;border-radius:6px;padding:7px 14px;cursor:pointer}
.ob-tabs button[aria-pressed="true"]{background:#fff;color:var(--hdr)}
.ob-sub{background:#fff;border-bottom:1px solid var(--line)}
.ob-sub .in{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.ob-crumb{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}

window.MOD_INFO={"summary": "The basics every office manager uses every day: clean customer records, tags, lead sources, roles and how messages go out.", "watch": {"f-1": ["FieldPulse will save a customer with no lead source. Nothing forces it, so you have to fill it every time.", "Typing a tag that is not on the list makes a new tag for the whole company.", "Customer records go to QuickBooks, so a typo here ends up in the books too.", "Notes on the customer are internal. The customer never sees them."], "f-2": ["If a job's location has a linked contact, changing the location also changes the job contact. Automatic texts and emails then go to that person.", "A company with many sites can be set up as separate linked customers (parent and child) or as extra locations on one customer. Ask your manager which way each account is set up before you add a site.", "Extra locations do not go to QuickBooks. A parent and each child go to QuickBooks as separate customers."], "f-3": ["A half-typed tag (for example 'Emerg' instead of 'Emergency') saves as a brand new tag for the whole company.", "Customer tags and job tags are separate lists. There are also tag lists for estimates and invoices, items, users, timesheets and maintenance agreements.", "Only an Admin can delete a tag from the company list (Company Settings > Jobs > Tags, or Company Settings > Customers > Tags)."], "f-4": ["FieldPulse can't make lead source required. The record saves without it.", "Check the lead source on every customer that came from a Booking Portal request, and set it by hand if it's blank.", "Only a FieldPulse Engage phone line can set a lead source by itself. Without Engage it is always done by hand."], "f-5": ["If you see a login that looks shared, like a company name instead of a person, tell your manager.", "The user list groups people by role: Admin, Team Manager, Service Agent and so on. Your manager decides your role."], "f-6": ["Texts sent from FieldPulse are one way. Customers can't reply to that number.", "Without Engage, texts come from a FieldPulse number, not your company number.", "Ask your manager whether on-the-way and arrival texts are working on your account before you tell a customer to expect one.", "Replies to FieldPulse emails go to the From address your company set up. Ask your manager which inbox that is, and send yourself a test to check."], "f-7": ["Treat a merge as something you can't undo. Check twice before you click Save Customers.", "Customers sync to QuickBooks. Tell the bookkeeper after a merge so they can check the books side.", "Searching first is the best fix. A merge is the clean-up."]}, "sops": {"INT-01": {"id": "INT-01", "title": "Answer and Log an Inbound Call", "url": "https://drive.google.com/file/d/1aGxOwLkxO6mXLecEFQK5bErGuic-cGCc/view?usp=drivesdk", "standard": ["Answer within your company's answer target and use your company's call script.", "Search FieldPulse for the customer first. Never create a duplicate record.", "Fill the intake form for the customer type every time.", "Tag the lead source from your company's lead source list. Use only your company's tag list, never a new tag.", "Offer 2 time windows first, then explain the service fee.", "Never waive the fee yourself. Send waiver requests to your company's fee waiver approver.", "No pricing or diagnosis over the phone.", "Pick a disposition code before you hang up. Add a one-line reason for Not Booked."], "mistakes": [{"mistake": "Quoting the fee before offering a time", "instead": "Offer the windows first, then the fee."}, {"mistake": "Creating a duplicate customer", "instead": "Search first."}, {"mistake": "Creating a new tag on the fly", "instead": "Use your company's tag list only."}]}, "DSP-02": {"id": "DSP-02", "title": "Confirm the Appointment", "url": "https://drive.google.com/file/d/1ZRJOx1wt0aAgQx9IsfLt0QADeGJ2iwoc/view?usp=drivesdk", "standard": ["If FieldPulse can't switch messages on or off by customer type, check your company's confirmation /* helpers on the world */
function cname(W,id){ const c=W.cust[id]; if(!c) return "-"; return c.company || `${c.first} ${c.last}`.trim(); }
function uname(W,id){ return (W.users[id]||{}).name || "-"; }
function techs(W){ return Object.keys(W.users).filter(k => W.users[k].tech && W.users[k].st==="Activated" && W.users[k].role!=="Assignment User"); }
function invTotal(i){ return i.items.reduce((a,x)=>a+x.q*x.p,0); }
function invPaid(i){ return i.pays.reduce((a,p)=>a+p.amt-(p.refunds||[]).reduce((b,r)=>b+r.amt,0),0); }
function invDue(i){ if(i.st==="Void"||i.st==="Invoice Draft") return i.st==="Invoice Draft"?invTotal(i):0; return Math.max(0, Math.round((invTotal(i)-invPaid(i))*100)/100); }
function estTotal(e){ const o=e.opts[0]; return o? o.items.reduce((a,x)=>a+x.q*x.p,0):0; }
function jobInvoices(W,jid){ return Object.values(W.inv).filter(i => i.job===jid && i.st!=="Void"); }
function jobInvStatus(W,j){ return jobInvoices(W,j.id).length ? "Invoiced" : "Not Yet Invoiced"; }
function tsHours(t){ if(t.co==null){ return null; } return Math.round((t.co-t.ci)*100)/100; }

/* collect every input with data-f before an action re-renders the screen */
function collect(){
  if(!ROOT) return;
  ROOT.querySelectorAll("[data-f]").forEach(el => {
    const k = el.dataset.f, store = k.startsWith("m.") ? U.form : U.pf;
    if(el.type==="checkbox") store[k] = el.checked;
    else if(el.type==="radio"){ if(el.checked) store[k] = el.value; }
    else if(el.tagName==="SELECT" && el.multiple) store[k] = [...el.selectedOptions].map(o=>o.value);
    else store[k] = el.value;
  });
}

function custMatch(c, q, f){
  if(!q) return true; q = q.toLowerCase();
  const v = {Name:`${c.first} ${c.last} ${c.company||""}`, Address:c.addr, City:c.city, State:"WI", "Zip Code":c.zip, Phone:c.phone, "Phone 2":""}[f] || "";
  return v.toLowerCase().replace(/[^a-z0-9 ]/g,"").includes(q.replace(/[^a-z0-9 ]/g,"")) || (f==="Phone" && v.replace(/\D/g,"").includes(q.replace(/\D/g,"")) && q.replace(/\D/g,"").length>2);
}

function jobList(view){
  let L = Object.values(W.jobs).filter(j => !j.archived);
  const v = W.views.find(x => x.name===view);
  const f = v ? v.f : null;
  if(view==="Open") L = L.filter(j => !CLOSED_ST.includes(j.st));
  if(view==="Closed") L = L.filter(j => CLOSED_ST.includes(j.st));
  if(view==="Unassigned") L = L.filter(j => !j.users.length && j.st!=="Canceled");
  if(view==="Unscheduled") L = L.filter(j => !j.date && j.st!=="Canceled");
  if(view==="Unassigned & Unscheduled") L = L.filter(j => !j.users.length && !j.date && j.st!=="Canceled");
  const ff = f || ((U.showJobFilters || U.jfApplied) ? U.jobsFilter : null);
  if(ff){
    if(ff.st && ff.st.length) L = L.filter(j => ff.st.includes(j.st));
    if(ff.inv && ff.inv!=="Any") L = L.filter(j => jobInvStatus(W,j)===ff.inv);
    if(ff.t){ const t = ff.t.toLowerCase(); L = L.filter(j => j.title.toLowerCase().includes(t)); }
    if(ff.u && ff.u!=="Any") L = L.filter(j => j.users.includes(ff.u));
    if(ff.sd && ff.sd!=="Any"){ const n = ff.sd==="Last 15 Days" ? 15 : 30; L = L.filter(j => { if(!j.date) return false; const d = ddiff(TODAY, j.date); return d>=0 && d<n; }); }
  }
  const q = (pv("p.jobq","")||"").trim().toLowerCase(); if(q) L = L.filter(j => (`#${j.id} ${j.title} ${cname(W,j.c)}`).toLowerCase().includes(q));
  return L.sort((a,b) => b.id.localeCompare(a.id));
}

function scrSchedule(){

  const blocks = [];
  Object.values(W.jobs).forEach(j => { if(j.archived||j.st==="Canceled"||j.date!==day) return; j.users.forEach(u => blocks.push({u, id:j.id, s:j.s, e:j.e, t:`#${j.id} ${cname(W,j.c)}`, em:j.tags.includes("Flag: Emergency / After Hours")})); j.visits.forEach(v => { if(v.date===day) v.users.forEach(u => blocks.push({u,id:j.id,s:v.s,e:v.e,t:`#${j.id} ${v.name}`,visit:true})); }); });
  Object.values(W.jobs).forEach(j => j.visits.forEach(v => { if(v.date===day && j.date!==day) v.users.forEach(u => blocks.push({u,id:j.id,s:v.s,e:v.e,t:`#${j.id} ${v.name}`,visit:true})); }));
  const un = Object.values(W.jobs).filter(j => !j.archived && !CLOSED_ST.includes(j.st) && (!j.users.length || !j.date));
  let h = `<div class="fp-ltabs top">${[["List","list"],["Calendar","cal"],["Dispatch","list"],["Map","map"]].map(([v,i])=>`<button class="${v==="Dispatch"?"on":""}" data-a="${v==="Dispatch"?"noop":"sched-other"}">${ic(i,16)}${v}</button>`).join("")}<span class="sp"></span><span class="fp-cj">${createBtn("job-new","Create Job")}<span class="dd">${ic("down",16)}</span></span></div>

  <div class="fp-sched ${U.showUnassigned?"withun":""}">`;

  h += `<div class="fp-board"><div class="fp-brow head"><span class="who"></span><div class="cells">${Array.from({length:span},(_,i)=>`<span>${fmtH(7+i).replace(":00","")}</span>`).join("")}</div></div>`;
  rows.forEach(u => {
    h += `<div class="fp-brow"><span class="who">${E(uname(W,u))}</span><div class="cells">${Array.from({length:span},(_,i)=>`<button class="cell" data-a="sched-drop" data-u="${u}" data-h="${7+i}" data-drop="1" aria-label="${E(uname(W,u))} ${fmtH(7+i)}" data-hk="cell-${u}-${7+i}"></button>`).join("")}
      ${blocks.filter(b=>b.u===u).map(b=>`<button class="blk ${b.visit?"v":""} ${b.em?"em":""} ${U.sel===b.id?"on":""}" style="left:${(b.s-7)/span*100}%;width:${Math.max(4,(b.e-b.s)/span*100)}%" draggable="true" data-drag="${b.id}" data-a="sched-pick" data-v="${b.id}" title="${E(b.t)}">${b.em?`<i class="tdot" title="Flag: Emergency / After Hours"></i>`:""}${E(b.t)}</button>`).join("")}</div></div>`;
  });
  return h + `</div></div><p class="muted fp-small fp-tip">Tip: drag a job onto a tech and time, or click the job and then click the spot. FieldPulse asks you to confirm.</p>`;

function passFilter(r, filters){
  for(const [k,f] of Object.entries(filters||{})){
    if(!f) continue;
    if(f.vals){ const v = r[k]===""||r[k]==null ? "(Blanks)" : String(r[k]); if(!f.vals.includes(v)) return false; }
    if(f.op && f.op!=="Any" && f.val!==""){ const n=+r[k], x=+f.val; if(r[k]===""||isNaN(n)) return false; if(f.op==="Greater Than" && !(n>x)) return false; if(f.op==="Less Than" && !(n<x)) return false; }
  }
  return true;
}

function pivotTable(rows, pv){
  const keyOf = {"Estimate Creator":"creator","Status":"status","Customer":"customer"}[pv.by];
  const g = {}; rows.forEach(r => { const k = r[keyOf]||"(Blanks)"; (g[k]=g[k]||[]).push(r); });
  const val = list => {
    if(pv.field==="Count") return String(list.length);
    if(pv.field==="Total") return money(list.reduce((a,r)=>a+(+r.total||0),0));
    const sent = list.filter(r=>r.status!=="Draft"), won = sent.filter(r=>r.converted);
    return sent.length ? `${Math.round(100*won.length/sent.length)}% (${won.length} of ${sent.length})` : "-";
  };
  return `<table class="fp-t sm"><thead><tr><th>${E(pv.by)}</th><th>${E(pv.field)}</th></tr></thead><tbody>${Object.keys(g).sort().map(k=>`<tr><td>${E(k)}</td><td>${val(g[k])}</td></tr>`).join("")}</tbody></table>`;
}

/* ===== what each click does ===== */
const HIST = [];
function nav(p, extra){ HIST.push(U.r); go(p, extra); }
function samePerson(a, b){ const A=W.cust[a], B=W.cust[b]; if(!A||!B) return false; const ph = A.phone.replace(/\D/g,"")===B.phone.replace(/\D/g,""); const ad = A.addr.toLowerCase().replace(/(lane|ln|street|st|road|rd)\.?$/,"").trim().split(" ").slice(0,2).join(" ")===B.addr.toLowerCase().replace(/(lane|ln|street|st|road|rd)\.?$/,"").trim().split(" ").slice(0,2).join(" "); return ph && ad; }
function findDupOf(first,last,phone,email,skip){ const p=(phone||"").replace(/\D/g,""); return Object.keys(W.cust).find(id => id!==skip && ((p.length>6 && W.cust[id].phone.replace(/\D/g,"")===p) || (email && W.cust[id].email && W.cust[id].email.toLowerCase()===email.toLowerCase()) || (`${W.cust[id].first} ${W.cust[id].last}`.toLowerCase()===`${first} ${last}`.toLowerCase().trim() && last))); }
function newCust(d){ const id = "c"+(W.nextCust++); W.cust[id] = Object.assign({first:"",last:"",phone:"",email:"",addr:"",city:"",zip:"",st:"Current Customer",type:"Residential",ls:"",tags:[],jobNotes:"",contacts:[],locs:[],cards:[],created:TODAY}, d); return id; }
function conflictFor(users, date, s, e, skipJob){
  for(const u of users){ for(const j of Object.values(W.jobs)){ if(j.archived||j.st==="Canceled"||j.id===skipJob) continue;
    const slots = [{d:j.date,s:j.s,e:j.e,u:j.users,n:`#${j.id}`}].concat(j.visits.map(v=>({d:v.date,s:v.s,e:v.e,u:v.users,n:`#${j.id} ${v.name}`})));
    for(const x of slots){ if(x.d===date && x.u.includes(u) && s<x.e && e>x.s) return `${uname(W,u)} already has ${x.n} from ${fmtH(x.s)} to ${fmtH(x.e)} on ${dlab(date)}.`; } } }
  return null;
}
function openAvail(len){ const out=[]; ["11-05","11-06","11-09"].forEach(d => techs(W).filter(u=>u!=="u8").forEach(u => { for(let h=8; h+len<=17; h++){ if(!conflictFor([u],d,h,h+len)){ out.push({d,u,s:h,e:h+len}); break; } } })); return out.sort((a,b)=>a.d.localeCompare(b.d)||a.s-b.s).slice(0,6); }
function addComm(c, kind, what){ W.comms.unshift({to:c, kind, what, at:"Nov 4, 2:15 PM", st:"Delivered"}); }

function act(a, ds){
  const v = ds.v;
  switch(a){
  case "noop": return;
  case "na-tab": { if(U.modal || !v){ toast("That part of FieldPulse is not set up in this practice.","rk"); return; } nav("na",{label:v}); return; }
  case "qb-ok": toast("This record is already synced with QuickBooks.","rk"); return;
  case "go": HIST.length=0; go(v, v==="na"?{label:ds.label}:{}); if(v==="jobs"){ U.jobsView="Open"; U.showJobFilters=false; U.jobsFilter={st:[],inv:"Any",sd:"Any"}; U.jfApplied=false; } if(v==="estimates"){ U.estTab="Estimates"; U.showEstFilters=false; U.estFilter={st:[],by:""}; } if(v==="customers"){ U.q=""; U.qf="Name"; } if(v==="rep" && !U.rep.tab) U.rep={tab:"jobs"}; return;
  case "back": { if(U.r.p==="preview"){ U.pf = {}; } const prev = HIST.pop(); if(prev) U.r = prev; else go("dash"); U.menu=null; return; }
  case "menu": U.menu = U.menu===v ? null : v; return;
  case "modal-close": closeModal(); return;
  case "archive": toast("Archiving is not part of this practice. Ask your manager before you archive anything.","rk"); U.menu=null; return;
  case "na-menu": toast("Not part of this practice.","rk"); U.menu=null; return;

/* dynamic questions */
function dynQ(name){
  if(name==="noinv"){ const n = Object.values(W.jobs).filter(j=>!j.archived && j.st==="Completed" && jobInvStatus(W,j)==="Not Yet Invoiced").length; const o=[...new Set([n, n+2, n>0?n-1:n+1])].sort((x,y)=>x-y); return {q:"How many jobs are on your new view right now?", o:o.map(String), a:o.indexOf(n)}; }
  return null;
}
function taskQs(t){ return (t.q||[]).map(q => q.dyn ? dynQ(q.dyn) : q); }

/* progress for this page load */
let PROG = {tasks:{}, slips:{}};          // saved across reloads (via course storage)
let ANS = {};                               // answers this session: {taskId:{qi:{i,ok}}}
let HINTED = {};                            // taskId -> true when hint was opened
let CUR = 0;                                // index of current task in the day
let PVIEW = "day";                          // "day" | "results"
function dayTasks(d){ return (PROGRAM.find(x=>x.d===d)||PROGRAM[0]).tasks; }
function qsOk(t){ const qs = taskQs(t); return qs.every((q,i) => ANS[t.id] && ANS[t.id][i] && ANS[t.id][i].ok); }
function evaluate(){
  let changed = false;
  dayTasks(DAY).forEach(t => {
    if(PROG.tasks[t.id]) return;
    let ok = false; try{ ok = t.check() && qsOk(t); }catch(e){ ok = false; }
    if(ok){ PROG.tasks[t.id] = HINTED[t.id] ? "h" : "s"; changed = true; if(t===dayTasks(DAY)[CUR]) toast("Task done. Nice work.","ok"); }
  });
  const sl = SLIPS.filter(s=>s.day===DAY).map(s=>({t:s.text,s:s.serious}));
  if(JSON.stringify(PROG.slips[DAY]||[]) !== JSON.stringify(sl)){ PROG.slips[DAY] = sl; changed = true; }
  if(changed && window.FPCourse) window.FPCourse.savePractice(PROG);
}
function startDay(d, fresh){
  DAY = d; W = pfresh(); EV = []; resetUI(); HIST.length = 0; ANS = {}; HINTED = {}; CUR = 0; PVIEW = "day";
  SLIPS = SLIPS.filter(s=>s.day!==d);
  if(fresh){ dayTasks(d).forEach(t => delete PROG.tasks[t.id]); PROG.slips[d] = []; if(window.FPCourse) window.FPCourse.savePractice(PROG); }
  const firstOpen = dayTasks(d).findIndex(t=>!PROG.tasks[t.id]); CUR = firstOpen<0 ? 0 : firstOpen;
}

/* rating */
function rating(){
  const vals = ALLTASKS.map(t=>PROG.tasks[t.id]);
  const done = vals.filter(Boolean).length, own = vals.filter(v=>v==="s").length;
  const serious = Object.values(PROG.slips||{}).flat().filter(s=>s.s).length;
  const slips = Object.values(PROG.slips||{}).flat().length;
  let r = "Not ready yet";
  if(done===TOTAL_TASKS && own>=Math.ceil(TOTAL_TASKS*0.85) && serious===0) r = "Ready";
  else if(done>=Math.ceil(TOTAL_TASKS*0.9) && serious<=1) r = "Ready with coaching";
  return {done, own, hint:done-own, serious, slips, r};
}

  const sl = Object.entries(PROG.slips||{}).flatMap(([d,L])=>L.map(s=>`Day ${d}: ${s.s?"Serious: ":""}${s.t}`));

function engAct(a, ds){
  const G = U.eng || (U.eng = {open:false});
  switch(a){
    case "eng-open": U.eng = {open:true, tab:"conv", sel:G.sel||null, comp:"sms"}; U.menu=null; log("eng-open",{}); return true;
    case "eng-close": G.open = false; G.more=false; G.modal=null; log("eng-close",{}); return true;
    case "eng-tab": G.tab = ds.v; G.more=false; log("eng-tab",{v:ds.v}); return true;
    case "eng-sel": { const cv = engConv(ds.v); if(cv){ cv.unread=false; } if(G.sel!==ds.v){ U.pf["e.link"]=false; U.pf["e.lc"]=""; U.pf["e.cq2"]=""; U.pf["e.msg"]=""; ["e.fn","e.ln","e.dn","e.em","e.ls","e.ad"].forEach(k=>delete U.pf[k]); } G.sel = ds.v; G.more=false; if(G.tab!=="conv"&&G.tab!=="calls"&&G.tab!=="vm") G.tab="conv"; log("eng-sel",{v:ds.v}); return true; }

    case "eng-calld": G.modal = {k:"calld", c:ds.v, e:ds.e}; log("eng-calld",{c:ds.v,e:ds.e}); return true;

    case "eng-relclose": { const M = G.modal; G.modal = M ? {k:"calld", c:M.c, e:M.e} : null; return true; }
    case "eng-reltick": { const M = G.modal; M.sel = M.sel.includes(ds.v) ? M.sel.filter(x=>x!==ds.v) : M.sel.concat([ds.v]); if(!M.sel.includes(M.primary)) M.primary = M.sel.length===1 ? null : M.primary; return true; }
    case "eng-relstar": G.modal.primary = ds.v; return true;
    case "eng-relsave": { const M = G.modal; if(!M.sel.length){ toast("Tick a record first.","bad"); return true; } if(!M.primary){ toast("Choose a primary record (the star).","bad"); return true; }
      const cv = engConv(M.c), e = cv.ev.find(x=>x.id===M.e); e.rel = {ids:M.sel.slice(), primary:M.primary}; M.sel.forEach(id=>{ const j=W.jobs[id]; if(j){ j.calls = (j.calls||[]).filter(x=>x.e!==e.id).concat([{e:e.id, conv:cv.id, primary:id===M.primary, time:e.time, date:e.date, ls:e.ls}]); } });
      log("eng-relink",{c:cv.id,e:e.id,ids:M.sel.slice(),primary:M.primary}); G.modal = {k:"calld", c:M.c, e:M.e}; toast("Call linked."); return true; }

    case "eng-unpick": U.pf["e.lc"] = ""; return true;

let GUIDE = null;          // {id, i, max, mode, ans}
function gStart(id){ const g = GUIDES[id]; if(!g) return false; W = pfresh(); resetUI(); EV = []; GUIDE = {id, i:0, max:0, mode:"walk", ans:{}}; return true; }
function gStepDone(s){ const i = GUIDES[GUIDE.id].steps.indexOf(s); return s.q ? (GUIDE.ans[i]===s.q.a) : !!s.done(); }
function gAdvance(){
  const g = GUIDES[GUIDE.id]; let moved = false;
  while(GUIDE.i===GUIDE.max && GUIDE.i<g.steps.length && gStepDone(g.steps[GUIDE.i])){ GUIDE.i++; GUIDE.max = GUIDE.i; moved = true; }
  return moved;
}
function gRail(){
  const g = GUIDES[GUIDE.id], L = window.FPCourse && window.FPCourse.lesson ? window.FPCourse.lesson(GUIDE.id) : null;
  const n = g.steps.length, done = Math.min(GUIDE.max, n), fin = GUIDE.max>=n;
  const title = window.FPCourse ? window.FPCourse.lessonTitle(GUIDE.id) : GUIDE.id;
  let h = `<div class="g-head"><div class="g-ey">${E(g.mod)} · Lesson ${g.n} of ${g.of}</div><h2>${E(title)}</h2>
   <div class="g-mode" role="group" aria-label="Lesson mode"><button class="${GUIDE.mode==="walk"?"on":""}" data-a="g-mode" data-v="walk">Walk me through it</button><button class="${GUIDE.mode==="read"?"on":""}" data-a="g-mode" data-v="read">Read the steps</button></div></div>`;
  if(GUIDE.mode==="read"){
    h += `<div class="g-body"><ol class="g-steps read">${g.steps.map((s,i)=>`<li><span class="g-num">${i+1}</span><div><b>${E(s.t)}</b><p>${s.do}</p>${s.watch?`<p class="g-w">${E(s.watch)}</p>`:""}</div></li>`).join("")}</ol>${gSop(L)}</div>`;
    return h;
  }
  h += `<div class="g-body"><div class="g-call"><small>${E(g.call.who)}</small><p>${E(g.call.text)}</p></div>
   <div class="g-prog"><span>${fin?"All steps done":`Step ${GUIDE.i+1} of ${n}`}</span><span>${done}/${n}</span></div><div class="g-bar"><i style="width:${Math.round(100*done/n)}%"></i></div>
   <ol class="g-steps">`;
  g.steps.forEach((s,i) => {
    const st = i<GUIDE.max ? "ok" : i===GUIDE.i ? "cur" : "next";
    const open = i===GUIDE.i;
    h += `<li class="${st}${open?" open":""}"><span class="g-num">${st==="ok"?ic("check",14):i+1}</span><div><button class="g-st" data-a="g-go" data-v="${i}" ${i>GUIDE.max?"disabled":""}>${E(s.t)}</button>`;
    if(open){
      h += `<p class="g-do">${s.do}</p>`;
      if(s.why) h += `<p class="g-why">${E(s.why)}</p>`;
      if(s.watch) h += `<p class="g-w"><b>Watch out.</b> ${E(s.watch)}</p>`;
      if(s.q){ const a = GUIDE.ans[i]; h += `<div class="g-q"><p>${E(s.q.ask)}</p><div class="g-opts">${s.q.opts.map((o,oi)=>`<button class="${a===oi?(oi===s.q.a?"right":"wrong"):""}" data-a="g-ans" data-v="${oi}">${E(o)}</button>`).join("")}</div>${a!=null?`<small class="${a===s.q.a?"ok":"bad"}">${a===s.q.a?E(s.q.fb):"Not quite. Look at the status badge on the invoice."}</small>`:""}</div>`; }
      if(i<GUIDE.max) h += `<p class="g-done">${ic("check",14)} Done</p>`;
      else if(!s.q) h += `<p class="g-wait"><span class="g-dot"></span>Waiting for you in FieldPulse. The orange box shows where.</p>`;
    }
    h += `</div></li>`;
  });
  h += `</ol>`;
  if(fin) h += `<div class="g-fin"><b>Lesson done.</b><p>Now try it with no help in Practice: ${E((LESSON_TASK[GUIDE.id]||{}).t||"the matching task")}.</p><div class="g-row">${`<button class="g-btn" data-a="g-restart">Do it again</button><button class="g-btn pri" data-a="g-practice">Go to practice</button>`}</div></div>`;
  h += gSop(L) + `</div>`;
  h += `<div class="g-foot"><button class="g-btn" data-a="g-prev" ${GUIDE.i===0?"disabled":""}>Back</button><span class="g-sp"></span><button class="g-btn" data-a="g-restart">Start over</button>${GUIDE.i<GUIDE.max&&!fin?`<button class="g-btn pri" data-a="g-next">Next</button>`:""}</div>`;
  return h;
}

function gAct(a, ds){
  if(!GUIDE) return null;

/* ===== Module 1 page: same layout as the Nov 4 guided prototype (app left, lesson panel right) =====
   Panel modes: Walk me through it (one step at a time, orange boxes), Read the steps (steps, watch-outs, office standard),
   Practice it (no boxes, steps tick off in any order, Show me gives one hint).
   Undo puts the practice copy back to how it was before the last click, and moves the lesson back with it.
   These function declarations replace the ones in p9_guide.js (the last declaration wins). */
const CHK = {};        // check answers per lesson: {id:{qi:optionIndex}}
let UNDO = [];
let RAILMIN = false;     // lesson card folded down to one line         // snapshots taken before each click or change in the practice copy
const CHK1 = {};       // first answer per check question, for the first-try score: {id:{qi:optionIndex}}
function m1Prog(part, extra){ try{ if(window.M1Progress) window.M1Progress.mark(GUIDE.id, part, extra); }catch(e){} }
function m1L(){ const L = window.MOD_LESSONS || (typeof M1_LESSONS!=="undefined" ? M1_LESSONS : {}); return L[GUIDE.id] || {}; }
function gStart(id, mode){
  const g = GUIDES[id]; if(!g) return false;
  W = pfresh(); resetUI(); EV = []; UNDO = [];
  GUIDE = {id, i:0, max:0, mode:mode||"walk", ans:{}, pd:{}, hint:-1, hints:0, checked:false};
  return true;
}
/* ---- undo ---- */
function gClone(o){ try{ return structuredClone(o); }catch(e){ return JSON.parse(JSON.stringify(o)); } }
function gSnap(){
  if(!GUIDE || GUIDE.mode==="read") return;
  try{ collect(); }catch(e){}
  UNDO.push({W:gClone(W), U:gClone(Object.assign({}, U, {snack:null, menu:null})), EV:gClone(EV), G:gClone({i:GUIDE.i, max:GUIDE.max, ans:GUIDE.ans, pd:GUIDE.pd, hint:GUIDE.hint})});
  if(UNDO.length>40) UNDO.shift();
}
function gUndo(){
  const s = UNDO.pop(); if(!s) return false;
  W = s.W; U = s.U; EV = s.EV; Object.assign(GUIDE, s.G); LASTR = "";
  return true;
}
function gStepDone(s){ const i = GUIDES[GUIDE.id].steps.indexOf(s); if(s.q) return GUIDE.ans[i]===s.q.a; try{ return !!s.done(); }catch(e){ return false; } }
function pIdx(){ return GUIDES[GUIDE.id].steps.map((s,i)=>s.q?-1:i).filter(i=>i>=0); }
function pAll(){ return pIdx().every(i => GUIDE.pd[i]); }
function gAdvance(){
  const g = GUIDES[GUIDE.id];
  if(GUIDE.mode==="practice"){
    let ch = false, was = pAll();
    pIdx().forEach(i => { if(!GUIDE.pd[i] && gStepDone(g.steps[i])){ GUIDE.pd[i] = true; ch = true; } });
    if(GUIDE.hint>=0 && GUIDE.pd[GUIDE.hint]) GUIDE.hint = -1;
    if(ch && !was && pAll()) m1Prog("practice", {hints:GUIDE.hints});
    return ch;
  }
  if(GUIDE.mode!=="walk") return false;
  let moved = false;
  while(GUIDE.i===GUIDE.max && GUIDE.i<g.steps.length && gStepDone(g.steps[GUIDE.i])){ GUIDE.i++; GUIDE.max = GUIDE.i; moved = true; }
  if(moved && GUIDE.max>=g.steps.length) m1Prog("walk");
  return moved;
}
/* ---- panel ---- */
function gHelp(full){
  const I = window.MOD_INFO||window.M1_INFO||{}, md = (I.media||{})[GUIDE.id];
  if(!md || !(md.videos.length || (full && md.docs.length))) return "";
  const vids = md.videos.map(v=>`<li><a href="${E(v.url)}" target="_blank" rel="noopener"><span class="g-play" aria-hidden="true"></span>${E(v.t)}</a> <small>${v.min} min video</small></li>`).join("");
  if(!full) return `<ul class="g-vids sm">${vids}</ul>`;
  const docs = md.docs.map(d=>`<li><a href="${E(d.url)}" target="_blank" rel="noopener">${E(d.t)}</a></li>`).join("");
  return `<div class="g-help"><p class="g-hh">From the FieldPulse help center</p>${vids?`<ul class="g-vids">${vids}</ul>`:""}${docs?`<p class="g-hs">Help articles</p><ul class="g-docs">${docs}</ul>`:""}</div>`;
}
function gSit(open){
  const g = GUIDES[GUIDE.id], L = m1L(), s = L.sit || g.call;
  return `<details class="g-sitd"${open?" open":""}><summary>What's going on</summary><div class="g-call"><p>${E(s.text)}</p>${L.why?`<p class="g-whyl"><b>Why it matters:</b> ${E(L.why)}</p>`:""}${gHelp(false)}</div></details>`;
}
function gRail(){
  const g = GUIDES[GUIDE.id], L = m1L(), m = GUIDE.mode;
  const title = window.FPCourse ? window.FPCourse.lessonTitle(GUIDE.id) : GUIDE.id;
  const stepTxt = m==="walk" ? `Step ${Math.min(GUIDE.i+1, g.steps.length)} of ${g.steps.length}` : m==="practice" ? "Practice" : "Steps";
  const minB = `<button class="g-min" data-a="g-min" aria-label="${RAILMIN?"Show the lesson":"Hide the lesson"}" title="${RAILMIN?"Show":"Hide"}">${RAILMIN?"&#9650;":"&#9660;"}</button>`;
  if(RAILMIN) return `<div class="g-head g-mini"><div class="g-ey">Lesson ${g.n} · ${stepTxt}</div><b>${E(title)}</b>${minB}</div>`;
  let h = `<div class="g-head">${minB}<div class="g-ey">Lesson ${g.n} of ${g.of}</div><h2>${E(title)}</h2>
   <div class="g-mode" role="group" aria-label="Lesson mode">${[["walk","Walk-through"],["read","Steps"],["practice","Practice"]].map(([k,l])=>`<button class="${m===k?"on":""}" data-a="g-mode" data-v="${k}" aria-pressed="${m===k}">${l}</button>`).join("")}</div></div>`;
  if(m==="read") return h + gRead(L);
  if(m==="practice") return h + pRail(g, L);
  const n = g.steps.length, done = Math.min(GUIDE.max, n), fin = GUIDE.max>=n;
  h += `<div class="g-body">${gSit(GUIDE.max===0)}`;
  if(fin){
    h += `<div class="g-fin"><b>Nice, you did it.</b><p>Answer these quick questions. Then try it on your own.</p></div>${gChecks(L)}
     <div class="g-row g-end"><button class="g-btn" data-a="g-restart">Do it again</button><button class="g-btn pri" data-a="g-mode" data-v="practice">Try it on my own</button></div>`;
  } else {
    const s = g.steps[GUIDE.i], past = GUIDE.i<GUIDE.max;
    h += `<div class="g-prog"><span>Step ${GUIDE.i+1} of ${n}</span></div><div class="g-bar"><i style="width:${Math.round(100*done/n)}%"></i></div>
     <div class="g-cur${past?" ok":""}"><b class="g-st">${E(s.t)}</b><p class="g-do">${s.do}</p>${s.why?`<p class="g-why">${E(s.why)}</p>`:""}${s.watch?`<p class="g-w"><b>Watch out.</b> ${E(s.watch)}</p>`:""}`;

function gMark(){

function gAct(a, ds){

      if(GUIDE.mode==="read" && v===GUIDE.prev){ GUIDE.mode = v; return true; }

    case "g-go": { const i = +ds.v; if(i<=GUIDE.max) GUIDE.i = i; return true; }
    case "g-prev": GUIDE.i = Math.max(0, GUIDE.i-1); return true;
    case "g-next": GUIDE.i = Math.min(GUIDE.max, GUIDE.i+1); return true;
    case "g-ans": GUIDE.ans[GUIDE.i] = +ds.v; return true;
    case "g-undo": gUndo(); return true;
    case "g-min": RAILMIN = !RAILMIN; if(ROOT) ROOT.classList.toggle("g-folded", RAILMIN); return true;

}

ecord", "Nothing", "The tags"], 0, "Make sure the whole history is there."]]};
