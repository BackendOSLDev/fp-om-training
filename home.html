<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FieldPulse training · BCB Partners Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;700&amp;family=Permanent+Marker&amp;family=Source+Sans+3:wght@400;500;600;700;900&amp;display=swap">
<style>
/* BCB Partners look, taken from bluecollarballerpartners.com: near-black ground, off-white type, one red, square corners.
   Anton for headings, Archivo for reading, JetBrains Mono for labels and buttons. */
body{margin:0;background:#0B0B0B}
.bcb{--ink:#0B0B0B;--ink2:#131313;--ink3:#1B1B1B;--paper:#F2F1EE;--mut:rgba(242,241,238,.72);--faint:rgba(242,241,238,.48);--line:rgba(242,241,238,.12);--line2:rgba(242,241,238,.24);--ok:#62C482;--warn:#E8A93C;--red:#C6301A;--red2:#DD3B22;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;--body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  min-height:100vh;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
/* Working pages use a white page; the header bar stays BCB black. Front-door pages (sign in, choose FSM) stay dark. */
.bcb.light{--ink:#FFFFFF;--ink2:#F6F5F2;--ink3:#EEECE7;--paper:#0B0B0B;--mut:rgba(11,11,11,.7);--faint:rgba(11,11,11,.52);--line:rgba(11,11,11,.12);--line2:rgba(11,11,11,.26);--ok:#1E7A3C;--warn:#9A6200;}
.bcb.light .hdr{--ink:#0B0B0B;--ink2:#131313;--ink3:#1B1B1B;--paper:#F2F1EE;--mut:rgba(242,241,238,.72);--faint:rgba(242,241,238,.48);--line:rgba(242,241,238,.12);--line2:rgba(242,241,238,.24);--ok:#62C482;--warn:#E8A93C;background:#0B0B0B;color:#F2F1EE}
.bcb a{color:var(--paper);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.bcb a:hover{text-decoration-color:var(--red)}
.bcb :focus-visible{outline:2px solid var(--red);outline-offset:2px}
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--ink)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none!important;color:var(--paper)!important}
.brand .logo{height:24px;width:auto;display:block}
.brand small{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);padding-left:12px;border-left:1px solid var(--line2)}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto;flex-wrap:wrap}
.toplink{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)!important;text-decoration:none!important;padding:8px 10px;border-bottom:2px solid transparent}
.toplink:hover{color:var(--paper)!important}
.toplink.on{color:var(--paper)!important;border-bottom-color:var(--red)}
.who{width:32px;height:32px;margin-left:10px;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--paper)}
.search{flex:1 1 260px;max-width:380px;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);padding:0 12px;min-height:38px;background:var(--ink2)}
.search input{border:0;background:transparent;font:inherit;font-size:14px;flex:1;min-width:0;outline:none;color:var(--paper)}
.search input::placeholder{color:var(--faint)}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:0}
.h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:46px;line-height:.98;letter-spacing:-.005em;margin:0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
.h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:19px;line-height:1.1;margin:0}
.mut{color:var(--mut)}.faint{color:var(--faint)}
.marker{font-family:'Permanent Marker',cursive;text-transform:none;letter-spacing:.01em;border-bottom:2px solid var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 20px;border:1px solid var(--red);background:var(--red);color:#F2F1EE!important;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none!important;cursor:pointer;border-radius:0}
.btn:hover{background:var(--red2);border-color:var(--red2)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--paper)!important}
.btn.ghost:hover{border-color:var(--paper)}
.btn.done{background:transparent;border-color:var(--ok);color:var(--ok)!important;cursor:default}
.panel{border:1px solid var(--line);background:var(--ink2)}
.paper{--ink:#FFFFFF;--ink2:#F6F5F2;--ink3:#EEECE7;--paper:#0B0B0B;--mut:rgba(11,11,11,.7);--faint:rgba(11,11,11,.52);--line:rgba(11,11,11,.12);--line2:rgba(11,11,11,.26);--ok:#1E7A3C;--warn:#9A6200;--ink2:#FFFFFF;background:#F2F1EE;color:#0B0B0B}
.bcb.light .paper{--ink:#0B0B0B;--ink2:#131313;--ink3:#1B1B1B;--paper:#F2F1EE;--mut:rgba(242,241,238,.72);--faint:rgba(242,241,238,.48);--line:rgba(242,241,238,.12);--line2:rgba(242,241,238,.24);--ok:#62C482;--warn:#E8A93C;background:#0B0B0B;color:#F2F1EE}
.tabs{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line2);width:max-content;max-width:100%}
.tabb{border:0;border-right:1px solid var(--line2);background:transparent;color:var(--paper);font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;padding:10px 14px;cursor:pointer;min-height:38px}
.tabb:last-child{border-right:0}
.tabb:hover{background:var(--ink3)}
.tabb.on{background:var(--red);color:#F2F1EE}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{font:inherit;font-size:15px;color:var(--paper);background:var(--ink2);border:1px solid var(--line2);border-radius:0;min-height:44px;padding:0 12px}
.field input:focus,.field select:focus{outline:none;border-color:var(--paper)}
.num{font-variant-numeric:tabular-nums}
.fsmchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);padding:6px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper)!important;text-decoration:none!important}
.fsmchip:hover{border-color:var(--paper)}
.fsmchip .dot{width:7px;height:7px;background:var(--ok)}
.fsmchip .chg{color:var(--faint);padding-left:8px;border-left:1px solid var(--line2)}
.bar{display:block;height:4px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--ok)}
.sw{position:relative;flex:1 1 260px;max-width:440px}.sw .search{max-width:none}.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;background:#131313;border:1px solid rgba(242,241,238,.24);box-shadow:0 18px 40px rgba(0,0,0,.45);max-height:560px;overflow:auto;padding:6px 0 10px}.sres-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 14px}.sres-top .lbl{color:rgba(242,241,238,.72)!important;text-transform:none;letter-spacing:.02em}.sres-x{border:0;background:transparent;color:rgba(242,241,238,.72);font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:4px}.sres-x:hover{color:#F2F1EE}.sres-g{border-top:1px solid rgba(242,241,238,.12);padding-top:6px;margin-top:4px}.sres-h{padding:4px 14px;color:rgba(242,241,238,.48)!important}.sres-h .num{margin-left:6px;color:#E0583F}.sres-i{display:flex;flex-direction:column;gap:2px;padding:8px 14px;text-decoration:none!important;border-left:2px solid transparent}.sres-i:hover{background:#1B1B1B;border-left-color:#C6301A}.sres-t{color:#F2F1EE;font-size:14px;font-weight:600;line-height:1.3}.sres-s{color:rgba(242,241,238,.55);font-size:12px}.sres-none{margin:6px 14px;color:rgba(242,241,238,.72);font-size:13.5px}
.out{border:1px solid var(--line2);background:transparent;color:var(--mut);font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:7px 10px;cursor:pointer;margin-left:6px}
.out:hover{color:var(--paper);border-color:var(--paper)}
.demo{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:#E8A93C;color:#0B0B0B;padding:4px 8px;margin-left:8px}
.fpt-toast{position:fixed;left:16px;bottom:16px;z-index:300;background:#0B0B0B;color:#F2F1EE;font:13px/1.4 'Archivo',system-ui,sans-serif;padding:10px 14px;border-left:3px solid #E8A93C}
.fpt-toast:empty{display:none}
.loading{padding:80px 24px;text-align:center;font:14px 'Archivo',system-ui,sans-serif;color:#9A9A9A}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed}
.marker{overflow-wrap:anywhere}
.px-arm{display:block;margin-top:4px;line-height:1.45}
@media (max-width:720px){.hdr{padding:12px 16px}.h1{font-size:36px}}


.modrow{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:10px 14px;border:0;border-left:2px solid transparent;background:transparent;font:inherit;text-align:left;cursor:pointer;color:var(--mut)}
.modrow:hover{background:var(--ink3);color:var(--paper)}
.modrow.on{border-left-color:var(--red);background:var(--ink3);color:var(--paper)}
.card{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--ink2);color:var(--paper)!important;text-decoration:none!important}
.card:hover{border-color:var(--paper)}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}
.plan>div{border:1px solid var(--line);background:var(--ink2);padding:14px 16px}
.grp{margin:34px 0 12px;display:flex;align-items:baseline;gap:12px}
.agenda{list-style:none;margin:20px 0 0;padding:0;border:1px solid var(--line);background:var(--ink2)}
.agenda>li{display:flex;flex-wrap:wrap;gap:6px 18px;padding:14px 16px;border-top:1px solid var(--line)}
.agenda>li:first-child{border-top:0}
.agenda .when{flex:0 0 120px}
.agenda .what{flex:1 1 300px;min-width:0}
.agenda ul{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.45;color:var(--mut)}
.card img{width:100%;aspect-ratio:1.8/1;object-fit:cover;object-position:top left;display:block;border-bottom:1px solid var(--line)}
</style>
</head>

  <div class="sw">
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:rgba(242,241,238,.48)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span><input type="search" placeholder="Search lessons, SOPs and videos" value="{{sq}}" onInput="{{setSq}}" autocomplete="off"></label>

        <div class="sres-top"><span class="lbl">{{sCount}}</span><button type="button" class="sres-x" onClick="{{clearSq}}">Clear</button></div>

            <sc-for list="{{g.items}}" as="r" hint-placeholder-count="3">
              <a class="sres-i" href="{{r.href}}" target="{{r.target}}" onClick="{{r.open}}"><span class="sres-t">{{r.t}}</span><span class="sres-s">{{r.sub}}</span></a>
            </sc-for>
          </div>
        </sc-for>

</header>

  <div style="display:flex;flex-wrap:wrap;flex:1;align-items:stretch">
    <aside style="flex:1 1 250px;max-width:290px;border-right:1px solid var(--line);padding:24px 0;box-sizing:border-box">
      <p class="lbl" style="margin:0 16px 10px">5-day program</p>
      <sc-for list="{{mods}}" as="m" hint-placeholder-count="5">
        <button type="button" class="{{m.cls}}" onClick="{{m.pick}}">
          <span style="width:22px;font-family:var(--display);font-size:18px;color:var(--faint)">{{m.num}}</span>
          <span style="flex:1;font-size:14.5px;font-weight:500;line-height:1.3">{{m.name}}</span>
          <span class="num" style="font-family:var(--mono);font-size:11px;color:var(--faint)">{{m.count}}</span>
        </button>
      </sc-for>
      <p class="lbl" style="margin:22px 16px 10px">Extra, not part of the certificate</p>
      <sc-for list="{{extras}}" as="m" hint-placeholder-count="1">
        <button type="button" class="{{m.cls}}" onClick="{{m.pick}}">
          <span style="width:22px;font-family:var(--display);font-size:18px;color:var(--faint)">{{m.num}}</span>
          <span style="flex:1;font-size:14.5px;font-weight:500;line-height:1.3">{{m.name}}</span>
          <span class="num" style="font-family:var(--mono);font-size:11px;color:var(--faint)">{{m.count}}</span>
        </button>
      </sc-for>
    </aside>

    <main style="flex:999 1 560px;min-width:0;padding:36px 44px 64px;box-sizing:border-box">
      <div style="max-width:1080px">
        <p class="lbl">FieldPulse training</p>
        <h1 class="h1" style="margin-top:10px">{{hello}}, <span class="marker">{{first}}</span></h1>
        <p class="mut" style="margin:12px 0 0;font-size:17px">{{line}}</p>

        <section class="paper" style="margin-top:26px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;padding:18px" aria-label="Continue">
          <sc-if value="{{up.img}}"><img src="{{up.img}}" alt="Practice screen for this lesson" style="width:220px;max-width:100%;aspect-ratio:1.8/1;object-fit:cover;object-position:top left;border:1px solid var(--line2)"></sc-if>
          <div style="flex:1 1 280px;min-width:0">
            <p class="lbl">{{up.kicker}}</p>
            <p class="h2" style="margin-top:8px;font-size:28px">{{up.title}}</p>
            <p style="margin:6px 0 0;font-size:14.5px;color:var(--mut)">{{up.sub}}</p>
          </div>
          <a class="btn" href="{{up.href}}">{{up.go}}
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </a>
        </section>

        <div style="margin-top:44px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;border-bottom:1px solid var(--line);padding-bottom:14px">
          <div>
            <p class="lbl">{{cur.kicker}}</p>
            <h2 class="h2" style="margin-top:6px">{{cur.title}}</h2>
            <p class="mut" style="margin:6px 0 0;font-size:15px;max-width:640px">{{cur.summary}}</p>
          </div>
          <p class="num" style="margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)">{{cur.count}}</p>
        </div>

        <sc-if value="{{cur.hasAgenda}}" hint-placeholder-val="{{ true }}">
          <ol class="agenda" aria-label="Agenda for this day">
            <sc-for list="{{cur.agenda}}" as="a" hint-placeholder-count="4">
              <li>
                <p class="lbl when" style="margin:3px 0 0">{{a.when}}</p>
                <div class="what">
                  <p style="margin:0;font-size:16px;font-weight:600;color:{{a.color}}">{{a.t}}</p>
                  <p class="lbl" style="margin:4px 0 0">{{a.who}}</p>
                  <ul><sc-for list="{{a.d}}" as="x"><li>{{x.t}}</li></sc-for></ul>
                </div>
              </li>
            </sc-for>
          </ol>
        </sc-if>
        <sc-for list="{{cur.groups}}" as="g" hint-placeholder-count="2">
          <div>
            <div class="grp"><h3 class="h3" style="margin:0">{{g.name}}</h3><span class="lbl">{{g.count}}</span></div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px">
          <sc-for list="{{g.lessons}}" as="l" hint-placeholder-count="4">
            <a class="card" href="{{l.href}}">
              <sc-if value="{{l.img}}" hint-placeholder-val="{{ true }}"><img src="{{l.img}}" alt="" loading="lazy"></sc-if>
              <sc-if value="{{l.noimg}}" hint-placeholder-val="{{ false }}"><div style="width:100%;aspect-ratio:1.8/1;border-bottom:1px solid var(--line);display:grid;place-items:center" class="lbl">Practice screen</div></sc-if>
              <div style="padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1">
                <span class="lbl">Lesson {{l.n}}</span>
                <span style="font-size:16px;font-weight:600;line-height:1.3">{{l.title}}</span>
                <span style="margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px">
                  <span style="display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:{{l.color}}"><span style="width:7px;height:7px;background:{{l.color}}"></span>{{l.status}}</span>
                  <sc-if value="{{l.vid}}" hint-placeholder-val="{{ true }}"><span class="faint" style="font-size:12.5px">&#9654; {{l.vid}}</span></sc-if>
                </span>
              </div>
            </a>
          </sc-for>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{cur.isReview}}" hint-placeholder-val="{{ false }}">
          <div class="plan" style="margin-top:22px" aria-label="Day 5 steps">
            <sc-for list="{{cur.steps}}" as="p" hint-placeholder-count="3">
              <div><p class="lbl">{{p.n}}</p><p style="margin:6px 0 0;font-size:16px;font-weight:600">{{p.t}}</p><p class="mut" style="margin:4px 0 10px;font-size:14px;line-height:1.45">{{p.d}}</p><a href="{{p.href}}" style="font-size:14px;font-weight:600">{{p.go}} &rarr;</a></div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </main>
  </div>
</div>

<script>

class Component extends DCLogic {
  constructor(p){ super(p); const q = new URLSearchParams(location.search).get('day'); const S = p.data.S;
    this.state = { cur: /^(d[1-5]|x)$/.test(q || '') ? q : S.curDay, sq: '' }; }
  renderVals() {
    const P = this.props.data.P, S = this.props.data.S, me = this.props.me || {};
    const STS = (id) => ACAD.isDone(P, id) ? ['Done', 'var(--ok)'] : P[id] ? ['In progress', 'var(--warn)'] : ['Not started', 'var(--faint)'];
    const inDay = (d) => ACAD.L.filter((x) => x.day === d);
    const doneIn = (d) => inDay(d).filter((x) => ACAD.isDone(P, x.id)).length;
    const row = (d) => ({ num: d.num, name: d.id === 'x' ? d.name : 'Day ' + d.num + ' · ' + d.name, count: d.id === 'd5' ? '' : doneIn(d.id) + '/' + inDay(d.id).length,
      cls: 'modrow' + (this.state.cur === d.id ? ' on' : ''), pick: () => { this.setState({ cur: d.id }); try { history.replaceState(null, '', '?day=' + d.id); } catch (e) {} } });
    const mods = ACAD.DAYS.map(row), extras = [row(ACAD.XTRA)];
    const D = ACAD.DAYS.concat([ACAD.XTRA]).find((d) => d.id === this.state.cur) || ACAD.DAYS[0];
    const ls = inDay(D.id), mids = []; ls.forEach((x) => { if (mids.indexOf(x.mod) < 0) mids.push(x.mod); });
    const groups = mids.map((m) => {
      const part = ls.filter((x) => x.mod === m), all = ACAD.L.filter((x) => x.mod === m), whole = part.length === all.length;
      const lessons = part.map((x) => { const st = STS(x.id); return { href: ACAD.href(x), n: x.n, title: x.title, img: x.img, noimg: !x.img, status: st[0], color: st[1], vid: x.vid }; });
      return { name: ACAD_MODNAME[m] + (whole ? '' : ', lessons ' + part[0].n + ' to ' + part[part.length - 1].n), count: lessons.length + ' lessons', lessons };
    });
    const nL = ls.length;
    const cur = { kicker: D.id === 'x' ? 'Extra' : 'Day ' + D.num + ' of 5', title: D.name, summary: D.summary,
      count: nL ? doneIn(D.id) + ' of ' + nL + ' done' : '', groups, isDay: nL > 0, isReview: D.id === 'd5',
      agenda: ACAD.agenda(D.id, P, this.props.data.pr).map((a) => Object.assign({}, a, { color: a.color || 'inherit', d: a.d.map((t) => ({ t })) })),
      hasAgenda: D.id !== 'x',
      steps: [
        { n: '1 · Final check', t: 'Take the final review check', d: '20 questions from Days 1 to 4. Your score shows which lessons to review.', go: 'Open the final check', href: 'final.html' },
        { n: '2 · Review', t: 'Redo any check you missed', d: 'My progress shows every lesson from Days 1 to 4 and which checks are still open.', go: 'Open My progress', href: 'progress.html' },
        { n: '3 · Practice', t: 'Get your practice result to Ready', d: 'All ' + ACAD.NT + ' practice tasks from Days 1 to 4 done, at least ' + ACAD.OWN + ' on your own, and no serious slips.', go: 'Open practice tasks', href: 'practice.html' },
        { n: '4 · Reflection', t: 'Write your reflection', d: 'Three short answers. Your trainer reads them before your results 1:1.', go: 'Open the reflection', href: 'final.html#reflect' },
        { n: '5 · Certificate', t: 'Your certificate unlocks', d: 'When all ' + ACAD.NL + ' lessons and checks are done and practice is Ready. Nothing to send in.', go: 'Open Certificate', href: 'certificate.html' }
      ] };
    const nx = S.next, x = P[nx ? nx.id : ''] || {};
    const up = nx ? { img: nx.img, kicker: 'Up next · ' + ACAD.where(nx), title: nx.title,
        sub: (x.walk ? 'Walk-through done' : x.open ? 'Walk-through started' : 'Not started yet') + (nx.vid ? ' · ' + nx.vid : ''), href: ACAD.href(nx), go: x.open ? 'Continue lesson' : 'Start lesson' }
      : { img: '', kicker: 'All lessons done', title: 'Every lesson is finished', sub: 'Open any lesson to review it.', href: 'certificate.html', go: 'Open Certificate' };
    const first = String(me.full_name || me.email || '').split(/[\s@]/)[0] || 'there';
    const dayTxt = S.curDay === 'd5' ? 'Day 5 of 5.' : 'Day ' + S.curDay.slice(1) + ' of 5.';
    return Object.assign({ hd: ACAD.hdr(me), hello: this.props.data.any ? 'Welcome back' : 'Welcome', first,
      line: S.done + ' of ' + ACAD.NL + ' lessons done. ' + dayTxt, up, mods, extras, cur }, ACAD.search(this));
  }
}
ACAD.start(Component, { auth: 'user' }, async () => { const [rows, pr] = await Promise.all([FPTrack.myEvents(), FPTrack.practiceGet()]); const P = ACAD.progress(rows); return { P, S: ACAD.summary(P), any: rows.length > 0, pr }; });

</script>
